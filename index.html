物以減少行為"},{"en":"Removing something pleasant to decrease a behaviour","tw":"移除愉快的事物以減少行為"}],"answerIndex":0,"correctAnswer":{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"}},{"id":"T4-07","topicNo":4,"difficulty":"medium","type":"order","star":true,"question":{"en":"Thorndike's law: behaviours followed by a reward get stronger; unrewarded ones get weaker. Tap the tiles to name the law.","tw":"桑代克的定律：有獎勵的行為會加強，沒有獎勵的會減弱。按次序點選字卡，說出定律名稱。"},"explanation":{"en":"**Slides say:** Thorndike's Law of Effect – the tendency to do a behaviour is strengthened if it is followed by a reward, and weakened if it is not rewarded.\n**In simple words:** His cats in puzzle boxes repeated the moves that got them out to the food and dropped the moves that didn't. A good effect makes an action stronger.\n**Remember:** Law of EFFECT = the effect (result) decides if you repeat it.","tw":"**投影片：**桑代克的效果定律 – 行為之後有獎勵，做該行為的傾向便增強；沒有獎勵便減弱。\n**簡單來說：**迷箱裏的貓會重複能逃出去吃食物的動作，放棄沒用的動作。好的「效果」令行為加強。\n**記住：**效果定律 =「效果」（結果）決定你會不會重複。"},"source":"PDF4 p.5","tiles":{"en":["Law","of","Effect","Reinforcement","Exercise"],"tw":["效果","定律","強化","練習"]},"answerLen":{"en":3,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Law of Effect","tw":"效果定律"}},{"id":"T4-08","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Thorndike studied cats escaping from…","tw":"桑代克研究貓從甚麼逃出？"},"explanation":{"en":"**Slides say:** Thorndike is famous for his cat \"puzzle boxes\": the cat must find a way out of the box to reach the food.\n**In simple words:** By trial and error the cat learns which action opens the box, and gets faster each time.\n**Trap:** the Skinner box (press a lever for food) came later, from Skinner.","tw":"**投影片：**桑代克以貓的「迷箱」聞名：貓要找方法逃出箱子才能吃到食物。\n**簡單來說：**貓透過嘗試錯誤學會哪個動作能打開箱子，一次比一次快。\n**陷阱：**按桿得食物的史金納箱是後來史金納設計的。"},"source":"PDF4 p.6","options":[{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"},{"en":"Skinner boxes","tw":"史金納箱"},{"en":"A Bobo doll room","tw":"吹氣娃娃房間"},{"en":"The Three Mountains model","tw":"三山模型"}],"answerIndex":0,"correctAnswer":{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"}},{"id":"T4-09","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who coined the term \"operant conditioning\" and built a box with a lever that gives food?","tw":"誰創造「操作性制約」一詞，並設計了按桿得食物的箱子？"},"explanation":{"en":"**Slides say:** B. F. Skinner created the term \"operant conditioning\" and is famous for the Skinner Box: an animal operates a lever to obtain food or water as a reinforcer.\n**In simple words:** When a rat learns that pressing the lever brings food, it presses more often.\n**Remember:** Skinner = operant + lever box. Pavlov = classical. Thorndike = puzzle box.","tw":"**投影片：**史金納創造了「操作性制約」一詞，以史金納箱聞名：動物按操作桿取得食物或水作為強化物。\n**簡單來說：**老鼠發現按桿有食物，就會更常按桿。\n**記住：**史金納 = 操作性制約 + 按桿箱；巴甫洛夫 = 古典制約；桑代克 = 迷箱。"},"source":"PDF4 p.8","options":[{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},{"en":"Edward Thorndike","tw":"桑代克"},{"en":"Ivan Pavlov","tw":"巴甫洛夫"},{"en":"Albert Bandura","tw":"班杜拉"}],"answerIndex":0,"correctAnswer":{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"}},{"id":"T4-10","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Money and gold stars (tokens) are examples of…","tw":"金錢和金星（代幣）屬於……"},"explanation":{"en":"**Slides say:** Primary reinforcers satisfy biological needs (water, food). Secondary reinforcers are LEARNED – they get their power from association with primary reinforcers (money, gold stars/tokens).\n**In simple words:** Money is only paper, but we learned it buys food. A gold star is only a sticker, but we learned it means praise.\n**Remember:** primary = body needs; secondary = learned value.","tw":"**投影片：**主要強化物滿足生理需要（水、食物）；次要強化物是「學來的」，因與主要強化物有關聯而有效（金錢、金星／代幣）。\n**簡單來說：**錢只是紙，但我們學會了錢能買食物；金星只是貼紙，但我們學會了它代表讚賞。\n**記住：**主要 = 身體需要；次要 = 學來的價值。"},"source":"PDF4 p.28","options":[{"en":"Secondary reinforcers","tw":"次要強化物"},{"en":"Primary reinforcers","tw":"主要強化物"},{"en":"Unconditioned stimuli","tw":"非制約刺激"},{"en":"Negative punishments","tw":"負懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Secondary reinforcers","tw":"次要強化物"}},{"id":"T4-11","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"When should praise be given to strengthen Sam's answering behaviour?","tw":"應在何時稱讚 Sam，才能最有效加強他回答問題的行為？"},"explanation":{"en":"**Slides say:** The reinforcer must follow the response, always and only follow it, and follow IMMEDIATELY. Praising Sam before he answers does not encourage answering.\n**In simple words:** Like a dog trainer giving the treat the second the dog sits. If the treat comes much later, the dog doesn't know what it was for.\n**Remember:** after, every time, right away.","tw":"**投影片：**強化物必須在反應之後出現、總是且只在之後、並且「立即」。在 Sam 回答前稱讚他，並不能鼓勵他答問題。\n**簡單來說：**就像訓練狗，狗一坐下立刻給零食；遲很久才給，狗不知道是因為甚麼。\n**記住：**之後、每次、立刻。"},"source":"PDF4 p.29","options":[{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"},{"en":"Before he answers, to encourage him","tw":"在他回答前先稱讚以作鼓勵"},{"en":"At random times during the day","tw":"一天中隨機時間"},{"en":"Only at the end of the school term","tw":"只在學期末"}],"answerIndex":0,"correctAnswer":{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"}},{"id":"T4-12","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Rewarding behaviours that get closer and closer to a complex target behaviour is called ___.","tw":"獎勵越來越接近複雜目標行為的表現，稱為 ___。"},"explanation":{"en":"**Slides say:** Shaping = first reward behaviours close to the desired behaviour, then reward only behaviours even closer. Slide example: game time for spelling 3 of 10 words, then 5, then 7, then all 10.\n**In simple words:** Teach a big skill in small steps, raising the bar each time. Dolphin shows are trained this way.\n**Trap:** plan the steps carefully, or you may reward the wrong behaviour by mistake.","tw":"**投影片：**塑形 = 先獎勵接近目標的行為，之後只獎勵更接近的行為。投影片例子：串對 10 個字中的 3 個可玩遊戲，之後要 5 個、7 個，最後 10 個。\n**簡單來說：**把大技能拆成小步，逐步提高要求。海豚表演就是這樣訓練的。\n**陷阱：**步驟要仔細計劃，否則可能無意中獎勵了錯誤行為。"},"source":"PDF4 p.30","options":[{"en":"Shaping","tw":"塑形（shaping）"},{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Extinction","tw":"消退（extinction）"}],"answerIndex":0,"correctAnswer":{"en":"Shaping","tw":"塑形（shaping）"}},{"id":"T4-13","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Slot machines in a casino use which reinforcement schedule?","tw":"賭場的老虎機使用哪種強化計劃？"},"explanation":{"en":"**Slides say:** Variable ratio = the number of responses needed for a reinforcer varies, e.g. gambling and slot machines. People keep going in the hope of a reward.\n**In simple words:** You never know which pull will win, so you keep pulling. That's why gambling is so hard to stop.\n**Remember:** ratio = number of tries; variable = unpredictable.","tw":"**投影片：**變動比率 = 獲得獎勵所需的次數不固定，例如賭博、老虎機。人們為了期待中的獎勵而持續下去。\n**簡單來說：**你不知道哪一次會中，所以一直拉。這就是賭博難以停止的原因。\n**記住：**比率 = 次數；變動 = 不可預測。"},"source":"PDF4 p.41","options":[{"en":"Variable ratio","tw":"變動比率（variable ratio）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Variable ratio","tw":"變動比率（variable ratio）"}},{"id":"T4-14","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A monthly salary is an example of…","tw":"每月薪金屬於……"},"explanation":{"en":"**Slides say:** Fixed interval = the reinforcer is given after a fixed time interval, e.g. monthly salary.\n**In simple words:** Pay comes at the end of every month, however many tasks you did on one day.\n**Remember:** interval = time; fixed = always the same.","tw":"**投影片：**固定時距 = 在固定時間後給予獎勵，例如每月薪金。\n**簡單來說：**每月底出糧，不論你某一天做了多少工作。\n**記住：**時距 = 時間；固定 = 每次一樣。"},"source":"PDF4 p.41","options":[{"en":"Fixed interval","tw":"固定時距（fixed interval）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Variable interval","tw":"變動時距"},{"en":"Variable ratio","tw":"變動比率"}],"answerIndex":0,"correctAnswer":{"en":"Fixed interval","tw":"固定時距（fixed interval）"}},{"id":"T4-15","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Sudden (pop) quizzes use which schedule?","tw":"突擊測驗屬於哪種強化計劃？"},"explanation":{"en":"**Slides say:** Variable interval = the reinforcer comes after a varied time interval, e.g. a sudden quiz or random classwork checks.\n**In simple words:** A quiz could come on any day, so students keep studying steadily instead of cramming at the last minute.\n**Remember:** interval = time; variable = you can't predict when.","tw":"**投影片：**變動時距 = 在不定時間後給予強化，例如突擊測驗、隨機檢查功課。\n**簡單來說：**測驗可能任何一天出現，所以學生會一直溫習，而不是臨急抱佛腳。\n**記住：**時距 = 時間；變動 = 不知何時。"},"source":"PDF4 p.42","options":[{"en":"Variable interval","tw":"變動時距（variable interval）"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Continuous reinforcement","tw":"連續性強化"}],"answerIndex":0,"correctAnswer":{"en":"Variable interval","tw":"變動時距（variable interval）"}},{"id":"T4-16","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Factory piece work (paid per item made) is an example of…","tw":"工廠計件工作（按件計酬）屬於……"},"explanation":{"en":"**Slides say:** Fixed ratio = a specific number of responses must be made to get the reinforcer, e.g. factory piece work, or a bonus for selling 10 cars.\n**In simple words:** Make a set number of items → get paid. Always the same number, so you can predict it.\n**Remember:** ratio = number of actions; fixed = predictable.","tw":"**投影片：**固定比率 = 做出特定次數的行為才獲得獎勵，例如工廠計件工作、每賣 10 部車有花紅。\n**簡單來說：**完成固定數量就有報酬，數量不變，可以預測。\n**記住：**比率 = 次數；固定 = 可預測。"},"source":"PDF4 p.42","options":[{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"},{"en":"Variable ratio","tw":"變動比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"}},{"id":"T4-17","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is a danger of punishment listed in the slides?","tw":"以下哪項是投影片列出的懲罰的危機？"},"explanation":{"en":"**Slides say:** Dangers of punishment: it arouses emotion in the punisher and the punished; its severity is hard to judge; it motivates concealment (telling lies); it often has only short-term effects, so it must keep escalating. Advice: shape behaviour through reinforcement rather than punishment.\n**In simple words:** A child punished for breaking a cup may simply hide the next broken cup, rather than learn to be careful.\n**Remember:** reward the good rather than punish the bad.","tw":"**投影片：**懲罰的危機：激起懲罰者和受罰者的情緒；難判斷輕重；鼓勵隱瞞（說謊）；通常只有短期效果，要不斷加重。建議：以強化而非懲罰塑造行為。\n**簡單來說：**孩子打破杯子被罰，下次可能只會把破杯藏起來，而不是學會小心。\n**記住：**多獎勵好行為，少懲罰壞行為。"},"source":"PDF4 p.23","options":[{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"},{"en":"It always produces long-term behaviour change","tw":"一定帶來長期行為改變"},{"en":"It never arouses emotion","tw":"從不引起情緒"},{"en":"It is easy to judge how severe it should be","tw":"很容易判斷懲罰應有多嚴重"}],"answerIndex":0,"correctAnswer":{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"}},{"id":"T4-18","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Flow (Csikszentmihalyi) happens when…","tw":"心流（Csikszentmihalyi）在甚麼情況下出現？"},"explanation":{"en":"**Slides say:** Flow: challenge = skill. Boredom: challenge < skill. Anxiety: challenge > skill (Csikszentmihalyi, 1990).\n**In simple words:** Flow is being \"in the zone\" – so absorbed that time flies. Example: playing a video game at exactly your level. Too easy → bored. Too hard → stressed.\n**Remember:** flow is intrinsic – people do it even without rewards.","tw":"**投影片：**心流：挑戰 = 技能；無聊：挑戰 < 技能；焦慮：挑戰 > 技能（Csikszentmihalyi, 1990）。\n**簡單來說：**心流就是「入定」，全神投入，時間過得飛快。例：玩一個剛好適合你程度的遊戲。太易 → 悶；太難 → 緊張。\n**記住：**心流屬內在動機 – 沒有獎勵也願意做。"},"source":"PDF4 p.52","options":[{"en":"Challenge matches skill","tw":"挑戰 = 技能"},{"en":"Challenge is lower than skill","tw":"挑戰 < 技能"},{"en":"Challenge is higher than skill","tw":"挑戰 > 技能"},{"en":"There is no challenge at all","tw":"完全沒有挑戰"}],"answerIndex":0,"correctAnswer":{"en":"Challenge matches skill","tw":"挑戰 = 技能"}},{"id":"T4-19","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In gamification, a task's challenge should be about ___ above the person's ability.","tw":"遊戲化中，任務的挑戰應比個人能力高出約 ___。"},"explanation":{"en":"**Slides say:** Gamification – make the challenge about 10% above ability, so people must focus and try hard but the goal is still reachable. Other steps: set clear goals, set levels/milestones, give instant rewards. The term was coined by Nick Pelling (2002).\n**In simple words:** Games stay fun because each level is a little harder than the last – hard enough to need effort, easy enough to win.\n**Remember:** ~10% harder = just right.","tw":"**投影片：**遊戲化 – 挑戰要高出能力約 10%，人們需要專注努力，但又做得到。其他步驟：訂定明確目標、設關卡／里程碑、即時獎勵。「遊戲化」一詞由 Nick Pelling（2002）提出。\n**簡單來說：**遊戲好玩，是因為每一關都比上一關難一點 – 要努力，但贏得到。\n**記住：**難約 10% = 剛剛好。"},"source":"PDF4 p.58","options":[{"en":"10%","tw":"10%"},{"en":"50%","tw":"50%"},{"en":"0%","tw":"0%"},{"en":"100%","tw":"100%"}],"answerIndex":0,"correctAnswer":{"en":"10%","tw":"10%"}},{"id":"T4-20","topicNo":4,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which comparison of classical vs operant conditioning is correct?","tw":"以下哪項古典制約與操作性制約的比較正確？"},"explanation":{"en":"**Slides say:** Classical: a stimulus comes first, the response is involuntary, learning is by association (Pavlov). Operant: the behaviour comes first, it is voluntary, learning is by reinforcement or punishment (Skinner).\n**In simple words:** Classical: bell rings → you drool without choosing. Operant: you choose to study → you get praised → you study more.\n**Remember:** Classical = reflex; Operant = choice.","tw":"**投影片：**古典：刺激在先，反應非自願，透過聯繫學習（巴甫洛夫）。操作：行為在先，屬自願，透過強化或懲罰學習（史金納）。\n**簡單來說：**古典：鈴聲一響你就流口水，不由自主。操作：你選擇溫習 → 被稱讚 → 更多溫習。\n**記住：**古典 = 反射；操作 = 選擇。"},"source":"PDF4 p.46","options":[{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"},{"en":"Classical: voluntary behaviour, consequence after (Skinner). Operant: involuntary, stimulus first (Pavlov).","tw":"古典：自願行為，後果在後（史金納）。操作：非自願，刺激在先（巴甫洛夫）。"},{"en":"Both use reinforcement and punishment only","tw":"兩者都只用強化和懲罰"},{"en":"Both only work with animals","tw":"兩者都只適用於動物"}],"answerIndex":0,"correctAnswer":{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"}},{"id":"T4-21","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Csikszentmihalyi's term for being totally absorbed in an activity, losing track of time, is…","tw":"Csikszentmihalyi 用來形容全情投入、忘記時間的狀態是……"},"explanation":{"en":"**Slides say:** \"Flow\" (Csikszentmihalyi, 1990) = being fully absorbed in an activity, losing track of time and self, even without external rewards (intrinsic motivation). It happens when challenge matches skill.\n**In simple words:** Like a musician practising so happily that hours pass in what feels like minutes.\n**Trap:** challenge < skill = boredom; challenge > skill = anxiety.","tw":"**投影片：**「心流」（Csikszentmihalyi, 1990）= 全神投入一項活動，忘我、忘記時間，沒有外在獎勵也願意做（內在動機）。挑戰與技能相符時出現。\n**簡單來說：**就像音樂家開心地練習，幾小時感覺只過了幾分鐘。\n**陷阱：**挑戰 < 技能 = 無聊；挑戰 > 技能 = 焦慮。"},"source":"PDF4 p.49","options":[{"en":"Flow","tw":"心流（flow）"},{"en":"Boredom","tw":"無聊（boredom）"},{"en":"Anxiety","tw":"焦慮（anxiety）"},{"en":"Learned helplessness","tw":"習得性無助"}],"answerIndex":0,"correctAnswer":{"en":"Flow","tw":"心流（flow）"}},{"id":"T5-01","topicNo":5,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Learning by observing the CONSEQUENCES of other people's behaviour is called…","tw":"透過觀察「他人行為的後果」來學習，稱為……"},"explanation":{"en":"**Slides say:** Vicarious learning = learning by watching others' failures or successes (their consequences). Seeing someone reinforced increases your tendency to do it; seeing someone punished decreases it.\n**In simple words:** You learn from what happens to OTHER people. Slide example: a new employee is always punctual after seeing a colleague fired for being late.\n**Remember:** vicarious = \"through someone else\".","tw":"**投影片：**替代學習 = 透過觀察他人的失敗／成功（行為後果）來學習。看到別人受獎，你更傾向做；看到別人受罰，你減少做。\n**簡單來說：**從「別人」的遭遇中學習。投影片例子：新員工見同事因遲到被解僱後，總是準時。\n**記住：**替代 =「借別人的經驗」。"},"source":"PDF5 p.6","options":[{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"},{"en":"Classical conditioning","tw":"古典制約"},{"en":"Shaping","tw":"塑形"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"}},{"id":"T5-02","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Bandura's Bobo doll experiment, which group of children imitated the aggressive acts LEAST?","tw":"在班杜拉的吹氣娃娃實驗中，哪一組兒童模仿攻擊行為「最少」？"},"explanation":{"en":"**Slides say:** Bobo doll experiment (Bandura, 1965) – children who saw the model being PUNISHED performed far fewer imitative acts than the rewarded and no-consequence groups.\n**In simple words:** Seeing the adult punished for hitting the doll made children less willing to copy the hitting.\n**Remember:** this is vicarious learning – the children were not punished themselves.","tw":"**投影片：**吹氣娃娃實驗（Bandura, 1965）– 看到成人「受罰」的兒童，模仿行為遠少於受獎組和無後果組。\n**簡單來說：**看見成人打娃娃後被罰，兒童就不太願意模仿。\n**記住：**這是替代學習 – 兒童自己並沒有被罰。"},"source":"PDF5 p.18","options":[{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"},{"en":"Those who saw the model rewarded","tw":"看到成人受獎的一組"},{"en":"Those who saw no consequences","tw":"看到沒有後果的一組"},{"en":"All groups imitated equally at first","tw":"一開始各組模仿程度相同"}],"answerIndex":0,"correctAnswer":{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"}},{"id":"T5-03","topicNo":5,"difficulty":"hard","type":"mc","star":true,"question":{"en":"When ALL Bobo doll groups were later offered incentives, all could reproduce the aggression. What does this show?","tw":"之後給「所有」吹氣娃娃組別獎勵，各組都能重現攻擊行為。這說明了甚麼？"},"explanation":{"en":"**Slides say:** Acquisition vs. performance – kids in all conditions ACQUIRED the aggressive behaviour, but not all of them performed it. When given an incentive, all groups reproduced it.\n**In simple words:** Learning something (acquisition) is not the same as showing it (performance). Example: you may know a swear word without ever saying it.\n**Remember:** acquired ≠ performed.","tw":"**投影片：**習得 vs 表現 – 所有組別的兒童都「習得」了攻擊行為，但並非全部表現出來；給予獎勵後，各組都能重現。\n**簡單來說：**學會一件事（習得）不等於做出來（表現）。例：你可能知道一句粗口，但從來不說。\n**記住：**習得 ≠ 表現。"},"source":"PDF5 p.25","options":[{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"},{"en":"Punishment stops learning completely","tw":"懲罰會完全阻止學習"},{"en":"Children only learn when directly reinforced","tw":"兒童只在直接受強化時才學習"},{"en":"Aggression is inborn, not learned","tw":"攻擊行為是天生，不是學來的"}],"answerIndex":0,"correctAnswer":{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"}},{"id":"T5-04","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"What are the four processes of observational learning, in order?","tw":"觀察學習的四個過程，正確次序是？"},"explanation":{"en":"**Slides say:** The four processes of observational learning: (1) Attention, (2) Retention (memory), (3) Reproduction (imitation), (4) Motivation. Slide example: baking a cake.\n**In simple words:** Watch the teacher bake (attention) → remember the steps (retention) → bake it yourself (reproduction) → want to do it because friends admire your cakes (motivation).\n**Remember:** Watch → Remember → Do → Want.","tw":"**投影片：**觀察學習四過程：(1) 注意；(2) 保存（記憶）；(3) 再生（模仿）；(4) 動機。投影片例子：焗蛋糕。\n**簡單來說：**留心看老師焗蛋糕（注意）→ 記住步驟（保存）→ 自己焗（再生）→ 朋友讚賞令你想做（動機）。\n**記住：**看 → 記 → 做 → 想做。"},"source":"PDF5 p.34","options":[{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"},{"en":"Motivation → Attention → Reproduction → Retention","tw":"動機 → 注意 → 再生 → 保存"},{"en":"Encoding → Storage → Retrieval → Motivation","tw":"編碼 → 儲存 → 提取 → 動機"},{"en":"Retention → Attention → Motivation → Reproduction","tw":"保存 → 注意 → 動機 → 再生"}],"answerIndex":0,"correctAnswer":{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"}},{"id":"T5-05","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Remembering the steps of baking a cake you watched in a cooking session is which process?","tw":"記住在烹飪課看到的焗蛋糕步驟，屬於哪個過程？"},"explanation":{"en":"**Slides say:** Retention (memory) = the learner must retain a memory of what was done, e.g. remembering the steps for the cake seen in a cooking session.\n**In simple words:** After watching (attention), you must keep the steps in your head before you can copy them (reproduction).\n**Remember:** teaching tip from the slides – teach good study and memory skills.","tw":"**投影片：**保存（記憶）= 學習者必須記住看過的內容，例如記住烹飪課中製作蛋糕的步驟。\n**簡單來說：**看完（注意）之後，要先把步驟記在腦中，才能模仿（再生）。\n**記住：**投影片的教學提示 – 教授良好的學習和記憶技巧。"},"source":"PDF5 p.34","options":[{"en":"Retention","tw":"保存（retention / 記憶）"},{"en":"Attention","tw":"注意（attention）"},{"en":"Reproduction","tw":"再生（reproduction）"},{"en":"Motivation","tw":"動機（motivation）"}],"answerIndex":0,"correctAnswer":{"en":"Retention","tw":"保存（retention / 記憶）"}},{"id":"T5-06","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A character in a book, film, TV show or game is a ___ model.","tw":"書籍、電影、電視或遊戲中的角色屬於 ___ 楷模。"},"explanation":{"en":"**Slides say:** Live model = a real person demonstrating. Symbolic model = a person or character in a book, film, TV show or game. Verbal instructional model = only describes how to behave.\n**In simple words:** A teen copying a hero's bravery from a film is learning from a symbolic model.\n**Remember:** live = real person; symbolic = media character; verbal = words only.","tw":"**投影片：**真人楷模 = 真人示範；象徵性楷模 = 書籍、電影、電視、遊戲中的人物或角色；言語指導楷模 = 只描述如何做。\n**簡單來說：**青少年模仿電影英雄的勇敢，就是向象徵性楷模學習。\n**記住：**真人 = 真人；象徵 = 媒體角色；言語 = 只有說話。"},"source":"PDF5 p.10","options":[{"en":"Symbolic","tw":"象徵性（symbolic）"},{"en":"Live","tw":"真人（live）"},{"en":"Verbal instructional","tw":"言語指導（verbal instructional）"},{"en":"Primary","tw":"主要（primary）"}],"answerIndex":0,"correctAnswer":{"en":"Symbolic","tw":"象徵性（symbolic）"}},{"id":"T5-07","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"For a LOW-achieving student, which model will most likely boost confidence in an academic task?","tw":"對「成績較差」的學生，哪個楷模最能提升他完成學術任務的信心？"},"explanation":{"en":"**Slides say:** Effective models have high perceived similarity. A low-achieving student is more likely to gain confidence after seeing another low-achieving student succeed. Models with high competence and prestige also work.\n**In simple words:** We copy people who are LIKE us: \"If someone like me can do it, so can I.\" A famous professor feels too different.\n**Remember:** similar, competent, prestigious.","tw":"**投影片：**有效楷模相似度高：成績較差的學生看到另一位成績較差的同學成功，更有信心。能力高、具威望的楷模也有效。\n**簡單來說：**我們模仿「像自己」的人：「和我差不多的人做得到，我也可以。」著名教授就感覺太遙遠。\n**記住：**相似、能力高、有威望。"},"source":"PDF5 p.12","options":[{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"},{"en":"A famous professor","tw":"一位著名教授"},{"en":"A cartoon character with no link to school","tw":"一個與學校無關的卡通角色"},{"en":"Nobody – models do not affect confidence","tw":"沒有 – 楷模不影響信心"}],"answerIndex":0,"correctAnswer":{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"}},{"id":"T5-08","topicNo":5,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Why does IGNORING a student's aggressive behaviour act like reinforcing it?","tw":"為何「忽視」學生的攻擊行為，會有鼓勵它的效果？"},"explanation":{"en":"**Slides say:** The non-occurrence of an expected consequence is itself a consequence. In the Bobo doll context, ignoring aggressive behaviour is reinforcing, because the expected punishment did not happen.\n**In simple words:** A child expects to be told off for hitting, but nothing happens. The child – and everyone watching – learns \"hitting is OK here.\"\n**Remember:** ignoring aggression = accidentally rewarding it.","tw":"**投影片：**預期的後果沒有出現，本身就是一個後果。在吹氣娃娃實驗中，忽視攻擊行為等於鼓勵，因為預期的懲罰沒有出現。\n**簡單來說：**孩子以為打人會被責罵，結果甚麼都沒發生，他和旁觀的同學都學到「在這裏打人沒問題」。\n**記住：**忽視攻擊行為 = 無意中獎勵它。"},"source":"PDF5 p.22","options":[{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"},{"en":"Ignoring is a form of positive punishment","tw":"忽視是一種正懲罰"},{"en":"Aggression is a classically conditioned reflex","tw":"攻擊是古典制約的反射"},{"en":"Ignoring always leads to extinction","tw":"忽視一定導致消退"}],"answerIndex":0,"correctAnswer":{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"}},{"id":"T5-09","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"You expect a bonus for beating your sales target, but get nothing. According to social learning theory this feels like…","tw":"你預期超額完成銷售目標會有花紅，結果甚麼都沒有。根據社會學習理論，這感覺像……"},"explanation":{"en":"**Slides say:** If you expect a behaviour to be reinforced and it is not, it can be punishing, with strong negative emotions. Slide example: expecting a bonus for beating the sales target, but getting none.\n**In simple words:** A promised reward that never comes feels like a punishment, so you may try less next time.\n**Remember:** missing reward = feels like punishment; missing punishment = feels like reward.","tw":"**投影片：**預期某行為會獲獎勵卻沒有，可以是一種懲罰，並伴隨強烈負面情緒。投影片例子：預期超額完成銷售目標有花紅，結果沒有。\n**簡單來說：**答應了的獎勵沒有出現，感覺就像被罰，下次可能不再那麼努力。\n**記住：**獎勵落空 = 像懲罰；懲罰沒出現 = 像獎勵。"},"source":"PDF5 p.22","options":[{"en":"A punishment","tw":"一種懲罰"},{"en":"A reinforcement","tw":"一種強化"},{"en":"Extinction of a reflex","tw":"反射消退"},{"en":"Nothing – no consequence occurred","tw":"沒有影響 – 根本沒有後果"}],"answerIndex":0,"correctAnswer":{"en":"A punishment","tw":"一種懲罰"}},{"id":"T5-10","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A specific belief about how well YOU can perform a particular task is called ___.","tw":"對「自己」能把某項任務做得多好的具體信念，稱為 ___。"},"explanation":{"en":"**Slides say:** Self-efficacy = \"How well can I do such-and-such?\" – a specific, evaluative judgement about oneself.\n**In simple words:** It is your belief in your ability for ONE particular task. Example: \"I'm sure I can solve fraction problems.\"\n**Trap:** self-esteem is how much you value yourself overall; self-image is how you see yourself (T8).","tw":"**投影片：**自我效能感 =「我能把這件事做得多好？」– 對自己具體的評價。\n**簡單來說：**對「某一項」任務能力的信心。例：「我肯定自己能解分數題。」\n**陷阱：**自尊是對自己整體的價值感；自我形象是你如何看自己（T8）。"},"source":"PDF5 p.39","options":[{"en":"Self-efficacy","tw":"自我效能感（self-efficacy）"},{"en":"Self-esteem","tw":"自尊（self-esteem）"},{"en":"Self-image","tw":"自我形象（self-image）"},{"en":"Self-determination","tw":"自我決定（self-determination）"}],"answerIndex":0,"correctAnswer":{"en":"Self-efficacy","tw":"自我效能感（self-efficacy）"}},{"id":"T5-11","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which is NOT one of the four sources of self-efficacy?","tw":"以下哪項「不是」自我效能感的四個來源？"},"explanation":{"en":"**Slides say:** The four sources of self-efficacy are mastery experience, vicarious experience, social persuasion and physiological status.\n**In simple words:** I did it before (mastery). I saw someone like me do it (vicarious). People tell me I can (persuasion). I feel calm, not panicky (physiological).\n**Trap:** fixed-interval reinforcement is a reward schedule (T4), not a source of self-efficacy.","tw":"**投影片：**自我效能感的四個來源：過往成功經驗、替代經驗、社會說服、身心狀態。\n**簡單來說：**我以前做到（成功經驗）；我看到和我相似的人做到（替代經驗）；別人說我可以（說服）；我感覺平靜，不慌（身心狀態）。\n**陷阱：**固定時距強化是獎勵計劃（T4），不是自我效能感的來源。"},"source":"PDF5 p.41","options":[{"en":"Fixed-interval reinforcement","tw":"固定時距強化"},{"en":"Mastery experience","tw":"過往成功經驗（mastery experience）"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"言語／朋輩說服"}],"answerIndex":0,"correctAnswer":{"en":"Fixed-interval reinforcement","tw":"固定時距強化"}},{"id":"T5-12","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Feeling very anxious before a test lowers your self-efficacy. Which source is this?","tw":"考試前非常焦慮，令自我效能感下降。這屬哪個來源？"},"explanation":{"en":"**Slides say:** Physiological status – anxiety and stress lower self-efficacy.\n**In simple words:** A racing heart and sweaty hands before a test make you feel \"I can't do this.\" Taking slow breaths and calming down helps you feel capable again.\n**Remember:** physiological = your body and feelings.","tw":"**投影片：**身心狀態 – 焦慮和壓力會降低自我效能感。\n**簡單來說：**考試前心跳加速、手心出汗，令你覺得「我做不到」；深呼吸冷靜下來，信心就回來。\n**記住：**身心狀態 = 身體和情緒。"},"source":"PDF5 p.41","options":[{"en":"Physiological status","tw":"身心狀態（physiological status）"},{"en":"Mastery experience","tw":"過往成功經驗"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"社會說服"}],"answerIndex":0,"correctAnswer":{"en":"Physiological status","tw":"身心狀態（physiological status）"}},{"id":"T5-13","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Bandura's social learning theory is also called…","tw":"班杜拉的社會學習理論又稱為……"},"explanation":{"en":"**Slides say:** Social learning theory is also known as social cognitive theory – \"cognitive\" because it takes our cognition (thinking) into consideration.\n**In simple words:** Bandura added the thinking part to learning from others: paying attention, remembering and expecting results.\n**Trap:** \"sociocultural\" = Vygotsky (T2).","tw":"**投影片：**社會學習理論又稱社會認知理論 –「認知」是因為它考慮我們的認知（思考）過程。\n**簡單來說：**班杜拉在「向別人學習」中加入思考部分：注意、記憶、預期結果。\n**陷阱：**「社會文化理論」是維高斯基（T2）。"},"source":"PDF5 p.7","options":[{"en":"Social cognitive theory","tw":"社會認知理論"},{"en":"Sociocultural theory","tw":"社會文化理論"},{"en":"Operant conditioning","tw":"操作性制約"},{"en":"Self-determination theory","tw":"自我決定理論"}],"answerIndex":0,"correctAnswer":{"en":"Social cognitive theory","tw":"社會認知理論"}},{"id":"T5-14","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Reciprocal causation means…","tw":"相互因果關係（reciprocal causation）是指……"},"explanation":{"en":"**Slides say:** Reciprocal causation – environment, person and behaviour interact and affect each other. The environment influences us, but we also affect our environment.\n**In simple words:** A noisy class (environment) makes you feel stressed (person), so you talk to the teacher (behaviour), and the class becomes quieter (environment changes).\n**Remember:** a triangle of arrows pointing both ways.","tw":"**投影片：**相互因果關係 – 環境、個人和行為交互作用、互相影響；環境影響我們，我們也影響環境。\n**簡單來說：**吵鬧的課室（環境）令你煩躁（個人），你向老師反映（行為），課室變得安靜（環境改變）。\n**記住：**三角形，箭頭雙向。"},"source":"PDF5 p.28","options":[{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"},{"en":"Only the environment controls behaviour","tw":"只有環境控制行為"},{"en":"Behaviour is caused only by genes","tw":"行為只由基因決定"},{"en":"Rewards and punishments cancel each other out","tw":"獎勵與懲罰互相抵消"}],"answerIndex":0,"correctAnswer":{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"}},{"id":"T5-15","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A toddler sees another child crying in fear of an injection, and then also becomes afraid of injections. This is…","tw":"幼兒看到別的孩子因害怕打針而哭，自己也變得害怕打針。這是……"},"explanation":{"en":"**Slides say:** Vicarious emotional learning is also called empathy – experiencing the same emotion from watching another. It is not the same as sympathy (concern for another's suffering). Slide example: a toddler sees another child crying in fear of an injection and learns to fear injections.\n**In simple words:** Empathy = feeling WITH someone. Sympathy = feeling sorry FOR someone.\n**Remember:** same feeling = empathy.","tw":"**投影片：**替代情感學習又稱同理心 – 觀察他人而感受到相同的情緒；與同情心（關心他人痛苦）不同。投影片例子：幼兒看到別的兒童怕打針而哭，自己也學會怕打針。\n**簡單來說：**同理心 = 和對方「一起」感受；同情心 =「為」對方難過。\n**記住：**感受相同 = 同理心。"},"source":"PDF5 p.26","options":[{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"},{"en":"Sympathy","tw":"同情心"},{"en":"Extinction","tw":"消退"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"}},{"id":"T5-16","topicNo":5,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Bill's daughter opened the combination lock weeks after watching him. Why does this challenge behaviourism?","tw":"Bill 的女兒在觀察爸爸數週後打開了密碼鎖。為何這挑戰了行為主義？"},"explanation":{"en":"**Slides say:** Bill's daughter opened the combination lock weeks after watching him. Learning did not cause an immediate change in behaviour, the behaviour was never reinforced, and the mind remembered the combination.\n**In simple words:** Behaviourism says learning = an immediate change in behaviour, and only rewarded behaviour is done. She learned by watching, got no reward, and used the code weeks later.\n**Remember:** the mind matters – it is not a \"black box\".","tw":"**投影片：**Bill 的女兒數週前看爸爸開密碼鎖，後來自己打開。學習沒有令行為即時改變，也從未被強化，是思想記住了密碼。\n**簡單來說：**行為主義認為學習 = 即時行為改變，而且只做有獎勵的行為；但她靠觀察學習，沒有獎勵，數週後才用。\n**記住：**思想很重要，不是「黑盒」。"},"source":"PDF5 p.5","options":[{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"},{"en":"She was punished for opening the lock","tw":"她因開鎖而受罰"},{"en":"It proves learning is only a reflex","tw":"證明學習只是反射"},{"en":"She learned by trial and error in a puzzle box","tw":"她在迷箱中嘗試錯誤而學會"}],"answerIndex":0,"correctAnswer":{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"}},{"id":"T5-17","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who developed Social Learning Theory and the Bobo doll experiment?","tw":"誰提出社會學習理論並進行吹氣娃娃實驗？"},"explanation":{"en":"**Slides say:** Albert Bandura (1925–2021), Canadian, famous for social learning theory. He moved psychology's focus from behaviourism to what goes on inside the mind. He was the 4th most cited psychologist of all time.\n**In simple words:** Bandura showed children copy what they see – the Bobo doll experiment.\n**Trap:** Vygotsky = ZPD; Piaget = stages; Skinner = operant.","tw":"**投影片：**班杜拉（1925–2021），加拿大人，以社會學習理論聞名，把心理學焦點由行為主義轉向思想內部；史上被引用第四多的心理學家。\n**簡單來說：**班杜拉證明兒童會模仿所見 – 吹氣娃娃實驗。\n**陷阱：**維高斯基 = ZPD；皮亞傑 = 階段；史金納 = 操作性制約。"},"source":"PDF5 p.8","options":[{"en":"Albert Bandura","tw":"班杜拉（Albert Bandura）"},{"en":"Lev Vygotsky","tw":"維高斯基（Lev Vygotsky）"},{"en":"Jean Piaget","tw":"皮亞傑（Jean Piaget）"},{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"}],"answerIndex":0,"correctAnswer":{"en":"Albert Bandura","tw":"班杜拉（Albert Bandura）"}},{"id":"T6-01","topicNo":6,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What are the three stages of memory, in order?","tw":"記憶的三個階段，正確次序是？"},"explanation":{"en":"**Slides say:** There are three stages of memory: Encoding, Storage, Retrieval.\n**In simple words:** Memory works like a library: label a new book (encoding), put it on the shelf (storage), find it again later (retrieval).\n**Remember:** E-S-R = in → keep → out.","tw":"**投影片：**記憶分三個階段：編碼、儲存、提取。\n**簡單來說：**記憶像圖書館：替新書編號（編碼）→ 放上書架（儲存）→ 日後找出來（提取）。\n**記住：**入 → 存 → 出。"},"source":"PDF6 p.5","options":[{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"},{"en":"Storage → Encoding → Retrieval","tw":"儲存 → 編碼 → 提取"},{"en":"Retrieval → Encoding → Storage","tw":"提取 → 編碼 → 儲存"},{"en":"Attention → Rehearsal → Forgetting","tw":"注意 → 複述 → 遺忘"}],"answerIndex":0,"correctAnswer":{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"}},{"id":"T6-02","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which level of encoding gives the deepest processing and the longest-lasting memory?","tw":"哪一層次的編碼處理最深、記憶最持久？"},"explanation":{"en":"**Slides say:** Levels of processing (Craik & Lockhart, 1972): structural (appearance, shallow) < phonetic (sound, intermediate) < semantic (meaning, deep). Deeper = more meaningful = longer-lasting memory. Semantic encoding uses more parts of the brain.\n**In simple words:** Thinking about what a word MEANS sticks best. Slide example with a tree: just seeing it (low) → naming it (higher) → imagining climbing it (highest).\n**Remember:** deeper thinking = longer memory.","tw":"**投影片：**處理層次（Craik & Lockhart, 1972）：結構（外觀，淺層）< 語音（聲音，中層）< 語義（意義，深層）。處理越深越有意義，記憶越持久；語義編碼使用更多腦區。\n**簡單來說：**想字詞的「意思」記得最牢。投影片的樹例子：只是看到（低）→ 說出名稱（較高）→ 想像爬上去（最高）。\n**記住：**想得越深，記得越久。"},"source":"PDF6 p.7","options":[{"en":"Semantic (meaning)","tw":"語義編碼（意義）"},{"en":"Structural (appearance)","tw":"結構編碼（外觀）"},{"en":"Phonetic (sound)","tw":"語音編碼（聲音）"},{"en":"Sensory (raw input)","tw":"感覺（原始輸入）"}],"answerIndex":0,"correctAnswer":{"en":"Semantic (meaning)","tw":"語義編碼（意義）"}},{"id":"T6-03","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Focusing on how a word SOUNDS (e.g. does it rhyme?) is ___ encoding.","tw":"專注於字詞的「讀音」（例如是否押韻）屬 ___ 編碼。"},"explanation":{"en":"**Slides say:** Phonetic encoding = intermediate processing that focuses on how words SOUND (e.g. rhyme).\n**In simple words:** \"Does 'cat' rhyme with 'hat'?\" is a question about sound, so it is phonetic.\n**Remember:** structural = looks; phonetic = sound (like phonics); semantic = meaning.","tw":"**投影片：**語音編碼 = 中層處理，專注字詞的「讀音」（例如押韻）。\n**簡單來說：**「cat 和 hat 押韻嗎？」是關於聲音的問題，所以是語音編碼。\n**記住：**結構 = 外觀；語音 = 聲音；語義 = 意義。"},"source":"PDF6 p.7","options":[{"en":"Phonetic","tw":"語音（phonetic）"},{"en":"Structural","tw":"結構（structural）"},{"en":"Semantic","tw":"語義（semantic）"},{"en":"Episodic","tw":"情節（episodic）"}],"answerIndex":0,"correctAnswer":{"en":"Phonetic","tw":"語音（phonetic）"}},{"id":"T6-04","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"What is the capacity of short-term memory (number of items)?","tw":"短期記憶的容量是多少個單位？"},"explanation":{"en":"**Slides say:** Short-term memory holds about 7 (± 2) units of information, for about 20 seconds without rehearsal.\n**In simple words:** You can juggle about 5 to 9 things in your head at once. That's why a 7-digit number is easy to remember, but a 20-letter string is hard.\n**Remember:** the magic number 7 ± 2.","tw":"**投影片：**短期記憶約可容納 7（± 2）個訊息單位；不複述約保留 20 秒。\n**簡單來說：**腦中同時只能處理約 5 至 9 樣東西，所以 7 位數字易記，20 個字母就很難。\n**記住：**神奇數字 7 ± 2。"},"source":"PDF6 p.16","options":[{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},{"en":"20 ± 5 items","tw":"20 ± 5 個單位"},{"en":"Unlimited","tw":"無限"},{"en":"3 ± 1 items","tw":"3 ± 1 個單位"}],"answerIndex":0,"correctAnswer":{"en":"7 ± 2 items","tw":"7 ± 2 個單位"}},{"id":"T6-05","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How long does information stay in short-term memory WITHOUT rehearsal?","tw":"在「不複述」的情況下，訊息在短期記憶中能保留多久？"},"explanation":{"en":"**Slides say:** Short-term memory duration: about 20 seconds without rehearsal. Technique: repeat the information to keep it in STM.\n**In simple words:** Hear a phone number once, don't repeat it, and about 20 seconds later it's gone.\n**Remember:** sensory = under a second; STM ≈ 20 s; LTM = relatively permanent.","tw":"**投影片：**短期記憶不複述約保留 20 秒；技巧：重複訊息令它留在短期記憶。\n**簡單來說：**聽一次電話號碼而不重複，約 20 秒後便忘記。\n**記住：**感覺記憶 < 1 秒；短期記憶約 20 秒；長期記憶相對永久。"},"source":"PDF6 p.16","options":[{"en":"About 20 seconds","tw":"約 20 秒"},{"en":"A fraction of a second","tw":"幾分之一秒"},{"en":"About 20 minutes","tw":"約 20 分鐘"},{"en":"Permanently","tw":"永久"}],"answerIndex":0,"correctAnswer":{"en":"About 20 seconds","tw":"約 20 秒"}},{"id":"T6-06","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Grouping letters like BAPGDEPHDHKUCUHK into meaningful units (BA, PGDE, PhD, HKU…) to fit short-term memory is called ___.","tw":"把 BAPGDEPHDHKUCUHK 分成有意義的單元（BA、PGDE、PhD、HKU……）以放進短期記憶，稱為 ___。"},"explanation":{"en":"**Slides say:** Chunking = group stimuli into a single unit to fit more into short-term memory. Slide example: BAPGDEPHDHKUCUHKIEDUST.\n**In simple words:** 22 letters is too many, but BA · PGDE · PhD · HKU · CUHK · IED · UST is only 7 chunks – easy!\n**Remember:** a chunk counts as ONE item.","tw":"**投影片：**集組塊 = 把刺激分組成一個單元，令短期記憶容納更多。投影片例子：BAPGDEPHDHKUCUHKIEDUST。\n**簡單來說：**22 個字母太多，但 BA · PGDE · PhD · HKU · CUHK · IED · UST 只有 7 組，容易記！\n**記住：**一個組塊只算一個單位。"},"source":"PDF6 p.16","options":[{"en":"Chunking","tw":"集組塊（chunking）"},{"en":"Rehearsal","tw":"複述（rehearsal）"},{"en":"Method of loci","tw":"位置記憶法（method of loci）"},{"en":"Serial position effect","tw":"序列位置效應"}],"answerIndex":0,"correctAnswer":{"en":"Chunking","tw":"集組塊（chunking）"}},{"id":"T6-07","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What is the capacity of long-term memory?","tw":"長期記憶的容量是？"},"explanation":{"en":"**Slides say:** Long-term memory: unlimited capacity, relatively permanent, organised as networks of meaning using schemas.\n**In simple words:** Your long-term memory never gets \"full\" – you can keep learning forever. The hard part is FINDING things, so organised notes help.\n**Remember:** STM is small; LTM is unlimited.","tw":"**投影片：**長期記憶：容量無限、相對永久，以基模組成意義網絡。\n**簡單來說：**長期記憶永遠不會「爆滿」，可以一直學；難的是「找回來」，所以有條理的筆記很有用。\n**記住：**短期記憶細小；長期記憶無限。"},"source":"PDF6 p.18","options":[{"en":"Unlimited","tw":"無限"},{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},{"en":"About 20 items","tw":"約 20 個單位"},{"en":"One item at a time","tw":"每次一個單位"}],"answerIndex":0,"correctAnswer":{"en":"Unlimited","tw":"無限"}},{"id":"T6-08","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Knowing HOW to ride a bicycle is stored as which type of memory?","tw":"「懂得」踩單車屬於哪種記憶？"},"explanation":{"en":"**Slides say:** Implicit memory includes procedural memory – memory of skills and \"how to\" (motor skills and habits), shown naturally when doing the task.\n**In simple words:** You ride a bike without thinking \"left foot, right foot\". Your body just knows how.\n**Remember:** procedural = how-to skills; semantic = facts; episodic = personal events.","tw":"**投影片：**內隱記憶包括程序記憶 – 技術和「如何做」的記憶（動作技能、習慣），做該任務時自然表現出來。\n**簡單來說：**踩單車時你不會想「左腳、右腳」，身體自然懂得。\n**記住：**程序 = 技能；語意 = 事實；情節 = 個人事件。"},"source":"PDF6 p.19","options":[{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"},{"en":"Episodic memory","tw":"情節記憶"},{"en":"Semantic memory","tw":"語意記憶"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"}},{"id":"T6-09","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Remembering your own 10th birthday party is which type of memory?","tw":"記得自己 10 歲的生日會，屬於哪種記憶？"},"explanation":{"en":"**Slides say:** Episodic memory = memories of personal events. Semantic memory = memories of factual information. Both are explicit (declarative) memory.\n**In simple words:** Episodic = your life as TV episodes (your 10th birthday party). Semantic = facts (Pavlov won the Nobel Prize in 1904).\n**Remember:** episode = event in MY life.","tw":"**投影片：**情節記憶 = 個人事件的回憶；語意記憶 = 事實訊息的記憶。兩者都屬外顯（陳述）記憶。\n**簡單來說：**情節記憶像你人生的電視劇集（10 歲生日會）；語意記憶是事實（巴甫洛夫 1904 年獲諾貝爾獎）。\n**記住：**情節 = 我人生中的一件事。"},"source":"PDF6 p.21","options":[{"en":"Episodic memory","tw":"情節記憶（episodic）"},{"en":"Semantic memory","tw":"語意記憶（semantic）"},{"en":"Procedural memory","tw":"程序記憶（procedural）"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Episodic memory","tw":"情節記憶（episodic）"}},{"id":"T6-10","topicNo":6,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Serial position effect: why are the LAST items in a list remembered well?","tw":"序列位置效應：為何清單「最後」的項目記得好？"},"explanation":{"en":"**Slides say:** Serial position effect (Murdock, 1962): items at the beginning (primacy effect) and end (recency effect) are remembered better. Primacy: more rehearsal. Recency: still active in STM. Middle: not enough rehearsal and interference.\n**In simple words:** After a shopping list is read out, the last few items are still \"fresh\" in your head.\n**Remember:** first = rehearsed; last = still in STM; middle = squeezed out.","tw":"**投影片：**序列位置效應（Murdock, 1962）：開頭（首因效應）和結尾（近因效應）的項目記得較好。首因：複述較多；近因：仍活躍於短期記憶；中間：複述不足且受干擾。\n**簡單來說：**聽完購物清單，最後幾項仍「新鮮」地留在腦中。\n**記住：**開頭 = 複述多；結尾 = 仍在短期記憶；中間 = 被擠掉。"},"source":"PDF6 p.31","options":[{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"},{"en":"Primacy effect – they were rehearsed the most","tw":"首因效應 – 它們被複述得最多"},{"en":"They suffer the most interference","tw":"它們受最多干擾"},{"en":"They were encoded structurally","tw":"它們以結構編碼"}],"answerIndex":0,"correctAnswer":{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"}},{"id":"T6-11","topicNo":6,"difficulty":"medium","type":"order","star":false,"question":{"en":"Put the PQ4R study method in the correct order.","tw":"把 PQ4R 學習法排成正確次序。"},"explanation":{"en":"**Slides say:** PQ4R (Thomas & Robinson, 1972) is a storage/study method: Preview, Question, Read, Reflect, Recite, Review.\n**In simple words:** Skim the chapter → ask \"What will I learn?\" → read → link it to what you know → say it back in your own words → go over it again later.\n**Remember:** P-Q then 4 R's: Read, Reflect, Recite, Review.","tw":"**投影片：**PQ4R（Thomas & Robinson, 1972）是儲存／學習方法：預覽、提問、閱讀、反思、背誦、複習。\n**簡單來說：**先略讀 → 問「我會學到甚麼？」→ 閱讀 → 連結已有知識 → 用自己的話說出來 → 之後再複習。\n**記住：**P、Q，再加 4 個 R。"},"source":"PDF6 p.28","tiles":{"en":["Preview","Question","Read","Reflect","Recite","Review"],"tw":["預覽","提問","閱讀","反思","背誦","複習"]},"answerLen":{"en":6,"tw":6},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Preview → Question → Read → Reflect → Recite → Review","tw":"預覽 → 提問 → 閱讀 → 反思 → 背誦 → 複習"}},{"id":"T6-12","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The method of loci improves encoding by…","tw":"位置記憶法（method of loci）如何改善編碼？"},"explanation":{"en":"**Slides say:** Method of loci = link new information with familiar visual images, to enrich encoding.\n**In simple words:** To remember a shopping list, imagine milk on your front door, eggs on the sofa and bread on your bed. Later, \"walk\" through your home in your mind and collect them.\n**Remember:** loci = places.","tw":"**投影片：**位置記憶法 = 把新資訊與熟悉的視覺影像連結，令編碼更豐富。\n**簡單來說：**要記購物清單，就想像牛奶放在大門、雞蛋在梳化、麵包在牀上；之後在腦中「行一轉」屋企，逐樣拿回來。\n**記住：**loci = 地點。"},"source":"PDF6 p.11","options":[{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"},{"en":"Repeating information out loud 100 times","tw":"把資訊大聲重複 100 次"},{"en":"Reading only the first and last items","tw":"只讀第一項和最後一項"},{"en":"Removing all meaning from the information","tw":"去除資訊的一切意義"}],"answerIndex":0,"correctAnswer":{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"}},{"id":"T6-13","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Specht & Sandling (1991): after traditional lectures, scores dropped by 54%. After role-playing they dropped by only…","tw":"Specht & Sandling（1991）：傳統講課後分數下降 54%，角色扮演後只下降……"},"explanation":{"en":"**Slides say:** Specht & Sandling (1991): scores after traditional lectures decreased by 54%; after role-playing they decreased by only 13%. Active learning helps.\n**In simple words:** Acting things out makes you think about MEANING (deep processing), so you remember more than when you just listen.\n**Remember:** doing beats listening.","tw":"**投影片：**Specht & Sandling（1991）：傳統講課後分數下降 54%；角色扮演後只下降 13%。主動學習有幫助。\n**簡單來說：**親身扮演令你思考「意義」（深層處理），比單純聽記得更多。\n**記住：**做比聽好。"},"source":"PDF6 p.25","options":[{"en":"13%","tw":"13%"},{"en":"54%","tw":"54%"},{"en":"40%","tw":"40%"},{"en":"0%","tw":"0%"}],"answerIndex":0,"correctAnswer":{"en":"13%","tw":"13%"}},{"id":"T6-14","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What is the difference between learning and development?","tw":"學習與發展（成長）的分別是？"},"explanation":{"en":"**Slides say:** Learning = a change in an individual due to experience. Development = a change due to biological maturation. They are inter-dependent – learning cannot happen in a developmentally inappropriate period.\n**In simple words:** Practising piano is learning. Growing taller is development. A child cannot learn to talk before their voice is physically ready.\n**Remember:** learning = experience; development = growing up. Both nature and nurture matter.","tw":"**投影片：**學習 = 經驗帶來的改變；發展（成長）= 生理成熟帶來的改變。兩者互相依存 – 發育未到的時期無法學習。\n**簡單來說：**練琴是學習；長高是發展。孩子的發聲器官未成熟，就學不到說話。\n**記住：**學習 = 經驗；發展 = 長大。先天與後天同樣重要。"},"source":"PDF6 p.41","options":[{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"},{"en":"Learning = change due to maturation; development = change due to experience","tw":"學習 = 成熟帶來的改變；發展 = 經驗帶來的改變"},{"en":"They are unrelated","tw":"兩者毫無關係"},{"en":"Only development needs the environment","tw":"只有發展需要環境"}],"answerIndex":0,"correctAnswer":{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"}},{"id":"T6-15","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"From sensory memory, which information moves on to working memory?","tw":"感覺記憶中，哪些訊息會進入工作記憶？"},"explanation":{"en":"**Slides say:** Only attended information goes into working memory. Sensory memory holds raw input for a fraction of a second, and it is lost quickly without further processing.\n**In simple words:** Your senses take in tons of things, but only what you NOTICE moves on. Slide example: the \"Monkey Business\" video – people counting passes miss a gorilla walking by!\n**Remember:** attention is the gate to memory.","tw":"**投影片：**只有被注意的訊息才會進入工作記憶；感覺記憶只保留原始訊息幾分之一秒，未經處理便迅速消失。\n**簡單來說：**感官接收大量資訊，只有你「留意」的才會留下。投影片例子：Monkey Business 影片 – 專心數傳球的人看不到走過的大猩猩！\n**記住：**注意力是記憶的閘門。"},"source":"PDF6 p.15","options":[{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"},{"en":"All information automatically","tw":"所有訊息自動進入"},{"en":"Only information that rhymes","tw":"只有押韻的訊息"},{"en":"Only information older than 20 seconds","tw":"只有超過 20 秒的訊息"}],"answerIndex":0,"correctAnswer":{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"}},{"id":"T6-16","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who proposed the levels of processing theory (1972)?","tw":"誰提出處理層次理論（1972）？"},"explanation":{"en":"**Slides say:** Levels of processing theory – Craik & Lockhart (1972).\n**In simple words:** They showed that HOW deeply you think about information decides how well you remember it.\n**Trap:** Thomas & Robinson = PQ4R; Murdock = serial position effect; Specht & Sandling = role-play study.","tw":"**投影片：**處理層次理論 – Craik & Lockhart（1972）。\n**簡單來說：**他們指出，你對資訊思考得多「深」，決定你記得多好。\n**陷阱：**Thomas & Robinson = PQ4R；Murdock = 序列位置效應；Specht & Sandling = 角色扮演研究。"},"source":"PDF6 p.9","options":[{"en":"Craik & Lockhart","tw":"Craik & Lockhart"},{"en":"Thomas & Robinson","tw":"Thomas & Robinson"},{"en":"Specht & Sandling","tw":"Specht & Sandling"},{"en":"Seligman & Maier","tw":"Seligman & Maier"}],"answerIndex":0,"correctAnswer":{"en":"Craik & Lockhart","tw":"Craik & Lockhart"}},{"id":"T6-17","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"To prevent \"false memories\" where new and old information mix up, a teacher should…","tw":"為防止新舊訊息混淆造成「錯誤記憶」，老師應……"},"explanation":{"en":"**Slides say:** To prevent \"false memories\" where new and old information get mixed up, point out how the new information is different from the old.\n**In simple words:** Example: after learning negative reinforcement, students often mix it up with punishment. Saying \"Careful – negative reinforcement INCREASES behaviour, punishment DECREASES it\" stops the mix-up.\n**Remember:** compare and contrast new vs old.","tw":"**投影片：**為防止新舊資訊混淆而產生「錯誤記憶」，要指出新資訊與舊資訊的分別。\n**簡單來說：**例：學生學了負增強後，常與懲罰混淆。老師說「小心 – 負增強令行為增加，懲罰令行為減少」，就能防止混淆。\n**記住：**新舊對比。"},"source":"PDF6 p.36","options":[{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"},{"en":"Teach the new topic without mentioning old topics","tw":"教新課題時完全不提舊課題"},{"en":"Give the information only once","tw":"只講一次"},{"en":"Ask students to memorise without understanding","tw":"要求學生不求甚解地背誦"}],"answerIndex":0,"correctAnswer":{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"}},{"id":"T7-01","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Motivation is defined (Slavin, 2014) as…","tw":"動機的定義（Slavin, 2014）是……"},"explanation":{"en":"**Slides say:** Motivation is an internal process that activates, guides and maintains behaviour over time (Slavin, 2014).\n**In simple words:** Motivation is your inner engine. It STARTS you (activate), STEERS you (guide), and KEEPS you going (maintain). Example: wanting to pass a test gets you to open the book, choose what to study, and keep revising all week.\n**Remember:** start, steer, keep going.","tw":"**投影片：**動機是激活、引導並長時間維持行為的內在過程（Slavin, 2014）。\n**簡單來說：**動機是你內心的引擎：「啟動」你、「指引」方向、「維持」你繼續。例：想考試合格，令你打開書本、決定溫甚麼、整個星期堅持溫習。\n**記住：**啟動、指引、維持。"},"source":"PDF7 p.2","options":[{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"},{"en":"A reward given after a behaviour","tw":"行為之後給予的獎勵"},{"en":"A reflex caused by an unconditioned stimulus","tw":"由非制約刺激引起的反射"},{"en":"The capacity of short-term memory","tw":"短期記憶的容量"}],"answerIndex":0,"correctAnswer":{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"}},{"id":"T7-02","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who developed attribution theory?","tw":"誰提出歸因理論？"},"explanation":{"en":"**Slides say:** Attribution theory was developed by Bernard Weiner (UCLA). Every cause can be related to three factors: internal/external, controllable/uncontrollable, stable/unstable.\n**In simple words:** Attribution = how you explain WHY you succeeded or failed (\"I studied hard\" vs \"I was lucky\").\n**Trap:** Dweck = mindsets and goals; Seligman = learned helplessness; Maslow = needs.","tw":"**投影片：**歸因理論由 Bernard Weiner（UCLA）提出。每個成因都可從三方面分析：內在／外在、可控／不可控、穩定／不穩定。\n**簡單來說：**歸因 = 你怎樣解釋自己「為甚麼」成功或失敗（「我很努力」vs「我好彩」）。\n**陷阱：**Dweck = 心態與目標；Seligman = 習得性無助；Maslow = 需求。"},"source":"PDF7 p.8","options":[{"en":"Bernard Weiner","tw":"Bernard Weiner"},{"en":"Carol Dweck","tw":"Carol Dweck"},{"en":"Martin Seligman","tw":"Martin Seligman"},{"en":"Abraham Maslow","tw":"Abraham Maslow"}],"answerIndex":0,"correctAnswer":{"en":"Bernard Weiner","tw":"Bernard Weiner"}},{"id":"T7-03","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is EFFORT classified in attribution theory?","tw":"歸因理論中，「努力」如何分類？"},"explanation":{"en":"**Slides say:** Effort = internal, controllable, unstable (\"personal effort can change\").\n**In simple words:** Effort comes from YOU, you CHOOSE how much, and it can be different tomorrow. That's why \"I didn't try hard enough\" is a hopeful reason – you can fix it next time.\n**Remember:** learning strategy has the same three labels as effort.","tw":"**投影片：**努力 = 內在、可控、不穩定（「個人努力是可變的」）。\n**簡單來說：**努力來自「你」，由你「選擇」多少，明天可以不同。所以「我不夠努力」是充滿希望的原因 – 下次可以改。\n**記住：**學習策略與努力的三個分類相同。"},"source":"PDF7 p.11","options":[{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"}},{"id":"T7-04","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is TASK DIFFICULTY classified?","tw":"「任務難度」如何分類？"},"explanation":{"en":"**Slides say:** Task difficulty = external, uncontrollable, stable.\n**In simple words:** How hard the exam is comes from OUTSIDE you, you can't change it, and it stays the same.\n• Effort/strategy: internal · controllable · unstable\n• Luck: external · uncontrollable · unstable\n• Task difficulty: external · uncontrollable · stable\n• Ability: internal · uncontrollable(?) · stable(?)","tw":"**投影片：**任務難度 = 外在、不可控、穩定。\n**簡單來說：**考試有多難來自你「以外」，你改變不了，而且不會變。\n• 努力／策略：內在 · 可控 · 不穩定\n• 運氣：外在 · 不可控 · 不穩定\n• 任務難度：外在 · 不可控 · 穩定\n• 能力：內在 · 不可控（?）· 穩定（?）"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"}},{"id":"T7-05","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How is LUCK classified?","tw":"「運氣」如何分類？"},"explanation":{"en":"**Slides say:** Luck = external, uncontrollable, unstable (\"luck is not under personal control\").\n**In simple words:** Luck is outside you, you can't control it, and it changes from day to day – lucky today, unlucky tomorrow.\n**Trap:** task difficulty is also external and uncontrollable, but it is STABLE.","tw":"**投影片：**運氣 = 外在、不可控、不穩定（「運氣是不受個人控制的」）。\n**簡單來說：**運氣在你以外、控制不了，而且每天不同 – 今天好彩，明天未必。\n**陷阱：**任務難度同樣外在、不可控，但它是「穩定」的。"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"}},{"id":"T7-06","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which attribution for FAILURE is the most adaptive (desirable)?","tw":"對「失敗」的哪種歸因最理想（適應性）？"},"explanation":{"en":"**Slides say:** Adaptive pattern: attribute failure to lack of effort → motivating emotions (e.g. guilt) → high persistence, mastery-oriented, relatively high expectation of future success. Maladaptive: failure → lack of ability → depression, avoidance, helplessness.\n**In simple words:** \"I didn't study enough\" means next time I can do better, so I keep going. \"I'm stupid\" means why bother, so I give up.\n**Remember:** blame effort, not brains.","tw":"**投影片：**理想歸因：失敗歸因於努力不足 → 激發情緒（如內疚）→ 高度堅持、精熟導向、對未來成功期望較高。不理想：失敗 → 能力不足 → 沮喪、逃避、無助。\n**簡單來說：**「我溫得不夠」= 下次可以做得更好，所以繼續；「我好蠢」= 何必努力，於是放棄。\n**記住：**歸因努力，不歸因天資。"},"source":"PDF7 p.17","options":[{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"},{"en":"\"I'm just not smart enough.\"","tw":"「我根本不夠聰明。」"},{"en":"\"The test was impossible.\"","tw":"「測驗根本不可能做到。」"},{"en":"\"I was unlucky.\"","tw":"「我運氣不好。」"}],"answerIndex":0,"correctAnswer":{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"}},{"id":"T7-07","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A teacher tells a student, \"You got an A – you were lucky!\" What is the problem?","tw":"老師對學生說：「你拿 A – 運氣好而已！」問題在哪？"},"explanation":{"en":"**Slides say:** Do not attribute students' success to unstable and uncontrollable factors such as luck. Maladaptive pattern: success → luck → indifference, little rise in expectation, lack of future effort.\n**In simple words:** If an A was \"just luck\", the student thinks effort doesn't matter and won't try harder next time.\n**Better feedback:** \"You got an A because you practised every day!\"","tw":"**投影片：**不要把學生的成功歸因於運氣等不穩定、不可控的因素。不理想歸因：成功 → 運氣 → 冷漠、期望不提高、日後不努力。\n**簡單來說：**如果拿 A 只是「好彩」，學生會覺得努力沒用，下次不再加把勁。\n**較好的回饋：**「你拿 A 是因為你每天都有練習！」"},"source":"PDF7 p.26","options":[{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"},{"en":"It attributes success to effort, which is maladaptive","tw":"把成功歸因於努力，屬不理想歸因"},{"en":"Luck is internal and stable","tw":"運氣是內在且穩定的"},{"en":"There is no problem; luck is the best attribution","tw":"沒有問題；運氣是最好的歸因"}],"answerIndex":0,"correctAnswer":{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"}},{"id":"T7-08","topicNo":7,"difficulty":"medium","type":"order","star":true,"question":{"en":"Dogs that could NOT control electric shocks later did not even try to escape. Tap the tiles to name this.","tw":"無法控制電擊的狗，之後連嘗試逃走都沒有。按次序點選字卡，說出這個現象。"},"explanation":{"en":"**Slides say:** Learned helplessness (Seligman & Maier, 1967): dogs that could not control shocks later did not escape, even when they easily could. In students: \"You expect to fail, so why bother?\" plus anxiety and low self-esteem.\n**In simple words:** After failing again and again no matter what, a student stops trying. Real experiences of overcoming difficulties protect against it – the earlier, the better.\n**Remember:** helplessness is LEARNED, so it can be un-learned.","tw":"**投影片：**習得性無助（Seligman & Maier, 1967）：無法控制電擊的狗，之後即使容易逃走也不逃。學生身上：「反正會失敗，何必努力？」並感到焦慮、自卑。\n**簡單來說：**無論怎樣做都一再失敗，學生便不再嘗試。曾經克服困難的經驗可以預防 – 越早越好。\n**記住：**無助是「學來的」，所以可以改變。"},"source":"PDF7 p.1","tiles":{"en":["Learned","helplessness","hopelessness","Attribution"],"tw":["習得性","無助","無望","歸因"]},"answerLen":{"en":2,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Learned helplessness","tw":"習得性無助"}},{"id":"T7-09","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In Dweck's (1975) attributional retraining, students in the experimental group were told their failures were due to…","tw":"在 Dweck（1975）的歸因再訓練中，實驗組學生被告知失敗是因為……"},"explanation":{"en":"**Slides say:** Dweck (1975) attributional retraining: each time students in the experimental group failed, they were told it was due to lack of effort or ineffective learning strategies. After 25 sessions they persisted longer, changed strategies and got better at maths. The control group got no such feedback.\n**In simple words:** Teaching kids to blame things they CAN fix (effort, method) brought back their motivation.\n**Remember:** retrain → \"try harder / try differently\".","tw":"**投影片：**Dweck（1975）歸因再訓練：實驗組學生每次失敗都被告知是因為努力不足或學習策略無效；25 節後他們更堅持、會改策略、數學進步。對照組沒有這種回饋。\n**簡單來說：**教學生把失敗歸因於「可以改」的事（努力、方法），動機便回來了。\n**記住：**再訓練 →「再努力／換方法」。"},"source":"PDF7 p.24","options":[{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"},{"en":"Low intelligence","tw":"智力低"},{"en":"Bad luck","tw":"運氣差"},{"en":"A very difficult test","tw":"測驗太難"}],"answerIndex":0,"correctAnswer":{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"}},{"id":"T7-10","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"Intelligence is inborn and cannot change\" is the ___ theory of intelligence.","tw":"「智力是天生且不能改變的」屬 ___ 智力理論。"},"explanation":{"en":"**Slides say:** Entity theory of intelligence = intelligence is inborn and unchangeable (Dweck, 1986).\n**In simple words:** Entity = a fixed \"thing\" – like eye colour, you're born with it. Incremental = it grows like a muscle with practice.\n**Remember:** entity → fixed mindset; incremental → growth mindset.","tw":"**投影片：**固定智力理論 = 智力與生俱來、不可改變（Dweck, 1986）。\n**簡單來說：**固定理論 = 智力像眼睛顏色，天生不變；增長理論 = 智力像肌肉，練習就會增長。\n**記住：**固定理論 → 固定心態；增長理論 → 成長心態。"},"source":"PDF7 p.30","options":[{"en":"Entity","tw":"固定（entity）"},{"en":"Incremental","tw":"增長（incremental）"},{"en":"Attribution","tw":"歸因"},{"en":"Expectancy","tw":"期望"}],"answerIndex":0,"correctAnswer":{"en":"Entity","tw":"固定（entity）"}},{"id":"T7-11","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Intelligence can be changed through effort\" is the ___ theory of intelligence.","tw":"「智力可以靠努力改變」屬哪種智力理論？"},"explanation":{"en":"**Slides say:** Incremental theory of intelligence = intelligence (ability) can be changed through effort (Dweck, 1986). Linked to ability being controllable and unstable (changeable).\n**In simple words:** \"Incremental\" = growing step by step. Like learning to swim: lap by lap you get better.\n**Remember:** incremental + learning goals = growth mindset.","tw":"**投影片：**增長智力理論 = 智力（能力）可以透過努力改變（Dweck, 1986）；能力被視為可控、不穩定（可改變）。\n**簡單來說：**「增長」= 一步一步進步，就像學游泳，一圈一圈游得更好。\n**記住：**增長理論 + 學習目標 = 成長心態。"},"source":"PDF7 p.30","options":[{"en":"Incremental","tw":"增長理論（incremental）"},{"en":"Entity","tw":"固定理論（entity）"},{"en":"Expectancy","tw":"期望理論（expectancy）"},{"en":"Attribution","tw":"歸因理論（attribution）"}],"answerIndex":0,"correctAnswer":{"en":"Incremental","tw":"增長理論（incremental）"}},{"id":"T7-12","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"It's important to me that I look smart compared to others in my class.\" This shows a…","tw":"「對我來說，在班上比別人顯得聰明很重要。」這反映……"},"explanation":{"en":"**Slides say:** Performance goals = to prove \"I have high ability\"; outcomes (grades) are seen as a sign of ability. Learning goals = to learn new knowledge and skills; growth is seen as success.\n**In simple words:** Wanting to LOOK smarter than classmates = performance goal. Wanting to GET better = learning goal.\n**Remember:** performance = prove; learning = improve.","tw":"**投影片：**表現目標 = 證明「我能力很高」；結果（成績）被視為能力指標。學習目標 = 學習新知識和技能；成長被視為成功。\n**簡單來說：**想「顯得」比同學聰明 = 表現目標；想「變得」更好 = 學習目標。\n**記住：**表現 = 證明；學習 = 進步。"},"source":"PDF7 p.37","options":[{"en":"Performance goal","tw":"表現目標"},{"en":"Learning goal","tw":"學習目標"},{"en":"Growth mindset","tw":"成長心態"},{"en":"Intrinsic motivation","tw":"內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Performance goal","tw":"表現目標"}},{"id":"T7-13","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A growth mindset combines…","tw":"成長心態結合了……"},"explanation":{"en":"**Slides say:** Growth mindset = incremental theory of intelligence + learning goals – ability is something to be DEVELOPED. Fixed mindset = entity theory + performance goals – ability is something to be DEMONSTRATED.\n**In simple words:** Growth mindset says \"I can't do it YET, but practice will help.\" Fixed mindset says \"I'm just not a maths person.\"\n**Remember:** growth = develop; fixed = demonstrate.","tw":"**投影片：**成長心態 = 增長智力理論 + 學習目標 – 能力是「培養」出來的。固定心態 = 固定理論 + 表現目標 – 能力是要「表現」出來的。\n**簡單來說：**成長心態：「我『暫時』未做到，練習會有幫助。」固定心態：「我天生不擅長數學。」\n**記住：**成長 = 培養；固定 = 表現。"},"source":"PDF7 p.42","options":[{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"},{"en":"Entity theory of intelligence + performance goals","tw":"固定智力理論＋表現目標"},{"en":"Entity theory + learning goals","tw":"固定理論＋學習目標"},{"en":"External attributions + extrinsic rewards","tw":"外在歸因＋外在獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"}},{"id":"T7-14","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"A student with a PERFORMANCE goal and LOW confidence will most likely…","tw":"抱「表現目標」且「信心低」的學生最可能……"},"explanation":{"en":"**Slides say:** Performance goal + LOW confidence → helpless pattern: avoid challenge, low persistence. Performance goal + high confidence → mastery-oriented. Learning goal → mastery-oriented whether confidence is high or low.\n**In simple words:** If you only care about LOOKING smart and you doubt yourself, a hard task could make you look stupid – so you avoid it and give up fast.\n**Remember:** learning goals protect students with low confidence.","tw":"**投影片：**表現目標 + 信心「低」→ 無助模式：逃避挑戰、不堅持。表現目標 + 信心高 → 精熟導向。學習目標 → 不論信心高低都是精熟導向。\n**簡單來說：**只在乎「顯得」聰明又懷疑自己，難題可能令你出醜 – 於是逃避、很快放棄。\n**記住：**學習目標能保護信心低的學生。"},"source":"PDF7 p.1","options":[{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"},{"en":"Seek challenge with high persistence","tw":"尋求挑戰並高度堅持"},{"en":"Be mastery-oriented no matter what","tw":"無論如何都是精熟導向"},{"en":"Have no change in behaviour","tw":"行為沒有改變"}],"answerIndex":0,"correctAnswer":{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"}},{"id":"T7-15","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Expectancy theory: M = Ps × ?","tw":"期望理論：M = Ps × ？"},"explanation":{"en":"**Slides say:** Expectancy theory (Edwards, 1954; Atkinson, 1964): M = Ps × Is. M = motivation, Ps = perceived probability of success, Is = incentive value of success.\n**In simple words:** You're motivated when you think you CAN succeed AND success is WORTH it. Example: a prize you'd love but can't possibly win → low M.\n**Remember:** chance × value.","tw":"**投影片：**期望理論（Edwards, 1954；Atkinson, 1964）：M = Ps × Is。M = 動機，Ps = 成功機會率，Is = 成功的誘因價值。\n**簡單來說：**你覺得自己「做得到」，而且成功「值得」，才會有動機。例：很想要但根本贏不到的獎品 → 動機低。\n**記住：**機會率 × 價值。"},"source":"PDF7 p.45","options":[{"en":"Is – incentive value of success","tw":"Is – 成功的誘因價值"},{"en":"Ps – probability of success","tw":"Ps – 成功的機會率"},{"en":"E – effort","tw":"E – 努力"},{"en":"A – ability","tw":"A – 能力"}],"answerIndex":0,"correctAnswer":{"en":"Is – incentive value of success","tw":"Is – 成功的誘因價值"}},{"id":"T7-16","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A student thinks success is very likely (Ps = 0.9) but sees no value in it (Is = 0). Motivation (M) = ?","tw":"學生認為成功機會很高（Ps = 0.9），但覺得成功毫無價值（Is = 0）。動機 M = ？"},"explanation":{"en":"**Slides say:** If Ps = 0 or Is = 0, then M = 0.\n**In simple words:** It's multiplication: 0.9 × 0 = 0. Even if success is almost certain, if you don't care about it at all, you won't be motivated.\n**Remember:** anything × 0 = 0.","tw":"**投影片：**如果 Ps = 0 或 Is = 0，M 就等於 0。\n**簡單來說：**這是乘法：0.9 × 0 = 0。即使幾乎一定成功，你完全不在乎的話，也不會有動機。\n**記住：**任何數 × 0 = 0。"},"source":"PDF7 p.45","options":[{"en":"0","tw":"0"},{"en":"0.9","tw":"0.9"},{"en":"0.45","tw":"0.45"},{"en":"1","tw":"1"}],"answerIndex":0,"correctAnswer":{"en":"0","tw":"0"}},{"id":"T7-17","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In expectancy theory, \"utility value\" means…","tw":"期望理論中，「實用價值」是指……"},"explanation":{"en":"**Slides say:** Utility value = how useful the student thinks the task is for future goals, such as career goals. Attainment value = personal importance and link to self-concept (pride). Cost = what you must give up, e.g. time.\n**In simple words:** \"Learning English will help me get a job abroad\" = utility value.\n**Remember:** utility = useful; attainment = pride; cost = what I give up.","tw":"**投影片：**實用價值 = 學生認為任務對未來目標（如職業）有多有用。成就價值 = 對個人的重要性及與自我概念的關係（自豪）。代價 = 要放棄的東西，例如時間。\n**簡單來說：**「學好英文有助我日後到外國工作」= 實用價值。\n**記住：**實用 = 有用；成就 = 自豪；代價 = 要放棄甚麼。"},"source":"PDF7 p.47","options":[{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"},{"en":"How the task links to self-concept and pride","tw":"任務與自我概念和自豪感的關係"},{"en":"What you must give up, e.g. time","tw":"要放棄甚麼，例如時間"},{"en":"The chance of succeeding","tw":"成功的機會率"}],"answerIndex":0,"correctAnswer":{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"}},{"id":"T7-18","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"If Ps (probability of success) is too HIGH, what happens to Is, and what should teachers do?","tw":"如果 Ps（成功機會率）太「高」，Is 會怎樣？老師應怎樣做？"},"explanation":{"en":"**Slides say:** If Ps is too high, Is will drop – \"What's the incentive for doing well on a very easy task?\" Grading should make good grades difficult, but not impossible.\n**In simple words:** Winning a race against a toddler feels worthless. Wins only feel valuable when they take real effort.\n**Remember:** challenging but not impossible.","tw":"**投影片：**Ps 太高，Is 便會下降 –「在極容易的任務上表現好有甚麼價值？」評分應令好成績變得困難，但並非不可能。\n**簡單來說：**跟幼童賽跑贏了也沒甚麼意思；要付出努力的勝利才有價值。\n**記住：**有挑戰，但並非不可能。"},"source":"PDF7 p.48","options":[{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"},{"en":"Is rises; make all tasks very easy","tw":"Is 上升；把所有任務變得很容易"},{"en":"Is stays the same; nothing needs to change","tw":"Is 不變；毋須改變"},{"en":"Is becomes negative; stop grading","tw":"Is 變成負數；停止評分"}],"answerIndex":0,"correctAnswer":{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"}},{"id":"T7-19","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Teachers should encourage students to attribute success and failure to factors that are…","tw":"老師應鼓勵學生把成功和失敗歸因於哪類因素？"},"explanation":{"en":"**Slides say:** Encourage students to attribute their success and failure to internal, controllable and unstable factors, e.g. effort.\n**In simple words:** If the cause is inside me and I can change it, then trying harder or changing my study method always makes sense.\n**Remember:** internal + controllable + unstable = effort / strategy.","tw":"**投影片：**鼓勵學生把成功和失敗歸因於內在、可控、不穩定的因素，例如努力。\n**簡單來說：**原因在我之內、我又能改變的話，更努力或改變溫習方法就一定有意思。\n**記住：**內在 + 可控 + 不穩定 = 努力／策略。"},"source":"PDF7 p.27","options":[{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"},{"en":"External, uncontrollable and stable (e.g. task difficulty)","tw":"外在、不可控、穩定（例如任務難度）"},{"en":"Internal, uncontrollable and stable (e.g. fixed ability)","tw":"內在、不可控、穩定（例如固定能力）"},{"en":"External, uncontrollable and unstable (e.g. luck)","tw":"外在、不可控、不穩定（例如運氣）"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"}},{"id":"T8-01","topicNo":8,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Maslow's hierarchy of needs from BOTTOM to TOP is…","tw":"馬斯洛需求層次由「下」至「上」是……"},"explanation":{"en":"**Slides say:** Maslow's hierarchy (1943), from the bottom: (1) physiological, (2) safety, (3) love & belonging, (4) esteem, (5) self-actualisation. More basic needs must be met before we are motivated by higher ones.\n**In simple words:** Food and sleep first, then feeling safe, then friends and family, then respect, then becoming your best self.\n**Remember:** \"**P**lease **S**top **L**aughing, **E**veryone **S**miles\" = P-S-L-E-S.","tw":"**投影片：**馬斯洛需求層次（1943），由下而上：(1) 生理；(2) 安全；(3) 愛與歸屬；(4) 尊重；(5) 自我實現。要先滿足較基本的需求，才會追求較高層的需求。\n**簡單來說：**先要吃飽睡好，再要安全，再要親友的愛，再要別人尊重，最後成為最好的自己。\n**記住：**「吃 → 安 → 愛 → 敬 → 實現」。"},"source":"PDF8 p.6","options":[{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"},{"en":"Safety → Physiological → Esteem → Love & belonging → Self-actualisation","tw":"安全 → 生理 → 尊重 → 愛與歸屬 → 自我實現"},{"en":"Physiological → Love & belonging → Safety → Self-actualisation → Esteem","tw":"生理 → 愛與歸屬 → 安全 → 自我實現 → 尊重"},{"en":"Self-actualisation → Esteem → Love & belonging → Safety → Physiological","tw":"自我實現 → 尊重 → 愛與歸屬 → 安全 → 生理"}],"answerIndex":0,"correctAnswer":{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"}},{"id":"T8-02","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which need is the LAST of the lower needs in Maslow's hierarchy?","tw":"馬斯洛需求層次中，哪一項是低層需求中的「最後」一個？"},"explanation":{"en":"**Slides say:** Love and belonging (social) needs relate to human interaction and are the last of the lower needs. Higher needs begin with esteem.\n**In simple words:** Belonging to a team, a club or a hobby group meets this need.\n**Remember:** lower = physiological, safety, love & belonging. Higher = esteem, self-actualisation.","tw":"**投影片：**愛與歸屬（社會）需求與人際互動有關，是低層需求中的最後一個；高層需求由尊重開始。\n**簡單來說：**加入球隊、學會或興趣小組，都能滿足這個需求。\n**記住：**低層 = 生理、安全、愛與歸屬；高層 = 尊重、自我實現。"},"source":"PDF8 p.7","options":[{"en":"Love and belonging (social) needs","tw":"愛與歸屬（社會）需求"},{"en":"Esteem needs","tw":"尊重需求"},{"en":"Safety needs","tw":"安全需求"},{"en":"Self-actualisation","tw":"自我實現"}],"answerIndex":0,"correctAnswer":{"en":"Love and belonging (social) needs","tw":"愛與歸屬（社會）需求"}},{"id":"T8-03","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to Maslow, which needs are NEVER fully satisfied?","tw":"根據馬斯洛，哪類需求「永遠不會」完全被滿足？"},"explanation":{"en":"**Slides say:** Basic and psychological needs CAN be satisfied. Growth (self-fulfilment) needs – e.g. the need to know, creativity – are NEVER fully satisfied: the more we fulfil them, the more we want.\n**In simple words:** Once you've eaten, you stop being hungry. But after reading one great book, you want to read another.\n**Remember:** growth needs keep growing.","tw":"**投影片：**基本和心理需求「可以」被滿足；成長（自我實現）需求 – 例如求知、創造力 – 「永遠不會」完全滿足：越滿足越想要更多。\n**簡單來說：**吃飽了就不再肚餓；但讀完一本好書，你會想讀下一本。\n**記住：**成長需求會一直增長。"},"source":"PDF8 p.12","options":[{"en":"Growth (self-fulfilment) needs","tw":"成長（自我實現）需求"},{"en":"Physiological needs","tw":"生理需求"},{"en":"Safety needs","tw":"安全需求"},{"en":"All needs are eventually fully satisfied","tw":"所有需求最終都能完全滿足"}],"answerIndex":0,"correctAnswer":{"en":"Growth (self-fulfilment) needs","tw":"成長（自我實現）需求"}},{"id":"T8-04","topicNo":8,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Maslow is known as the father of…","tw":"馬斯洛被稱為哪個學派之父？"},"explanation":{"en":"**Slides say:** Abraham Maslow (1908–1970), father of \"Humanistic Psychology\" (\"whole person\" psychology). Basic idea: motivation depends on, and is, the satisfaction of needs.\n**In simple words:** Humanistic psychology looks at the WHOLE person and their wish to grow, not just their behaviour.\n**Trap:** behaviourism = Watson; constructivism = Piaget and Vygotsky; social learning = Bandura.","tw":"**投影片：**馬斯洛（1908–1970），「人本心理學」（「全人」心理學）之父。基本思想：動機取決於（亦即是）需求的滿足。\n**簡單來說：**人本心理學關注「整個人」和他想成長的願望，而不只是行為。\n**陷阱：**行為主義 = 華生；建構主義 = 皮亞傑、維高斯基；社會學習 = 班杜拉。"},"source":"PDF8 p.4","options":[{"en":"Humanistic psychology","tw":"人本心理學"},{"en":"Behaviourism","tw":"行為主義"},{"en":"Constructivism","tw":"建構主義"},{"en":"Social learning theory","tw":"社會學習理論"}],"answerIndex":0,"correctAnswer":{"en":"Humanistic psychology","tw":"人本心理學"}},{"id":"T8-05","topicNo":8,"difficulty":"medium","type":"mc","star":true,"question":{"en":"For Carl Rogers, \"congruence\" means…","tw":"對羅傑斯而言，「一致性」是指……"},"explanation":{"en":"**Slides say:** The closer our self-image and ideal self are, the more congruent we are and the higher our sense of self-worth. Rogers: congruence is needed for self-actualisation and depends on unconditional positive regard.\n**In simple words:** If how you see yourself (\"I'm kind\") matches who you want to be (\"a kind person\"), you feel good about yourself.\n**Trap:** \"challenge matches skill\" is FLOW (T4), not congruence.","tw":"**投影片：**自我形象與理想自我越接近，就越一致，自我價值感越高。羅傑斯：自我實現需要一致性，而一致性有賴無條件積極關懷。\n**簡單來說：**你看自己的方式（「我很善良」）與你想成為的人（「善良的人」）相符，你就會欣賞自己。\n**陷阱：**「挑戰與技能相符」是心流（T4），不是一致性。"},"source":"PDF8 p.20","options":[{"en":"Your self-image is close to your ideal self → higher self-worth","tw":"自我形象與理想自我接近 → 自我價值感較高"},{"en":"Your behaviour matches your teacher's rules","tw":"你的行為符合老師的規則"},{"en":"Your challenge level matches your skill","tw":"挑戰程度與技能相符"},{"en":"Your attributions are internal and controllable","tw":"你的歸因屬內在且可控"}],"answerIndex":0,"correctAnswer":{"en":"Your self-image is close to your ideal self → higher self-worth","tw":"自我形象與理想自我接近 → 自我價值感較高"}},{"id":"T8-06","topicNo":8,"difficulty":"medium","type":"order","star":true,"question":{"en":"Accepting and loving a person for who they are – not withdrawn when they make mistakes. Tap the tiles to name it.","tw":"接納並愛一個人的本來面目 – 即使犯錯也不收回。按次序點選字卡，說出名稱。"},"explanation":{"en":"**Slides say:** Unconditional positive regard = parents or significant others accept and love the person for what he or she is; it is not withdrawn after mistakes. The person then feels free to try things and make mistakes.\n**In simple words:** \"I love you no matter what – even if you fail the test.\" Kids who feel this dare to try new things.\n**Trap:** conditional positive regard = \"I love you only IF you get an A.\"","tw":"**投影片：**無條件積極關懷 =
