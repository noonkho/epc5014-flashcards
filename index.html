ial learning theory is also called…","tw":"班杜拉的社會學習理論又稱為……"},"explanation":{"en":"\"Cognitive\" because it includes thinking (attention, memory, expectations) – unlike behaviourism.\nTrap: sociocultural = Vygotsky.","tw":"稱為「認知」，因為它考慮思考過程（注意、記憶、預期）– 與行為主義不同。\n陷阱：社會文化理論是維高斯基。"},"source":"PDF5 p.7","options":[{"en":"Social cognitive theory","tw":"社會認知理論"},{"en":"Sociocultural theory","tw":"社會文化理論"},{"en":"Operant conditioning","tw":"操作性制約"},{"en":"Self-determination theory","tw":"自我決定理論"}],"answerIndex":0,"correctAnswer":{"en":"Social cognitive theory","tw":"社會認知理論"},"accepted":null},{"id":"T5-14","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Reciprocal causation means…","tw":"相互因果關係（reciprocal causation）是指……"},"explanation":{"en":"Triangle: Environment ↔ Person ↔ Behaviour. The environment shapes us, but we also shape our environment.","tw":"三角關係：環境 ↔ 個人 ↔ 行為。環境影響我們，我們也影響環境。"},"source":"PDF5 p.28","options":[{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"},{"en":"Only the environment controls behaviour","tw":"只有環境控制行為"},{"en":"Behaviour is caused only by genes","tw":"行為只由基因決定"},{"en":"Rewards and punishments cancel each other out","tw":"獎勵與懲罰互相抵消"}],"answerIndex":0,"correctAnswer":{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"},"accepted":null},{"id":"T5-15","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"A toddler sees another child crying in fear of an injection, and then also becomes afraid of injections. This is…","tw":"幼兒看到別的孩子因害怕打針而哭，自己也變得害怕打針。這是……"},"explanation":{"en":"Empathy = feeling the SAME emotion as the person you watch. Sympathy = concern for another's suffering (different!).","tw":"同理心 = 感受到與被觀察者「相同」的情緒。同情心 = 對他人痛苦的關心（兩者不同！）。"},"source":"PDF5 p.26","options":[{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"},{"en":"Sympathy","tw":"同情心"},{"en":"Extinction","tw":"消退"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"},"accepted":null},{"id":"T5-16","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"Bill's daughter opened the combination lock weeks after watching him. Why does this challenge behaviourism?","tw":"Bill 的女兒在觀察爸爸數週後打開了密碼鎖。為何這挑戰了行為主義？"},"explanation":{"en":"Behaviourism says learning = immediate behaviour change, and only reinforced behaviour is performed. Here the mind (memory) did the work and she chose when to act.","tw":"行為主義認為學習 = 即時行為改變，且只有被強化的行為才會出現。這例子中是思想（記憶）在運作，而且她自己決定何時去做。"},"source":"PDF5 p.5","options":[{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"},{"en":"She was punished for opening the lock","tw":"她因開鎖而受罰"},{"en":"It proves learning is only a reflex","tw":"證明學習只是反射"},{"en":"She learned by trial and error in a puzzle box","tw":"她在迷箱中嘗試錯誤而學會"}],"answerIndex":0,"correctAnswer":{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"},"accepted":null},{"id":"T5-17","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"easy","type":"short","star":false,"question":{"en":"Who developed Social Learning Theory and the Bobo doll experiment? (surname)","tw":"誰提出社會學習理論並進行吹氣娃娃實驗？（姓氏）"},"explanation":{"en":"Bandura (1925–2021), Canadian; 4th most cited psychologist of all time (after Skinner, Freud, Piaget).","tw":"班杜拉（1925–2021），加拿大人；史上被引用第四多的心理學家（次於史金納、佛洛伊德、皮亞傑）。"},"source":"PDF5 p.8","options":null,"correctAnswer":{"en":"Albert Bandura","tw":"班杜拉（Albert Bandura）"},"accepted":["bandura","albert bandura","班杜拉","班度拉"]},{"id":"T6-01","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"What are the three stages of memory, in order?","tw":"記憶的三個階段，正確次序是？"},"explanation":{"en":"Like a library: label the book (encode) → shelve it (store) → find it later (retrieve).","tw":"就像圖書館：替書編號（編碼）→ 放上書架（儲存）→ 日後找出來（提取）。"},"source":"PDF6 p.5","options":[{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"},{"en":"Storage → Encoding → Retrieval","tw":"儲存 → 編碼 → 提取"},{"en":"Retrieval → Encoding → Storage","tw":"提取 → 編碼 → 儲存"},{"en":"Attention → Rehearsal → Forgetting","tw":"注意 → 複述 → 遺忘"}],"answerIndex":0,"correctAnswer":{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"},"accepted":null},{"id":"T6-02","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which level of encoding gives the deepest processing and the longest-lasting memory?","tw":"哪一層次的編碼處理最深、記憶最持久？"},"explanation":{"en":"Levels of processing (Craik & Lockhart, 1972): structural (shallow) < phonetic (intermediate) < semantic (deep, uses more brain areas).","tw":"處理層次理論（Craik & Lockhart, 1972）：結構（淺層）< 語音（中層）< 語義（深層，使用更多腦區）。"},"source":"PDF6 p.7","options":[{"en":"Semantic (meaning)","tw":"語義編碼（意義）"},{"en":"Structural (appearance)","tw":"結構編碼（外觀）"},{"en":"Phonetic (sound)","tw":"語音編碼（聲音）"},{"en":"Sensory (raw input)","tw":"感覺（原始輸入）"}],"answerIndex":0,"correctAnswer":{"en":"Semantic (meaning)","tw":"語義編碼（意義）"},"accepted":null},{"id":"T6-03","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Focusing on how a word SOUNDS (e.g. does it rhyme?) is ___ encoding.","tw":"專注於字詞的「讀音」（例如是否押韻）屬 ___ 編碼。"},"explanation":{"en":"Phonetic = intermediate processing. Structural = what it LOOKS like. Semantic = what it MEANS.","tw":"語音 = 中層處理。結構 = 看起來怎樣。語義 = 有甚麼意思。"},"source":"PDF6 p.7","options":[{"en":"Phonetic","tw":"語音（phonetic）"},{"en":"Structural","tw":"結構（structural）"},{"en":"Semantic","tw":"語義（semantic）"},{"en":"Episodic","tw":"情節（episodic）"}],"answerIndex":0,"correctAnswer":{"en":"Phonetic","tw":"語音（phonetic）"},"accepted":null},{"id":"T6-04","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"short","star":true,"question":{"en":"What is the capacity of short-term memory (number of items)?","tw":"短期記憶的容量是多少個單位？"},"explanation":{"en":"Magic number 7 ± 2. Duration is about 20 seconds without rehearsal. Tricks: chunking and rehearsal.","tw":"神奇數字 7 ± 2。不複述的話約保留 20 秒。技巧：集組塊和複述。"},"source":"PDF6 p.16","options":null,"correctAnswer":{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},"accepted":["7±2","7+-2","7+/-2","7","7 items","7±2 items","seven","7 chunks","7 plus or minus 2","7 plus minus 2","5-9","5 to 9","七","7個","7個單位","七個","七加減二"]},{"id":"T6-05","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"How long does information stay in short-term memory WITHOUT rehearsal?","tw":"在「不複述」的情況下，訊息在短期記憶中能保留多久？"},"explanation":{"en":"Sensory = fraction of a second · STM = ~20 s · LTM = relatively permanent.","tw":"感覺記憶 = 幾分之一秒 · 短期記憶 = 約 20 秒 · 長期記憶 = 相對永久。"},"source":"PDF6 p.16","options":[{"en":"About 20 seconds","tw":"約 20 秒"},{"en":"A fraction of a second","tw":"幾分之一秒"},{"en":"About 20 minutes","tw":"約 20 分鐘"},{"en":"Permanently","tw":"永久"}],"answerIndex":0,"correctAnswer":{"en":"About 20 seconds","tw":"約 20 秒"},"accepted":null},{"id":"T6-06","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"short","star":false,"question":{"en":"Grouping letters like BAPGDEPHDHKUCUHK into meaningful units (BA, PGDE, PhD, HKU…) to fit short-term memory is called ___.","tw":"把 BAPGDEPHDHKUCUHK 分成有意義的單元（BA、PGDE、PhD、HKU……）以放進短期記憶，稱為 ___。"},"explanation":{"en":"Each chunk counts as ONE item, so 7 ± 2 chunks can hold much more information. Well-organised teaching material helps chunking.","tw":"每個組塊只算「一個」單位，所以 7 ± 2 個組塊可容納更多資訊。有系統組織的教材有助集組塊。"},"source":"PDF6 p.16","options":null,"correctAnswer":{"en":"Chunking","tw":"集組塊（chunking）"},"accepted":["chunking","chunk","chunks","集組塊","意元集組","組塊"]},{"id":"T6-07","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"What is the capacity of long-term memory?","tw":"長期記憶的容量是？"},"explanation":{"en":"LTM: unlimited capacity, relatively permanent, organised as NETWORKS of meaning using schemas.","tw":"長期記憶：無限容量、相對永久，以基模組成意義「網絡」。"},"source":"PDF6 p.18","options":[{"en":"Unlimited","tw":"無限"},{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},{"en":"About 20 items","tw":"約 20 個單位"},{"en":"One item at a time","tw":"每次一個單位"}],"answerIndex":0,"correctAnswer":{"en":"Unlimited","tw":"無限"},"accepted":null},{"id":"T6-08","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Knowing HOW to ride a bicycle is stored as which type of memory?","tw":"「懂得」踩單車屬於哪種記憶？"},"explanation":{"en":"Implicit = procedural (\"how to\": motor skills, habits). Explicit = declarative → semantic (facts) + episodic (personal events).","tw":"內隱 = 程序記憶（「如何做」：動作技能、習慣）。外顯 = 陳述記憶 → 語意（事實）＋ 情節（個人事件）。"},"source":"PDF6 p.19","options":[{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"},{"en":"Episodic memory","tw":"情節記憶"},{"en":"Semantic memory","tw":"語意記憶"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"},"accepted":null},{"id":"T6-09","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Remembering your own 10th birthday party is which type of memory?","tw":"記得自己 10 歲的生日會，屬於哪種記憶？"},"explanation":{"en":"Episodic = personal EVENTS (an episode of your life). Semantic = FACTS (e.g. Pavlov won the Nobel Prize in 1904).","tw":"情節 = 個人「事件」（人生的一集）。語意 = 「事實」（例如巴甫洛夫 1904 年獲諾貝爾獎）。"},"source":"PDF6 p.21","options":[{"en":"Episodic memory","tw":"情節記憶（episodic）"},{"en":"Semantic memory","tw":"語意記憶（semantic）"},{"en":"Procedural memory","tw":"程序記憶（procedural）"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Episodic memory","tw":"情節記憶（episodic）"},"accepted":null},{"id":"T6-10","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Serial position effect: why are the LAST items in a list remembered well?","tw":"序列位置效應：為何清單「最後」的項目記得好？"},"explanation":{"en":"Primacy (first items) = more rehearsal. Recency (last items) = still in STM. Middle items = little rehearsal + interference (Murdock, 1962).","tw":"首因（開頭）= 複述較多。近因（最後）= 仍在短期記憶。中間 = 複述不足＋受干擾（Murdock, 1962）。"},"source":"PDF6 p.31","options":[{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"},{"en":"Primacy effect – they were rehearsed the most","tw":"首因效應 – 它們被複述得最多"},{"en":"They suffer the most interference","tw":"它們受最多干擾"},{"en":"They were encoded structurally","tw":"它們以結構編碼"}],"answerIndex":0,"correctAnswer":{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"},"accepted":null},{"id":"T6-11","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"short","star":false,"question":{"en":"PQ4R = Preview, Question, Read, Reflect, Recite, ___","tw":"PQ4R = 預覽、提問、閱讀、反思、背誦、___"},"explanation":{"en":"PQ4R (Thomas & Robinson, 1972) is a storage/study method, like note-taking, underlining and summarising.","tw":"PQ4R（Thomas & Robinson, 1972）是一種儲存／學習方法，與做筆記、劃線、總結一樣。"},"source":"PDF6 p.28","options":null,"correctAnswer":{"en":"Review","tw":"複習（review）"},"accepted":["review","reviewing","revise","revision","複習","温習","溫習"]},{"id":"T6-12","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"The method of loci improves encoding by…","tw":"位置記憶法（method of loci）如何改善編碼？"},"explanation":{"en":"Other ways to enrich encoding: self-referent (make it personally relevant) and elaborative (connect to what you already know).","tw":"其他豐富編碼的方法：自我參照（與自己相關）、聯想編碼（與已有知識連結）。"},"source":"PDF6 p.11","options":[{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"},{"en":"Repeating information out loud 100 times","tw":"把資訊大聲重複 100 次"},{"en":"Reading only the first and last items","tw":"只讀第一項和最後一項"},{"en":"Removing all meaning from the information","tw":"去除資訊的一切意義"}],"answerIndex":0,"correctAnswer":{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"},"accepted":null},{"id":"T6-13","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"Specht & Sandling (1991): after traditional lectures, scores dropped by 54%. After role-playing they dropped by only…","tw":"Specht & Sandling（1991）：傳統講課後分數下降 54%，角色扮演後只下降……"},"explanation":{"en":"Active learning (role-play) builds deeper, more meaningful encoding → better long-term memory.","tw":"主動學習（角色扮演）帶來更深、更有意義的編碼 → 長期記憶更好。"},"source":"PDF6 p.25","options":[{"en":"13%","tw":"13%"},{"en":"54%","tw":"54%"},{"en":"40%","tw":"40%"},{"en":"0%","tw":"0%"}],"answerIndex":0,"correctAnswer":{"en":"13%","tw":"13%"},"accepted":null},{"id":"T6-14","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"What is the difference between learning and development?","tw":"學習與發展（成長）的分別是？"},"explanation":{"en":"They are inter-dependent: learning can't happen in a developmentally inappropriate period (a child can't talk before vocal development). Nature AND nurture both matter.","tw":"兩者互相依存：發育未到就無法學習（發聲未發展前不能說話）。先天與後天同樣重要。"},"source":"PDF6 p.41","options":[{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"},{"en":"Learning = change due to maturation; development = change due to experience","tw":"學習 = 成熟帶來的改變；發展 = 經驗帶來的改變"},{"en":"They are unrelated","tw":"兩者毫無關係"},{"en":"Only development needs the environment","tw":"只有發展需要環境"}],"answerIndex":0,"correctAnswer":{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"},"accepted":null},{"id":"T6-15","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"From sensory memory, which information moves on to working memory?","tw":"感覺記憶中，哪些訊息會進入工作記憶？"},"explanation":{"en":"Attention is the gate. Teachers boost it with active learning, vivid real-life demos, pictures, thought-provoking questions, \"This will be on the test!\".","tw":"注意力是閘門。老師可用主動學習、生活化示範、圖片、發人深省的問題、「這是考試重點！」來提升注意。"},"source":"PDF6 p.15","options":[{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"},{"en":"All information automatically","tw":"所有訊息自動進入"},{"en":"Only information that rhymes","tw":"只有押韻的訊息"},{"en":"Only information older than 20 seconds","tw":"只有超過 20 秒的訊息"}],"answerIndex":0,"correctAnswer":{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"},"accepted":null},{"id":"T6-16","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who proposed the levels of processing theory (1972)?","tw":"誰提出處理層次理論（1972）？"},"explanation":{"en":"Craik & Lockhart = levels of processing. Thomas & Robinson = PQ4R. Murdock = serial position.","tw":"Craik & Lockhart = 處理層次。Thomas & Robinson = PQ4R。Murdock = 序列位置效應。"},"source":"PDF6 p.9","options":[{"en":"Craik & Lockhart","tw":"Craik & Lockhart"},{"en":"Thomas & Robinson","tw":"Thomas & Robinson"},{"en":"Specht & Sandling","tw":"Specht & Sandling"},{"en":"Seligman & Maier","tw":"Seligman & Maier"}],"answerIndex":0,"correctAnswer":{"en":"Craik & Lockhart","tw":"Craik & Lockhart"},"accepted":null},{"id":"T6-17","topicNo":6,"topic":{"en":"T6 Information Processing","tw":"T6 訊息處理模型"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"To prevent \"false memories\" where new and old information mix up, a teacher should…","tw":"為防止新舊訊息混淆造成「錯誤記憶」，老師應……"},"explanation":{"en":"Memory errors can happen at encoding (no attention), storage (wrong network) or retrieval (forgetting/inaccurate). Contrast helps file new info in the right network.","tw":"記憶錯誤可發生在編碼（不注意）、儲存（放錯網絡）、提取（遺忘／不準確）。對比新舊有助把新知放進正確網絡。"},"source":"PDF6 p.36","options":[{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"},{"en":"Teach the new topic without mentioning old topics","tw":"教新課題時完全不提舊課題"},{"en":"Give the information only once","tw":"只講一次"},{"en":"Ask students to memorise without understanding","tw":"要求學生不求甚解地背誦"}],"answerIndex":0,"correctAnswer":{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"},"accepted":null},{"id":"T7-01","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Motivation is defined (Slavin, 2014) as…","tw":"動機的定義（Slavin, 2014）是……"},"explanation":{"en":"3 verbs: ACTIVATE (start), GUIDE (direct), MAINTAIN (keep going).","tw":"三個動詞：激活（開始）、引導（方向）、維持（堅持）。"},"source":"PDF7 p.2","options":[{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"},{"en":"A reward given after a behaviour","tw":"行為之後給予的獎勵"},{"en":"A reflex caused by an unconditioned stimulus","tw":"由非制約刺激引起的反射"},{"en":"The capacity of short-term memory","tw":"短期記憶的容量"}],"answerIndex":0,"correctAnswer":{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"},"accepted":null},{"id":"T7-02","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who developed attribution theory?","tw":"誰提出歸因理論？"},"explanation":{"en":"Weiner (UCLA): every cause can be classified on 3 dimensions – internal/external, controllable/uncontrollable, stable/unstable.","tw":"Weiner（UCLA）：每個成因都可按三個維度分類 – 內在／外在、可控／不可控、穩定／不穩定。"},"source":"PDF7 p.8","options":[{"en":"Bernard Weiner","tw":"Bernard Weiner"},{"en":"Carol Dweck","tw":"Carol Dweck"},{"en":"Martin Seligman","tw":"Martin Seligman"},{"en":"Abraham Maslow","tw":"Abraham Maslow"}],"answerIndex":0,"correctAnswer":{"en":"Bernard Weiner","tw":"Bernard Weiner"},"accepted":null},{"id":"T7-03","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is EFFORT classified in attribution theory?","tw":"歸因理論中，「努力」如何分類？"},"explanation":{"en":"Effort is inside you, you control it, and it can change from day to day. That's why it's the BEST cause to blame or credit.","tw":"努力在你之內、由你控制、每天可以不同。所以它是最理想的歸因。"},"source":"PDF7 p.11","options":[{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},"accepted":null},{"id":"T7-04","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is TASK DIFFICULTY classified?","tw":"「任務難度」如何分類？"},"explanation":{"en":"Table:\n• Effort / learning strategy: internal · controllable · unstable\n• Luck: external · uncontrollable · unstable\n• Task difficulty: external · uncontrollable · stable\n• Ability: internal · uncontrollable(?) · stable(?)","tw":"表：\n• 努力／學習策略：內在 · 可控 · 不穩定\n• 運氣：外在 · 不可控 · 不穩定\n• 任務難度：外在 · 不可控 · 穩定\n• 能力：內在 · 不可控（?）· 穩定（?）"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},"accepted":null},{"id":"T7-05","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"How is LUCK classified?","tw":"「運氣」如何分類？"},"explanation":{"en":"Luck is outside you, you can't control it, and it changes. Trap: don't mix it up with task difficulty (which is STABLE).","tw":"運氣在你之外、不能控制、會改變。陷阱：別與任務難度（「穩定」）混淆。"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},"accepted":null},{"id":"T7-06","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which attribution for FAILURE is the most adaptive (desirable)?","tw":"對「失敗」的哪種歸因最理想（適應性）？"},"explanation":{"en":"Failure → lack of effort → motivating emotion (guilt) → high persistence, mastery-oriented, relatively high expectation.\nFailure → lack of ability → depression, helplessness, avoidance.","tw":"失敗 → 努力不足 → 激發情緒（內疚、不甘心）→ 高度堅持、精熟導向、期望較高。\n失敗 → 能力不足 → 沮喪、無助、逃避。"},"source":"PDF7 p.17","options":[{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"},{"en":"\"I'm just not smart enough.\"","tw":"「我根本不夠聰明。」"},{"en":"\"The test was impossible.\"","tw":"「測驗根本不可能做到。」"},{"en":"\"I was unlucky.\"","tw":"「我運氣不好。」"}],"answerIndex":0,"correctAnswer":{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"},"accepted":null},{"id":"T7-07","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"A teacher tells a student, \"You got an A – you were lucky!\" What is the problem?","tw":"老師對學生說：「你拿 A – 運氣好而已！」問題在哪？"},"explanation":{"en":"Success → luck → indifference, lack of future effort, little rise in expectation. Better: \"You worked hard / used a good strategy.\"","tw":"成功 → 運氣 → 冷漠、不再努力、期望不會提高。較好的說法：「你很努力／用了好策略。」"},"source":"PDF7 p.26","options":[{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"},{"en":"It attributes success to effort, which is maladaptive","tw":"把成功歸因於努力，屬不理想歸因"},{"en":"Luck is internal and stable","tw":"運氣是內在且穩定的"},{"en":"There is no problem; luck is the best attribution","tw":"沒有問題；運氣是最好的歸因"}],"answerIndex":0,"correctAnswer":{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"},"accepted":null},{"id":"T7-08","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Dogs that could NOT control electric shocks later did not even try to escape. Name this phenomenon.","tw":"無法控制電擊的狗，之後連嘗試逃走都沒有。這現象叫甚麼？"},"explanation":{"en":"Seligman & Maier (1967). In students: \"I'll fail anyway, why try?\" + anxiety + low self-esteem. Protection: real experiences of overcoming setbacks (the earlier, the stronger).","tw":"Seligman & Maier（1967）。學生身上：「反正會失敗，何必努力？」＋焦慮＋自卑。預防：真正克服挫折的經驗（越早越有效）。"},"source":"PDF7 p.1","options":null,"correctAnswer":{"en":"Learned helplessness","tw":"習得性無助（learned helplessness）"},"accepted":["learned helplessness","learnt helplessness","learned helpless","helplessness","習得性無助","習得無助"]},{"id":"T7-09","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"In Dweck's (1975) attributional retraining, students in the experimental group were told their failures were due to…","tw":"在 Dweck（1975）的歸因再訓練中，實驗組學生被告知失敗是因為……"},"explanation":{"en":"After 25 sessions they persisted longer, changed strategies when failing, and got better at maths. The control group got the same tasks but no feedback.","tw":"25 節後，他們更堅持、失敗時會改變策略，數學也進步了。對照組做同樣任務但沒有回饋。"},"source":"PDF7 p.24","options":[{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"},{"en":"Low intelligence","tw":"智力低"},{"en":"Bad luck","tw":"運氣差"},{"en":"A very difficult test","tw":"測驗太難"}],"answerIndex":0,"correctAnswer":{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"},"accepted":null},{"id":"T7-10","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"Intelligence is inborn and cannot change\" is the ___ theory of intelligence.","tw":"「智力是天生且不能改變的」屬 ___ 智力理論。"},"explanation":{"en":"Entity = fixed \"thing\" (uncontrollable, stable). Incremental = grows step by step with effort (controllable, unstable). Dweck, 1986.","tw":"固定理論 = 固定不變的「東西」（不可控、穩定）。增長理論 = 靠努力逐步增長（可控、不穩定）。Dweck, 1986。"},"source":"PDF7 p.30","options":[{"en":"Entity","tw":"固定（entity）"},{"en":"Incremental","tw":"增長（incremental）"},{"en":"Attribution","tw":"歸因"},{"en":"Expectancy","tw":"期望"}],"answerIndex":0,"correctAnswer":{"en":"Entity","tw":"固定（entity）"},"accepted":null},{"id":"T7-11","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"short","star":false,"question":{"en":"\"Intelligence can be changed through effort\" is the ___ theory of intelligence (one word).","tw":"「智力可以靠努力改變」屬哪種智力理論？"},"explanation":{"en":"Incremental + learning goals = growth mindset. Entity + performance goals = fixed mindset.","tw":"增長理論＋學習目標 = 成長心態。固定理論＋表現目標 = 固定心態。"},"source":"PDF7 p.30","options":null,"correctAnswer":{"en":"Incremental theory","tw":"增長理論（incremental）"},"accepted":["incremental","incremental theory","incremental theory of intelligence","增長理論","增長"]},{"id":"T7-12","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"It's important to me that I look smart compared to others in my class.\" This shows a…","tw":"「對我來說，在班上比別人顯得聰明很重要。」這反映……"},"explanation":{"en":"Performance goal = PROVE ability (grades, comparisons, short-term). Learning goal = IMPROVE ability (master new concepts, long-term).","tw":"表現目標 = 「證明」能力（成績、比較、短期）。學習目標 = 「提升」能力（掌握新概念、長期）。"},"source":"PDF7 p.37","options":[{"en":"Performance goal","tw":"表現目標"},{"en":"Learning goal","tw":"學習目標"},{"en":"Growth mindset","tw":"成長心態"},{"en":"Intrinsic motivation","tw":"內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Performance goal","tw":"表現目標"},"accepted":null},{"id":"T7-13","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"A growth mindset combines…","tw":"成長心態結合了……"},"explanation":{"en":"Growth mindset: ability is something to be DEVELOPED. Fixed mindset: ability is something to be DEMONSTRATED.","tw":"成長心態：能力是「培養」出來的。固定心態：能力是要「表現」出來的。"},"source":"PDF7 p.42","options":[{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"},{"en":"Entity theory of intelligence + performance goals","tw":"固定智力理論＋表現目標"},{"en":"Entity theory + learning goals","tw":"固定理論＋學習目標"},{"en":"External attributions + extrinsic rewards","tw":"外在歸因＋外在獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"},"accepted":null},{"id":"T7-14","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"A student with a PERFORMANCE goal and LOW confidence will most likely…","tw":"抱「表現目標」且「信心低」的學生最可能……"},"explanation":{"en":"Performance goal: high confidence → mastery-oriented; low confidence → helpless. Learning goal: mastery-oriented whether confidence is high OR low.","tw":"表現目標：信心高 → 精熟導向；信心低 → 無助。學習目標：信心高或低都是精熟導向。"},"source":"PDF7 p.1","options":[{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"},{"en":"Seek challenge with high persistence","tw":"尋求挑戰並高度堅持"},{"en":"Be mastery-oriented no matter what","tw":"無論如何都是精熟導向"},{"en":"Have no change in behaviour","tw":"行為沒有改變"}],"answerIndex":0,"correctAnswer":{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"},"accepted":null},{"id":"T7-15","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Expectancy theory: M = Ps × ___ (abbreviation or full name).","tw":"期望理論：M = Ps × ___（縮寫或全名）。"},"explanation":{"en":"M = motivation, Ps = perceived probability of success, Is = incentive value of success (Edwards 1954; Atkinson 1964).","tw":"M = 動機，Ps = 成功的機會率，Is = 成功的誘因價值（Edwards 1954；Atkinson 1964）。"},"source":"PDF7 p.45","options":null,"correctAnswer":{"en":"Is – incentive value of success","tw":"Is – 成功的誘因價值（對成果的價值評價）"},"accepted":["is","incentive value","incentive value of success","incentive","value","誘因價值","成果的價值","價值","效價"]},{"id":"T7-16","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"A student thinks success is very likely (Ps = 0.9) but sees no value in it (Is = 0). Motivation (M) = ?","tw":"學生認為成功機會很高（Ps = 0.9），但覺得成功毫無價值（Is = 0）。動機 M = ？"},"explanation":{"en":"Multiplication: if EITHER factor is 0, M = 0. 0.9 × 0 = 0. Both chance AND value are needed.","tw":"相乘：任何一個因素是 0，M 就是 0。0.9 × 0 = 0。機會率和價值缺一不可。"},"source":"PDF7 p.45","options":[{"en":"0","tw":"0"},{"en":"0.9","tw":"0.9"},{"en":"0.45","tw":"0.45"},{"en":"1","tw":"1"}],"answerIndex":0,"correctAnswer":{"en":"0","tw":"0"},"accepted":null},{"id":"T7-17","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"In expectancy theory, \"utility value\" means…","tw":"期望理論中，「實用價值」是指……"},"explanation":{"en":"Value types: Attainment (self-concept, pride) · Utility (future usefulness) · Cost (what you give up).","tw":"價值類型：成就價值（自我概念、自豪）· 實用價值（未來用處）· 代價（要放棄的東西）。"},"source":"PDF7 p.47","options":[{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"},{"en":"How the task links to self-concept and pride","tw":"任務與自我概念和自豪感的關係"},{"en":"What you must give up, e.g. time","tw":"要放棄甚麼，例如時間"},{"en":"The chance of succeeding","tw":"成功的機會率"}],"answerIndex":0,"correctAnswer":{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"},"accepted":null},{"id":"T7-18","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"If Ps (probability of success) is too HIGH, what happens to Is, and what should teachers do?","tw":"如果 Ps（成功機會率）太「高」，Is 會怎樣？老師應怎樣做？"},"explanation":{"en":"What's the value of acing a super-easy task? Little. So tasks should be challenging but not impossible.","tw":"在極容易的任務上拿高分有甚麼價值？很少。所以任務要有挑戰但並非不可能。"},"source":"PDF7 p.48","options":[{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"},{"en":"Is rises; make all tasks very easy","tw":"Is 上升；把所有任務變得很容易"},{"en":"Is stays the same; nothing needs to change","tw":"Is 不變；毋須改變"},{"en":"Is becomes negative; stop grading","tw":"Is 變成負數；停止評分"}],"answerIndex":0,"correctAnswer":{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"},"accepted":null},{"id":"T7-19","topicNo":7,"topic":{"en":"T7 Motivation I (Causes)","tw":"T7 學習動機 I（成因）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Teachers should encourage students to attribute success and failure to factors that are…","tw":"老師應鼓勵學生把成功和失敗歸因於哪類因素？"},"explanation":{"en":"If the cause is something I control and can change, then trying harder or changing strategy makes sense → motivation stays up.","tw":"如果成因是自己能控制、能改變的，那麼更努力或改策略就有意義 → 動機得以維持。"},"source":"PDF7 p.27","options":[{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"},{"en":"External, uncontrollable and stable (e.g. task difficulty)","tw":"外在、不可控、穩定（例如任務難度）"},{"en":"Internal, uncontrollable and stable (e.g. fixed ability)","tw":"內在、不可控、穩定（例如固定能力）"},{"en":"External, uncontrollable and unstable (e.g. luck)","tw":"外在、不可控、不穩定（例如運氣）"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"},"accepted":null},{"id":"T8-01","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"Maslow's hierarchy of needs from BOTTOM to TOP is…","tw":"馬斯洛需求層次由「下」至「上」是……"},"explanation":{"en":"Mnemonic (bottom → top): \"**P**lease **S**top **L**aughing **E**veryone **S**miles\" = Physiological, Safety, Love, Esteem, Self-actualisation. Lower needs must be met first.","tw":"記法（由下而上）：「吃 → 安 → 愛 → 敬 → 實現」。必須先滿足較低層需求。"},"source":"PDF8 p.6","options":[{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"},{"en":"Safety → Physiological → Esteem → Love & belonging → Self-actualisation","tw":"安全 → 生理 → 尊重 → 愛與歸屬 → 自我實現"},{"en":"Physiological → Love & belonging → Safety → Self-actualisation → Esteem","tw":"生理 → 愛與歸屬 → 安全 → 自我實現 → 尊重"},{"en":"Self-actualisation → Esteem → Love & belonging → Safety → Physiological","tw":"自我實現 → 尊重 → 愛與歸屬 → 安全 → 生理"}],"answerIndex":0,"correctAnswer":{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"},"accepted":null},{"id":"T8-02","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which need is the LAST of the lower needs in Maslow's hierarchy?","tw":"馬斯洛需求層次中，哪一項是低層需求中的「最後」一個？"},"explanation":{"en":"The higher needs begin with esteem. Love & belonging = being part of groups (team, club, hobby group).","tw":"高層需求由尊重開始。愛與歸屬 = 成為群體一分子（團隊、學會、興趣小組）。"},"source":"PDF8 p.7","options":[{"en":"Love and belonging (social) needs","tw":"愛與歸屬（社會）需求"},{"en":"Esteem needs","tw":"尊重需求"},{"en":"Safety needs","tw":"安全需求"},{"en":"Self-actualisation","tw":"自我實現"}],"answerIndex":0,"correctAnswer":{"en":"Love and belonging (social) needs","tw":"愛與歸屬（社會）需求"},"accepted":null},{"id":"T8-03","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to Maslow, which needs are NEVER fully satisfied?","tw":"根據馬斯洛，哪類需求「永遠不會」完全被滿足？"},"explanation":{"en":"Basic and psychological needs CAN be satisfied. Growth needs (to know, understand, create) – the more we fulfil them, the more we want.","tw":"基本和心理需求「可以」被滿足。成長需求（求知、理解、創造）– 越滿足，越想要更多。"},"source":"PDF8 p.12","options":[{"en":"Growth (self-fulfilment) needs","tw":"成長（自我實現）需求"},{"en":"Physiological needs","tw":"生理需求"},{"en":"Safety needs","tw":"安全需求"},{"en":"All needs are eventually fully satisfied","tw":"所有需求最終都能完全滿足"}],"answerIndex":0,"correctAnswer":{"en":"Growth (self-fulfilment) needs","tw":"成長（自我實現）需求"},"accepted":null},{"id":"T8-04","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Maslow is known as the father of…","tw":"馬斯洛被稱為哪個學派之父？"},"explanation":{"en":"Humanistic = \"whole person\" psychology. Basic idea: motivation depends on (and is) the satisfaction of needs.","tw":"人本心理學 =「全人」心理學。基本思想：動機取決於（亦即是）需求的滿足。"},"source":"PDF8 p.4","options":[{"en":"Humanistic psychology","tw":"人本心理學"},{"en":"Behaviourism","tw":"行為主義"},{"en":"Constructivism","tw":"建構主義"},{"en":"Social learning theory","tw":"社會學習理論"}],"answerIndex":0,"correctAnswer":{"en":"Humanistic psychology","tw":"人本心理學"},"accepted":null},{"id":"T8-05","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"For Carl Rogers, \"congruence\" means…","tw":"對羅傑斯而言，「一致性」是指……"},"explanation":{"en":"Closer self-image ↔ ideal self = more congruent = higher self-worth. Congruence is needed for self-actualisation and depends on unconditional positive regard.\nTrap: option 3 is flow.","tw":"自我形象 ↔ 理想自我越接近 = 越一致 = 自我價值越高。自我實現需要一致性，而一致性有賴無條件積極關懷。\n陷阱：第三項是心流。"},"source":"PDF8 p.20","options":[{"en":"Your self-image is close to your ideal self → higher self-worth","tw":"自我形象與理想自我接近 → 自我價值感較高"},{"en":"Your behaviour matches your teacher's rules","tw":"你的行為符合老師的規則"},{"en":"Your challenge level matches your skill","tw":"挑戰程度與技能相符"},{"en":"Your attributions are internal and controllable","tw":"你的歸因屬內在且可控"}],"answerIndex":0,"correctAnswer":{"en":"Your self-image is close to your ideal self → higher self-worth","tw":"自我形象與理想自我接近 → 自我價值感較高"},"accepted":null},{"id":"T8-06","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Accepting and loving a person for who they are – not withdrawn when they make mistakes – is called ___.","tw":"接納並愛一個人的本來面目 – 即使犯錯也不收回 – 稱為 ___。"},"explanation":{"en":"Result: the person feels free to try things and make mistakes. People who self-actualise usually received it from parents in childhood. Opposite: conditional positive regard.","tw":"結果：人會放心嘗試、敢於犯錯。能自我實現的人，童年時多數曾得到父母的無條件積極關懷。相反是有條件的積極關懷。"},"source":"PDF8 p.23","options":null,"correctAnswer":{"en":"Unconditional positive regard","tw":"無條件積極關懷（unconditional positive regard）"},"accepted":["unconditional positive regard","unconditional regard","upr","無條件的積極關懷","無條件積極關懷","無條件關懷","無條件正面關懷"]},{"id":"T8-07","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"A child loves music but feels parents only value them if they become a doctor. According to Rogers, \"conditions of worth\" may lead the child to…","tw":"孩子熱愛音樂，卻覺得父母只在他當醫生時才重視他。根據羅傑斯，「價值條件化」可能令孩子……"},"explanation":{"en":"Conditions of worth = conditions we think we must meet to be loved. They conflict with self-actualisation.","tw":"價值條件化 = 我們以為要達到某些條件才值得被愛。這與自我實現相衝突。"},"source":"PDF8 p.26","options":[{"en":"Deny or distort a feature of their true self","tw":"否認或扭曲真實自我的一部分"},{"en":"Reach self-actualisation faster","tw":"更快達到自我實現"},{"en":"Develop object permanence","tw":"發展物體恆存"},{"en":"Become intrinsically motivated to be a doctor","tw":"對當醫生產生內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Deny or distort a feature of their true self","tw":"否認或扭曲真實自我的一部分"},"accepted":null},{"id":"T8-08","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is NOT one of Rogers' five characteristics of a fully functioning person?","tw":"以下哪項「不是」羅傑斯所說「充分發揮的人」的五個特徵？"},"explanation":{"en":"The 5: open to experience · existential living · trust feelings · creativity · fulfilled life. Constant approval-seeking is linked to CONDITIONAL positive regard.","tw":"五個特徵：開放體驗 · 活在當下 · 信任感覺 · 創造力 · 充實人生。不斷尋求認可與「有條件」積極關懷有關。"},"source":"PDF8 p.28","options":[{"en":"Constantly seeking approval from others","tw":"不斷尋求他人認可"},{"en":"Open to experience","tw":"開放體驗"},{"en":"Existential living (living in the present)","tw":"活在當下"},{"en":"Trusting own feelings","tw":"信任自己的感覺"}],"answerIndex":0,"correctAnswer":{"en":"Constantly seeking approval from others","tw":"不斷尋求他人認可"},"accepted":null},{"id":"T8-09","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Rogers' self-concept has three components. Which set is correct?","tw":"羅傑斯的自我概念包括三個部分，哪組正確？"},"explanation":{"en":"Self-worth = what we think of ourselves; self-image = how we see ourselves (body, social roles, personality); ideal self = who we want to be (changes over time).\nTrap: option 3 is SDT.","tw":"自我價值 = 我們對自己的看法；自我形象 = 我們如何看自己（身體、社會角色、性格）；理想自我 = 想成為的人（會改變）。\n陷阱：第三項是自我決定理論。"},"source":"PDF8 p.18","options":[{"en":"Self-worth, self-image, ideal self","tw":"自我價值、自我形象、理想自我"},{"en":"Id, ego, superego","tw":"本我、自我、超我"},{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"},{"en":"Attention, retention, reproduction","tw":"注意、保存、再生"}],"answerIndex":0,"correctAnswer":{"en":"Self-worth, self-image, ideal self","tw":"自我價值、自我形象、理想自我"},"accepted":null},{"id":"T8-10","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Self-Determination Theory (SDT) names three intrinsic needs. Which are they?","tw":"自我決定理論（SDT）提出的三種內在需求是？"},"explanation":{"en":"Mnemonic \"**CAR**\": Competence (I can), Autonomy (I choose), Relatedness (I belong). Deci & Ryan.","tw":"記法「勝、自、歸」：勝任（我做得到）、自主（我自己選）、歸屬（我屬於這裡）。Deci & Ryan。"},"source":"PDF8 p.31","options":[{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"},{"en":"Physiological, safety, esteem","tw":"生理、安全、尊重"},{"en":"Attention, retention, motivation","tw":"注意、保存、動機"},{"en":"Effort, luck, ability","tw":"努力、運氣、能力"}],"answerIndex":0,"correctAnswer":{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"},"accepted":null},{"id":"T8-11","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"What can happen when extrinsic rewards are given for a behaviour that is ALREADY intrinsically motivated?","tw":"對「本已」有內在動機的行為給予外在獎勵，可能會怎樣？"},"explanation":{"en":"As behaviour becomes controlled by external rewards, people feel less in control → intrinsic motivation drops (Deci). So avoid extra rewards when students already enjoy the task.","tw":"當行為越來越受外在獎勵控制，人便覺得失去控制 → 內在動機下降（Deci）。所以學生已享受任務時，避免再給外在獎勵。"},"source":"PDF8 p.41","options":[{"en":"Autonomy is undermined and intrinsic motivation decreases","tw":"削弱自主感，內在動機下降"},{"en":"Intrinsic motivation always doubles","tw":"內在動機一定加倍"},{"en":"Nothing changes","tw":"沒有任何改變"},{"en":"The behaviour becomes a reflex","tw":"行為變成反射"}],"answerIndex":0,"correctAnswer":{"en":"Autonomy is undermined and intrinsic motivation decreases","tw":"削弱自主感，內在動機下降"},"accepted":null},{"id":"T8-12","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, how should rewards (like grades) be used?","tw":"根據投影片，應如何運用獎勵（例如成績）？"},"explanation":{"en":"\"Don't do it FOR the grade; the grade tells you how well you've done.\" If rewards are used to start a task, soon shift attention to the task's intrinsic value.","tw":"「不要『為了』成績而做；成績只是告訴你做得多好。」若用獎勵令學生開始任務，之後要盡快把注意力轉到任務本身的價值。"},"source":"PDF8 p.42","options":[{"en":"Focus on their informational function (the grade tells you how well you did), not their controlling function","tw":"著重其「信息」功能（成績告訴你做得多好），而非操控功能"},{"en":"Use them to control every behaviour","tw":"用它們控制每一個行為"},{"en":"Give them only for intrinsically enjoyable tasks","tw":"只在任務本身有趣時才給"},{"en":"Never tell students their grades","tw":"永不告訴學生成績"}],"answerIndex":0,"correctAnswer":{"en":"Focus on their informational function (the grade tells you how well you did), not their controlling function","tw":"著重其「信息」功能（成績告訴你做得多好），而非操控功能"},"accepted":null},{"id":"T8-13","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"\"I study this subject because it's fun.\" This is…","tw":"「我讀這科因為很有趣。」這是……"},"explanation":{"en":"Intrinsic = the task itself is the reward (fun, interest, important to self-concept). Extrinsic = to get a reward, avoid punishment or win approval.","tw":"內在 = 任務本身就是獎勵（有趣、興趣、對自我概念重要）。外在 = 為了獎勵、避免懲罰或得到認可。"},"source":"PDF8 p.45","options":[{"en":"Intrinsic motivation","tw":"內在動機"},{"en":"Extrinsic motivation","tw":"外在動機"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Learned helplessness","tw":"習得性無助"}],"answerIndex":0,"correctAnswer":{"en":"Intrinsic motivation","tw":"內在動機"},"accepted":null},{"id":"T8-14","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"In the Relative Autonomy Index (RAI), the scores of Q1 + Q2 (\"it's the rule\", \"so others won't get mad\") are multiplied by…","tw":"相對自主指數（RAI）中，Q1 + Q2（「這是規定」、「免得別人生氣」）的分數要乘以……"},"explanation":{"en":"RAI = (Q1+Q2)×−2 + (Q3+Q4)×−1 + (Q5+Q6)×1 + (Q7+Q8)×2. Most external reasons get −2; fun/enjoy get +2. (Ryan & Connell, 1989)","tw":"RAI =（Q1+Q2）×−2 +（Q3+Q4）×−1 +（Q5+Q6）×1 +（Q7+Q8）×2。最外在的理由乘 −2；有趣／享受乘 +2。（Ryan & Connell, 1989）"},"source":"PDF8 p.46","options":[{"en":"−2","tw":"−2"},{"en":"−1","tw":"−1"},{"en":"+1","tw":"+1"},{"en":"+2","tw":"+2"}],"answerIndex":0,"correctAnswer":{"en":"−2","tw":"−2"},"accepted":null},{"id":"T8-15","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"hard","type":"short","star":false,"question":{"en":"A POSITIVE RAI score means you have more ___ motivation than the other type.","tw":"RAI 分數為「正數」代表你的 ___ 動機較多。"},"explanation":{"en":"Positive RAI → more intrinsic than extrinsic; negative → the reverse.","tw":"RAI 正數 → 內在動機多於外在；負數 → 相反。"},"source":"PDF8 p.46","options":null,"correctAnswer":{"en":"Intrinsic","tw":"內在（intrinsic）"},"accepted":["intrinsic","intrinsic motivation","internal","內在","內在動機"]},{"id":"T8-16","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who developed Self-Determination Theory?","tw":"誰提出自我決定理論？"},"explanation":{"en":"Deci & Ryan, professors at the University of Rochester. Autonomy (free choice, directing your own actions) is a universal need.","tw":"Deci & Ryan，羅徹斯特大學教授。自主（自由選擇、主導自己行為）是普遍需要。"},"source":"PDF8 p.31","options":[{"en":"Edward Deci & Richard Ryan","tw":"Edward Deci & Richard Ryan"},{"en":"Abraham Maslow","tw":"Abraham Maslow"},{"en":"Carl Rogers","tw":"Carl Rogers"},{"en":"Carol Dweck","tw":"Carol Dweck"}],"answerIndex":0,"correctAnswer":{"en":"Edward Deci & Richard Ryan","tw":"Edward Deci & Richard Ryan"},"accepted":null},{"id":"T8-17","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"How do the slides say SDT may apply in Hong Kong / traditional Chinese culture?","tw":"投影片指自我決定理論在香港／中國傳統文化中可能如何應用？"},"explanation":{"en":"Culture matters: doing things for family can feel personally important, so it may become internalised.","tw":"文化有影響：為家人做事可以變成對自己重要的事，因而被內化。"},"source":"PDF8 p.52","options":[{"en":"Some extrinsic motives, like duty to close others (filial piety), may lead to intrinsic motivation for people who value meeting others' expectations","tw":"某些外在動機，如對家人的責任（孝道），對重視滿足他人期望的人，可能轉化為內在動機"},{"en":"SDT does not apply at all in Hong Kong","tw":"自我決定理論完全不適用於香港"},{"en":"Only money motivates students in Hong Kong","tw":"香港學生只受金錢激勵"},{"en":"Filial piety always destroys intrinsic motivation","tw":"孝道必定摧毀內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Some extrinsic motives, like duty to close others (filial piety), may lead to intrinsic motivation for people who value meeting others' expectations","tw":"某些外在動機，如對家人的責任（孝道），對重視滿足他人期望的人，可能轉化為內在動機"},"accepted":null},{"id":"T8-18","topicNo":8,"topic":{"en":"T8 Motivation II (Types)","tw":"T8 學習動機 II（類型）"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Students are hungry, sleepy or feel physically unsafe. Even with a fascinating lesson, Maslow predicts they will…","tw":"學生肚餓、睏倦或感到不安全。即使課堂很精彩，馬斯洛預計他們會……"},"explanation":{"en":"Lower needs must be met before higher needs (like the search for knowledge) can motivat function fmtWhen(ms){
  const d = ms - Date.now();
  if (d <= 0) return t("due");
  const m = Math.round(d/MIN);
  if (L()==="tw") return m < 60 ? `${m} 分鐘後` : m < 1440 ? `${Math.round(m/60)} 小時後` : `${Math.round(m/1440)} 天後`;
  return m < 60 ? `in ${m} min` : m < 1440 ? `in ${Math.round(m/60)} h` : `in ${Math.round(m/1440)} days`;
}
function fmtDur(ms){ const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

/* ---------- answer checking ---------- */
function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/\+\s*\/\s*-|\+\s*-/g,"±")
    .replace(/[\s.,;:'"()\[\]\-_/!?。，、；：「」『』（）！？·×*]/g,"");
}
function lev(a,b){
  const m=a.length, n=b.length; if (Math.abs(m-n)>2) return 9;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
const isCJK = s => /[㐀-鿿]/.test(s);
function checkShort(input, accepted){
  const n = norm(input); if (!n) return false;
  return accepted.some(a => {
    const m = norm(a);
    if (!m) return false;
    if (n === m) return true;
    if ((isCJK(m) ? m.length >= 2 : m.length >= 4) && n.includes(m)) return true;
    if (!isCJK(m) && m.length >= 5) return lev(n, m) <= (m.length >= 10 ? 2 : 1);
    return false;
  });
}

/* ---------- pool & scheduling ---------- */
function pool(){
  const st = S.settings, now = Date.now();
  return BANK.filter(q => st.topics.includes(q.topicNo) && st.diffs.includes(q.difficulty) && st.types.includes(q.type)
    && (!st.starOnly || q.star)
    && (!st.weakOnly || (peek(q.id).seen > 0 && peek(q.id).box <= 2)));
}
function grade(q, ok){
  const c = card(q.id), now = Date.now();
  c.seen++; ok ? c.right++ : c.wrong++;
  c.box = ok ? Math.min(5, Math.max(1, c.box) + 1) : 1; // new card answered right → box 2
  c.due = now + SCHED[S.settings.schedule][c.box - 1];
  const st = S.stats;
  st.answered++;
  if (ok){ st.correct++; st.streak++; st.best = Math.max(st.best, st.streak); st.score += POINTS[q.difficulty]; }
  else st.streak = 0;
}
function masteryPct(list){ list = list || BANK; if (!list.length) return 0; return Math.round(100 * list.filter(q => peek(q.id).box >= 4).length / list.length); }

/* ---------- study mode ---------- */
let mode = "study";
let study = null;   // {queue:[ids], done:n}
let cur = null;     // {q, order, picked, input, result}

function buildQueue(practice){
  const now = Date.now(), p = pool();
  // Random order everywhere; spaced repetition only decides WHICH cards come first.
  if (practice) return shuffle(p).map(q => q.id);
  const due = shuffle(p.filter(q => peek(q.id).seen > 0 && peek(q.id).due <= now));
  const fresh = shuffle(p.filter(q => !peek(q.id).seen));
  return [...due, ...fresh].map(q => q.id);
}
function startStudy(practice){
  study = { queue: buildQueue(practice), done: 0 };
  nextCard();
}
function nextCard(){
  if (!study.queue.length) return renderCaughtUp();
  const q = byId[study.queue.shift()];
  cur = { q, order: q.type==="mc" ? shuffle([0,1,2,3]) : null, picked:null, input:"", result:null };
  renderCard();
}
function renderCaughtUp(){
  cur = null;
  const p = pool();
  if (!p.length){ $("view").innerHTML = `<div class="card center"><p>${esc(t("noPool"))}</p></div>`; return; }
  const future = p.map(q => peek(q.id)).filter(c => c.seen && c.due > Date.now()).map(c => c.due).sort((a,b)=>a-b)[0];
  $("view").innerHTML = `<div class="card center">
    <h2>${esc(study && study.done ? t("sessionDone") : t("caught"))}</h2>
    <p>${future ? esc(t("nextDue",{t:fmtWhen(future)})) : esc(t("noneSeen"))}</p>
    <p>${esc(t("mastered"))} ${masteryPct(p)}%</p>
    <div class="bar good" aria-hidden="true"><i style="width:${masteryPct(p)}%"></i></div>
    <p class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="practiceBtn">${esc(t("practice"))}</button></p></div>`;
  $("practiceBtn").onclick = () => startStudy(true);
  $("practiceBtn").focus();
}

    <p><b>${esc(t("answerIs"))}</b> ${esc(tx(q.correctAnswer))}</p>
    ${alt ? `<p class="hint">${esc(t("accepted"))} ${esc(alt)}</p>` : ""}
    <p>${q.star?'<span class="star">★</span> ':""}${rich(tx(q.explanation))}</p>
    ${!ok ? `<p class="hint">${esc(pick(T[L()].no))}</p>` : ""}
    <p class="src">${esc(t("src"))} ${esc(q.source)}</p></div>`;
}
function renderCard(){
  const { q, order, picked, result } = cur;
  const answered = result !== null;
  const left = study.queue.length;
  const total = study.done + left + 1;
  const body = q.type === "mc"
    ? optionsHTML(q, order, picked, result, answered)
    : `<div class="ans"><label class="sr" for="ansIn">${esc(t("typeHere"))}</label>
        <input id="ansIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t("typeHere"))}" value="${esc(cur.input)}" ${answered?"disabled":""}>
        ${answered ? "" : `<button class="btn primary" id="checkBtn">${esc(t("check"))}</button>`}</div>`;
  $("view").innerHTML = `
    <div class="row hint" style="justify-content:space-between"><span>${esc(t("left",{n:left}))}</span></div>
    <div class="bar" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${study.done}"><i style="width:${Math.round(100*study.done/total)}%"></i></div>
    <article class="card">
      ${cardMeta(q)}
      <h2 class="q" id="qText" tabindex="-1">${q.star?'<span class="star" aria-hidden="true">★ </span>':""}${esc(tx(q.question))}</h2>
      ${body}
      <div id="fbBox" role="status" aria-live="polite">${answered ? feedbackHTML(q, result, q.type==="mc" ? (picked!=null ? tx(q.options[picked]) : "") : cur.input) : ""}</div>
      <div class="actions">
        ${answered ? `<span></span><button class="btn primary" id="nextBtn">${esc(t("next"))}</button>`
                   : `<button class="btn" id="idkBtn">${esc(t("idk"))}</button><span></span>`}
      </div>
    </article>`;
  if (!answered){
    if (q.type === "mc") document.querySelectorAll(".opt").forEach(b => b.onclick = () => submitStudy(+b.dataset.oi));
    else { $("checkBtn").onclick = () => submitStudy($("ansIn").value); $("ansIn").addEventListener("input", e => cur.input = e.target.value); }
    $("idkBtn").onclick = () => submitStudy(null);
    (q.type === "short" ? $("ansIn") : $("qText")).focus();
  } else {
    $("nextBtn").onclick = () => { study.done++; nextCard(); };
    $("nextBtn").focus();
  }
}
function submitStudy(answer){
  if (cur.result !== null) return;
  const q = cur.q;
  let ok;
  if (q.type === "mc"){ cur.picked = answer; ok = answer === q.answerIndex; }
  else { cur.input = answer == null ? "" : answer; ok = answer != null && checkShort(answer, q.accepted); }
  cur.result = ok;
  grade(q, ok);
  if (!ok){ // see it again later this round
    const pos = Math.min(study.queue.length, 3 + Math.floor(Math.random() * 4)); // back in 3–6 cards
    if (!study.queue.includes(q.id)) study.queue.splice(pos, 0, q.id);
  }
  save(); renderStats(); renderCard(); milestones(); persist();
}

/* ---------- test mode ---------- */
let test = null, timerId = null;
function renderTestSetup(){
  const n = pool().length;
  const opts = ["10","20","30","all"].map(v => `<option value="${v}" ${S.settings.testN===v?"selected":""}>${v==="all"?esc(t("all"))+` (${n})`:v}</option>`).join("");
  $("view").innerHTML = `<div class="card">
    <h2>${esc(t("testSetup"))}</h2><p>${esc(t("testDesc"))}</p>
    <p class="hint">${esc(n ? t("pool",{n}) : t("noPool"))}</p>
    <div class="row"><label for="testN">${esc(t("nQ"))}</label><select id="testN" class="btn">${opts}</select>
      <span class="hint">${esc(t("perQ"))}</span></div>
    <p><button class="btn primary" id="startTest" ${n?"":"disabled"}>${esc(t("start"))}</button></p></div>`;
  $("startTest").onclick = () => {
    S.settings.testN = $("testN").value; save();
    const p = shuffle(pool());
    const items = (S.settings.testN === "all" ? p : p.slice(0, +S.settings.testN));
    test = { items: items.map(q => ({ id:q.id, order: q.type==="mc"?shuffle([0,1,2,3]):null, answer:null })), i:0,
             start: Date.now(), deadline: Date.now() + items.length*45000, finished:false };
    clearInterval(timerId); timerId = setInterval(tick, 1000);
    renderTestQ();
  };
}
function tick(){
  if (!test || test.finished) return clearInterval(timerId);
  const left = test.deadline - Date.now();
  const el = $("timer"); if (el){ el.textContent = fmtDur(left); el.classList.toggle("low", left < 60000); }
  if (left <= 0) finishTest();
}
function renderTestQ(){
  const it = test.items[test.i], q = byId[it.id], n = test.items.length;
  const body = q.type === "mc"
    ? optionsHTML(q, it.order, it.answer, null, false)
    : `<div class="ans"><label class="sr" for="ansIn">${esc(t("typeHere"))}</label>
        <input id="ansIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t("typeHere"))}" value="${esc(it.answer||"")}"></div>`;
  $("view").innerHTML = `
    <div class="row hint" style="justify-content:space-between"><span>${esc(t("qOf",{i:test.i+1,n}))}</span>
      <span>${esc(t("timeLeft"))}: <span class="timer" id="timer">${fmtDur(test.deadline-Date.now())}</span></span></div>
    <div class="bar" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${test.i}"><i style="width:${Math.round(100*test.i/n)}%"></i></div>
    <article class="card">${cardMeta(q)}
      <h2 class="q" id="qText" tabindex="-1">${esc(tx(q.question))}</h2>${body}
      <div class="actions"><button class="btn" id="finBtn">${esc(t("finish"))}</button>
        <button class="btn primary" id="tNext">${esc(test.i < n-1 ? t("next") : t("finish"))}</button></div></article>`;
  if (q.type === "mc") document.querySelectorAll(".opt").forEach(b => b.onclick = () => { it.answer = +b.dataset.oi; testNext(); });
  else { $("ansIn").addEventListener("input", e => it.answer = e.target.value); $("ansIn").focus(); }
  if (q.type === "mc") $("qText").focus();
  $("tNext").onclick = testNext;
  $("finBtn").onclick = finishTest;
}
function testNext(){ if (test.i < test.items.length-1){ test.i++; renderTestQ(); } else finishTest(); }
function finishTest(){
  if (!test || test.finished) return;
  test.finished = true; clearInterval(timerId);
  const used = Math.min(Date.now(), test.deadline) - test.start;
  const rows = test.items.map(it => {
    const q = byId[it.id];
    const ok = q.type === "mc" ? it.answer === q.answerIndex : (it.answer != null && checkShort(it.answer, q.accepted));
    grade(q, ok);
    const given = q.type === "mc" ? (it.answer != null ? tx(q.options[it.answer]) : "") : (it.answer || "");
    return { q, ok, given };
  });
  save(); renderStats(); milestones(); persist();
  const c = rows.filter(r => r.ok).length, n = rows.length, p = n ? Math.round(100*c/n) : 0;
  if (p >= 90) confetti();
  rows.sort((a,b) => a.ok - b.ok);
  $("view").innerHTML = `<div class="card">
    <h2 tabindex="-1" id="resH">${esc(t("results"))}</h2>
    <p><b>${esc(t("scoreLine",{c,n,p,t:fmtDur(used)}))}</b></p>
    <div class="bar good" aria-hidden="true"><i style="width:${p}%"></i></div>
    <p>${esc(p>=90 ? pick(T[L()].yes) : pick(T[L()].no))}</p>
    <h3>${esc(t("review"))}</h3>
    ${rows.map((r,i) => `<div class="res-item"><p><span class="${r.ok?"ok-t":"no-t"}">${r.ok?"✓":"✗"}</span> <b>${i+1}.</b> ${esc(tx(r.q.question))}</p>
      ${r.ok ? `<p class="hint">${esc(t("answerIs"))} ${esc(tx(r.q.correctAnswer))}</p>` : feedbackHTML(r.q, false, r.given)}</div>`).join("")}
    <p><button class="btn primary" id="againBtn">${esc(t("again"))}</button></p></div>`;
  $("againBtn").onclick = renderTestSetup;
  $("resH").focus();
}

/* ---------- progress view ---------- */
function renderProgress(){
  const rows = Object.keys(TOPICS).map(k => {
    const list = BANK.filter(q => q.topicNo === +k), m = masteryPct(list);
    const seen = list.filter(q => peek(q.id).seen).length;
    return `<tr><td>${esc(tx(TOPICS[k]))}</td><td style="width:40%"><div class="bar good" aria-hidden="true"><i style="width:${m}%"></i></div></td><td>${m}%</td><td class="hint">${seen}/${list.length}</td></tr>`;
  }).join("");
  const counts = [0,1,2,3,4,5].map(b => BANK.filter(q => (peek(q.id).seen ? peek(q.id).box : 0) === b).length);
  $("view").innerHTML = `<div class="card"><h2>${esc(t("perTopic"))}</h2><table>${rows}</table>
    <p class="hint">${esc(t("mastered"))}</p>
    <h3>${esc(t("boxes"))}</h3>
    <div class="boxes">${counts.map((n,b) => `<div><b>${n}</b><br>${b ? "Box "+b : esc(t("bNew"))}</div>`).join("")}</div></div>`;
}

/* ---------- mode switching & events ---------- */
function setMode(m){
  if (mode === "test" && m !== "test" && test && !test.finished){ clearInterval(timerId); test = null; }
  mode = m;
  $("modeStudy").setAttribute("aria-pressed", m==="study"); $("modeTest").setAttribute("aria-pressed", m==="test"); $("modeStats").setAttribute("aria-pressed", m==="stats");
  if (m === "study") startStudy(false);
  else if (m === "test") renderTestSetup();
  else renderProgress();
}
function rerender(){
  renderLabels();
  if (mode === "study"){ cur ? renderCard() : startStudy(false); }
  else if (mode === "test"){ test && !test.finished ? renderTestQ() : renderTestSetup(); }
  else renderProgress();
}
$("lang-en").onclick = () => { S.settings.lang = "en"; save(); rerender(); };
$("lang-tw").onclick = () => { S.settings.lang = "tw"; save(); rerender(); };
$("modeStudy").onclick = () => setMode("study");
$("modeTest").onclick = () => setMode("test");
$("modeStats").onclick = () => setMode("stats");
$("filters").addEventListener("change", () => { readFilters(); updatePoolCount(); });
$("applyFilters").onclick = () => { readFilters(); save(); $("filters").open = false; cur = null; setMode(mode === "stats" ? "study" : mode); };
$("resetBtn").onclick = () => {
  $("confirmMsg").textContent = t("resetQ"); $("confirmYes").textContent = t("yesReset"); $("confirmNo").textContent = t("cancel");
  $("filters").open = false; $("confirmBox").hidden = false; $("confirmNo").focus();
};
$("confirmNo").onclick = () => { $("confirmBox").hidden = true; };
$("confirmYes").onclick = () => {
  $("confirmBox").hidden = true;
  const lang = S.settings.lang; S = defaults(); S.settings.lang = lang;
  try { localStorage.removeItem(KEY); } catch(e){}
  persist(); cur = null; renderLabels(); setMode("study");
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("confirmBox").hidden){ $("confirmBox").hidden = true; return; }
  if (e.key === "Escape" && $("filters").open){ $("filters").open = false; return; }
  if (!$("confirmBox").hidden) return;
  const inInput = e.target.tagName === "INPUT" && e.target.type === "text" || e.target.id === "ansIn";
  const inForm = e.target.closest && e.target.closest("#filters, select");
  if (inForm) return;
  if (mode === "study" && cur){
    if (cur.result === null){
      if (!inInput && cur.q.type === "mc" && /^[1-4]$/.test(e.key)){ e.preventDefault(); submitStudy(cur.order[+e.key-1]); }
      else if (cur.q.type === "short" && e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); submitStudy($("ansIn").value); }
    } else if (e.key === "Enter" && e.target.id !== "nextBtn"){ e.preventDefault(); study.done++; nextCard(); }
  } else if (mode === "test" && test && !test.finished){
    const it = test.items[test.i];
    if (!inInput && byId[it.id].type === "mc" && /^[1-4]$/.test(e.key)){ e.preventDefault(); it.answer = it.order[+e.key-1]; testNext(); }
    else if (byId[it.id].type === "short" && e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); testNext(); }
  }
});

/* ---------- account sync (only inside the claude.ai viewer, signed in) ---------- */
const sync = { ref:null, busy:false, dirty:false, timer:null };
function pushSoon(){ if (!sync.ref) return; sync.dirty = true; clearTimeout(sync.timer); sync.timer = setTimeout(push, 2000); }
async function push(){
  if (!sync.ref || sync.busy || !sync.dirty) return;
  sync.busy = true; sync.dirty = false;
  try { await sync.ref.set({ v:1, cards:S.cards, stats:S.stats, milestones:S.milestones, updatedAt:Date.now() }); }
  catch(e){
    if (e && ["invalid_argument","revoked","not_granted","quota_exceeded","capability_disabled","capability_removed"].includes(e.code)){ sync.ref = null; $("syncNote").textContent = t("syncLocal"); }
    else sync.dirty = true;
  } finally {
    sync.busy = false;
    if (sync.dirty && sync.ref) sync.timer = setTimeout(push, 4000);
  }
}
// Merge account copy into this browser's copy; returns true if this browser knew something the account did not.
function mergeRemote(r){
  let localAhead = false;
  const rc = (r && typeof r.cards === "object" && r.cards) || {};
  for (const id of Object.keys(byId)){
    const a = S.cards[id], b = rc[id];
    const ok = b && typeof b.seen === "number" && typeof b.box === "number" && typeof b.due === "number";
    if (ok && (!a || b.seen > a.seen || (b.seen === a.seen && b.due > a.due))) S.cards[id] = { box:b.box, due:b.due, seen:b.seen, right:+b.right||0, wrong:+b.wrong||0 };
    else if (a && a.seen && (!ok || a.seen > b.seen)) localAhead = true;
  }
  const rs = r && r.stats;
  if (rs && typeof rs.answered === "number" && rs.answered > S.stats.answered) S.stats = { ...S.stats, ...rs };
  else if (S.stats.answered > ((rs && rs.answered) || 0)) localAhead = true;
  if (r && r.milestones && typeof r.milestones === "object") S.milestones = { ...r.milestones, ...S.milestones };
  return localAhead;
}
async function initSync(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const localAhead = mergeRemote(snap.exists ? snap.data() : null);
    sync.ref = ref;
    save(); rerender();
    if (localAhead) pushSoon();
  } catch(e){ /* stay on this-browser storage */ }
}

renderLabels();
if (S.stats.answered) toast(t("started"));
setMode("study");
initSync();
</script>
