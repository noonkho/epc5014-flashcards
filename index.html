身體需要；次要 = 學來的價值。"},"source":"PDF4 p.28","options":[{"en":"Secondary reinforcers","tw":"次要強化物"},{"en":"Primary reinforcers","tw":"主要強化物"},{"en":"Unconditioned stimuli","tw":"非制約刺激"},{"en":"Negative punishments","tw":"負懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Secondary reinforcers","tw":"次要強化物"}},{"id":"T4-11","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"When should praise be given to strengthen Sam's answering behaviour?","tw":"應在何時稱讚 Sam，才能最有效加強他回答問題的行為？"},"explanation":{"en":"**Slides say:** The reinforcer must follow the response, always and only follow it, and follow IMMEDIATELY. Praising Sam before he answers does not encourage answering.\n**In simple words:** Like a dog trainer giving the treat the second the dog sits. If the treat comes much later, the dog doesn't know what it was for.\n**Remember:** after, every time, right away.","tw":"**投影片：**強化物必須在反應之後出現、總是且只在之後、並且「立即」。在 Sam 回答前稱讚他，並不能鼓勵他答問題。\n**簡單來說：**就像訓練狗，狗一坐下立刻給零食；遲很久才給，狗不知道是因為甚麼。\n**記住：**之後、每次、立刻。"},"source":"PDF4 p.29","options":[{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"},{"en":"Before he answers, to encourage him","tw":"在他回答前先稱讚以作鼓勵"},{"en":"At random times during the day","tw":"一天中隨機時間"},{"en":"Only at the end of the school term","tw":"只在學期末"}],"answerIndex":0,"correctAnswer":{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"}},{"id":"T4-12","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Rewarding behaviours that get closer and closer to a complex target behaviour is called ___.","tw":"獎勵越來越接近複雜目標行為的表現，稱為 ___。"},"explanation":{"en":"**Slides say:** Shaping = first reward behaviours close to the desired behaviour, then reward only behaviours even closer. Slide example: game time for spelling 3 of 10 words, then 5, then 7, then all 10.\n**In simple words:** Teach a big skill in small steps, raising the bar each time. Dolphin shows are trained this way.\n**Trap:** plan the steps carefully, or you may reward the wrong behaviour by mistake.","tw":"**投影片：**塑形 = 先獎勵接近目標的行為，之後只獎勵更接近的行為。投影片例子：串對 10 個字中的 3 個可玩遊戲，之後要 5 個、7 個，最後 10 個。\n**簡單來說：**把大技能拆成小步，逐步提高要求。海豚表演就是這樣訓練的。\n**陷阱：**步驟要仔細計劃，否則可能無意中獎勵了錯誤行為。"},"source":"PDF4 p.30","options":[{"en":"Shaping","tw":"塑形（shaping）"},{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Extinction","tw":"消退（extinction）"}],"answerIndex":0,"correctAnswer":{"en":"Shaping","tw":"塑形（shaping）"}},{"id":"T4-13","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Slot machines in a casino use which reinforcement schedule?","tw":"賭場的老虎機使用哪種強化計劃？"},"explanation":{"en":"**Slides say:** Variable ratio = the number of responses needed for a reinforcer varies, e.g. gambling and slot machines. People keep going in the hope of a reward.\n**In simple words:** You never know which pull will win, so you keep pulling. That's why gambling is so hard to stop.\n**Remember:** ratio = number of tries; variable = unpredictable.","tw":"**投影片：**變動比率 = 獲得獎勵所需的次數不固定，例如賭博、老虎機。人們為了期待中的獎勵而持續下去。\n**簡單來說：**你不知道哪一次會中，所以一直拉。這就是賭博難以停止的原因。\n**記住：**比率 = 次數；變動 = 不可預測。"},"source":"PDF4 p.41","options":[{"en":"Variable ratio","tw":"變動比率（variable ratio）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Variable ratio","tw":"變動比率（variable ratio）"},"fig":"schedules_grid"},{"id":"T4-14","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A monthly salary is an example of…","tw":"每月薪金屬於……"},"explanation":{"en":"**Slides say:** Fixed interval = the reinforcer is given after a fixed time interval, e.g. monthly salary.\n**In simple words:** Pay comes at the end of every month, however many tasks you did on one day.\n**Remember:** interval = time; fixed = always the same.","tw":"**投影片：**固定時距 = 在固定時間後給予獎勵，例如每月薪金。\n**簡單來說：**每月底出糧，不論你某一天做了多少工作。\n**記住：**時距 = 時間；固定 = 每次一樣。"},"source":"PDF4 p.41","options":[{"en":"Fixed interval","tw":"固定時距（fixed interval）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Variable interval","tw":"變動時距"},{"en":"Variable ratio","tw":"變動比率"}],"answerIndex":0,"correctAnswer":{"en":"Fixed interval","tw":"固定時距（fixed interval）"},"fig":"schedules_grid"},{"id":"T4-15","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Sudden (pop) quizzes use which schedule?","tw":"突擊測驗屬於哪種強化計劃？"},"explanation":{"en":"**Slides say:** Variable interval = the reinforcer comes after a varied time interval, e.g. a sudden quiz or random classwork checks.\n**In simple words:** A quiz could come on any day, so students keep studying steadily instead of cramming at the last minute.\n**Remember:** interval = time; variable = you can't predict when.","tw":"**投影片：**變動時距 = 在不定時間後給予強化，例如突擊測驗、隨機檢查功課。\n**簡單來說：**測驗可能任何一天出現，所以學生會一直溫習，而不是臨急抱佛腳。\n**記住：**時距 = 時間；變動 = 不知何時。"},"source":"PDF4 p.42","options":[{"en":"Variable interval","tw":"變動時距（variable interval）"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Continuous reinforcement","tw":"連續性強化"}],"answerIndex":0,"correctAnswer":{"en":"Variable interval","tw":"變動時距（variable interval）"},"fig":"schedules_grid"},{"id":"T4-16","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Factory piece work (paid per item made) is an example of…","tw":"工廠計件工作（按件計酬）屬於……"},"explanation":{"en":"**Slides say:** Fixed ratio = a specific number of responses must be made to get the reinforcer, e.g. factory piece work, or a bonus for selling 10 cars.\n**In simple words:** Make a set number of items → get paid. Always the same number, so you can predict it.\n**Remember:** ratio = number of actions; fixed = predictable.","tw":"**投影片：**固定比率 = 做出特定次數的行為才獲得獎勵，例如工廠計件工作、每賣 10 部車有花紅。\n**簡單來說：**完成固定數量就有報酬，數量不變，可以預測。\n**記住：**比率 = 次數；固定 = 可預測。"},"source":"PDF4 p.42","options":[{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"},{"en":"Variable ratio","tw":"變動比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"},"fig":"schedules_grid"},{"id":"T4-17","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is a danger of punishment listed in the slides?","tw":"以下哪項是投影片列出的懲罰的危機？"},"explanation":{"en":"**Slides say:** Dangers of punishment: it arouses emotion in the punisher and the punished; its severity is hard to judge; it motivates concealment (telling lies); it often has only short-term effects, so it must keep escalating. Advice: shape behaviour through reinforcement rather than punishment.\n**In simple words:** A child punished for breaking a cup may simply hide the next broken cup, rather than learn to be careful.\n**Remember:** reward the good rather than punish the bad.","tw":"**投影片：**懲罰的危機：激起懲罰者和受罰者的情緒；難判斷輕重；鼓勵隱瞞（說謊）；通常只有短期效果，要不斷加重。建議：以強化而非懲罰塑造行為。\n**簡單來說：**孩子打破杯子被罰，下次可能只會把破杯藏起來，而不是學會小心。\n**記住：**多獎勵好行為，少懲罰壞行為。"},"source":"PDF4 p.23","options":[{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"},{"en":"It always produces long-term behaviour change","tw":"一定帶來長期行為改變"},{"en":"It never arouses emotion","tw":"從不引起情緒"},{"en":"It is easy to judge how severe it should be","tw":"很容易判斷懲罰應有多嚴重"}],"answerIndex":0,"correctAnswer":{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"}},{"id":"T4-18","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Flow (Csikszentmihalyi) happens when…","tw":"心流（Csikszentmihalyi）在甚麼情況下出現？"},"explanation":{"en":"**Slides say:** Flow: challenge = skill. Boredom: challenge < skill. Anxiety: challenge > skill (Csikszentmihalyi, 1990).\n**In simple words:** Flow is being \"in the zone\" – so absorbed that time flies. Example: playing a video game at exactly your level. Too easy → bored. Too hard → stressed.\n**Remember:** flow is intrinsic – people do it even without rewards.","tw":"**投影片：**心流：挑戰 = 技能；無聊：挑戰 < 技能；焦慮：挑戰 > 技能（Csikszentmihalyi, 1990）。\n**簡單來說：**心流就是「入定」，全神投入，時間過得飛快。例：玩一個剛好適合你程度的遊戲。太易 → 悶；太難 → 緊張。\n**記住：**心流屬內在動機 – 沒有獎勵也願意做。"},"source":"PDF4 p.52","options":[{"en":"Challenge matches skill","tw":"挑戰 = 技能"},{"en":"Challenge is lower than skill","tw":"挑戰 < 技能"},{"en":"Challenge is higher than skill","tw":"挑戰 > 技能"},{"en":"There is no challenge at all","tw":"完全沒有挑戰"}],"answerIndex":0,"correctAnswer":{"en":"Challenge matches skill","tw":"挑戰 = 技能"},"fig":"flow_channel"},{"id":"T4-19","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In gamification, a task's challenge should be about ___ above the person's ability.","tw":"遊戲化中，任務的挑戰應比個人能力高出約 ___。"},"explanation":{"en":"**Slides say:** Gamification – make the challenge about 10% above ability, so people must focus and try hard but the goal is still reachable. Other steps: set clear goals, set levels/milestones, give instant rewards. The term was coined by Nick Pelling (2002).\n**In simple words:** Games stay fun because each level is a little harder than the last – hard enough to need effort, easy enough to win.\n**Remember:** ~10% harder = just right.","tw":"**投影片：**遊戲化 – 挑戰要高出能力約 10%，人們需要專注努力，但又做得到。其他步驟：訂定明確目標、設關卡／里程碑、即時獎勵。「遊戲化」一詞由 Nick Pelling（2002）提出。\n**簡單來說：**遊戲好玩，是因為每一關都比上一關難一點 – 要努力，但贏得到。\n**記住：**難約 10% = 剛剛好。"},"source":"PDF4 p.58","options":[{"en":"10%","tw":"10%"},{"en":"50%","tw":"50%"},{"en":"0%","tw":"0%"},{"en":"100%","tw":"100%"}],"answerIndex":0,"correctAnswer":{"en":"10%","tw":"10%"}},{"id":"T4-20","topicNo":4,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which comparison of classical vs operant conditioning is correct?","tw":"以下哪項古典制約與操作性制約的比較正確？"},"explanation":{"en":"**Slides say:** Classical: a stimulus comes first, the response is involuntary, learning is by association (Pavlov). Operant: the behaviour comes first, it is voluntary, learning is by reinforcement or punishment (Skinner).\n**In simple words:** Classical: bell rings → you drool without choosing. Operant: you choose to study → you get praised → you study more.\n**Remember:** Classical = reflex; Operant = choice.","tw":"**投影片：**古典：刺激在先，反應非自願，透過聯繫學習（巴甫洛夫）。操作：行為在先，屬自願，透過強化或懲罰學習（史金納）。\n**簡單來說：**古典：鈴聲一響你就流口水，不由自主。操作：你選擇溫習 → 被稱讚 → 更多溫習。\n**記住：**古典 = 反射；操作 = 選擇。"},"source":"PDF4 p.46","options":[{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"},{"en":"Classical: voluntary behaviour, consequence after (Skinner). Operant: involuntary, stimulus first (Pavlov).","tw":"古典：自願行為，後果在後（史金納）。操作：非自願，刺激在先（巴甫洛夫）。"},{"en":"Both use reinforcement and punishment only","tw":"兩者都只用強化和懲罰"},{"en":"Both only work with animals","tw":"兩者都只適用於動物"}],"answerIndex":0,"correctAnswer":{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"}},{"id":"T4-21","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Csikszentmihalyi's term for being totally absorbed in an activity, losing track of time, is…","tw":"Csikszentmihalyi 用來形容全情投入、忘記時間的狀態是……"},"explanation":{"en":"**Slides say:** \"Flow\" (Csikszentmihalyi, 1990) = being fully absorbed in an activity, losing track of time and self, even without external rewards (intrinsic motivation). It happens when challenge matches skill.\n**In simple words:** Like a musician practising so happily that hours pass in what feels like minutes.\n**Trap:** challenge < skill = boredom; challenge > skill = anxiety.","tw":"**投影片：**「心流」（Csikszentmihalyi, 1990）= 全神投入一項活動，忘我、忘記時間，沒有外在獎勵也願意做（內在動機）。挑戰與技能相符時出現。\n**簡單來說：**就像音樂家開心地練習，幾小時感覺只過了幾分鐘。\n**陷阱：**挑戰 < 技能 = 無聊；挑戰 > 技能 = 焦慮。"},"source":"PDF4 p.49","options":[{"en":"Flow","tw":"心流（flow）"},{"en":"Boredom","tw":"無聊（boredom）"},{"en":"Anxiety","tw":"焦慮（anxiety）"},{"en":"Learned helplessness","tw":"習得性無助"}],"answerIndex":0,"correctAnswer":{"en":"Flow","tw":"心流（flow）"},"fig":"flow_channel"},{"id":"T4-22","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Class exercise: praising a dog who sits when told. Which type is this?","tw":"課堂練習：狗服從指示坐下，你就稱讚牠。這屬哪一類？"},"explanation":{"en":"**Slides say:** Class exercise Q1 (no answer given). [Tip] Sitting goes UP → reinforcement; praise is ADDED → positive. So: positive reinforcement.\n**In simple words:** Something nice is added after the good action, so the dog sits more.\n**Remember:** always ask: up or down? add or remove?","tw":"**投影片：**課堂練習 Q1（未提供答案）。[提示] 坐下增加 → 強化；「加入」讚賞 → 正。所以是正增強。\n**簡單來說：**好行為之後加入好東西，狗更常坐下。\n**記住：**每次都問：增加還是減少？加入還是移走？"},"source":"PDF4 p.17","options":[{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative punishment","tw":"負懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Positive reinforcement","tw":"正增強"}},{"id":"T4-23","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Class exercise: a baby stops annoying crying after you pick it up. For YOU (the parent), picking the baby up is strengthened by…","tw":"課堂練習：你抱起寶寶後，他便停止惱人的哭鬧。對「你」（家長）來說，抱寶寶的行為被甚麼強化？"},"explanation":{"en":"**Slides say:** Class exercise Q2 (no answer given). [Tip] Your picking-up goes UP → reinforcement; the crying (unpleasant) is REMOVED → negative. So: negative reinforcement for the parent.\n**In simple words:** You learn \"pick up = noise stops\", so you pick the baby up more.\n**Trap:** negative reinforcement is not punishment – the behaviour INCREASES.","tw":"**投影片：**課堂練習 Q2（未提供答案）。[提示] 你抱寶寶的行為增加 → 強化；哭鬧（不愉快）被「移走」→ 負。所以對家長是負增強。\n**簡單來說：**你學會「抱起 = 哭聲停」，於是更常抱寶寶。\n**陷阱：**負增強不是懲罰 – 行為是「增加」的。"},"source":"PDF4 p.17","options":[{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative punishment","tw":"負懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Negative reinforcement","tw":"負增強"}},{"id":"T4-24","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Class exercise: you get fined $100 for speeding, and you speed less afterwards. Which type is this?","tw":"課堂練習：你因超速被罰款 $100，之後少了超速。這屬哪一類？"},"explanation":{"en":"**Slides say:** Class exercise Q3 (no answer given). [Tip] Speeding goes DOWN → punishment; money you like is TAKEN AWAY → negative. So: negative punishment (Q4, allowance cut for bad grades, works the same way).\n**In simple words:** You lose something you value, so you do the behaviour less.\n**Trap:** some textbooks call a fine \"positive punishment\" (adding a penalty). By the slides' rule (remove something positive), it is negative punishment.","tw":"**投影片：**課堂練習 Q3（未提供答案）。[提示] 超速減少 → 懲罰；你喜歡的錢被「移走」→ 負。所以是負懲罰（Q4 成績差被扣零用錢也一樣）。\n**簡單來說：**失去你重視的東西，於是減少該行為。\n**陷阱：**有些書把罰款當作「正懲罰」（加入懲處）；按投影片的規則（移走正面事物），屬負懲罰。"},"source":"PDF4 p.17","options":[{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive reinforcement","tw":"正增強"}],"answerIndex":0,"correctAnswer":{"en":"Negative punishment","tw":"負懲罰"}},{"id":"T4-25","topicNo":4,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the difference between continuous and intermittent (partial) reinforcement?","tw":"連續性強化與間歇性（部分）強化有何分別？"},"explanation":{"en":"**Slides say:** Continuous schedule: every instance of the desired behaviour is reinforced (reinforcer : behaviour = 1:1). Partial (intermittent) schedules reinforce only occasionally (< 1:1) – split into ratio and interval, fixed and variable.\n**In simple words:** A sticker for EVERY correct answer = continuous. A sticker only sometimes = intermittent.\n**Remember:** continuous teaches fast; intermittent makes behaviour last.","tw":"**投影片：**連續性強化：每次期望行為都得到獎勵（強化物：行為 = 1:1）。間歇性（部分）強化只偶爾獎勵（< 1:1），再分為比率和時距、固定和變動。\n**簡單來說：**每答對一題都有貼紙 = 連續性；只是有時有貼紙 = 間歇性。\n**記住：**連續學得快；間歇維持得久。"},"source":"PDF4 p.39","options":[{"en":"Continuous: every target behaviour is reinforced (1:1). Intermittent: only some are (< 1:1).","tw":"連續性：每次目標行為都獎勵（1:1）。間歇性：只偶爾獎勵（< 1:1）。"},{"en":"Continuous: reinforce once a month. Intermittent: reinforce every time.","tw":"連續性：每月獎勵一次。間歇性：每次都獎勵。"},{"en":"Continuous uses punishment; intermittent uses rewards","tw":"連續性用懲罰；間歇性用獎勵"},{"en":"There is no difference","tw":"沒有分別"}],"answerIndex":0,"correctAnswer":{"en":"Continuous: every target behaviour is reinforced (1:1). Intermittent: only some are (< 1:1).","tw":"連續性：每次目標行為都獎勵（1:1）。間歇性：只偶爾獎勵（< 1:1）。"}},{"id":"T4-26","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Behaviour modification (discipline) is based on the idea that…","tw":"行為矯正（紀律）的基本理念是……"},"explanation":{"en":"**Slides say:** You can modify students' behaviour with positive and negative consequences. Behaviour modification is based on the idea that good behaviour should lead to positive consequences and bad behaviour to negative consequences.\n**In simple words:** Like a game: good moves earn points, bad moves cost points.\n**Remember:** but the slides also advise using reinforcement more than punishment.","tw":"**投影片：**你可以用正面和負面後果修正學生行為。行為矯正的基礎：良好行為應帶來正面結果，不良行為應帶來負面結果。\n**簡單來說：**就像遊戲：好的一步得分，壞的一步扣分。\n**記住：**不過投影片也建議多用強化、少用懲罰。"},"source":"PDF4 p.19","options":[{"en":"Good behaviour should lead to positive consequences and bad behaviour to negative consequences","tw":"良好行為應帶來正面後果，不良行為應帶來負面後果"},{"en":"All behaviour should be ignored","tw":"所有行為都應被忽略"},{"en":"Only feelings, not behaviour, can be changed","tw":"只有感覺可以改變，行為不能"},{"en":"Students should choose their own consequences every time","tw":"每次都讓學生自選後果"}],"answerIndex":0,"correctAnswer":{"en":"Good behaviour should lead to positive consequences and bad behaviour to negative consequences","tw":"良好行為應帶來正面後果，不良行為應帶來負面後果"}},{"id":"T4-27","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to a study in the slides, when employees' time in \"flow\" at work rose from 5% to 15%, their productivity…","tw":"根據投影片引述的研究，員工上班時的「心流」時間由 5% 升至 15%，生產力會……"},"explanation":{"en":"**Slides say:** Typical workers are in flow only about 5% of the working day; when this rises to 15%, productivity doubles. Flow benefits: positive emotions, improved performance, improved creativity, fostering skill improvement.\n**In simple words:** A little more \"in the zone\" time makes a big difference.\n**Remember:** 5% → 15% flow = productivity × 2.","tw":"**投影片：**一般員工上班時只有約 5% 時間處於心流；升至 15% 時，生產力提升一倍。心流的好處：正向情緒、提升表現、提升創造力、驅使進步。\n**簡單來說：**多一點「入定」的時間，效果大大不同。\n**記住：**心流 5% → 15% = 生產力 × 2。"},"source":"PDF4 p.54","options":[{"en":"Doubled","tw":"提升一倍"},{"en":"Fell by half","tw":"下降一半"},{"en":"Did not change","tw":"沒有變化"},{"en":"Rose by 5%","tw":"上升 5%"}],"answerIndex":0,"correctAnswer":{"en":"Doubled","tw":"提升一倍"}},{"id":"T4-28","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"\"Gamification\" means…","tw":"「遊戲化」是指……"},"explanation":{"en":"**Slides say:** Gamification (term coined by Nick Pelling, 2002) = using game elements in non-game situations such as learning or work, to motivate people towards goals and make dull tasks fun – even creating \"flow\".\n**In simple words:** Example: earning badges for each reading level, like levelling up in a game.\n**Trap:** the goal is not just fun – it is reaching a goal while enjoying it.","tw":"**投影片：**遊戲化（Nick Pelling 於 2002 年提出）= 在學習、工作等非遊戲場合運用遊戲元素，激勵人達到目標，令沉悶的任務變得有趣，甚至產生「心流」。\n**簡單來說：**例：每完成一個閱讀程度就得到徽章，就像遊戲升級。\n**陷阱：**目標不只是好玩，而是在享受中達到目標。"},"source":"PDF4 p.57","options":[{"en":"Using game elements in non-game settings such as learning and work","tw":"在學習、工作等非遊戲場合運用遊戲元素"},{"en":"Letting students play video games all lesson","tw":"整堂課讓學生打機"},{"en":"Removing all goals from a task","tw":"移除任務的所有目標"},{"en":"Punishing students who lose","tw":"懲罰輸了的學生"}],"answerIndex":0,"correctAnswer":{"en":"Using game elements in non-game settings such as learning and work","tw":"在學習、工作等非遊戲場合運用遊戲元素"}},{"id":"T4-29","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT a feature of the flow state (Csikszentmihalyi)?","tw":"以下哪項「不是」心流狀態的特點（Csikszentmihalyi）？"},"explanation":{"en":"**Slides say:** People in flow: lose track of time; are fully absorbed and forget the self; keep going happily even when it's challenging; feel at their best; take part even WITHOUT external reward (intrinsic motivation); the challenge matches their skills.\n**In simple words:** Flow is doing something you love so much that the reward is the activity itself.\n**Remember:** flow = intrinsic.","tw":"**投影片：**心流狀態：快樂不知時日過；專心致志、忘我；即使有挑戰仍樂此不疲；覺得發揮到極致；即使沒有外在獎勵仍願意參與（內在動機）；挑戰與技能匹配。\n**簡單來說：**心流就是做喜愛的事，活動本身已是獎勵。\n**記住：**心流 = 內在動機。"},"source":"PDF4 p.50","options":[{"en":"It only continues when an external reward is given","tw":"只有給予外在獎勵才會持續"},{"en":"Time seems to fly by","tw":"時間彷彿飛逝"},{"en":"Total concentration; you forget yourself","tw":"全神貫注，彷彿忘我"},{"en":"The challenge matches your skills","tw":"挑戰與技能相符"}],"answerIndex":0,"correctAnswer":{"en":"It only continues when an external reward is given","tw":"只有給予外在獎勵才會持續"}},{"id":"T4-30","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Staying in at recess to help the teacher is a treat for Mei but a punishment for Tom. Why?","tw":"小息留在課室幫老師，對 Mei 是獎勵，對 Tom 卻是懲罰。為甚麼？"},"explanation":{"en":"**Slides say:** Reinforcer or punishment? It depends on the receiver's perception.\n**In simple words:** Same event, different feelings. Mei loves helping (reward); Tom loves playing outside (losing it feels like punishment).\n**Remember:** judge by the EFFECT on the behaviour, not by what you intended.","tw":"**投影片：**強化物（獎勵）還是懲罰？取決於接收者的感覺。\n**簡單來說：**同一件事，感受不同。Mei 喜歡幫忙（獎勵）；Tom 喜歡到外面玩（失去了就像懲罰）。\n**記住：**看它對行為的「效果」，而不是你的原意。"},"source":"PDF4 p.28","options":[{"en":"Whether something is a reinforcer or a punishment depends on the receiver's perception","tw":"某事是強化物還是懲罰，取決於接收者的感受"},{"en":"Recess is always a punishment","tw":"小息永遠是懲罰"},{"en":"Mei is in a different Piaget stage","tw":"Mei 處於另一個皮亞傑階段"},{"en":"It is classical conditioning, not operant","tw":"這是古典制約，不是操作性制約"}],"answerIndex":0,"correctAnswer":{"en":"Whether something is a reinforcer or a punishment depends on the receiver's perception","tw":"某事是強化物還是懲罰，取決於接收者的感受"}},{"id":"T4-31","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which reinforcement schedules are PREDICTABLE?","tw":"哪些強化計劃是「可預測」的？"},"explanation":{"en":"**Slides say:** Ratio = based on number of responses; interval = based on passage of time. Fixed-ratio and fixed-interval are predictable; variable-ratio and variable-interval are unpredictable.\n**In simple words:** \"Fixed\" = you know exactly when the reward comes (every 10 cars, every month). \"Variable\" = surprise timing.\n**Remember:** fixed = predictable; variable = unpredictable.","tw":"**投影片：**比率 = 按反應次數；時距 = 按時間流逝。固定比率和固定時距可預測；變動比率和變動時距不可預測。\n**簡單來說：**「固定」= 你清楚知道何時有獎勵（每 10 部車、每個月）；「變動」= 時間是驚喜。\n**記住：**固定 = 可預測；變動 = 不可預測。"},"source":"PDF4 p.41","options":[{"en":"Fixed ratio and fixed interval","tw":"固定比率和固定時距"},{"en":"Variable ratio and variable interval","tw":"變動比率和變動時距"},{"en":"Only variable ratio","tw":"只有變動比率"},{"en":"None of them","tw":"全部都不可預測"}],"answerIndex":0,"correctAnswer":{"en":"Fixed ratio and fixed interval","tw":"固定比率和固定時距"},"fig":"schedules_grid"},{"id":"T4-32","topicNo":4,"difficulty":"hard","type":"mc","star":true,"question":{"en":"According to the schedule-effects table, which schedule produces VERY HIGH performance with SLOW extinction?","tw":"根據強化計劃效果表，哪個計劃產生「非常高」的表現而且「消退緩慢」？"},"explanation":{"en":"**Slides say:** Continuous: fast learning but rapid extinction. Fixed interval: average and irregular performance, rapid extinction. Variable interval: moderately high, stable performance, slow extinction. Fixed ratio: high, stable performance attained quickly but rapid extinction. Variable ratio: very high performance with slow extinction.\n**In simple words:** When you never know which try will pay off, you keep trying – and you're slow to give up.\n**Remember:** VR = the \"slot machine\" schedule – the hardest to stop.","tw":"**投影片：**連續性：學得快但消退也快。固定時距：表現一般且不規則，消退快。變動時距：表現中高而穩定，消退慢。固定比率：很快達到高而穩定的表現，但消退快。變動比率：表現非常高，消退慢。\n**簡單來說：**不知道哪一次會成功，你就會一直試，而且很難放棄。\n**記住：**變動比率 =「老虎機」計劃，最難停止。"},"source":"PDF4 p.44","options":[{"en":"Variable ratio (e.g. gambling)","tw":"變動比率（例如賭博）"},{"en":"Continuous","tw":"連續性"},{"en":"Fixed interval (e.g. monthly salary)","tw":"固定時距（例如月薪）"},{"en":"Fixed ratio (e.g. factory piece work)","tw":"固定比率（例如工廠計件）"}],"answerIndex":0,"correctAnswer":{"en":"Variable ratio (e.g. gambling)","tw":"變動比率（例如賭博）"}},{"id":"T4-33","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"According to the schedule-effects table, what is true of CONTINUOUS reinforcement?","tw":"根據強化計劃效果表，「連續性」強化有甚麼特點？"},"explanation":{"en":"**Slides say:** Continuous (reinforce after each desired behaviour): fast learning of new behaviour but rapid extinction.\n**In simple words:** If you get a sweet EVERY time, you learn quickly – but when the sweets stop, you quickly stop too.\n**Remember:** start with continuous to teach; switch to intermittent to keep the behaviour.","tw":"**投影片：**連續性（每次期望行為後都強化）：新行為學得快，但消退也快。\n**簡單來說：**每次都有糖吃，你學得很快；但糖一停，你也很快不做了。\n**記住：**先用連續性去教，再轉間歇性去維持。"},"source":"PDF4 p.44","options":[{"en":"Fast learning of new behaviour, but rapid extinction once rewards stop","tw":"新行為學得快，但獎勵一停便很快消退"},{"en":"Slow learning but behaviour lasts forever","tw":"學得慢但行為永遠維持"},{"en":"Very high performance with slow extinction","tw":"表現非常高而且消退慢"},{"en":"Average and irregular performance","tw":"表現一般且不規則"}],"answerIndex":0,"correctAnswer":{"en":"Fast learning of new behaviour, but rapid extinction once rewards stop","tw":"新行為學得快，但獎勵一停便很快消退"}},{"id":"T4-34","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"According to the slides, punishment is most EFFECTIVE when it is…","tw":"根據投影片，懲罰在甚麼情況下最「有效」？"},"explanation":{"en":"**Slides say:** Effective punishment: swift, consistent, appropriately aversive. Challenges: it may increase aggressive behaviour, and people may fear the person who punishes. It is most effective when combined with reinforcement for the desired behaviour.\n**In simple words:** Act right away, the same way every time, not too harsh – and praise the good behaviour you DO want.\n**Remember:** punish the wrong + reward the right.","tw":"**投影片：**有效的懲罰：迅速、一致、厭惡程度適當。挑戰：可能增加攻擊行為，令人害怕懲罰者。配合強化期望的行為時最有效。\n**簡單來說：**即時、每次一樣、不過分 – 同時稱讚你「想要」的好行為。\n**記住：**罰錯的 + 獎對的。"},"source":"PDF4 p.13","options":[{"en":"Swift, consistent, appropriately aversive – and combined with reinforcement for the desired behaviour","tw":"迅速、一致、厭惡程度適當，並配合強化期望的行為"},{"en":"Delayed until the end of term","tw":"延遲到學期末才執行"},{"en":"Given only sometimes, at random","tw":"只是偶爾隨機給予"},{"en":"As harsh as possible, with no reinforcement","tw":"愈嚴厲愈好，不配合任何強化"}],"answerIndex":0,"correctAnswer":{"en":"Swift, consistent, appropriately aversive – and combined with reinforcement for the desired behaviour","tw":"迅速、一致、厭惡程度適當，並配合強化期望的行為"}},{"id":"T4-35","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The slides note another name for negative reinforcement. What is it?","tw":"投影片提到負增強的另一個名稱，是甚麼？"},"explanation":{"en":"**Slides say:** Negative reinforcement = removing an unpleasant stimulus after a behaviour, so the behaviour increases – sometimes called escape conditioning.\n**In simple words:** You learn the action that lets you ESCAPE something unpleasant. Example: you take a painkiller and the headache goes away, so you take one next time too.\n**Remember:** negative reinforcement = escape the nasty.","tw":"**投影片：**負增強 = 行為後移除不愉快刺激，令行為增加 – 有時稱為逃脫制約。\n**簡單來說：**你學會能「逃離」不愉快事物的行為。例：吃止痛藥後頭痛消失，下次頭痛又會吃。\n**記住：**負增強 = 逃離討厭的事。"},"source":"PDF4 p.12","options":[{"en":"Escape conditioning","tw":"逃脫制約（escape conditioning）"},{"en":"Extinction","tw":"消退"},{"en":"Shaping","tw":"塑形"},{"en":"Generalization","tw":"泛化"}],"answerIndex":0,"correctAnswer":{"en":"Escape conditioning","tw":"逃脫制約（escape conditioning）"}},{"id":"T4-36","topicNo":4,"difficulty":"hard","type":"order","star":true,"question":{"en":"Shaping example: teach shy Johnny to speak in front of the class. Put the reinforced steps in order.","tw":"塑形例子：教害羞的 Johnny 在全班面前說話。把獲強化的步驟排成正確次序。"},"explanation":{"en":"**Slides say:** Shaping Johnny: (1) stand up from his bench; (2) stand in front of the class for at least 5 s; (3) stand in front and say \"Hello\"; (4) say hello and introduce himself; (5) read a passage from his book; (6) give a speech – each step is reinforced.\n**In simple words:** Each step is only a little harder than the last, and only the newest step earns the reward.\n**Remember:** reward closer and closer approximations.","tw":"**投影片：**塑形 Johnny：(1) 從座位站起來；(2) 站在全班面前至少 5 秒；(3) 站在前面說「Hello」；(4) 說 Hello 並自我介紹；(5) 朗讀書中一段；(6) 發表演講 – 每一步都獲強化。\n**簡單來說：**每一步只比上一步難一點，只有最新的一步才得到獎勵。\n**記住：**獎勵越來越接近目標的行為。"},"source":"PDF4 p.36","tiles":{"en":["Stands up from his bench","Stands in front of the class for 5 s","Stands in front and says \"Hello\"","Says hello and introduces himself","Reads a passage from his book","Gives a speech"],"tw":["從座位站起來","站在全班面前 5 秒","站在前面說「Hello」","說 Hello 並自我介紹","朗讀書中的一段","發表演講"]},"answerLen":{"en":6,"tw":6},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Stands up from his bench → Stands in front of the class for 5 s → Stands in front and says \"Hello\" → Says hello and introduces himself → Reads a passage from his book → Gives a speech","tw":"從座位站起來 → 站在全班面前 5 秒 → 站在前面說「Hello」 → 說 Hello 並自我介紹 → 朗讀書中的一段 → 發表演講"}},{"id":"T4-37","topicNo":4,"difficulty":"hard","type":"mc","star":false,"question":{"en":"On the slides' flow chart (challenge level vs skill level), LOW challenge with LOW skill gives…","tw":"在投影片的心流圖（挑戰程度 vs 技能程度）中，「低」挑戰加「低」技能會產生……"},"explanation":{"en":"**Slides say:** The flow chart has 8 zones: anxiety (high challenge, low skill), arousal, flow (high challenge, high skill), control, relaxation (low challenge, high skill), boredom, apathy (low challenge, low skill), worry.\n**In simple words:** An easy task you're bad at, which you also don't care about → \"meh\" = apathy.\n**Remember:** flow lives in the top-right corner: hard AND skilled.","tw":"**投影片：**心流圖有 8 個區域：焦慮（高挑戰、低技能）、激發、心流（高挑戰、高技能）、掌控、放鬆（低挑戰、高技能）、無聊、冷漠（低挑戰、低技能）、擔憂。\n**簡單來說：**容易又不擅長、自己又不在乎的事 →「無所謂」= 冷漠。\n**記住：**心流在右上角：又難又有技能。"},"source":"PDF4 p.53","options":[{"en":"Apathy","tw":"冷漠（apathy）"},{"en":"Flow","tw":"心流（flow）"},{"en":"Anxiety","tw":"焦慮（anxiety）"},{"en":"Control","tw":"掌控（control）"}],"answerIndex":0,"correctAnswer":{"en":"Apathy","tw":"冷漠（apathy）"},"fig":"flow_channel"},{"id":"T4-38","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is one of the gamification steps in the slides?","tw":"以下哪項是投影片中的遊戲化步驟？"},"explanation":{"en":"**Slides say:** Gamification steps: set clear goals; make it challenging (about 10% above ability); set levels/milestones (be clear about how many tasks and where the checkpoints are); give instant rewards when a small stage is finished.\n**In simple words:** Like a game: you know the goal, each level is a bit harder, you can see your progress, and you get rewards straight away.\n**Remember:** goals, 10%, levels, instant rewards.","tw":"**投影片：**遊戲化步驟：訂定明確目標；具挑戰性（高出能力約 10%）；設定關卡／里程碑（清楚有幾件事要完成、關卡在哪裏）；完成小階段給即時獎勵。\n**簡單來說：**就像遊戲：清楚目標、每關難一點、看到進度、立即得到獎勵。\n**記住：**目標、10%、關卡、即時獎勵。"},"source":"PDF4 p.59","options":[{"en":"Give instant rewards when a small stage is completed","tw":"完成小階段就給即時獎勵"},{"en":"Keep the goal secret","tw":"把目標保密"},{"en":"Make tasks 50% harder than ability","tw":"令任務比能力難 50%"},{"en":"Remove all levels and milestones","tw":"取消所有關卡和里程碑"}],"answerIndex":0,"correctAnswer":{"en":"Give instant rewards when a small stage is completed","tw":"完成小階段就給即時獎勵"}},{"id":"T4-39","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a benefit of flow listed in the slides?","tw":"以下哪項是投影片列出的心流好處？"},"explanation":{"en":"**Slides say:** Benefits of flow: (1) positive emotions; (2) improved performance; (3) improved creativity – inspiration and creativity rise greatly (e.g. composers, painters); (4) fostering skill improvement – people keep pushing through difficulties (similar to Vygotsky's ZPD).\n**In simple words:** When you're \"in the zone\", new ideas pop up more easily.\n**Remember:** emotion, performance, creativity, skill.","tw":"**投影片：**心流的好處：(1) 正向情緒；(2) 提升表現；(3) 提升創造力 – 靈感和創意大大提升（如作曲家、畫家）；(4) 驅使進步 – 迎難而上（與維高斯基的 ZPD 異曲同工）。\n**簡單來說：**「入定」的時候，新點子更容易出現。\n**記住：**情緒、表現、創意、技能。"},"source":"PDF4 p.55","options":[{"en":"Improved creativity – inspiration rises when everyday distractions are set aside","tw":"提升創造力 – 放下日常雜念，靈感大增"},{"en":"Greater need for external rewards","tw":"更需要外在獎勵"},{"en":"More anxiety and stress","tw":"更多焦慮和壓力"},{"en":"Shorter attention span","tw":"專注時間更短"}],"answerIndex":0,"correctAnswer":{"en":"Improved creativity – inspiration rises when everyday distractions are set aside","tw":"提升創造力 – 放下日常雜念，靈感大增"}},{"id":"T4-40","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which question from the slides helps you check whether an activity gives you flow?","tw":"投影片中哪個問題可以幫你檢查某活動是否帶來心流？"},"explanation":{"en":"**Slides say:** To find flow activities, ask: Do you love it and are willing to spend time (even money) on it without any reward? Does time often seem to fly? When talking about it, do you feel proud or deeply satisfied?\n**In simple words:** If you lose track of time doing it and would do it for free, it's probably a flow activity.\n**Remember:** no reward needed + time flies + pride.","tw":"**投影片：**找出心流活動，可以問：是否喜愛並願意付出時間（甚至金錢），即使沒有獎勵？是否常覺得時光飛逝？談論它時是否感到自豪或滿足？\n**簡單來說：**做的時候忘記時間、不收錢也願意做，大概就是心流活動。\n**記住：**不需獎勵 + 時光飛逝 + 自豪。"},"source":"PDF4 p.51","options":[{"en":"Does time seem to fly when you are doing it?","tw":"做這件事時，是否常覺得時光飛逝？"},{"en":"Do you only do it when you are paid?","tw":"是否只有收錢才會做？"},{"en":"Do you feel bored most of the time?","tw":"是否大部分時間都覺得悶？"},{"en":"Do you avoid talking about it?","tw":"是否避免談論它？"}],"answerIndex":0,"correctAnswer":{"en":"Does time seem to fly when you are doing it?","tw":"做這件事時，是否常覺得時光飛逝？"}},{"id":"T5-01","topicNo":5,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Learning by observing the CONSEQUENCES of other people's behaviour is called…","tw":"透過觀察「他人行為的後果」來學習，稱為……"},"explanation":{"en":"**Slides say:** Vicarious learning = learning by watching others' failures or successes (their consequences). Seeing someone reinforced increases your tendency to do it; seeing someone punished decreases it.\n**In simple words:** You learn from what happens to OTHER people. Slide example: a new employee is always punctual after seeing a colleague fired for being late.\n**Remember:** vicarious = \"through someone else\".","tw":"**投影片：**替代學習 = 透過觀察他人的失敗／成功（行為後果）來學習。看到別人受獎，你更傾向做；看到別人受罰，你減少做。\n**簡單來說：**從「別人」的遭遇中學習。投影片例子：新員工見同事因遲到被解僱後，總是準時。\n**記住：**替代 =「借別人的經驗」。"},"source":"PDF5 p.6","options":[{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"},{"en":"Classical conditioning","tw":"古典制約"},{"en":"Shaping","tw":"塑形"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"}},{"id":"T5-02","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Bandura's Bobo doll experiment, which group of children imitated the aggressive acts LEAST?","tw":"在班杜拉的吹氣娃娃實驗中，哪一組兒童模仿攻擊行為「最少」？"},"explanation":{"en":"**Slides say:** Bobo doll experiment (Bandura, 1965) – children who saw the model being PUNISHED performed far fewer imitative acts than the rewarded and no-consequence groups.\n**In simple words:** Seeing the adult punished for hitting the doll made children less willing to copy the hitting.\n**Remember:** this is vicarious learning – the children were not punished themselves.","tw":"**投影片：**吹氣娃娃實驗（Bandura, 1965）– 看到成人「受罰」的兒童，模仿行為遠少於受獎組和無後果組。\n**簡單來說：**看見成人打娃娃後被罰，兒童就不太願意模仿。\n**記住：**這是替代學習 – 兒童自己並沒有被罰。"},"source":"PDF5 p.18","options":[{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"},{"en":"Those who saw the model rewarded","tw":"看到成人受獎的一組"},{"en":"Those who saw no consequences","tw":"看到沒有後果的一組"},{"en":"All groups imitated equally at first","tw":"一開始各組模仿程度相同"}],"answerIndex":0,"correctAnswer":{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"}},{"id":"T5-03","topicNo":5,"difficulty":"hard","type":"mc","star":true,"question":{"en":"When ALL Bobo doll groups were later offered incentives, all could reproduce the aggression. What does this show?","tw":"之後給「所有」吹氣娃娃組別獎勵，各組都能重現攻擊行為。這說明了甚麼？"},"explanation":{"en":"**Slides say:** Acquisition vs. performance – kids in all conditions ACQUIRED the aggressive behaviour, but not all of them performed it. When given an incentive, all groups reproduced it.\n**In simple words:** Learning something (acquisition) is not the same as showing it (performance). Example: you may know a swear word without ever saying it.\n**Remember:** acquired ≠ performed.","tw":"**投影片：**習得 vs 表現 – 所有組別的兒童都「習得」了攻擊行為，但並非全部表現出來；給予獎勵後，各組都能重現。\n**簡單來說：**學會一件事（習得）不等於做出來（表現）。例：你可能知道一句粗口，但從來不說。\n**記住：**習得 ≠ 表現。"},"source":"PDF5 p.25","options":[{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"},{"en":"Punishment stops learning completely","tw":"懲罰會完全阻止學習"},{"en":"Children only learn when directly reinforced","tw":"兒童只在直接受強化時才學習"},{"en":"Aggression is inborn, not learned","tw":"攻擊行為是天生，不是學來的"}],"answerIndex":0,"correctAnswer":{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"}},{"id":"T5-04","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"What are the four processes of observational learning, in order?","tw":"觀察學習的四個過程，正確次序是？"},"explanation":{"en":"**Slides say:** The four processes of observational learning: (1) Attention, (2) Retention (memory), (3) Reproduction (imitation), (4) Motivation. Slide example: baking a cake.\n**In simple words:** Watch the teacher bake (attention) → remember the steps (retention) → bake it yourself (reproduction) → want to do it because friends admire your cakes (motivation).\n**Remember:** Watch → Remember → Do → Want.","tw":"**投影片：**觀察學習四過程：(1) 注意；(2) 保存（記憶）；(3) 再生（模仿）；(4) 動機。投影片例子：焗蛋糕。\n**簡單來說：**留心看老師焗蛋糕（注意）→ 記住步驟（保存）→ 自己焗（再生）→ 朋友讚賞令你想做（動機）。\n**記住：**看 → 記 → 做 → 想做。"},"source":"PDF5 p.34","options":[{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"},{"en":"Motivation → Attention → Reproduction → Retention","tw":"動機 → 注意 → 再生 → 保存"},{"en":"Encoding → Storage → Retrieval → Motivation","tw":"編碼 → 儲存 → 提取 → 動機"},{"en":"Retention → Attention → Motivation → Reproduction","tw":"保存 → 注意 → 動機 → 再生"}],"answerIndex":0,"correctAnswer":{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"},"fig":"obs_learning"},{"id":"T5-05","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Remembering the steps of baking a cake you watched in a cooking session is which process?","tw":"記住在烹飪課看到的焗蛋糕步驟，屬於哪個過程？"},"explanation":{"en":"**Slides say:** Retention (memory) = the learner must retain a memory of what was done, e.g. remembering the steps for the cake seen in a cooking session.\n**In simple words:** After watching (attention), you must keep the steps in your head before you can copy them (reproduction).\n**Remember:** teaching tip from the slides – teach good study and memory skills.","tw":"**投影片：**保存（記憶）= 學習者必須記住看過的內容，例如記住烹飪課中製作蛋糕的步驟。\n**簡單來說：**看完（注意）之後，要先把步驟記在腦中，才能模仿（再生）。\n**記住：**投影片的教學提示 – 教授良好的學習和記憶技巧。"},"source":"PDF5 p.34","options":[{"en":"Retention","tw":"保存（retention / 記憶）"},{"en":"Attention","tw":"注意（attention）"},{"en":"Reproduction","tw":"再生（reproduction）"},{"en":"Motivation","tw":"動機（motivation）"}],"answerIndex":0,"correctAnswer":{"en":"Retention","tw":"保存（retention / 記憶）"},"fig":"obs_learning"},{"id":"T5-06","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A character in a book, film, TV show or game is a ___ model.","tw":"書籍、電影、電視或遊戲中的角色屬於 ___ 楷模。"},"explanation":{"en":"**Slides say:** Live model = a real person demonstrating. Symbolic model = a person or character in a book, film, TV show or game. Verbal instructional model = only describes how to behave.\n**In simple words:** A teen copying a hero's bravery from a film is learning from a symbolic model.\n**Remember:** live = real person; symbolic = media character; verbal = words only.","tw":"**投影片：**真人楷模 = 真人示範；象徵性楷模 = 書籍、電影、電視、遊戲中的人物或角色；言語指導楷模 = 只描述如何做。\n**簡單來說：**青少年模仿電影英雄的勇敢，就是向象徵性楷模學習。\n**記住：**真人 = 真人；象徵 = 媒體角色；言語 = 只有說話。"},"source":"PDF5 p.10","options":[{"en":"Symbolic","tw":"象徵性（symbolic）"},{"en":"Live","tw":"真人（live）"},{"en":"Verbal instructional","tw":"言語指導（verbal instructional）"},{"en":"Primary","tw":"主要（primary）"}],"answerIndex":0,"correctAnswer":{"en":"Symbolic","tw":"象徵性（symbolic）"}},{"id":"T5-07","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"For a LOW-achieving student, which model will most likely boost confidence in an academic task?","tw":"對「成績較差」的學生，哪個楷模最能提升他完成學術任務的信心？"},"explanation":{"en":"**Slides say:** Effective models have high perceived similarity. A low-achieving student is more likely to gain confidence after seeing another low-achieving student succeed. Models with high competence and prestige also work.\n**In simple words:** We copy people who are LIKE us: \"If someone like me can do it, so can I.\" A famous professor feels too different.\n**Remember:** similar, competent, prestigious.","tw":"**投影片：**有效楷模相似度高：成績較差的學生看到另一位成績較差的同學成功，更有信心。能力高、具威望的楷模也有效。\n**簡單來說：**我們模仿「像自己」的人：「和我差不多的人做得到，我也可以。」著名教授就感覺太遙遠。\n**記住：**相似、能力高、有威望。"},"source":"PDF5 p.12","options":[{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"},{"en":"A famous professor","tw":"一位著名教授"},{"en":"A cartoon character with no link to school","tw":"一個與學校無關的卡通角色"},{"en":"Nobody – models do not affect confidence","tw":"沒有 – 楷模不影響信心"}],"answerIndex":0,"correctAnswer":{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"}},{"id":"T5-08","topicNo":5,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Why does IGNORING a student's aggressive behaviour act like reinforcing it?","tw":"為何「忽視」學生的攻擊行為，會有鼓勵它的效果？"},"explanation":{"en":"**Slides say:** The non-occurrence of an expected consequence is itself a consequence. In the Bobo doll context, ignoring aggressive behaviour is reinforcing, because the expected punishment did not happen.\n**In simple words:** A child expects to be told off for hitting, but nothing happens. The child – and everyone watching – learns \"hitting is OK here.\"\n**Remember:** ignoring aggression = accidentally rewarding it.","tw":"**投影片：**預期的後果沒有出現，本身就是一個後果。在吹氣娃娃實驗中，忽視攻擊行為等於鼓勵，因為預期的懲罰沒有出現。\n**簡單來說：**孩子以為打人會被責罵，結果甚麼都沒發生，他和旁觀的同學都學到「在這裏打人沒問題」。\n**記住：**忽視攻擊行為 = 無意中獎勵它。"},"source":"PDF5 p.22","options":[{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"},{"en":"Ignoring is a form of positive punishment","tw":"忽視是一種正懲罰"},{"en":"Aggression is a classically conditioned reflex","tw":"攻擊是古典制約的反射"},{"en":"Ignoring always leads to extinction","tw":"忽視一定導致消退"}],"answerIndex":0,"correctAnswer":{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"}},{"id":"T5-09","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"You expect a bonus for beating your sales target, but get nothing. According to social learning theory this feels like…","tw":"你預期超額完成銷售目標會有花紅，結果甚麼都沒有。根據社會學習理論，這感覺像……"},"explanation":{"en":"**Slides say:** If you expect a behaviour to be reinforced and it is not, it can be punishing, with strong negative emotions. Slide example: expecting a bonus for beating the sales target, but getting none.\n**In simple words:** A promised reward that never comes feels like a punishment, so you may try less next time.\n**Remember:** missing reward = feels like punishment; missing punishment = feels like reward.","tw":"**投影片：**預期某行為會獲獎勵卻沒有，可以是一種懲罰，並伴隨強烈負面情緒。投影片例子：預期超額完成銷售目標有花紅，結果沒有。\n**簡單來說：**答應了的獎勵沒有出現，感覺就像被罰，下次可能不再那麼努力。\n**記住：**獎勵落空 = 像懲罰；懲罰沒出現 = 像獎勵。"},"source":"PDF5 p.22","options":[{"en":"A punishment","tw":"一種懲罰"},{"en":"A reinforcement","tw":"一種強化"},{"en":"Extinction of a reflex","tw":"反射消退"},{"en":"Nothing – no consequence occurred","tw":"沒有影響 – 根本沒有後果"}],"answerIndex":0,"correctAnswer":{"en":"A punishment","tw":"一種懲罰"}},{"id":"T5-10","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A specific belief about how well YOU can perform a particular task is called ___.","tw":"對「自己」能把某項任務做得多好的具體信念，稱為 ___。"},"explanation":{"en":"**Slides say:** Self-efficacy = \"How well can I do such-and-such?\" – a specific, evaluative judgement about oneself.\n**In simple words:** It is your belief in your ability for ONE particular task. Example: \"I'm sure I can solve fraction problems.\"\n**Trap:** self-esteem is how much you value yourself overall; self-image is how you see yourself (T8).","tw":"**投影片：**自我效能感 =「我能把這件事做得多好？」– 對自己具體的評價。\n**簡單來說：**對「某一項」任務能力的信心。例：「我肯定自己能解分數題。」\n**陷阱：**自尊是對自己整體的價值感；自我形象是你如何看自己（T8）。"},"source":"PDF5 p.39","options":[{"en":"Self-efficacy","tw":"自我效能感（self-efficacy）"},{"en":"Self-esteem","tw":"自尊（self-esteem）"},{"en":"Self-image","tw":"自我形象（self-image）"},{"en":"Self-determination","tw":"自我決定（self-determination）"}],"answerIndex":0,"correctAnswer":{"en":"Self-efficacy","tw":"自我效能感（self-efficacy）"}},{"id":"T5-11","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which is NOT one of the four sources of self-efficacy?","tw":"以下哪項「不是」自我效能感的四個來源？"},"explanation":{"en":"**Slides say:** The four sources of self-efficacy are mastery experience, vicarious experience, social persuasion and physiological status.\n**In simple words:** I did it before (mastery). I saw someone like me do it (vicarious). People tell me I can (persuasion). I feel calm, not panicky (physiological).\n**Trap:** fixed-interval reinforcement is a reward schedule (T4), not a source of self-efficacy.","tw":"**投影片：**自我效能感的四個來源：過往成功經驗、替代經驗、社會說服、身心狀態。\n**簡單來說：**我以前做到（成功經驗）；我看到和我相似的人做到（替代經驗）；別人說我可以（說服）；我感覺平靜，不慌（身心狀態）。\n**陷阱：**固定時距強化是獎勵計劃（T4），不是自我效能感的來源。"},"source":"PDF5 p.41","options":[{"en":"Fixed-interval reinforcement","tw":"固定時距強化"},{"en":"Mastery experience","tw":"過往成功經驗（mastery experience）"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"言語／朋輩說服"}],"answerIndex":0,"correctAnswer":{"en":"Fixed-interval reinforcement","tw":"固定時距強化"},"fig":"efficacy_sources"},{"id":"T5-12","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Feeling very anxious before a test lowers your self-efficacy. Which source is this?","tw":"考試前非常焦慮，令自我效能感下降。這屬哪個來源？"},"explanation":{"en":"**Slides say:** Physiological status – anxiety and stress lower self-efficacy.\n**In simple words:** A racing heart and sweaty hands before a test make you feel \"I can't do this.\" Taking slow breaths and calming down helps you feel capable again.\n**Remember:** physiological = your body and feelings.","tw":"**投影片：**身心狀態 – 焦慮和壓力會降低自我效能感。\n**簡單來說：**考試前心跳加速、手心出汗，令你覺得「我做不到」；深呼吸冷靜下來，信心就回來。\n**記住：**身心狀態 = 身體和情緒。"},"source":"PDF5 p.41","options":[{"en":"Physiological status","tw":"身心狀態（physiological status）"},{"en":"Mastery experience","tw":"過往成功經驗"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"社會說服"}],"answerIndex":0,"correctAnswer":{"en":"Physiological status","tw":"身心狀態（physiological status）"},"fig":"efficacy_sources"},{"id":"T5-13","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Bandura's social learning theory is also called…","tw":"班杜拉的社會學習理論又稱為……"},"explanation":{"en":"**Slides say:** Social learning theory is also known as social cognitive theory – \"cognitive\" because it takes our cognition (thinking) into consideration.\n**In simple words:** Bandura added the thinking part to learning from others: paying attention, remembering and expecting results.\n**Trap:** \"sociocultural\" = Vygotsky (T2).","tw":"**投影片：**社會學習理論又稱社會認知理論 –「認知」是因為它考慮我們的認知（思考）過程。\n**簡單來說：**班杜拉在「向別人學習」中加入思考部分：注意、記憶、預期結果。\n**陷阱：**「社會文化理論」是維高斯基（T2）。"},"source":"PDF5 p.7","options":[{"en":"Social cognitive theory","tw":"社會認知理論"},{"en":"Sociocultural theory","tw":"社會文化理論"},{"en":"Operant conditioning","tw":"操作性制約"},{"en":"Self-determination theory","tw":"自我決定理論"}],"answerIndex":0,"correctAnswer":{"en":"Social cognitive theory","tw":"社會認知理論"},"photo":"bandura"},{"id":"T5-14","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Reciprocal causation means…","tw":"相互因果關係（reciprocal causation）是指……"},"explanation":{"en":"**Slides say:** Reciprocal causation – environment, person and behaviour interact and affect each other. The environment influences us, but we also affect our environment.\n**In simple words:** A noisy class (environment) makes you feel stressed (person), so you talk to the teacher (behaviour), and the class becomes quieter (environment changes).\n**Remember:** a triangle of arrows pointing both ways.","tw":"**投影片：**相互因果關係 – 環境、個人和行為交互作用、互相影響；環境影響我們，我們也影響環境。\n**簡單來說：**吵鬧的課室（環境）令你煩躁（個人），你向老師反映（行為），課室變得安靜（環境改變）。\n**記住：**三角形，箭頭雙向。"},"source":"PDF5 p.28","options":[{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"},{"en":"Only the environment controls behaviour","tw":"只有環境控制行為"},{"en":"Behaviour is caused only by genes","tw":"行為只由基因決定"},{"en":"Rewards and punishments cancel each other out","tw":"獎勵與懲罰互相抵消"}],"answerIndex":0,"correctAnswer":{"en":"Environment, person and behaviour all influence each other","tw":"環境、個人和行為互相影響"},"fig":"reciprocal"},{"id":"T5-15","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A toddler sees another child crying in fear of an injection, and then also becomes afraid of injections. This is…","tw":"幼兒看到別的孩子因害怕打針而哭，自己也變得害怕打針。這是……"},"explanation":{"en":"**Slides say:** Vicarious emotional learning is also called empathy – experiencing the same emotion from watching another. It is not the same as sympathy (concern for another's suffering). Slide example: a toddler sees another child crying in fear of an injection and learns to fear injections.\n**In simple words:** Empathy = feeling WITH someone. Sympathy = feeling sorry FOR someone.\n**Remember:** same feeling = empathy.","tw":"**投影片：**替代情感學習又稱同理心 – 觀察他人而感受到相同的情緒；與同情心（關心他人痛苦）不同。投影片例子：幼兒看到別的兒童怕打針而哭，自己也學會怕打針。\n**簡單來說：**同理心 = 和對方「一起」感受；同情心 =「為」對方難過。\n**記住：**感受相同 = 同理心。"},"source":"PDF5 p.26","options":[{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"},{"en":"Sympathy","tw":"同情心"},{"en":"Extinction","tw":"消退"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"}},{"id":"T5-16","topicNo":5,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Bill's daughter opened the combination lock weeks after watching him. Why does this challenge behaviourism?","tw":"Bill 的女兒在觀察爸爸數週後打開了密碼鎖。為何這挑戰了行為主義？"},"explanation":{"en":"**Slides say:** Bill's daughter opened the combination lock weeks after watching him. Learning did not cause an immediate change in behaviour, the behaviour was never reinforced, and the mind remembered the combination.\n**In simple words:** Behaviourism says learning = an immediate change in behaviour, and only rewarded behaviour is done. She learned by watching, got no reward, and used the code weeks later.\n**Remember:** the mind matters – it is not a \"black box\".","tw":"**投影片：**Bill 的女兒數週前看爸爸開密碼鎖，後來自己打開。學習沒有令行為即時改變，也從未被強化，是思想記住了密碼。\n**簡單來說：**行為主義認為學習 = 即時行為改變，而且只做有獎勵的行為；但她靠觀察學習，沒有獎勵，數週後才用。\n**記住：**思想很重要，不是「黑盒」。"},"source":"PDF5 p.5","options":[{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"},{"en":"She was punished for opening the lock","tw":"她因開鎖而受罰"},{"en":"It proves learning is only a reflex","tw":"證明學習只是反射"},{"en":"She learned by trial and error in a puzzle box","tw":"她在迷箱中嘗試錯誤而學會"}],"answerIndex":0,"correctAnswer":{"en":"Learning happened without immediate behaviour change and without reinforcement","tw":"學習在沒有即時行為改變、也沒有強化的情況下發生"}},{"id":"T5-17","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who developed Social Learning Theory and the Bobo doll experiment?","tw":"誰提出社會學習理論並進行吹氣娃娃實驗？"},"explanation":{"en":"**Slides say:** Albert Bandura (1925–2021), Canadian, famous for social learning theory. He moved psychology's focus from behaviourism to what goes on inside the mind. He was the 4th most cited psychologist of all time.\n**In simple words:** Bandura showed children copy what they see – the Bobo doll experiment.\n**Trap:** Vygotsky = ZPD; Piaget = stages; Skinner = operant.","tw":"**投影片：**班杜拉（1925–2021），加拿大人，以社會學習理論聞名，把心理學焦點由行為主義轉向思想內部；史上被引用第四多的心理學家。\n**簡單來說：**班杜拉證明兒童會模仿所見 – 吹氣娃娃實驗。\n**陷阱：**維高斯基 = ZPD；皮亞傑 = 階段；史金納 = 操作性制約。"},"source":"PDF5 p.8","options":[{"en":"Albert Bandura","tw":"班杜拉（Albert Bandura）"},{"en":"Lev Vygotsky","tw":"維高斯基（Lev Vygotsky）"},{"en":"Jean Piaget","tw":"皮亞傑（Jean Piaget）"},{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"}],"answerIndex":0,"correctAnswer":{"en":"Albert Bandura","tw":"班杜拉（Albert Bandura）"},"photo":"bandura"},{"id":"T5-18","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"According to the slides, which behaviours can be learned through modeling?","tw":"根據投影片，哪些行為可以透過模仿學習？"},"explanation":{"en":"**Slides say:** Behaviours learned through modeling: academic skills (e.g. thinking aloud), aggression (the Bobo doll experiment), social skills (children learn how to interact with others by observation).\n**In simple words:** Kids copy good AND bad things: how a teacher solves a problem, how a friend says sorry, even how someone hits.\n**Remember:** academic, aggression, social.","tw":"**投影片：**可透過模仿學習的行為：學習技巧（例如出聲思考）、攻擊行為（吹氣娃娃實驗）、社交技巧（兒童透過觀察學習如何與人互動）。\n**簡單來說：**孩子好壞都會學：老師怎樣解題、朋友怎樣道歉，甚至別人怎樣打人。\n**記住：**學習、攻擊、社交。"},"source":"PDF5 p.13","options":[{"en":"Academic skills, aggression and social skills","tw":"學習技巧、攻擊行為和社交技巧"},{"en":"Only reflexes such as salivating","tw":"只有流口水等反射"},{"en":"Only behaviours that are directly rewarded","tw":"只有直接受獎勵的行為"},{"en":"Only physical sports skills","tw":"只有體育技能"}],"answerIndex":0,"correctAnswer":{"en":"Academic skills, aggression and social skills","tw":"學習技巧、攻擊行為和社交技巧"}},{"id":"T5-19","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"Even after watching others play the violin, I won't try – I don't think I could ever learn it.\" Which expectation is low here?","tw":"「即使看過別人拉小提琴，我也不會嘗試 – 我覺得自己根本學不會。」這裏哪一種預期偏低？"},"explanation":{"en":"**Slides say:** Efficacy expectations = beliefs about whether you yourself can execute a behaviour successfully. If you don't think you can learn the violin, you won't learn it even after observing others. Outcome expectations = expecting a behaviour to be reinforced.\n**In simple words:** Efficacy = \"CAN I do it?\" Outcome = \"Will it PAY OFF?\"\n**Remember:** efficacy = ability belief; outcome = result belief.","tw":"**投影片：**效能預期 = 對自己能否成功做出某行為的信念。如果你不認為自己學得會小提琴，即使看過別人拉，也不會學。結果預期 = 預期行為會得到獎勵。\n**簡單來說：**效能 =「我『做得到』嗎？」；結果 =「做了會『有回報』嗎？」\n**記住：**效能 = 能力信念；結果 = 後果信念。"},"source":"PDF5 p.21","options":[{"en":"Efficacy expectation","tw":"效能預期"},{"en":"Outcome expectation","tw":"結果預期"},{"en":"Vicarious punishment","tw":"替代懲罰"},{"en":"Primary reinforcement","tw":"主要強化"}],"answerIndex":0,"correctAnswer":{"en":"Efficacy expectation","tw":"效能預期"}},{"id":"T5-20","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Outcome expectations require learners to see the link between a behaviour and its consequence. What should teachers therefore do?","tw":"結果預期要求學習者看到行為與後果的關係。所以老師應怎樣做？"},"explanation":{"en":"**Slides say:** Learners must be aware of the response–consequence relationship. If a learner is not sure which part of the behaviour is reinforced, they are less likely to learn it – so explicitly state what behaviour is desirable or undesirable.\n**In simple words:** Say exactly what earned the praise: \"Great – you showed every working step!\", not just \"Good job\".\n**Remember:** make the link clear.","tw":"**投影片：**學習者必須意識到行為–後果的關係。若不清楚行為哪部分被強化，就不太可能學會 – 所以要明確說出哪些行為可取／不可取。\n**簡單來說：**清楚說出因甚麼被讚：「很好 – 你寫出了每一步計算！」，而不只是「做得好」。\n**記住：**把關係說清楚。"},"source":"PDF5 p.20","options":[{"en":"Explicitly state which behaviours are desirable and undesirable","tw":"明確說明哪些行為可取、哪些不可取"},{"en":"Keep the rules secret so students guess","tw":"把規則保密讓學生猜"},{"en":"Reward behaviours at random","tw":"隨機獎勵行為"},{"en":"Never mention consequences","tw":"從不提及後果"}],"answerIndex":0,"correctAnswer":{"en":"Explicitly state which behaviours are desirable and undesirable","tw":"明確說明哪些行為可取、哪些不可取"}},{"id":"T5-21","topicNo":5,"difficulty":"medium","type":"mc","star":true,"question":{"en":"The teacher tells Gregg and Natalie to stop whispering. Christine, who was also whispering, stops too. How does social learning theory explain Christine's behaviour?","tw":"老師叫 Gregg 和 Natalie 停止私語。同樣在私語的 Christine 也停了下來。社會學習理論如何解釋 Christine 的行為？"},"explanation":{"en":"**Slides say:** Class exercise: Christine stops whispering after seeing Gregg and Natalie corrected. Vicarious learning = learning from observing the consequences of others' behaviour.\n**In simple words:** Christine thinks, \"If they got told off, I will too\", so she stops without being told.\n**[Tip]** If the teacher had said nothing, the whispering would likely spread – the missing \"punishment\" acts as a reward.","tw":"**投影片：**課堂練習：Christine 看到 Gregg 和 Natalie 被糾正後，也停止私語。替代學習 = 透過觀察他人行為的後果來學習。\n**簡單來說：**Christine 想：「他們被說了，我也會被說」，於是自己停下來。\n**[提示]** 如果老師甚麼都不說，私語很可能蔓延 – 沒有出現的「懲罰」等於獎勵。"},"source":"PDF5 p.27","options":[{"en":"Vicarious learning – she saw the consequence for others and changed her own behaviour","tw":"替代學習 – 她看到別人的後果，於是改變自己的行為"},{"en":"Classical conditioning of a reflex","tw":"反射的古典制約"},{"en":"She was directly punished","tw":"她直接受到懲罰"},{"en":"Extinction of whispering","tw":"私語行為消退"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious learning – she saw the consequence for others and changed her own behaviour","tw":"替代學習 – 她看到別人的後果，於是改變自己的行為"}},{"id":"T5-22","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, people with HIGHER self-efficacy tend to…","tw":"根據投影片，自我效能感「較高」的人傾向……"},"explanation":{"en":"**Slides say:** Effects of self-efficacy: choice of activities (believe you run fast → join the athletics team); goals (higher self-efficacy → higher goals); effort and persistence (more effort, persist through obstacles); learning and achievement (usually learn better – but unrealistically high self-efficacy can be harmful).\n**In simple words:** \"I can do this\" makes you aim higher and keep going.\n**Remember:** choice, goals, effort, achievement.","tw":"**投影片：**自我效能感的影響：活動選擇（相信自己跑得快 → 加入田徑隊）；目標（效能高 → 目標高）；努力與堅持（更努力、遇障礙更堅持）；學習與成就（通常學得更好 – 但不切實際的高效能可能有害）。\n**簡單來說：**「我做得到」令你目標更高、更堅持。\n**記住：**選擇、目標、努力、成就。"},"source":"PDF5 p.40","options":[{"en":"Set higher goals and put in more effort and persistence when they meet obstacles","tw":"訂下較高目標，遇到障礙時更努力、更堅持"},{"en":"Avoid all challenges","tw":"逃避所有挑戰"},{"en":"Give up faster","tw":"更快放棄"},{"en":"Learn worse than others","tw":"學得比別人差"}],"answerIndex":0,"correctAnswer":{"en":"Set higher goals and put in more effort and persistence when they meet obstacles","tw":"訂下較高目標，遇到障礙時更努力、更堅持"}},{"id":"T5-23","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"To support the REPRODUCTION stage of observational learning, the slides suggest teachers should…","tw":"為支援觀察學習的「再生」階段，投影片建議老師……"},"explanation":{"en":"**Slides say:** Observational learning in teaching – Attention: teach in an exciting way. Retention: teach good study and memory skills. Reproduction: test – did they learn? Motivation: reward good performance.\n**In simple words:** Reproduction = can the student DO it themselves? So let them try it and check.\n**Remember:** exciting → memory skills → test → reward.","tw":"**投影片：**觀察學習於教學中的應用 – 注意：以令人興奮的方式教學；保存：教授學習和記憶技巧；再生：測試 – 他們學會了嗎？動機：獎勵良好表現。\n**簡單來說：**再生 = 學生能否「自己做到」？所以讓他們試做並檢查。\n**記住：**生動 → 記憶技巧 → 測試 → 獎勵。"},"source":"PDF5 p.37","options":[{"en":"Test – check whether students can actually do it","tw":"測試 – 檢查學生是否真的做得到"},{"en":"Teach in an exciting way","tw":"以令人興奮的方式教學"},{"en":"Teach memory skills","tw":"教授記憶技巧"},{"en":"Reward good performance","tw":"獎勵良好表現"}],"answerIndex":0,"correctAnswer":{"en":"Test – check whether students can actually do it","tw":"測試 – 檢查學生是否真的做得到"},"fig":"obs_learning"},{"id":"T5-24","topicNo":5,"difficulty":"hard","type":"mc","star":false,"question":{"en":"About mastery experience as a source of self-efficacy, the slides warn that…","tw":"關於「過往成功經驗」作為自我效能感的來源，投影片提醒……"},"explanation":{"en":"**Slides say:** Mastery experience: previous successes (failures) increase (decrease) self-efficacy – however, a history without failure may not be good.\n**In simple words:** If you have never failed, your first failure can crush you. Some experience of failing and recovering builds resilience (see learned helplessness in T7).\n**Remember:** success builds confidence; recovering from failure builds toughness.","tw":"**投影片：**過往成功經驗：先前的成功（失敗）會提高（降低）自我效能感 – 然而，從未失敗的經歷未必是好事。\n**簡單來說：**從未失敗過的人，第一次失敗可能被擊垮；經歷過失敗並重新站起來，才更堅韌（參見 T7 習得性無助）。\n**記住：**成功建立信心；從失敗中站起來建立韌力。"},"source":"PDF5 p.41","options":[{"en":"A history without any failure may not be good","tw":"從未失敗的經歷未必是好事"},{"en":"Success always lowers self-efficacy","tw":"成功一定降低自我效能感"},{"en":"Only failures build self-efficacy","tw":"只有失敗才能建立自我效能感"},{"en":"Past experience has no effect","tw":"過往經驗沒有影響"}],"answerIndex":0,"correctAnswer":{"en":"A history without any failure may not be good","tw":"從未失敗的經歷未必是好事"}},{"id":"T5-25","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"For SOCIAL PERSUASION to build self-efficacy, the slides say it should be…","tw":"投影片指「社會說服」要提升自我效能感，應該要……"},"explanation":{"en":"**Slides say:** Social persuasion = whether others believe you can do it. Be both constructive and realistic.\n**In simple words:** \"You've improved your timing a lot – you can make the team if you keep practising\" works. \"You're the best in the world!\" does not, because it isn't believable.\n**Remember:** believable encouragement.","tw":"**投影片：**社會說服 = 別人是否相信你做得到。意見要有建設性及貼近現實。\n**簡單來說：**「你的時間掌握進步了很多，繼續練習就能入選」有效；「你是全世界最好的！」無效，因為不可信。\n**記住：**可信的鼓勵。"},"source":"PDF5 p.41","options":[{"en":"Both constructive and realistic","tw":"具建設性而且貼近現實"},{"en":"As exaggerated as possible","tw":"愈誇張愈好"},{"en":"Given only by strangers","tw":"只由陌生人給予"},{"en":"Focused on the person's weaknesses","tw":"集中指出對方弱點"}],"answerIndex":0,"correctAnswer":{"en":"Both constructive and realistic","tw":"具建設性而且貼近現實"}},{"id":"T5-26","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is an implication of observational learning for teachers?","tw":"以下哪項是觀察學習對老師的啟示？"},"explanation":{"en":"**Slides say:** Implications: demonstrate and teach good behaviours; use high-achieving and successful peers as models; model positive behaviours yourself; make sure students see that positive behaviours lead to positive consequences.\n**In simple words:** Show the good example, and let students SEE it pay off.\n**Trap:** ignoring misbehaviour can act like a reward (T5 aggression).","tw":"**投影片：**啟示：展示並教導良好行為；以成績卓越、成功的同儕為榜樣；自己樹立好榜樣；確保學生看見積極行為帶來良好後果。\n**簡單來說：**做好示範，並讓學生「看到」好行為有好結果。\n**陷阱：**忽視不當行為反而可能等於獎勵（T5 攻擊行為）。"},"source":"PDF5 p.36","options":[{"en":"Use high-achieving and successful peers as models","tw":"以成績卓越和成功的同儕作榜樣"},{"en":"Hide good behaviour so students discover it alone","tw":"把好行為藏起來讓學生自己發現"},{"en":"Ignore misbehaviour so it disappears","tw":"忽略不當行為讓它消失"},{"en":"Never demonstrate a skill","tw":"從不示範技能"}],"answerIndex":0,"correctAnswer":{"en":"Use high-achieving and successful peers as models","tw":"以成績卓越和成功的同儕作榜樣"}},{"id":"T5-27","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What do the slides on health and wellness advise students about social media?","tw":"身心健康的投影片就社交媒體給學生甚麼建議？"},"explanation":{"en":"**Slides say:** Students should balance social media and the real world to keep quality in-person time. Many studies link increased anxiety and depression in children with social media use. Online bullying harms health, wellness and sense of self, so students should reflect on how their use affects mood and mental health.\n**In simple words:** Online models influence us too – choose them carefully and take breaks.\n**Remember:** balance + reflect.","tw":"**投影片：**學生應在社交媒體與現實世界之間取得平衡，確保與家人朋友有優質的面對面時間。很多研究顯示兒童焦慮和抑鬱增加與社交媒體使用有關。網絡欺凌損害健康、幸福感和自我感，所以學生應反思使用習慣如何影響情緒和心理健康。\n**簡單來說：**網上的楷模也會影響我們 – 小心選擇，並適時休息。\n**記住：**平衡 + 反思。"},"source":"PDF5 p.30","options":[{"en":"Keep a balance between social media and the real world, and reflect on how it affects mood and mental health","tw":"在社交媒體與現實世界之間取得平衡，並反思它如何影響情緒和心理健康"},{"en":"Use social media as much as possible to learn by observation","tw":"盡量多用社交媒體以觀察學習"},{"en":"Online bullying is harmless","tw":"網絡欺凌無害"},{"en":"Social media has no link with anxiety","tw":"社交媒體與焦慮無關"}],"answerIndex":0,"correctAnswer":{"en":"Keep a balance between social media and the real world, and reflect on how it affects mood and mental health","tw":"在社交媒體與現實世界之間取得平衡，並反思它如何影響情緒和心理健康"}},{"id":"T5-28","topicNo":5,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Teenagers are more likely to copy a pop idol than an average adult. Which feature of effective models explains this?","tw":"青少年較易模仿偶像而非普通成人。這可用有效楷模的哪個特點解釋？"},"explanation":{"en":"**Slides say:** Effective models have high perceived similarity, high competence, and prestige and power (teenagers are more likely to model idols than an average adult).\n**In simple words:** Famous, admired people get copied – that's why celebrities in adverts work.\n**Remember:** similar, competent, prestigious.","tw":"**投影片：**有效楷模：相似度高、能力高、具威望和權力（青少年較易模仿偶像，多於普通成人）。\n**簡單來說：**有名、受崇拜的人容易被模仿 – 所以廣告愛找明星。\n**記住：**相似、能幹、有威望。"},"source":"PDF5 p.12","options":[{"en":"Prestige and power","tw":"具威望和權力"},{"en":"Low competence","tw":"能力低"},{"en":"Low similarity","tw":"相似度低"},{"en":"Being punished","tw":"受到懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Prestige and power","tw":"具威望和權力"}},{"id":"T5-29","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Bandura (1977) said most human behaviour is learned…","tw":"班杜拉（1977）指大多數人類行為是透過甚麼學來的？"},"explanation":{"en":"**Slides say:** \"Most human behaviour is learned by observation through modeling: from observing others, one forms an idea of how new behaviours are performed, and on later occasions this coded information serves as a guide for action\" (Bandura, 1977).\n**In simple words:** You watch, you store a mental \"recipe\", and later you use it – like the girl opening the combination lock.\n**Remember:** observe → store → use later.","tw":"**投影片：**「大多數人類行為都是透過觀察和模仿學來的：觀察他人後，人們形成如何做新行為的概念，日後這些記下的資訊成為行動的指引」（Bandura, 1977）。\n**簡單來說：**看 → 在腦中存下「食譜」→ 之後使用 – 就像開密碼鎖的女孩。\n**記住：**觀察 → 儲存 → 日後使用。"},"source":"PDF5 p.9","options":[{"en":"By observation through modeling – the coded information later guides action","tw":"透過觀察和模仿 – 所記下的資訊日後引導行動"},{"en":"Only by trial and error with rewards","tw":"只透過嘗試錯誤和獎勵"},{"en":"Only by biological maturation","tw":"只靠生理成熟"},{"en":"By classical conditioning of reflexes","tw":"透過反射的古典制約"}],"answerIndex":0,"correctAnswer":{"en":"By observation through modeling – the coded information later guides action","tw":"透過觀察和模仿 – 所記下的資訊日後引導行動"}},{"id":"T5-30","topicNo":5,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is listed as an important note on social learning theory?","tw":"以下哪項是投影片列出的社會學習理論注意事項？"},"explanation":{"en":"**Slides say:** Important notes: students can learn by simply observing others; explicitly state behaviour–consequence relationships; it is an alternative for shaping new behaviours; role models are important; expose students to a variety of models; self-efficacy is important; keep realistic expectations.\n**In simple words:** Instead of rewarding tiny steps (shaping), you can often just SHOW the behaviour.\n**Remember:** observe, state links, models, efficacy, realism.","tw":"**投影片：**注意事項：學生只需觀察他人就能學習；明確指出行為–後果的關係；是塑造新行為的另類方法；以身作則很重要；多接觸不同楷模；自我效能感很重要；期望要實際。\n**簡單來說：**不一定要逐步獎勵（塑形），很多時只要「示範」行為就可以。\n**記住：**觀察、說明關係、榜樣、效能、實際。"},"source":"PDF5 p.43","options":[{"en":"Observational learning is an alternative way to shape new behaviours","tw":"觀察學習是塑造新行為的另一種方法"},{"en":"Students can only learn through direct reinforcement","tw":"學生只能透過直接強化學習"},{"en":"Role models do not matter","tw":"榜樣並不重要"},{"en":"Expectations should be as high as possible, even if unrealistic","tw":"期望應愈高愈好，即使不切實際"}],"answerIndex":0,"correctAnswer":{"en":"Observational learning is an alternative way to shape new behaviours","tw":"觀察學習是塑造新行為的另一種方法"}},{"id":"T5-31","topicNo":5,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In Bandura's results graph, what happened when children were later given a POSITIVE INCENTIVE to copy the model?","tw":"在班杜拉的結果圖表中，之後給兒童「正面誘因」去模仿時，結果如何？"},"explanation":{"en":"**Slides say:** The graph compares \"positive incentive\" with \"no incentive\" for the model-rewarded, model-punished and no-consequences groups, for boys and girls. With a positive incentive, imitation went up in every group – the model-punished children had acquired the behaviour too. Boys imitated more than girls overall.\n**In simple words:** The kids had learned it all along; they just needed a reason to show it.\n**Remember:** acquisition ≠ performance.","tw":"**投影片：**圖表比較成人受獎、受罰、無後果三組在「有正面誘因」與「無誘因」下的表現（男孩、女孩分開）。有正面誘因時，每組的模仿都上升 – 看到成人受罰的兒童其實也學會了。整體而言男孩模仿得比女孩多。\n**簡單來說：**孩子早已學會，只是需要理由才表現出來。\n**記住：**習得 ≠ 表現。"},"source":"PDF5 p.17","options":[{"en":"Imitation rose in every group, including the model-punished group","tw":"每組的模仿都增加，包括看到成人受罰的一組"},{"en":"Only the model-rewarded group imitated","tw":"只有看到成人受獎的一組模仿"},{"en":"Nobody imitated at all","tw":"完全沒有人模仿"},{"en":"Imitation fell in every group","tw":"每組的模仿都下降"}],"answerIndex":0,"correctAnswer":{"en":"Imitation rose in every group, including the model-punished group","tw":"每組的模仿都增加，包括看到成人受罰的一組"}},{"id":"T6-01","topicNo":6,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What are the three stages of memory, in order?","tw":"記憶的三個階段，正確次序是？"},"explanation":{"en":"**Slides say:** There are three stages of memory: Encoding, Storage, Retrieval.\n**In simple words:** Memory works like a library: label a new book (encoding), put it on the shelf (storage), find it again later (retrieval).\n**Remember:** E-S-R = in → keep → out.","tw":"**投影片：**記憶分三個階段：編碼、儲存、提取。\n**簡單來說：**記憶像圖書館：替新書編號（編碼）→ 放上書架（儲存）→ 日後找出來（提取）。\n**記住：**入 → 存 → 出。"},"source":"PDF6 p.5","options":[{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"},{"en":"Storage → Encoding → Retrieval","tw":"儲存 → 編碼 → 提取"},{"en":"Retrieval → Encoding → Storage","tw":"提取 → 編碼 → 儲存"},{"en":"Attention → Rehearsal → Forgetting","tw":"注意 → 複述 → 遺忘"}],"answerIndex":0,"correctAnswer":{"en":"Encoding → Storage → Retrieval","tw":"編碼 → 儲存 → 提取"},"fig":"memory_model"},{"id":"T6-02","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which level of encoding gives the deepest processing and the longest-lasting memory?","tw":"哪一層次的編碼處理最深、記憶最持久？"},"explanation":{"en":"**Slides say:** Levels of processing (Craik & Lockhart, 1972): structural (appearance, shallow) < phonetic (sound, intermediate) < semantic (meaning, deep). Deeper = more meaningful = longer-lasting memory. Semantic encoding uses more parts of the brain.\n**In simple words:** Thinking about what a word MEANS sticks best. Slide example with a tree: just seeing it (low) → naming it (higher) → imagining climbing it (highest).\n**Remember:** deeper thinking = longer memory.","tw":"**投影片：**處理層次（Craik & Lockhart, 1972）：結構（外觀，淺層）< 語音（聲音，中層）< 語義（意義，深層）。處理越深越有意義，記憶越持久；語義編碼使用更多腦區。\n**簡單來說：**想字詞的「意思」記得最牢。投影片的樹例子：只是看到（低）→ 說出名稱（較高）→ 想像爬上去（最高）。\n**記住：**想得越深，記得越久。"},"source":"PDF6 p.7","options":[{"en":"Semantic (meaning)","tw":"語義編碼（意義）"},{"en":"Structural (appearance)","tw":"結構編碼（外觀）"},{"en":"Phonetic (sound)","tw":"語音編碼（聲音）"},{"en":"Sensory (raw input)","tw":"感覺（原始輸入）"}],"answerIndex":0,"correctAnswer":{"en":"Semantic (meaning)","tw":"語義編碼（意義）"},"fig":"levels_processing"},{"id":"T6-03","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Focusing on how a word SOUNDS (e.g. does it rhyme?) is ___ encoding.","tw":"專注於字詞的「讀音」（例如是否押韻）屬 ___ 編碼。"},"explanation":{"en":"**Slides say:** Phonetic encoding = intermediate processing that focuses on how words SOUND (e.g. rhyme).\n**In simple words:** \"Does 'cat' rhyme with 'hat'?\" is a question about sound, so it is phonetic.\n**Remember:** structural = looks; phonetic = sound (like phonics); semantic = meaning.","tw":"**投影片：**語音編碼 = 中層處理，專注字詞的「讀音」（例如押韻）。\n**簡單來說：**「cat 和 hat 押韻嗎？」是關於聲音的問題，所以是語音編碼。\n**記住：**結構 = 外觀；語音 = 聲音；語義 = 意義。"},"source":"PDF6 p.7","options":[{"en":"Phonetic","tw":"語音（phonetic）"},{"en":"Structural","tw":"結構（structural）"},{"en":"Semantic","tw":"語義（semantic）"},{"en":"Episodic","tw":"情節（episodic）"}],"answerIndex":0,"correctAnswer":{"en":"Phonetic","tw":"語音（phonetic）"},"fig":"levels_processing"},{"id":"T6-04","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"What is the capacity of short-term memory (number of items)?","tw":"短期記憶的容量是多少個單位？"},"explanation":{"en":"**Slides say:** Short-term memory holds about 7 (± 2) units of information, for about 20 seconds without rehearsal.\n**In simple words:** You can juggle about 5 to 9 things in your head at once. That's why a 7-digit number is easy to remember, but a 20-letter string is hard.\n**Remember:** the magic number 7 ± 2.","tw":"**投影片：**短期記憶約可容納 7（± 2）個訊息單位；不複述約保留 20 秒。\n**簡單來說：**腦中同時只能處理約 5 至 9 樣東西，所以 7 位數字易記，20 個字母就很難。\n**記住：**神奇數字 7 ± 2。"},"source":"PDF6 p.16","options":[{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},{"en":"20 ± 5 items","tw":"20 ± 5 個單位"},{"en":"Unlimited","tw":"無限"},{"en":"3 ± 1 items","tw":"3 ± 1 個單位"}],"answerIndex":0,"correctAnswer":{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},"fig":"memory_model"},{"id":"T6-05","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How long does information stay in short-term memory WITHOUT rehearsal?","tw":"在「不複述」的情況下，訊息在短期記憶中能保留多久？"},"explanation":{"en":"**Slides say:** Short-term memory duration: about 20 seconds without rehearsal. Technique: repeat the information to keep it in STM.\n**In simple words:** Hear a phone number once, don't repeat it, and about 20 seconds later it's gone.\n**Remember:** sensory = under a second; STM ≈ 20 s; LTM = relatively permanent.","tw":"**投影片：**短期記憶不複述約保留 20 秒；技巧：重複訊息令它留在短期記憶。\n**簡單來說：**聽一次電話號碼而不重複，約 20 秒後便忘記。\n**記住：**感覺記憶 < 1 秒；短期記憶約 20 秒；長期記憶相對永久。"},"source":"PDF6 p.16","options":[{"en":"About 20 seconds","tw":"約 20 秒"},{"en":"A fraction of a second","tw":"幾分之一秒"},{"en":"About 20 minutes","tw":"約 20 分鐘"},{"en":"Permanently","tw":"永久"}],"answerIndex":0,"correctAnswer":{"en":"About 20 seconds","tw":"約 20 秒"},"fig":"memory_model"},{"id":"T6-06","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Grouping letters like BAPGDEPHDHKUCUHK into meaningful units (BA, PGDE, PhD, HKU…) to fit short-term memory is called ___.","tw":"把 BAPGDEPHDHKUCUHK 分成有意義的單元（BA、PGDE、PhD、HKU……）以放進短期記憶，稱為 ___。"},"explanation":{"en":"**Slides say:** Chunking = group stimuli into a single unit to fit more into short-term memory. Slide example: BAPGDEPHDHKUCUHKIEDUST.\n**In simple words:** 22 letters is too many, but BA · PGDE · PhD · HKU · CUHK · IED · UST is only 7 chunks – easy!\n**Remember:** a chunk counts as ONE item.","tw":"**投影片：**集組塊 = 把刺激分組成一個單元，令短期記憶容納更多。投影片例子：BAPGDEPHDHKUCUHKIEDUST。\n**簡單來說：**22 個字母太多，但 BA · PGDE · PhD · HKU · CUHK · IED · UST 只有 7 組，容易記！\n**記住：**一個組塊只算一個單位。"},"source":"PDF6 p.16","options":[{"en":"Chunking","tw":"集組塊（chunking）"},{"en":"Rehearsal","tw":"複述（rehearsal）"},{"en":"Method of loci","tw":"位置記憶法（method of loci）"},{"en":"Serial position effect","tw":"序列位置效應"}],"answerIndex":0,"correctAnswer":{"en":"Chunking","tw":"集組塊（chunking）"}},{"id":"T6-07","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What is the capacity of long-term memory?","tw":"長期記憶的容量是？"},"explanation":{"en":"**Slides say:** Long-term memory: unlimited capacity, relatively permanent, organised as networks of meaning using schemas.\n**In simple words:** Your long-term memory never gets \"full\" – you can keep learning forever. The hard part is FINDING things, so organised notes help.\n**Remember:** STM is small; LTM is unlimited.","tw":"**投影片：**長期記憶：容量無限、相對永久，以基模組成意義網絡。\n**簡單來說：**長期記憶永遠不會「爆滿」，可以一直學；難的是「找回來」，所以有條理的筆記很有用。\n**記住：**短期記憶細小；長期記憶無限。"},"source":"PDF6 p.18","options":[{"en":"Unlimited","tw":"無限"},{"en":"7 ± 2 items","tw":"7 ± 2 個單位"},{"en":"About 20 items","tw":"約 20 個單位"},{"en":"One item at a time","tw":"每次一個單位"}],"answerIndex":0,"correctAnswer":{"en":"Unlimited","tw":"無限"},"fig":"memory_model"},{"id":"T6-08","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Knowing HOW to ride a bicycle is stored as which type of memory?","tw":"「懂得」踩單車屬於哪種記憶？"},"explanation":{"en":"**Slides say:** Implicit memory includes procedural memory – memory of skills and \"how to\" (motor skills and habits), shown naturally when doing the task.\n**In simple words:** You ride a bike without thinking \"left foot, right foot\". Your body just knows how.\n**Remember:** procedural = how-to skills; semantic = facts; episodic = personal events.","tw":"**投影片：**內隱記憶包括程序記憶 – 技術和「如何做」的記憶（動作技能、習慣），做該任務時自然表現出來。\n**簡單來說：**踩單車時你不會想「左腳、右腳」，身體自然懂得。\n**記住：**程序 = 技能；語意 = 事實；情節 = 個人事件。"},"source":"PDF6 p.19","options":[{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"},{"en":"Episodic memory","tw":"情節記憶"},{"en":"Semantic memory","tw":"語意記憶"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Procedural (implicit) memory","tw":"程序記憶（內隱）"},"fig":"memory_types"},{"id":"T6-09","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Remembering your own 10th birthday party is which type of memory?","tw":"記得自己 10 歲的生日會，屬於哪種記憶？"},"explanation":{"en":"**Slides say:** Episodic memory = memories of personal events. Semantic memory = memories of factual information. Both are explicit (declarative) memory.\n**In simple words:** Episodic = your life as TV episodes (your 10th birthday party). Semantic = facts (Pavlov won the Nobel Prize in 1904).\n**Remember:** episode = event in MY life.","tw":"**投影片：**情節記憶 = 個人事件的回憶；語意記憶 = 事實訊息的記憶。兩者都屬外顯（陳述）記憶。\n**簡單來說：**情節記憶像你人生的電視劇集（10 歲生日會）；語意記憶是事實（巴甫洛夫 1904 年獲諾貝爾獎）。\n**記住：**情節 = 我人生中的一件事。"},"source":"PDF6 p.21","options":[{"en":"Episodic memory","tw":"情節記憶（episodic）"},{"en":"Semantic memory","tw":"語意記憶（semantic）"},{"en":"Procedural memory","tw":"程序記憶（procedural）"},{"en":"Sensory memory","tw":"感覺記憶"}],"answerIndex":0,"correctAnswer":{"en":"Episodic memory","tw":"情節記憶（episodic）"},"fig":"memory_types"},{"id":"T6-10","topicNo":6,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Serial position effect: why are the LAST items in a list remembered well?","tw":"序列位置效應：為何清單「最後」的項目記得好？"},"explanation":{"en":"**Slides say:** Serial position effect (Murdock, 1962): items at the beginning (primacy effect) and end (recency effect) are remembered better. Primacy: more rehearsal. Recency: still active
