<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPC5014 Flashcards</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1d2330; --muted:#5d6678; --line:#dfe3ea;
  --accent:#2f5bd3; --accent-ink:#ffffff; --good:#1c8a4c; --good-bg:#e5f5ec; --bad:#c23b3b; --bad-bg:#fbeaea;
  --warn:#9a6a00; --chip:#eef1f6; --shadow:0 2px 10px rgba(20,30,50,.08); --star:#d39b00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.3rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.btn.small{padding:4px 10px;min-height:32px;font-size:.875rem}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.stat:last-child{grid-column:span 2}
@media(min-width:600px){.stats{grid-template-columns:repeat(5,1fr)}.stat:last-child{grid-column:auto}}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.875rem;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.good>i{background:var(--good)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
details.card{padding:12px 18px}
summary{cursor:pointer;font-weight:600}
fieldset{border:0;padding:0;margin:10px 0}
legend{font-size:.875rem;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.875rem;cursor:pointer}
.chip input{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.875rem;color:var(--muted);margin-bottom:8px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px}
.tag.easy{color:var(--good)} .tag.medium{color:var(--warn)} .tag.hard{color:var(--bad)}
.star{color:var(--star)}
.q{font-size:1.3rem;font-weight:600;margin:4px 0 14px;outline:none}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:hover:not([disabled]),.tile:hover:not([disabled]){border-color:var(--accent)}
.opt .k,.tile .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.875rem;font-weight:700}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{border-color:var(--accent)}
.opt[disabled],.tile[disabled]{cursor:default}
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.built.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.built.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;min-height:40px;cursor:pointer;text-align:left}
.tile.placed{border-color:var(--accent)}
.tiles .tile[disabled]{opacity:.35}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb .src{font-size:.875rem;color:var(--muted);margin-top:6px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:.875rem;color:var(--muted)}
.center{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res-item{border-bottom:1px solid var(--line);padding:10px 0}
.res-item:last-child{border:0}
.ok-t{color:var(--good);font-weight:700} .no-t{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90vw;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:19;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.bar>i{transition:none}}
.warn{background:var(--bad-bg);border-radius:10px;padding:8px 12px;font-size:.875rem;display:none}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:.875rem}
.boxes div{background:var(--chip);border-radius:8px;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">EPC5014 Flashcards</h1>
    <div class="row">
      <div class="row" role="group" aria-label="Language">
        <button class="btn small" id="lang-en" aria-pressed="true">EN</button>
        <button class="btn small" id="lang-tw" aria-pressed="false">繁中</button>
      </div>
    </div>
  </header>

  <div class="warn" id="storeWarn" role="alert"></div>

  <section class="stats" aria-label="Progress">
    <div class="stat"><b id="sScore">0</b><span data-t="score"></span></div>
    <div class="stat"><b id="sStreak">0</b><span data-t="streak"></span></div>
    <div class="stat"><b id="sAnswered">0</b><span data-t="answered"></span></div>
    <div class="stat"><b id="sAcc">–</b><span data-t="accuracy"></span></div>
    <div class="stat"><b id="sMastery">0%</b><span data-t="mastery"></span></div>
  </section>
  <div class="bar good" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="masteryBar" aria-label="Mastery"><i></i></div>

  <div class="row" style="margin-top:12px" role="group" aria-label="Mode">
    <button class="btn" id="modeStudy" aria-pressed="true"></button>
    <button class="btn" id="modeTest" aria-pressed="false"></button>
    <button class="btn" id="modeStats" aria-pressed="false"></button>
  </div>

  <p class="hint" id="syncNote"></p>
  <div class="card" id="confirmBox" role="alertdialog" aria-labelledby="confirmMsg" hidden>
    <p id="confirmMsg"></p>
    <div class="row"><button class="btn primary" id="confirmYes"></button><button class="btn" id="confirmNo"></button></div>
  </div>
  <details class="card" id="filters">
    <summary data-t="filters"></summary>
    <fieldset><legend data-t="topics"></legend><div class="chips" id="fTopics"></div></fieldset>
    <fieldset><legend data-t="difficulty"></legend><div class="chips" id="fDiff"></div></fieldset>
    <fieldset><legend data-t="qtype"></legend><div class="chips" id="fType"></div></fieldset>
    <fieldset><legend data-t="more"></legend><div class="chips" id="fMore"></div></fieldset>
    <fieldset><legend data-t="schedule"></legend>
      <div class="chips" id="fSched"></div>
      <p class="hint" data-t="schedHint"></p>
    </fieldset>
    <div class="row"><span class="hint" id="poolCount"></span>
      <button class="btn small" id="applyFilters" data-t="apply"></button>
      <button class="btn small" id="resetBtn" data-t="reset"></button></div>
  </details>

  <main id="view" aria-live="polite"></main>
  <p class="hint center" data-t="keys"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const BANK = [{"id":"T1-01","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Using an EXISTING schema to make sense of a new experience is called…","tw":"運用「既有」基模去解釋新經驗，稱為……"},"explanation":{"en":"**Slides say:** Assimilation = interpret new experiences using EXISTING schemas.\n**In simple words:** You already have a \"box\" in your head for an idea. You put the new thing into that same box without changing the box. Example: you know \"dog\"; you meet a poodle for the first time and still call it \"dog\".\n**Remember:** a**SS**imilate = **S**ame **S**chema. a**CC**ommodate = **C**hange the box.","tw":"**投影片：**同化 = 運用「既有」基模解釋新經驗。\n**簡單來說：**你腦中已有一個「盒子」裝某個概念，新東西直接放進同一個盒子，盒子不用改。例：你認識「狗」，第一次見到貴婦狗，也叫牠「狗」。\n**記住：**同化 = 照舊用；調適 = 要改盒子。"},"source":"PDF1 p.9","options":[{"en":"Assimilation","tw":"同化（assimilation）"},{"en":"Accommodation","tw":"調適（accommodation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"}],"answerIndex":0,"correctAnswer":{"en":"Assimilation","tw":"同化（assimilation）"}},{"id":"T1-02","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Aaron calls every four-legged animal \"dog\". Dad says \"No, that is a horse\", and Aaron builds a new \"horse\" schema. Which Piaget process is this?","tw":"Aaron 把所有四腳動物都叫「狗」。爸爸說「不，那是馬」，Aaron 於是建立了新的「馬」基模。這是皮亞傑的哪個過程？"},"explanation":{"en":"**Slides say:** Accommodation = modify existing schemas (or create a new one) to explain new experiences. The slides use exactly this Aaron example.\n**In simple words:** The horse did not fit Aaron's \"dog\" box, so he made a NEW \"horse\" box. Before that he felt confused – that confusion is disequilibrium.\n**Trap:** if Aaron kept calling the horse \"dog\", that would be assimilation.","tw":"**投影片：**調適 = 修正既有基模（或建立新基模）去解釋新經驗。投影片正正用了 Aaron 這個例子。\n**簡單來說：**馬放不進 Aaron 的「狗」盒子，他便新開一個「馬」盒子。之前他感到困惑，那就是失衡。\n**陷阱：**如果 Aaron 繼續叫馬做「狗」，那才是同化。"},"source":"PDF1 p.21","options":[{"en":"Accommodation","tw":"調適（accommodation）"},{"en":"Assimilation","tw":"同化（assimilation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Centration","tw":"中心化（centration）"}],"answerIndex":0,"correctAnswer":{"en":"Accommodation","tw":"調適（accommodation）"}},{"id":"T1-03","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The confused feeling when existing schemas CANNOT assimilate a new experience is called…","tw":"既有基模「無法」同化新經驗時所產生的困惑感，稱為……"},"explanation":{"en":"**Slides say:** Disequilibrium occurs if existing schemas cannot assimilate new experiences. It is the pre-requisite of new knowledge.\n**In simple words:** \"Dis-\" means \"not\", so disequilibrium = \"not balanced\". It is the \"Huh? That doesn't fit!\" feeling. Example: Aaron seeing a horse that is not quite a dog.\n**Remember:** this confused feeling is GOOD – it pushes you to learn, so teachers create it on purpose.","tw":"**投影片：**既有基模無法同化新經驗時，便會出現失衡。失衡是學習新知識的先決條件。\n**簡單來說：**失衡就是「咦？對不上！」的感覺。例：Aaron 見到一隻像狗又不是狗的馬。\n**記住：**這種困惑是好事，它推動學習，所以老師會刻意製造失衡。"},"source":"PDF1 p.10","options":[{"en":"Disequilibrium","tw":"失衡（disequilibrium）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"}],"answerIndex":0,"correctAnswer":{"en":"Disequilibrium","tw":"失衡（disequilibrium）"}},{"id":"T1-04","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the correct order of Piaget's four stages?","tw":"皮亞傑四個認知發展階段的正確次序是？"},"explanation":{"en":"**Slides say:** Sensorimotor (0–2) → Preoperational (2–7) → Concrete operational (7–11) → Formal operational (11/12+).\n**In simple words:** Babies learn with senses and hands. Young kids start using words and pretend play. School kids reason about real things. Teenagers can think about \"what if\" ideas.\n**Remember:** \"**S**ome **P**eople **C**an **F**ly\" = S-P-C-F.","tw":"**投影片：**感覺運動期（0–2）→ 前運思期（2–7）→ 具體運思期（7–11）→ 形式運思期（11/12 歲以上）。\n**簡單來說：**嬰兒用感官和手去認識世界；幼童開始用語言和扮演遊戲；小學生能對實物推理；青少年能思考「如果……」的抽象問題。\n**記住：**「感 → 前 → 具 → 形」：先感覺，後符號，再具體，最後抽象。"},"source":"PDF1 p.28","options":[{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"},{"en":"Preoperational → Sensorimotor → Formal operational → Concrete operational","tw":"前運思期 → 感覺運動期 → 形式運思期 → 具體運思期"},{"en":"Sensorimotor → Concrete operational → Preoperational → Formal operational","tw":"感覺運動期 → 具體運思期 → 前運思期 → 形式運思期"},{"en":"Concrete operational → Sensorimotor → Preoperational → Formal operational","tw":"具體運思期 → 感覺運動期 → 前運思期 → 形式運思期"}],"answerIndex":0,"correctAnswer":{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"}},{"id":"T1-05","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"A baby searches for a ball after it rolls under the sofa. Which milestone does this show?","tw":"嬰兒在球滾到梳化底後會去找它。這顯示了哪一個里程碑？"},"explanation":{"en":"**Slides say:** Object permanence = knowing that something continues to exist even when it is out of sight (e.g. looking for a lost ball). Sensorimotor stage, 0–2.\n**In simple words:** \"Permanent\" means it stays. The baby knows the ball is still under the sofa, so she looks for it.\n**Trap:** the slides' film shows a younger baby who thinks a hidden toy no longer exists – that baby LACKS object permanence.","tw":"**投影片：**物體恆存 = 知道東西看不見時仍然存在（例如找丟失的球）。屬感覺運動期（0–2 歲）。\n**簡單來說：**嬰兒知道球仍在梳化底，所以會去找。\n**陷阱：**投影片影片中，較小的嬰兒以為看不見的玩具已經不存在，那是「缺乏」物體恆存。"},"source":"PDF1 p.29","options":[{"en":"Object permanence","tw":"物體恆存（object permanence）"},{"en":"Conservation","tw":"守恆（conservation）"},{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"},{"en":"Reversibility","tw":"可逆性（reversibility）"}],"answerIndex":0,"correctAnswer":{"en":"Object permanence","tw":"物體恆存（object permanence）"}},{"id":"T1-06","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In hide-and-seek, a child covers only his own eyes, thinking the seeker cannot see him. Which error is this?","tw":"玩捉迷藏時，孩子只遮著自己的眼睛，以為對方看不到他。這是哪種錯誤？"},"explanation":{"en":"**Slides say:** Egocentric = cannot see the world from others' point of view. The slides use this hide-and-seek example (Preoperational, 2–7).\n**In simple words:** \"Ego\" means \"me\". The child thinks: \"I can't see you, so you can't see me.\" Another slide example: a child nods \"yes\" on the phone, forgetting you can't see them.\n**Remember:** Piaget's Three Mountains task also tests egocentrism.","tw":"**投影片：**自我中心 = 無法從別人的角度看世界。投影片正正用了這個捉迷藏例子（前運思期，2–7 歲）。\n**簡單來說：**孩子心想：「我看不見你，你也看不見我。」投影片另一例：孩子講電話時點頭說「是」，忘了對方看不見。\n**記住：**皮亞傑的三山實驗也是測試自我中心。"},"source":"PDF1 p.36","options":[{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"},{"en":"Irreversibility","tw":"不可逆性（irreversibility）"},{"en":"Lack of object permanence","tw":"缺乏物體恆存"}],"answerIndex":0,"correctAnswer":{"en":"Egocentrism","tw":"自我中心（egocentrism）"}},{"id":"T1-07","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A child says the TALL thin glass has more juice than the short wide glass (same amount). Focusing on only ONE feature (height) is called…","tw":"孩子說高瘦杯的果汁比矮闊杯多（其實份量一樣）。只注意「一個」特徵（高度）的錯誤稱為……"},"explanation":{"en":"**Slides say:** Centration = concentrating on ONE aspect of a stimulus while ignoring other features (\"if one object looks taller, it is bigger\"). With irreversibility, it causes lack of conservation (Preoperational).\n**In simple words:** The child looks only at how TALL the juice is and forgets how WIDE the glass is.\n**Remember:** Concrete operational children (7–11) know the amount stays the same – that is conservation.","tw":"**投影片：**中心化 = 只注意刺激的「一個」方面而忽略其他特徵（「看起來較高的就較大」）。加上不可逆性，就會守恆失敗（前運思期）。\n**簡單來說：**孩子只看果汁有多「高」，忘了杯子有多「闊」。\n**記住：**具體運思期（7–11 歲）的孩子明白份量不變，這就是守恆。"},"source":"PDF1 p.39","options":[{"en":"Centration","tw":"中心化（centration）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Reversibility","tw":"可逆性（reversibility）"},{"en":"Accommodation","tw":"調適（accommodation）"}],"answerIndex":0,"correctAnswer":{"en":"Centration","tw":"中心化（centration）"}},{"id":"T1-08","topicNo":1,"difficulty":"medium","type":"order","star":false,"question":{"en":"Tap the tiles to name Piaget's task where a child picks the photo that shows what a doll on the OTHER side of the table can see.","tw":"按次序點選字卡，說出皮亞傑讓孩子選出「桌子對面洋娃娃」所見照片的實驗名稱。"},"explanation":{"en":"**Slides say:** In the Three Mountains Problem, a child chooses the photo of what a doll on the opposite side of the table would see.\n**In simple words:** Young children pick the photo of what THEY see, not what the doll sees. They can't yet imagine another person's view.\n**Remember:** Three Mountains → tests egocentrism → Preoperational stage (2–7).","tw":"**投影片：**三山實驗中，孩子要選出坐在桌子對面的洋娃娃會看到的照片。\n**簡單來說：**年幼的孩子會選「自己」看到的照片，而不是洋娃娃看到的，因為他們還未能想像別人的角度。\n**記住：**三山實驗 → 測試自我中心 → 前運思期（2–7 歲）。"},"source":"PDF1 p.37","tiles":{"en":["Three","Mountains","Problem","Conservation","Hidden"],"tw":["三山","實驗","守恆","迷箱"]},"answerLen":{"en":3,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Three Mountains Problem","tw":"三山實驗"}},{"id":"T1-09","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which stage: the child thinks logically about objects that are PRESENT and has conservation, decentration and reversibility, but cannot solve complex problems systematically?","tw":"哪個階段：孩子能對「眼前」事物作邏輯思考，已有守恆、去中心化和可逆性，但未能有系統地解決複雜問題？"},"explanation":{"en":"**Slides say:** Concrete operational (7–11): thinks logically about objects that are PRESENT and already understands conservation, decentration and reversibility. Errors: works only with familiar objects; can't systematically work through complex problems.\n**In simple words:** \"Concrete\" = real things you can see and touch. Example: the child knows a tall glass and a short glass can hold the same amount of juice.\n**Remember:** concrete = real objects; formal = abstract ideas.","tw":"**投影片：**具體運思期（7–11 歲）：能對「眼前」事物作邏輯思考，已明白守恆、去中心化和可逆性。錯誤：只限熟悉事物；未能系統地解決複雜問題。\n**簡單來說：**「具體」= 看得見、摸得到的實物。例：孩子知道高杯和矮杯可以裝同樣多的果汁。\n**記住：**具體 = 實物；形式 = 抽象概念。"},"source":"PDF1 p.43","options":[{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"},{"en":"Preoperational (2–7)","tw":"前運思期（2–7 歲）"},{"en":"Formal operational (11/12+)","tw":"形式運思期（11/12 歲以上）"},{"en":"Sensorimotor (0–2)","tw":"感覺運動期（0–2 歲）"}],"answerIndex":0,"correctAnswer":{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"}},{"id":"T1-10","topicNo":1,"difficulty":"hard","type":"mc","star":true,"question":{"en":"According to Piaget, which is TRUE about the formal operational stage?","tw":"根據皮亞傑，以下哪項關於形式運思期的描述正確？"},"explanation":{"en":"**Slides say:** Formal operational = abstract and systematic thinking (\"If… then…\"). Piaget believed reaching this stage, unlike the other stages, is NOT universal.\n**In simple words:** Everyone passes through the first three stages, but not everyone fully reaches this last one. Example of formal thinking (from the slides): \"David is taller than Peter and shorter than Eve – who is tallest?\"\n**Trap:** \"only familiar, present objects\" describes the CONCRETE stage.","tw":"**投影片：**形式運思期 = 抽象和系統的思考（「如果……就……」）。皮亞傑認為，與其他階段不同，達到此階段並不具普遍性。\n**簡單來說：**人人都會經過前三個階段，但並非人人能完全達到最後一個。投影片的例子：「David 比 Peter 高、比 Eve 矮，誰最高？」\n**陷阱：**「只限熟悉、眼前的事物」是「具體」運思期。"},"source":"PDF1 p.46","options":[{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"},{"en":"It is the stage where egocentrism is strongest","tw":"這是自我中心最強的階段"},{"en":"Children can only reason about familiar, present objects","tw":"兒童只能對熟悉、眼前的事物推理"},{"en":"It starts at age 7","tw":"從 7 歲開始"}],"answerIndex":0,"correctAnswer":{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"}},{"id":"T1-11","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"When does the formal operational stage begin, according to the Topic 1 slides?","tw":"根據 Topic 1 投影片，形式運思期何時開始？"},"explanation":{"en":"**Slides say:** One slide lists the formal stage as \"age 12 onwards\"; later slides say \"age 11 onwards\". The concrete stage ends at 11.\n**In simple words:** The slides disagree with themselves, so both ages are \"correct\" for this course.\n**Exam tip:** write \"11/12 onwards\" or mention both ages.","tw":"**投影片：**有一張投影片寫形式運思期由「12 歲以上」開始，後面幾張寫「11 歲以上」。具體運思期在 11 歲結束。\n**簡單來說：**投影片前後不一，所以兩個年齡在這科都算正確。\n**應試提示：**答「11/12 歲以上」，或兩個都寫。"},"source":"PDF1 p.28","options":[{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"},{"en":"Age 7 onwards","tw":"7 歲以上"},{"en":"Age 2 onwards","tw":"2 歲以上"},{"en":"Age 15 onwards","tw":"15 歲以上"}],"answerIndex":0,"correctAnswer":{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"}},{"id":"T1-12","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"All dogs have four legs. Boxer is a dog. So Boxer has four legs.\" This is…","tw":"「所有狗都有四條腿。Boxer 是狗。所以 Boxer 有四條腿。」這是……"},"explanation":{"en":"**Slides say:** Deductive reasoning = use a general rule to solve a specific case. The slides use this Boxer example. Inductive reasoning = make a general rule from specific examples.\n**In simple words:** Deductive goes DOWN from a rule to one case. Inductive goes UP from many examples to a rule. Inductive example: \"Every swan I've seen is white, so all swans are white.\"\n**Remember:** DEductive = Down.","tw":"**投影片：**演繹推理 = 用一般原則解決特定個案，投影片正正用了 Boxer 這個例子。歸納推理 = 從具體例子歸納出一般原則。\n**簡單來說：**演繹是由原則「向下」推到個案；歸納是由很多例子「向上」得出原則。歸納例子：「我見過的天鵝都是白色，所以天鵝都是白色。」\n**記住：**演繹 = 由上而下。"},"source":"PDF1 p.44","options":[{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"},{"en":"Inductive reasoning","tw":"歸納推理（inductive reasoning）"},{"en":"Centration","tw":"中心化"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"}},{"id":"T1-13","topicNo":1,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which is a WEAKNESS of Piaget's theory listed in the slides?","tw":"以下哪項是投影片列出的皮亞傑理論「缺點」？"},"explanation":{"en":"**Slides say:** Weaknesses: (1) underestimates children's abilities – 3-month-olds already show object permanence (Bower, 1974); (2) the stages are too strict; (3) not enough attention to the role of others and social context.\n**In simple words:** Babies turned out to be smarter, earlier, than Piaget thought.\n**Trap:** \"too much attention to social context\" is backwards – Piaget gave it TOO LITTLE. Social context is Vygotsky's focus.","tw":"**投影片：**缺點：(1) 低估兒童能力 – 3 個月大已有物體恆存（Bower, 1974）；(2) 階段太嚴格；(3) 對他人角色和社會背景關注不足。\n**簡單來說：**嬰兒原來比皮亞傑所想的更早、更聰明。\n**陷阱：**「太重視社會背景」剛好相反 – 皮亞傑是關注「不足」。重視社會背景的是維高斯基。"},"source":"PDF1 p.57","options":[{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"},{"en":"It puts too much attention on social and cultural context","tw":"太重視社會及文化背景"},{"en":"It never used tests with real children","tw":"從未以真實兒童進行測試"},{"en":"It says learners are passive receivers of knowledge","tw":"認為學習者是被動接收知識的"}],"answerIndex":0,"correctAnswer":{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"}},{"id":"T1-14","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Piaget advises teachers to \"present new problems in moderately novel ways\". Why?","tw":"皮亞傑建議老師「以適度新穎的方式提出新課題」，原因是？"},"explanation":{"en":"**Slides say:** Present new problems in moderately novel ways – disequilibrium is the pre-requisite of new knowledge.\n**In simple words:** If a problem is too familiar, nothing feels strange, so the mind doesn't change. If it is too strange, the child can't link it to anything. \"A little bit new\" is just right. Example: show students two paintings and ask \"Which one looks farther away?\" when the answer surprises them.\n**Remember:** Goldilocks – not too easy, not too hard.","tw":"**投影片：**以適度新穎的方式提出新課題 – 失衡是學習新知識的先決條件。\n**簡單來說：**太熟悉，沒有奇怪感，思想不會改變；太陌生，孩子連結不到。「有一點新」最好。例：給學生看兩幅畫，問「哪幅畫距離我們最遠？」，答案令他們意外。\n**記住：**不太易，也不太難，剛剛好。"},"source":"PDF1 p.52","options":[{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"},{"en":"To keep students in equilibrium so they never feel confused","tw":"讓學生保持平衡，永不困惑"},{"en":"To replace schemas with rote memorising","tw":"以死記硬背取代基模"},{"en":"To reward students immediately","tw":"即時獎勵學生"}],"answerIndex":0,"correctAnswer":{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"}},{"id":"T1-15","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Piaget's term for a mental framework that organises experiences:","tw":"皮亞傑用來指「組織經驗的心理架構」的術語："},"explanation":{"en":"**Slides say:** Schema = a mental framework to organise experiences; a way of interacting with the world.\n**In simple words:** A schema is like a folder in your brain for one idea. Example: your \"birthday party\" folder holds cake, candles and presents.\n**Remember:** new things go into a folder (assimilation) or make you change folders (accommodation).","tw":"**投影片：**基模 = 用來組織經驗的心理架構；是與世界互動的方式。\n**簡單來說：**基模就像腦中的文件夾，每個裝一個概念。例：「生日會」文件夾裏有蛋糕、蠟燭和禮物。\n**記住：**新東西放進文件夾 = 同化；要改文件夾 = 調適。"},"source":"PDF1 p.7","options":[{"en":"Schema","tw":"基模（schema）"},{"en":"Scaffold","tw":"鷹架（scaffold）"},{"en":"Chunk","tw":"組塊（chunk）"},{"en":"Model","tw":"楷模（model）"}],"answerIndex":0,"correctAnswer":{"en":"Schema","tw":"基模（schema）"}},{"id":"T1-16","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Differences, not disabilities\" in Piaget's implications means…","tw":"皮亞傑教學意義中的「是差異，不是障礙」意思是……"},"explanation":{"en":"**Slides say:** Children go through the same stages but at different rates. Teachers should design activities for groups of children, not the whole class. \"Differences, not disabilities.\"\n**In simple words:** All children climb the same stairs in the same order, but at different speeds. A slower child is not \"broken\", just at a different step.\n**Remember:** same ORDER, different SPEED.","tw":"**投影片：**兒童經歷相同階段，但速度不同。老師應為小組設計活動，而非全班統一。「是差異，不是障礙。」\n**簡單來說：**所有孩子按同一次序走同一條樓梯，只是快慢不同。走得慢的孩子並非「有問題」，只是在另一級。\n**記住：**次序相同，速度不同。"},"source":"PDF1 p.53","options":[{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"},{"en":"Some children skip stages, so ignore the stages","tw":"有些兒童會跳過階段，所以不用理會階段"},{"en":"Slow children have a learning disability","tw":"發展慢的兒童有學習障礙"},{"en":"All children in a class are at the same stage","tw":"全班兒童都處於同一階段"}],"answerIndex":0,"correctAnswer":{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"}},{"id":"T1-17","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"\"New material must be close enough to what the child already knows so a connection can be made.\" This describes…","tw":"「新知識必須足夠接近孩子已知的內容，才能建立新舊連繫。」這描述的是……"},"explanation":{"en":"**Slides say:** Closeness of the match = new material must be close enough to what the child already knows to connect old and new. Readiness = the child has the prior knowledge needed to make that connection.\n**In simple words:** Learning needs a bridge from old to new. Example: teach multiplication after addition (3 × 4 = 4 + 4 + 4), not before.\n**Remember:** closeness = about the LESSON; readiness = about the CHILD.","tw":"**投影片：**足夠接近 = 新知識要足夠接近孩子已知的內容，新舊才能連結。準備就緒 = 孩子具備建立連結所需的先備知識。\n**簡單來說：**學習需要一道由舊到新的橋。例：先學加法，再學乘法（3 × 4 = 4 + 4 + 4）。\n**記住：**足夠接近講「教材」；準備就緒講「孩子」。"},"source":"PDF1 p.13","options":[{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"},{"en":"Readiness","tw":"準備就緒（readiness）"},{"en":"Adaptation","tw":"適應（adaptation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"}],"answerIndex":0,"correctAnswer":{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"}},{"id":"T1-18","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What first made Piaget curious about how children think?","tw":"甚麼事情最初令皮亞傑對兒童思維產生興趣？"},"explanation":{"en":"**Slides say:** Piaget helped standardise a French intelligence test and was captured by the WRONG answers children gave. 6-, 8- and 13-year-olds made different types of errors.\n**In simple words:** Different ages made different kinds of mistakes. That suggested children think differently at each age, which led to his stage theory.\n**Trap:** drooling dogs = Pavlov; Bobo doll = Bandura; puzzle-box cats = Thorndike.","tw":"**投影片：**皮亞傑協助標準化法語版智力測試時，對兒童的「錯誤答案」很感興趣；6、8、13 歲兒童犯不同類型的錯誤。\n**簡單來說：**不同年齡犯不同的錯，代表兒童在不同年齡的思考方式不同，於是產生了階段理論。\n**陷阱：**流口水的狗 = 巴甫洛夫；吹氣娃娃 = 班杜拉；迷箱裏的貓 = 桑代克。"},"source":"PDF1 p.26","options":[{"en":"Children's WRONG answers on a French intelligence test he helped standardise","tw":"他協助標準化法語智力測試時，兒童給出的「錯誤答案」"},{"en":"Pavlov's dogs salivating to a bell","tw":"巴甫洛夫的狗聽到鈴聲流口水"},{"en":"Children copying an adult hitting a Bobo doll","tw":"兒童模仿成人打吹氣娃娃"},{"en":"Cats escaping from puzzle boxes","tw":"貓從迷箱逃出"}],"answerIndex":0,"correctAnswer":{"en":"Children's WRONG answers on a French intelligence test he helped standardise","tw":"他協助標準化法語智力測試時，兒童給出的「錯誤答案」"}},{"id":"T2-01","topicNo":2,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the Zone of Proximal Development (ZPD)?","tw":"甚麼是近側發展區（ZPD）？"},"explanation":{"en":"**Slides say:** ZPD = the distance between a child's current level of competence on a task and the level they can reach with support or guidance. It differs for each person.\n**In simple words:** Three zones: can do alone (too easy) | can do WITH help (ZPD) | can't do even with help (too hard). Teach in the middle zone. Example: a child can't bake a cake alone, but can with Mum guiding (the slides' cake example).\n**Remember:** ZPD = the \"I can, with help\" zone.","tw":"**投影片：**ZPD = 兒童現有能力與在支援或指導下可達水平之間的差距，因人而異。\n**簡單來說：**三個區：自己做到（太易）｜有人幫就做到（ZPD）｜有人幫也做不到（太難）。老師要在中間那區教。例：男孩不能獨自焗蛋糕，但有媽媽指導就可以（投影片的例子）。\n**記住：**ZPD = 「有人幫我就做到」的區域。"},"source":"PDF2 p.18","options":[{"en":"The gap between what a child can do alone and what they can do with guidance","tw":"兒童「獨自」能做到與在「指導下」能做到之間的差距"},{"en":"The age range of the preoperational stage","tw":"前運思期的年齡範圍"},{"en":"The part of memory that holds 7 ± 2 items","tw":"能容納 7 ± 2 個單位的記憶部分"},{"en":"The time between a behaviour and its reward","tw":"行為與獎勵之間的時間"}],"answerIndex":0,"correctAnswer":{"en":"The gap between what a child can do alone and what they can do with guidance","tw":"兒童「獨自」能做到與在「指導下」能做到之間的差距"}},{"id":"T2-02","topicNo":2,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Support that fits the learner's current level, given by a more competent person and gradually removed, is called ___.","tw":"由能力較高者提供、配合學習者現有水平、並逐步撤走的支援，稱為 ___。"},"explanation":{"en":"**Slides say:** Scaffolding = support from more competent peers or adults, adjusted to the learner's current level, so the task is done successfully and more independently. Give only enough support.\n**In simple words:** Builders put up scaffolding while building, then take it down when the building can stand alone. Example: holding a child's hands while they learn to walk (from the slides), then letting go.\n**Trap:** shaping (T4) REWARDS behaviour step by step; scaffolding gives HELP step by step.","tw":"**投影片：**搭鷹架 = 能力較高的同儕或成人，按學習者現有水平提供支援，令其成功並更獨立地完成任務；只給「足夠」支援。\n**簡單來說：**建築工人起樓時搭棚架，大樓能自己站穩就拆走。例：扶著孩子的手學行（投影片例子），之後慢慢放手。\n**陷阱：**塑形（T4）是逐步「獎勵」行為；搭鷹架是逐步「提供協助」。"},"source":"PDF2 p.21","options":[{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"},{"en":"Shaping","tw":"塑形（shaping）"},{"en":"Chunking","tw":"集組塊（chunking）"},{"en":"Modeling","tw":"示範（modeling）"}],"answerIndex":0,"correctAnswer":{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"}},{"id":"T2-03","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Gradually withdrawing scaffolding as the learner improves (based on their ZPD) is called…","tw":"根據學習者的 ZPD，隨其進步而逐步撤走鷹架，稱為……"},"explanation":{"en":"**Slides say:** The helper should fade out assistance based on the learner's ZPD. The goal is an independent learner.\n**In simple words:** Fading = slowly taking the help away. Example: holding the back of a bike seat, then letting go a little more each day.\n**Trap:** \"extinction\" is different – it is a learned reaction dying out in classical conditioning (T3).","tw":"**投影片：**協助者應按學習者的 ZPD 逐步撤出協助，目標是培養獨立學習者。\n**簡單來說：**逐步撤出 = 慢慢減少幫助。例：教孩子踩單車，先扶著車尾，每天放手多一點。\n**陷阱：**「消退」是另一回事 – 那是古典制約（T3）中習得反應的減弱。"},"source":"PDF2 p.24","options":[{"en":"Fading","tw":"逐步撤出（fading）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Disequilibrium","tw":"失衡（disequilibrium）"}],"answerIndex":0,"correctAnswer":{"en":"Fading","tw":"逐步撤出（fading）"}},{"id":"T2-04","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Vygotsky: every function in a child's development appears twice – first at the ___ level, then at the ___ level.","tw":"維高斯基：兒童發展中的每項功能都出現兩次 – 先在 ___ 層面，然後在 ___ 層面。"},"explanation":{"en":"**Slides say:** Every function in a child's development appears twice: first at the social level (between people), then at the individual level (inside the child).\n**In simple words:** We learn something WITH others first, then we can do it in our own head. Slide example: Penny's mum reads \"I think I can\" with her; days later Penny tells a classmate \"we can do this if we keep trying.\"\n**Remember:** outside → inside (internalisation).","tw":"**投影片：**兒童發展中的每項功能都會出現兩次：先在社會層面（人與人之間），後在個人層面（兒童內心）。\n**簡單來說：**先和別人一起學，之後自己在腦中也做到。投影片例子：媽媽和 Penny 讀「我想我可以」；幾天後 Penny 對同學說「只要繼續嘗試，我們就做得到」。\n**記住：**由外到內（內化）。"},"source":"PDF2 p.8","options":[{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"},{"en":"individual → social","tw":"個人 → 社會"},{"en":"biological → cultural","tw":"生理 → 文化"},{"en":"assimilation → accommodation","tw":"同化 → 調適"}],"answerIndex":0,"correctAnswer":{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"}},{"id":"T2-05","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A physics teacher talks out loud while solving a problem on the board. Which type of scaffolding?","tw":"物理老師在黑板解題時把思考過程說出來。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Think-aloud = a physics teacher talks out loud while solving a physics problem on the chalkboard.\n**In simple words:** The teacher says their thinking out loud (\"First I find the force, then…\") so students can hear how an expert thinks.\n**Trap:** Modeling = SHOWING how to do it (an art teacher draws an apple first). Think-aloud = SAYING your thinking.","tw":"**投影片：**出聲思考 = 物理老師在黑板解題時把思考過程說出來。\n**簡單來說：**老師把腦中想法講出來（「先找出力，然後……」），學生就能「聽到」專家如何思考。\n**陷阱：**示範 = 「做」給你看（美術老師先畫蘋果）；出聲思考 = 「講」出想法。"},"source":"PDF2 p.28","options":[{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Prompts and cues","tw":"提示（prompts and cues）"},{"en":"Adapting instructional materials","tw":"調節教學內容"}],"answerIndex":0,"correctAnswer":{"en":"Think-aloud","tw":"出聲思考（think-aloud）"}},{"id":"T2-06","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A PE teacher lowers the basketball basket while teaching shooting, then raises it later. Which type of scaffolding?","tw":"體育老師教射球時先降低籃框，之後再升高。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Adapting instructional materials = a PE teacher lowers the basketball basket while teaching shooting, then raises it later.\n**In simple words:** The task itself is made easier first, then harder as skills grow. The help is in the equipment, not in the teacher's words.\n**Remember:** the 5 types are modeling, think-aloud, questions, adapting materials, and prompts & cues.","tw":"**投影片：**調節教學內容 = 體育老師教射球時先降低籃框，之後再升高。\n**簡單來說：**先把任務本身變容易，技能提升後再加難。協助來自器材，而不是老師的說話。\n**記住：**五類：示範、出聲思考、提問、調節教學內容、提示。"},"source":"PDF2 p.28","options":[{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Questions","tw":"提問（questions）"}],"answerIndex":0,"correctAnswer":{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"}},{"id":"T2-07","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is a COGNITIVE tool (not a physical tool) in Vygotsky's theory?","tw":"在維高斯基理論中，以下哪項是「認知」工具（不是實體工具）？"},"explanation":{"en":"**Slides say:** Physical tools = chopsticks, scissors, hammers, computers. Cognitive tools = writing system, number system, maps. \"You know how to calculate only because your culture has a number system.\"\n**In simple words:** Physical tools help your HANDS; cognitive tools help your MIND.\n**Trap:** a computer is a physical tool in the slides, even though it feels \"smart\".","tw":"**投影片：**實體工具 = 筷子、剪刀、鐵鎚、電腦；認知工具 = 文字系統、數字系統、地圖。「你懂得運算，是因為你的文化有數字系統。」\n**簡單來說：**實體工具幫你的「手」；認知工具幫你的「腦」。\n**陷阱：**投影片把電腦列為實體工具，雖然它好像很「聰明」。"},"source":"PDF2 p.7","options":[{"en":"A number system","tw":"數字系統"},{"en":"Chopsticks","tw":"筷子"},{"en":"Scissors","tw":"剪刀"},{"en":"A computer","tw":"電腦"}],"answerIndex":0,"correctAnswer":{"en":"A number system","tw":"數字系統"}},{"id":"T2-08","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Self-talk that guides a child's thinking and action is called…","tw":"引導兒童思考和行動的自我對話稱為……"},"explanation":{"en":"**Slides say:** Language lets you think to yourself: out loud → private speech, \"self-talk that guides thinking and action\".\n**In simple words:** Ever said \"OK, first this, then that…\" to yourself while doing something hard? That is private speech.\n**Remember:** language is a cognitive tool. It lets you share knowledge, think and solve problems, and talk to yourself.","tw":"**投影片：**語言讓你自我思考：說出來 → 自我對話（private speech），即「引導思考和行動的自言自語」。\n**簡單來說：**做難題時，你有沒有對自己說「好，先做這個，再做那個……」？這就是自我對話。\n**記住：**語言是認知工具：交流知識、思考解難、自我對話。"},"source":"PDF2 p.15","options":[{"en":"Private speech","tw":"自我對話（private speech）"},{"en":"Deferred imitation","tw":"延遲模仿"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Retrieval cue","tw":"提取線索"}],"answerIndex":0,"correctAnswer":{"en":"Private speech","tw":"自我對話（private speech）"}},{"id":"T2-09","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"What is the MAIN difference between Piaget and Vygotsky?","tw":"皮亞傑與維高斯基的「主要」分別是？"},"explanation":{"en":"**Slides say:** Piaget: individual, internal construction of knowledge; social interaction does not play a major role. Vygotsky: social interaction, language and culture shape development – \"development is not an individual process\".\n**In simple words:** Both say children build knowledge actively. Piaget's child is a little scientist working mostly ALONE. Vygotsky's child learns WITH parents, teachers and classmates.\n**Remember:** Piaget = \"me\"; Vygotsky = \"we\".","tw":"**投影片：**皮亞傑：個人內在建構知識，社交互動不扮演重要角色。維高斯基：社交互動、語言和文化塑造發展 –「成長發展不是個人的過程」。\n**簡單來說：**兩者都認為兒童主動建構知識。皮亞傑的兒童像小科學家，多數「自己」探索；維高斯基的兒童「與人一起」學（父母、老師、同學）。\n**記住：**皮亞傑 =「我」；維高斯基 =「我們」。"},"source":"PDF2 p.6","options":[{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"},{"en":"Piaget: social interaction is central; Vygotsky: learning is individual","tw":"皮亞傑：社交互動是核心；維高斯基：學習是個人的"},{"en":"Piaget: learners are passive; Vygotsky: learners are active","tw":"皮亞傑：學習者被動；維高斯基：學習者主動"},{"en":"Vygotsky ignored language; Piaget focused on language","tw":"維高斯基忽略語言；皮亞傑重視語言"}],"answerIndex":0,"correctAnswer":{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"}},{"id":"T2-10","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT one of the four characteristics of constructivist learning theory (Eggen & Kauchak, 2010)?","tw":"以下哪項「不是」建構主義學習理論的四大特點（Eggen & Kauchak, 2010）？"},"explanation":{"en":"**Slides say:** Constructivism – learners create their own knowledge rather than receiving it from another source (Eggen & Kauchak, 2010). The 4 characteristics: (1) learners construct knowledge that makes sense to them; (2) new learning depends on current understanding; (3) social interaction helps; (4) real-world tasks make learning meaningful.\n**In simple words:** Students BUILD understanding, like building with Lego. They are not just filled up like empty cups.\n**Trap:** \"passively receive from the teacher\" is the opposite of constructivism.","tw":"**投影片：**建構主義 – 學習者自行建構知識，而不是被動接收（Eggen & Kauchak, 2010）。四特點：(1) 以對自己有意義的方式建構；(2) 新學習取決於現有理解；(3) 社交互動促進學習；(4) 真實任務令學習有意義。\n**簡單來說：**學生像砌 Lego 一樣「砌」出理解，而不是像空杯子被倒滿。\n**陷阱：**「被動接收老師的知識」正是建構主義的相反。"},"source":"PDF2 p.42","options":[{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"},{"en":"New learning depends on current understanding","tw":"新學習取決於現有理解"},{"en":"Social interaction facilitates learning","tw":"社交互動促進學習"},{"en":"Real-world tasks are needed for meaningful learning","tw":"真實世界任務帶來有意義的學習"}],"answerIndex":0,"correctAnswer":{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"}},{"id":"T2-11","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Problem-based Learning (PBL), what is the order?","tw":"在問題導向學習（PBL）中，次序是？"},"explanation":{"en":"**Slides say:** In PBL, students are asked to solve the problem FIRST, THEN are taught the basic/abstract skills. Problems are authentic and \"ill-structured\". The teacher is a facilitator.\n**In simple words:** You meet a real, messy problem first, then learn what you need. Slide example: teams get only a list of criteria plus internet access to build a tissue-paper balloon, not step-by-step instructions.\n**Trap:** being busy with your hands (behaviourally active) is NOT the same as thinking hard (cognitively active).","tw":"**投影片：**問題導向學習：學生「先」解決問題，「然後」才學基本／抽象技巧。問題真實且「結構不良」，老師是引導者。\n**簡單來說：**先遇上真實、複雜的問題，再學需要的東西。投影片例子：小組只獲一系列標準加上互聯網，自行製作紙熱氣球，而不是照著步驟做。\n**陷阱：**手在忙（行為活躍）≠ 腦在想（認知活躍）。"},"source":"PDF2 p.48","options":[{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"},{"en":"Teacher lectures all skills first, then gives a well-structured exercise","tw":"老師先講授所有技巧，再給結構清晰的練習"},{"en":"Students memorise standard answers, then take a test","tw":"學生先背標準答案，再考試"},{"en":"Students work alone with no teacher at all","tw":"學生獨自學習，完全沒有老師"}],"answerIndex":0,"correctAnswer":{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"}},{"id":"T2-12","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"What are the four steps of STAD (Slavin, 1994) in order?","tw":"STAD（Slavin, 1994）的四個步驟次序是？"},"explanation":{"en":"**Slides say:** STAD (Slavin, 1994) has four steps: Teach → Team study (worksheets in teams) → Test (individual quizzes) → Team recognition (team score from members' scores).\n**In simple words:** The teacher explains, the team practises together, each student takes the test ALONE, then the team is rewarded for how much each member IMPROVED.\n**Trap:** \"expert groups\" belong to the Jigsaw method.","tw":"**投影片：**STAD（Slavin, 1994）四步：講授 → 小組學習（組內完成工作紙）→ 測驗（個人測驗）→ 小組表揚（按成員分數計算小組分）。\n**簡單來說：**老師講解，小組一起練習，每人「獨自」考試，最後按每位成員的「進步」獎勵小組。\n**陷阱：**「專家組」屬拼圖法。"},"source":"PDF2 p.55","options":[{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"},{"en":"Team study → Teach → Team recognition → Test","tw":"小組學習 → 講授 → 小組表揚 → 測驗"},{"en":"Teach → Expert group → Home group → Quiz","tw":"講授 → 專家組 → 原組 → 測驗"},{"en":"Test → Teach → Team study → Team recognition","tw":"測驗 → 講授 → 小組學習 → 小組表揚"}],"answerIndex":0,"correctAnswer":{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"}},{"id":"T2-13","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the Jigsaw method, students from different groups who studied the SAME section meet in a(n)…","tw":"拼圖法中，來自不同小組、負責「同一部分」的學生會在哪裏會面？"},"explanation":{"en":"**Slides say:** Jigsaw step 2: students from different groups with the same section meet in an \"expert group\" to discuss their section, then return home to teach it.\n**In simple words:** Each team member gets one piece of the puzzle. Everyone with the same piece meets to become experts, then goes back to teach their own team. Like each friend studying one chapter and teaching it to the others.\n**Remember:** expert group → home group.","tw":"**投影片：**拼圖法第二步：不同小組中負責同一部分的學生在「專家組」討論，之後回原組教授。\n**簡單來說：**每位組員拿一塊拼圖；拿同一塊的人先聚在一起成為專家，再回自己小組教其他人。就像每位朋友讀一章，再教給其他人。\n**記住：**專家組 → 原組。"},"source":"PDF2 p.58","options":[{"en":"Expert group","tw":"專家組"},{"en":"Home group","tw":"原組"},{"en":"Control group","tw":"對照組"},{"en":"Mixed-ability group","tw":"混合能力組"}],"answerIndex":0,"correctAnswer":{"en":"Expert group","tw":"專家組"}},{"id":"T2-14","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"PIES (elements of effective groups) stands for…","tw":"PIES（有效小組的要素）代表……"},"explanation":{"en":"**Slides say:** PIES (Spencer, 1994; Slavin, 1994) = Positive interdependence, Individual accountability, Equal participation, Social skills.\n**In simple words:** P – we need each other (shared goal). I – each person's part is checked. E – everyone does a fair share. S – listening, leading and solving arguments.\n**Remember:** think of a PIE shared fairly by the whole group.","tw":"**投影片：**PIES（Spencer, 1994；Slavin, 1994）= 積極互賴、個人責任、平等參與、社交技巧。\n**簡單來說：**P – 互相需要（共同目標）；I – 每人的部分都會被評估；E – 公平分工；S – 聆聽、領導、處理分歧。\n**記住：**想像一個「PIE」（批）由全組公平分享。"},"source":"PDF2 p.63","options":[{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"},{"en":"Peer tutoring, Independent work, Equal grades, Silent reading","tw":"朋輩輔導、獨立工作、相同分數、默讀"},{"en":"Positive reinforcement, Imitation, Extinction, Shaping","tw":"正增強、模仿、消退、塑形"},{"en":"Praise, Incentives, Effort, Success","tw":"讚賞、誘因、努力、成功"}],"answerIndex":0,"correctAnswer":{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"}},{"id":"T2-15","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"STAD scoring: Albert's base score is 75 and his test score is 85. What is his improvement score?","tw":"STAD 計分：Albert 基本分 75，測驗分 85。他的進步分是？"},"explanation":{"en":"**Slides say:** In STAD, members contribute an improved score = test score − base score (Albert: 85 − 75 = 10).\n**In simple words:** STAD counts how much you IMPROVED, not your raw mark. A weaker student who jumps from 56 to 75 adds 19 points – more than Albert!\n**Remember:** improvement = test − base.","tw":"**投影片：**STAD 中，每位成員貢獻進步分 = 測驗分 − 基本分（Albert：85 − 75 = 10）。\n**簡單來說：**STAD 計的是「進步」，不是原始分。由 56 分進步到 75 分的同學可貢獻 19 分，比 Albert 還多！\n**記住：**進步分 = 測驗分 − 基本分。"},"source":"PDF2 p.57","options":[{"en":"10","tw":"10"},{"en":"85","tw":"85"},{"en":"160","tw":"160"},{"en":"75","tw":"75"}],"answerIndex":0,"correctAnswer":{"en":"10","tw":"10"}},{"id":"T2-16","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a disadvantage of discovery learning?","tw":"以下哪項是發現式學習的缺點？"},"explanation":{"en":"**Slides say:** Discovery learning – disadvantages: time-consuming; needs very careful planning and preparation; unless well supervised, some learners might not gain from it. Advantages: active engagement, curiosity, highly motivating.\n**In simple words:** Students find out rules themselves through experiments or field trips. It is exciting, but slow, and without guidance some students miss the point.\n**Remember:** most often used in science lessons.","tw":"**投影片：**發現學習的缺點：費時；需非常周詳的計劃和準備；缺乏良好督導，部分學生未必有得益。優點：主動投入、培養好奇心、高度激勵。\n**簡單來說：**學生靠實驗或實地考察自己找出規律。很有趣，但很花時間；沒有指導的話，有些學生會學不到重點。\n**記住：**最常用於科學課。"},"source":"PDF2 p.73","options":[{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"},{"en":"It kills students' curiosity","tw":"扼殺學生好奇心"},{"en":"Students are never active","tw":"學生從不主動"},{"en":"It can only be used in PE lessons","tw":"只能用於體育課"}],"answerIndex":0,"correctAnswer":{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"}},{"id":"T2-17","topicNo":2,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In inter-group competition, why compare a group's present score with its OWN past score?","tw":"在分組比賽中，為何要將小組現時分數與其「自己」過去的分數比較？"},"explanation":{"en":"**Slides say:** Inter-group competition builds cooperative spirit but may create inter-group hostility. Better: compare each group's present score with its past score and reward group improvement.\n**In simple words:** If groups only fight to beat each other, they start disliking each other. If each group tries to beat its OWN last score, they still work hard without fighting. Like chasing your personal best in sport.\n**Remember:** reward improvement, not winning.","tw":"**投影片：**分組比賽可培養合作精神，但可能造成組別間敵意。較好的做法：把小組現時分數與過去分數比較，按進步給獎。\n**簡單來說：**如果各組只想打敗對方，就會互相討厭；如果各組挑戰自己上次的分數，大家仍會努力，又不會敵對。就像運動員挑戰個人最佳成績。\n**記住：**獎勵進步，不是獎勵勝出。"},"source":"PDF2 p.74","options":[{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"},{"en":"To make weaker groups feel ashamed","tw":"令較弱的組別感到羞愧"},{"en":"Because past scores are always higher","tw":"因為過去的分數總是較高"},{"en":"To stop groups from cooperating","tw":"阻止小組合作"}],"answerIndex":0,"correctAnswer":{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"}},{"id":"T2-18","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Vygotsky is famous for his…","tw":"維高斯基以哪個理論聞名？"},"explanation":{"en":"**Slides say:** Vygotsky is famous for his Sociocultural Theory of Development.\n**In simple words:** Socio = people around you; cultural = the tools and ideas your culture gives you (language, numbers). We grow by learning through both.\n**Trap:** social COGNITIVE theory = Bandura (T5). Self-determination theory = Deci & Ryan (T8).","tw":"**投影片：**維高斯基以「社會文化發展理論」聞名。\n**簡單來說：**社會 = 身邊的人；文化 = 文化給我們的工具和概念（語言、數字）。我們透過兩者成長。\n**陷阱：**社會「認知」理論 = 班杜拉（T5）；自我決定理論 = Deci & Ryan（T8）。"},"source":"PDF2 p.5","options":[{"en":"Sociocultural theory of development","tw":"社會文化發展理論"},{"en":"Social cognitive theory","tw":"社會認知理論"},{"en":"Self-determination theory","tw":"自我決定理論"},{"en":"Attribution theory","tw":"歸因理論"}],"answerIndex":0,"correctAnswer":{"en":"Sociocultural theory of development","tw":"社會文化發展理論"}},{"id":"T2-19","topicNo":2,"difficulty":"medium","type":"order","star":true,"question":{"en":"Put the five steps of the Jigsaw method in order.","tw":"把拼圖式合作學習法的五個步驟排成正確次序。"},"explanation":{"en":"**Slides say:** Jigsaw has five steps: (1) the task is divided into sections, one per member; (2) members with the same section meet in an expert group; (3) experts return and teach their home group; (4) each member takes an individual quiz; (5) team scores are computed from members' scores.\n**In simple words:** Everyone holds one puzzle piece, so the team needs everyone to finish the picture.\n**Remember:** split → experts → teach → quiz → score.","tw":"**投影片：**拼圖法五步：(1) 任務分成不同部分，每人負責一部分；(2) 負責同一部分的成員在專家組會面；(3) 專家回原組教授；(4) 每人參加個人測驗；(5) 按成員分數計算小組分。\n**簡單來說：**每人手上一塊拼圖，小組需要每個人才能完成整幅圖。\n**記住：**分拆 → 專家 → 教授 → 測驗 → 計分。"},"source":"PDF2 p.58","tiles":{"en":["Split the task into sections","Same-section students meet in expert groups","Experts teach their home group","Everyone takes an individual quiz","Team score from members' scores"],"tw":["把任務分成不同部分","同一部分的學生在專家組會面","專家回原組教授","每人參加個人測驗","按成員分數計算小組分"]},"answerLen":{"en":5,"tw":5},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Split the task into sections → Same-section students meet in expert groups → Experts teach their home group → Everyone takes an individual quiz → Team score from members' scores","tw":"把任務分成不同部分 → 同一部分的學生在專家組會面 → 專家回原組教授 → 每人參加個人測驗 → 按成員分數計算小組分"}},{"id":"T3-01","topicNo":3,"difficulty":"easy","type":"mc","star":true,"question":{"en":"In Pavlov's experiment, the MEAT that naturally makes the dog salivate is the…","tw":"在巴甫洛夫實驗中，自然令狗流口水的「肉」是……"},"explanation":{"en":"**Slides say:** Unconditioned stimulus (US) = a stimulus that naturally elicits a response, e.g. meat. The natural response (salivation) is the UR.\n**In simple words:** \"Un-conditioned\" = no training needed. Meat makes a dog drool from birth.\n**Remember:** US → UR happens naturally. Training only adds the bell (NS → CS).","tw":"**投影片：**非制約刺激（US）= 能自然引發反應的刺激，例如肉；自然反應（流口水）是 UR。\n**簡單來說：**「非制約」= 不用訓練。狗天生見到肉就流口水。\n**記住：**US → UR 是天生的；訓練只是加入鈴聲（NS → CS）。"},"source":"PDF3 p.15","options":[{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Conditioned response (CR)","tw":"制約反應（CR）"}],"answerIndex":0,"correctAnswer":{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"}},{"id":"T3-02","topicNo":3,"difficulty":"easy","type":"mc","star":true,"question":{"en":"BEFORE conditioning, the bell that causes no salivation is a…","tw":"制約「之前」，不會令狗流口水的鈴聲是……"},"explanation":{"en":"**Slides say:** Neutral stimulus (NS) = a stimulus that does not evoke a response, e.g. hearing a bell.\n**In simple words:** Before training, the bell means nothing to the dog – no drool. After the bell is paired with meat many times, it becomes the conditioned stimulus (CS).\n**Remember:** NS (nothing) → paired with US → becomes CS.","tw":"**投影片：**中性刺激（NS）= 不會引起反應的刺激，例如鈴聲。\n**簡單來說：**訓練前，鈴聲對狗沒有意義，不會流口水。鈴聲與肉多次配對後，才變成制約刺激（CS）。\n**記住：**NS（無反應）→ 與 US 配對 → 變成 CS。"},"source":"PDF3 p.15","options":[{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"}],"answerIndex":0,"correctAnswer":{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"}},{"id":"T3-03","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"AFTER conditioning, the dog salivates to the bell alone. This salivation is the…","tw":"制約「之後」，狗只聽到鈴聲就流口水。這流口水是……"},"explanation":{"en":"**Slides say:** Conditioned response (CR) = a learned response elicited by the CS.\n**In simple words:** It's the same drool with a different name. Drooling to MEAT = UR (natural). Drooling to the BELL = CR (learned).\n**Trap:** ask \"what started the drool?\" If it's the learned signal (bell), it's the CR.","tw":"**投影片：**制約反應（CR）= 由制約刺激引發、經學習得來的反應。\n**簡單來說：**同樣是流口水，名稱不同：對「肉」流口水 = UR（天生）；對「鈴聲」流口水 = CR（學來的）。\n**陷阱：**問自己「是甚麼引發流口水？」如果是學來的信號（鈴聲），就是 CR。"},"source":"PDF3 p.15","options":[{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned response (CR)","tw":"制約反應（CR）"}},{"id":"T3-04","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A teacher always raises his hand while asking for quiet. Later, students stop talking when they just see the raised hand. The raised hand is now the…","tw":"老師每次要求安靜時都舉手。之後學生一看到老師舉手就停止說話。舉手現在是……"},"explanation":{"en":"**Slides say:** Class Exercise 2 – a teacher always raises his hand when asking students to stop talking; later students stop talking when they see the hand. Hand = CS; stop talking = CR.\n**In simple words:** At first the raised hand meant nothing (NS). It kept coming with \"Be quiet!\" (US), so now the hand alone works.\n**Trap:** before the pairing, the hand was the NS – it only becomes the CS after learning.","tw":"**投影片：**課堂練習 2 – 老師每次要求安靜都舉手；後來學生一見舉手就停止說話。舉手 = CS；停止說話 = CR。\n**簡單來說：**起初舉手沒有意義（NS）。它一直和「安靜！」（US）一起出現，現在單是舉手就有效。\n**陷阱：**配對前，舉手是 NS；學習後才變成 CS。"},"source":"PDF3 p.26","options":[{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}},{"id":"T3-05","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which of these can NOT be a conditioned response in classical conditioning?","tw":"以下哪項「不能」成為古典制約的制約反應？"},"explanation":{"en":"**Slides say:** Classical conditioning involves INVOLUNTARY responses – \"doing homework is not a potential candidate\" for a conditioned response.\n**In simple words:** Classical conditioning only works on things that happen by themselves – fear, happiness, drooling. You CHOOSE to do homework, so it is voluntary.\n**Remember:** voluntary actions belong to operant conditioning (rewards and punishments, T4).","tw":"**投影片：**古典制約涉及「非自願」反應 –「做功課不是自然反應」，不能成為制約反應。\n**簡單來說：**古典制約只適用於自動出現的反應 – 害怕、開心、流口水。做功課是你「選擇」做的，屬自願行為。\n**記住：**自願行為屬操作性制約（獎勵和懲罰，T4）。"},"source":"PDF3 p.16","options":[{"en":"Doing homework","tw":"做功課"},{"en":"Feeling fear","tw":"感到害怕"},{"en":"Salivating","tw":"流口水"},{"en":"Feeling happy","tw":"感到愉快"}],"answerIndex":0,"correctAnswer":{"en":"Doing homework","tw":"做功課"}},{"id":"T3-06","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Pavlov won the Nobel Prize in 1904 for…","tw":"巴甫洛夫在 1904 年獲諾貝爾獎，是哪個範疇？"},"explanation":{"en":"**Slides say:** Pavlov (1849–1936) was a Russian physiologist who studied digestion. He won the 1904 Nobel Prize in Physiology or Medicine (\"but not for Psychology!\").\n**In simple words:** He was studying how dogs digest food when he noticed they drooled before the food even arrived. That led to classical conditioning.\n**Trap:** many students pick \"Psychology\" – wrong.","tw":"**投影片：**巴甫洛夫（1849–1936）是研究消化的俄國生理學家，1904 年獲諾貝爾生理學或醫學獎（「不是心理學！」）。\n**簡單來說：**他研究狗如何消化食物時，發現食物未到狗已流口水，於是發現了古典制約。\n**陷阱：**很多同學選「心理學」– 錯。"},"source":"PDF3 p.12","options":[{"en":"Physiology or Medicine","tw":"生理學或醫學"},{"en":"Psychology","tw":"心理學"},{"en":"Chemistry","tw":"化學"},{"en":"Peace","tw":"和平"}],"answerIndex":0,"correctAnswer":{"en":"Physiology or Medicine","tw":"生理學或醫學"}},{"id":"T3-07","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who is called the founder of behaviourism and ran the \"Little Albert\" experiment?","tw":"誰被稱為行為主義創始人，並進行了「小艾伯特」實驗？"},"explanation":{"en":"**Slides say:** John B. Watson (1878–1958), the founder of Behaviourism. The Little Albert experiment shows a conditioned emotional response.\n**In simple words:** Watson showed that FEAR can be learned: baby Albert learned to fear something harmless after it was paired with something frightening.\n**Remember:** Watson = founder of behaviourism + Little Albert.","tw":"**投影片：**華生（John B. Watson，1878–1958）是行為主義創始人；小艾伯特實驗展示制約情緒反應。\n**簡單來說：**華生證明「恐懼」可以學來：嬰兒艾伯特把無害的東西與可怕的事配對後，便開始害怕它。\n**記住：**華生 = 行為主義創始人 + 小艾伯特。"},"source":"PDF3 p.30","options":[{"en":"John B. Watson","tw":"華生（John B. Watson）"},{"en":"Ivan Pavlov","tw":"巴甫洛夫（Ivan Pavlov）"},{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},{"en":"Edward Thorndike","tw":"桑代克（Edward Thorndike）"}],"answerIndex":0,"correctAnswer":{"en":"John B. Watson","tw":"華生（John B. Watson）"}},{"id":"T3-08","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student who fears Mathematics now also fears Physics. This is…","tw":"一名怕數學的學生，現在連物理也怕。這是……"},"explanation":{"en":"**Slides say:** Generalization = the tendency to respond to stimuli similar to the CS. Example: a student who fears Maths may also fear other subjects like Physics.\n**In simple words:** The fear spreads to things that feel similar – like a child bitten by one dog who becomes scared of all dogs.\n**Remember:** generalization = SPREADS.","tw":"**投影片：**泛化 = 對類似 CS 的刺激也作出反應。例：怕數學的學生也可能怕物理等其他科目。\n**簡單來說：**恐懼擴散到相似的東西 – 就像被一隻狗咬過，就怕所有狗。\n**記住：**泛化 = 擴散。"},"source":"PDF3 p.38","options":[{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Shaping","tw":"塑形（shaping）"}],"answerIndex":0,"correctAnswer":{"en":"Generalization","tw":"泛化（generalization）"}},{"id":"T3-09","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student fears Maths and Physics but NOT Accounting. This is…","tw":"學生怕數學和物理，但「不」怕會計。這是……"},"explanation":{"en":"**Slides say:** Discrimination = the ability to differentiate between classes of stimuli. Example: the student fears Maths and Physics, but not Accounting.\n**In simple words:** The student can tell the subjects apart, so the fear stops spreading.\n**Remember:** generalization spreads the reaction; discrimination tells things apart.","tw":"**投影片：**差異（辨別）= 能區分不同種類的刺激。例：學生怕數學和物理，但不怕會計。\n**簡單來說：**學生分得出科目的分別，所以恐懼不再擴散。\n**記住：**泛化 = 擴散；辨別 = 分清楚。"},"source":"PDF3 p.12","options":[{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Spontaneous reinforcement","tw":"自發強化"}],"answerIndex":0,"correctAnswer":{"en":"Discrimination","tw":"差異／辨別（discrimination）"}},{"id":"T3-10","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student repeatedly passes Maths tests and the fear of Maths disappears. This is…","tw":"學生多次通過數學測驗，對數學的恐懼消失了。這是……"},"explanation":{"en":"**Slides say:** Extinction = gradual weakening of the CR when the CS appears without the US. Example: if the student repeatedly passes Maths tests, the fear of Maths disappears.\n**In simple words:** Maths (CS) keeps coming WITHOUT the bad experience (failing), so the fear slowly dies out – like a dog that stops drooling when the bell keeps ringing with no food.\n**Remember:** extinction = the learned reaction fades.","tw":"**投影片：**消退 = CS 出現而沒有 US，CR 會逐漸減弱。例：學生多次通過數學測驗，對數學的恐懼就會消失。\n**簡單來說：**數學（CS）一再出現，但沒有壞經驗（不合格），恐懼便慢慢消失 – 就像鈴聲響了很多次都沒有食物，狗就不再流口水。\n**記住：**消退 = 學來的反應慢慢消失。"},"source":"PDF3 p.38","options":[{"en":"Extinction","tw":"消退（extinction）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Extinction","tw":"消退（extinction）"}},{"id":"T3-11","topicNo":3,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Using classical conditioning, why is giving writing assignments as punishment unwise?","tw":"以古典制約解釋，為何以寫作作懲罰並不明智？"},"explanation":{"en":"**Slides say:** Discussion – teachers are discouraged from using writing assignments as punishment. Explain it with classical conditioning.\n**In simple words:** Writing (NS) keeps coming with punishment and bad feelings. The brain links \"writing = bad\", so later just being asked to write (now a CS) makes students feel upset and avoid it (CR).\n**Remember:** same as the shaming Maths teacher example – students end up avoiding the subject.","tw":"**投影片：**討論題 – 老師不應以寫作作為懲罰，請以古典制約解釋。\n**簡單來說：**寫作（NS）總是和懲罰、負面感受一起出現，大腦便把「寫作 = 不開心」連結起來；之後單是要寫作（已成 CS）就令學生不安並逃避（CR）。\n**記住：**與「羞辱學生的數學老師」例子一樣 – 學生最後逃避那一科。"},"source":"PDF3 p.41","options":[{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"},{"en":"Writing is a voluntary behaviour, so it cannot be conditioned","tw":"寫作是自願行為，所以不能被制約"},{"en":"Writing becomes a primary reinforcer","tw":"寫作會變成主要強化物"},{"en":"Punishment always leads to extinction of writing skills","tw":"懲罰一定導致寫作技能消退"}],"answerIndex":0,"correctAnswer":{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"}},{"id":"T3-12","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In classical conditioning, the neutral stimulus is usually presented ___ the unconditioned stimulus.","tw":"古典制約中，中性刺激通常在非制約刺激 ___ 出現。"},"explanation":{"en":"**Slides say:** The NS is usually presented BEFORE the US.\n**In simple words:** The signal must come first so it can PREDICT what comes next: bell → meat. If the meat came first, the bell would predict nothing.\n**Remember:** classical = something BEFORE the reaction; operant = a consequence AFTER the behaviour.","tw":"**投影片：**中性刺激（NS）通常在非制約刺激（US）「之前」出現。\n**簡單來說：**信號要先出現，才能「預告」接下來的事：鈴聲 → 肉。如果肉先出現，鈴聲就預告不到甚麼。\n**記住：**古典制約 = 反應「之前」的刺激；操作性制約 = 行為「之後」的後果。"},"source":"PDF3 p.16","options":[{"en":"before","tw":"之前"},{"en":"after","tw":"之後"},{"en":"instead of","tw":"取代"},{"en":"long after","tw":"很久之後"}],"answerIndex":0,"correctAnswer":{"en":"before","tw":"之前"}},{"id":"T3-13","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Behaviourism focuses on…","tw":"行為主義著重於……"},"explanation":{"en":"**Slides say:** Behaviourism focuses only on OBSERVABLE behaviours and ignores what is not directly observable, such as what happens inside the brain – the \"black box\".\n**In simple words:** Behaviourists only study what you can SEE someone do, not what they think.\n**Remember:** Bandura (T5) and information processing (T6) later looked inside the black box.","tw":"**投影片：**行為主義只研究「可觀察」的行為，忽略不能直接觀察的東西，例如大腦內發生的事 –「黑盒」。\n**簡單來說：**行為主義只研究你「看得見」的行為，不理會人在想甚麼。\n**記住：**後來班杜拉（T5）和訊息處理模型（T6）才打開這個黑盒。"},"source":"PDF3 p.3","options":[{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"},{"en":"Thoughts and schemas inside the brain","tw":"大腦內的思想與基模"},{"en":"Dreams and the unconscious","tw":"夢境與潛意識"},{"en":"Social and cultural tools","tw":"社會及文化工具"}],"answerIndex":0,"correctAnswer":{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"}},{"id":"T3-14","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"The first time you eat sushi you get food poisoning; now just seeing sushi makes you feel sick. Which is the unconditioned stimulus (US)?","tw":"第一次吃壽司就食物中毒，現在一看到壽司就不舒服。哪一項是非制約刺激（US）？"},"explanation":{"en":"**Slides say:** Food aversion example: NS = sushi, US = food poisoning, UR = feel sick → afterwards CS = sushi, CR = feel sick.\n**In simple words:** Ask: what made you sick NATURALLY? The food poisoning. Sushi was harmless until it got linked with being sick.\n**Trap:** sushi is the NS (later the CS), NOT the US.","tw":"**投影片：**食物厭惡例子：NS = 壽司，US = 食物中毒，UR = 不適 → 之後 CS = 壽司，CR = 不適。\n**簡單來說：**問自己：甚麼「天生」令你不舒服？是食物中毒。壽司本來無害，只是和不適連結了。\n**陷阱：**壽司是 NS（之後變 CS），不是 US。"},"source":"PDF3 p.22","options":[{"en":"Food poisoning","tw":"食物中毒"},{"en":"Sushi","tw":"壽司"},{"en":"Feeling sick","tw":"感到不適"},{"en":"Seeing sushi later","tw":"之後看到壽司"}],"answerIndex":0,"correctAnswer":{"en":"Food poisoning","tw":"食物中毒"}},{"id":"T3-15","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How can a teacher use classical conditioning in classroom management?","tw":"老師如何在課堂管理中運用古典制約？"},"explanation":{"en":"**Slides say:** Positive learning environment – associate the learning environment with positive emotions: attractive learning aids, decorate the classroom, greet and smile at students, help them complete tasks.\n**In simple words:** If the classroom keeps coming with happy feelings, the classroom itself starts to feel happy. Slide example: Anna smiles and praises students, so they enjoy her English lessons.\n**Trap:** shaming does the opposite – it links the subject with fear.","tw":"**投影片：**愉快的學習環境 – 把學習環境與正面情緒連結：吸引的教具、佈置課室、微笑問好、協助完成任務。\n**簡單來說：**課室總是伴隨開心的感覺，課室本身就會令人開心。投影片例子：安娜常微笑讚賞學生，學生都喜歡上她的英文課。\n**陷阱：**羞辱學生正好相反 – 令科目與恐懼連結。"},"source":"PDF3 p.40","options":[{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"},{"en":"Shame students who make mistakes so they try harder","tw":"羞辱犯錯的學生，令他們更努力"},{"en":"Give extra writing as punishment","tw":"以額外寫作作懲罰"},{"en":"Remove all rewards from lessons","tw":"取消課堂上的所有獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"}},{"id":"T3-16","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Throwing a child who cannot swim into deep water \"so he learns to swim\" most likely leads to…","tw":"把不會游泳的孩子扔進深水「讓他學游泳」，最可能導致……"},"explanation":{"en":"**Slides say:** Many irrational fears come from pairing neutral stimuli with stimuli that trigger an involuntary response. Throwing a child who cannot swim into deep water is likely to cause a fear of water.\n**In simple words:** Water (neutral) + panic of nearly sinking (natural fear) → water itself becomes scary.\n**Remember:** phobias are often learned through classical conditioning.","tw":"**投影片：**許多非理性恐懼源於中性刺激與觸發非自願反應的刺激配對。把不會游泳的孩子扔進深水，很可能令他怕水。\n**簡單來說：**水（中性）＋ 差點遇溺的驚慌（天生恐懼）→ 水本身變得可怕。\n**記住：**恐懼症常由古典制約學來。"},"source":"PDF3 p.39","options":[{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"},{"en":"Learning to swim quickly","tw":"很快學會游泳"},{"en":"Extinction of fear","tw":"恐懼消退"},{"en":"Positive reinforcement of swimming","tw":"游泳行為得到正增強"}],"answerIndex":0,"correctAnswer":{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"}},{"id":"T3-17","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who suggested the \"Law of Association\" about 2000 years ago?","tw":"約 2000 年前，誰提出「聯繫法則」？"},"explanation":{"en":"**Slides say:** Our minds naturally connect events that occur in sequence; 2000 years ago Aristotle suggested this \"Law of Association\".\n**In simple words:** Things that happen one after another get linked in our mind – like the school bell and the end of a lesson.\n**Remember:** classical conditioning is built on this old idea.","tw":"**投影片：**大腦自然地把先後發生的事件聯繫起來；2000 年前亞里士多德已提出「聯繫法則」。\n**簡單來說：**先後發生的事會在腦中連在一起 – 就像下課鐘聲和下課。\n**記住：**古典制約就是建基於這個古老的想法。"},"source":"PDF3 p.10","options":[{"en":"Aristotle","tw":"亞里士多德"},{"en":"Pavlov","tw":"巴甫洛夫"},{"en":"Skinner","tw":"史金納"},{"en":"Plato","tw":"柏拉圖"}],"answerIndex":0,"correctAnswer":{"en":"Aristotle","tw":"亞里士多德"}},{"id":"T3-18","topicNo":3,"difficulty":"medium","type":"order","star":true,"question":{"en":"Put the steps of classical conditioning in order (Pavlov's dog).","tw":"把古典制約的步驟排成正確次序（巴甫洛夫的狗）。"},"explanation":{"en":"**Slides say:** Step 0: US → UR. Step 1: NS → no response. Step 2: NS + US → UR. Step 3: CS → CR.\n**In simple words:** Meat makes a dog drool. A bell alone does nothing. Ring the bell with the meat many times. Now the bell alone makes the dog drool.\n**Remember:** natural → nothing → pair → learned.","tw":"**投影片：**步驟 0：US → UR；步驟 1：NS → 沒有反應；步驟 2：NS + US → UR；步驟 3：CS → CR。\n**簡單來說：**肉令狗流口水；單是鈴聲沒有反應；鈴聲和肉一起出現很多次；之後單是鈴聲就令狗流口水。\n**記住：**天生 → 無反應 → 配對 → 學會。"},"source":"PDF3 p.20","tiles":{"en":["US → UR: meat makes the dog drool","NS → no response: bell alone","NS + US → UR: bell with meat, many times","CS → CR: bell alone makes it drool"],"tw":["US → UR：肉令狗流口水","NS → 沒有反應：只有鈴聲","NS + US → UR：鈴聲與肉多次一起出現","CS → CR：單是鈴聲就令狗流口水"]},"answerLen":{"en":4,"tw":4},"sep":{"en":"  |  ","tw":"  |  "},"correctAnswer":{"en":"US → UR: meat makes the dog drool  |  NS → no response: bell alone  |  NS + US → UR: bell with meat, many times  |  CS → CR: bell alone makes it drool","tw":"US → UR：肉令狗流口水  |  NS → 沒有反應：只有鈴聲  |  NS + US → UR：鈴聲與肉多次一起出現  |  CS → CR：單是鈴聲就令狗流口水"}},{"id":"T4-01","topicNo":4,"difficulty":"easy","type":"mc","star":true,"question":{"en":"In operant conditioning, behaviour is controlled by its…","tw":"在操作性制約中，行為受甚麼控制？"},"explanation":{"en":"**Slides say:** Operant conditioning = a type of learning in which responses are controlled by their consequences. Reinforcement → behaviour increases; punishment → behaviour decreases.\n**In simple words:** You learn from what happens AFTER you act. Slide example: Sam answers a question, gets praised, and answers more often.\n**Remember:** ABC – Antecedent (before) → Behaviour → Consequence (after). Operant = the C.","tw":"**投影片：**操作性制約 = 反應行為受後果影響的學習。強化 → 行為增加；懲罰 → 行為減少。\n**簡單來說：**你從行動「之後」發生的事學習。投影片例子：Sam 回答問題後被稱讚，以後更常答問題。\n**記住：**前因 → 行為 → 後果；操作性制約講的是「後果」。"},"source":"PDF4 p.5","options":[{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"},{"en":"Antecedent stimuli only","tw":"只受前因刺激"},{"en":"Reflexes","tw":"反射"},{"en":"Genes","tw":"基因"}],"answerIndex":0,"correctAnswer":{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"}},{"id":"T4-02","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Lawrence is often late. His teacher makes him clean all the desks after school each time. Now he is late less often. This is…","tw":"Lawrence 經常遲到，老師每次都要他放學後清潔所有桌子。現在他少了遲到。這是……"},"explanation":{"en":"**Slides say:** This is the slides' revision exercise. Positive punishment = present something negative to decrease behaviour.\n**In simple words:** Ask two questions. (1) Did lateness go up or down? Down → punishment. (2) Was something added or taken away? ADDED (cleaning desks) → positive. Answer: positive punishment.\n**Trap:** \"positive\" means ADD, not \"good\".","tw":"**投影片：**這是投影片的溫習練習。正懲罰 = 加入負面事物以減少行為。\n**簡單來說：**問兩個問題：(1) 遲到增加還是減少？減少 → 懲罰。(2) 加入還是移走東西？「加入」（清潔桌子）→ 正。答案：正懲罰。\n**陷阱：**「正」= 加入，不是「好」。"},"source":"PDF4 p.16","options":[{"en":"Positive punishment","tw":"正懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Positive punishment","tw":"正懲罰"}},{"id":"T4-03","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Students do NOT have to do extra practice if they score more than 80 in the exam. This is…","tw":"考試超過 80 分的學生就「不用」做額外練習。這是……"},"explanation":{"en":"**Slides say:** Negative reinforcement = remove something negative so the behaviour increases. Slide example: students do not need to do extra practice if they score more than 80.\n**In simple words:** (1) Studying goes UP → reinforcement. (2) Something unpleasant is TAKEN AWAY (extra practice) → negative. Everyday example: the car's seatbelt beep stops when you buckle up, so you buckle up more.\n**Remember:** −R = remove the nasty.","tw":"**投影片：**負增強 = 移除負面事物，令行為增加。投影片例子：考試超過 80 分就不用做額外練習。\n**簡單來說：**(1) 溫習增加 → 強化；(2) 移走不愉快的事（額外練習）→ 負。生活例子：扣好安全帶後警告聲就停，所以你更會扣安全帶。\n**記住：**負增強 = 移走討厭的事。"},"source":"PDF4 p.26","options":[{"en":"Negative reinforcement","tw":"負增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Positive punishment","tw":"正懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Negative reinforcement","tw":"負增強"}},{"id":"T4-04","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Recess is taken away after a noisy class. This is…","tw":"課堂吵鬧後取消小息。這是……"},"explanation":{"en":"**Slides say:** Negative punishment = remove something positive to decrease behaviour. Slide example: taking away recess time after a noisy class.\n**In simple words:** (1) Noise goes DOWN → punishment. (2) Something they LIKE is taken away (recess) → negative.\n**Remember:** −P = remove the nice.","tw":"**投影片：**負懲罰 = 移除喜愛的事物以減少行為。投影片例子：課堂吵鬧後取消小息。\n**簡單來說：**(1) 吵鬧減少 → 懲罰；(2) 移走「喜歡」的東西（小息）→ 負。\n**記住：**負懲罰 = 移走喜歡的東西。"},"source":"PDF4 p.22","options":[{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Extinction","tw":"消退"}],"answerIndex":0,"correctAnswer":{"en":"Negative punishment","tw":"負懲罰"}},{"id":"T4-05","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A teacher gives a candy whenever a student attempts to answer a question. This is…","tw":"學生每次嘗試答問題，老師就給糖果。這是……"},"explanation":{"en":"**Slides say:** Positive reinforcement = give something that reinforces good behaviour. Slide example: a teacher gives candy whenever students attempt to answer, so they become more eager to answer. Discipline relying mostly on it is usually very effective.\n**In simple words:** (1) Answering goes UP → reinforcement. (2) Something nice is ADDED (candy) → positive.\n**Remember:** +R = add the nice.","tw":"**投影片：**正增強 = 給予強化良好行為的東西。投影片例子：學生每次嘗試答問題，老師就給糖果，學生更願意回答。主要依賴正增強的紀律通常非常有效。\n**簡單來說：**(1) 答問題增加 → 強化；(2)「加入」好東西（糖果）→ 正。\n**記住：**正增強 = 加入好東西。"},"source":"PDF4 p.25","options":[{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Classical conditioning","tw":"古典制約"}],"answerIndex":0,"correctAnswer":{"en":"Positive reinforcement","tw":"正增強"}},{"id":"T4-06","topicNo":4,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Common trap: \"negative reinforcement\" means…","tw":"常見陷阱：「負增強」的意思是……"},"explanation":{"en":"**Slides say:** Reinforcement → strengthens (increases) behaviour; punishment → weakens it. Positive = present (+); negative = remove (−).\n**In simple words:** Reinforcement ALWAYS makes behaviour go up. \"Negative\" only means \"take away\". So negative reinforcement takes away something annoying so you do the behaviour MORE.\n• +R add nice · −R remove nasty · +P add nasty · −P remove nice","tw":"**投影片：**強化 → 行為增加；懲罰 → 行為減少。正 = 給予（+）；負 = 移除（−）。\n**簡單來說：**強化「永遠」令行為增加。「負」只是「移走」。所以負增強是移走討厭的事，令你「更多」做這個行為。\n• 正增強：加好的 · 負增強：移走壞的 · 正懲罰：加壞的 · 負懲罰：移走好的"},"source":"PDF4 p.11","options":[{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"},{"en":"A type of punishment","tw":"一種懲罰"},{"en":"Adding something unpleasant to decrease a behaviour","tw":"加入不愉快的事
