<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPC5014 Flashcards</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1d2330; --muted:#5d6678; --line:#dfe3ea;
  --accent:#2f5bd3; --accent-ink:#ffffff; --good:#1c8a4c; --good-bg:#e5f5ec; --bad:#c23b3b; --bad-bg:#fbeaea;
  --warn:#9a6a00; --chip:#eef1f6; --shadow:0 2px 10px rgba(20,30,50,.08); --star:#d39b00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.3rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 10px;min-height:32px;font-size:.875rem}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.stat:last-child{grid-column:span 2}
@media(min-width:600px){.stats{grid-template-columns:repeat(5,1fr)}.stat:last-child{grid-column:auto}}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.875rem;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.good>i{background:var(--good)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
details.card{padding:12px 18px}
summary{cursor:pointer;font-weight:600}
fieldset{border:0;padding:0;margin:10px 0}
legend{font-size:.875rem;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.875rem;cursor:pointer}
.chip input{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.875rem;color:var(--muted);margin-bottom:8px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px}
.tag.easy{color:var(--good)} .tag.medium{color:var(--warn)} .tag.hard{color:var(--bad)}
.star{color:var(--star)}
.q{font-size:1.3rem;font-weight:600;margin:4px 0 14px;outline:none}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.875rem;font-weight:700}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans input{flex:1 1 220px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:44px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb .src{font-size:.875rem;color:var(--muted);margin-top:6px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:.875rem;color:var(--muted)}
.center{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res-item{border-bottom:1px solid var(--line);padding:10px 0}
.res-item:last-child{border:0}
.ok-t{color:var(--good);font-weight:700} .no-t{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90vw;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:19;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.bar>i{transition:none}}
.warn{background:var(--bad-bg);border-radius:10px;padding:8px 12px;font-size:.875rem;display:none}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:.875rem}
.boxes div{background:var(--chip);border-radius:8px;padding:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">EPC5014 Flashcards</h1>
    <div class="row">
      <div class="row" role="group" aria-label="Language">
        <button class="btn small" id="lang-en" aria-pressed="true">EN</button>
        <button class="btn small" id="lang-tw" aria-pressed="false">繁中</button>
      </div>
    </div>
  </header>

  <div class="warn" id="storeWarn" role="alert"></div>

  <section class="stats" aria-label="Progress">
    <div class="stat"><b id="sScore">0</b><span data-t="score"></span></div>
    <div class="stat"><b id="sStreak">0</b><span data-t="streak"></span></div>
    <div class="stat"><b id="sAnswered">0</b><span data-t="answered"></span></div>
    <div class="stat"><b id="sAcc">–</b><span data-t="accuracy"></span></div>
    <div class="stat"><b id="sMastery">0%</b><span data-t="mastery"></span></div>
  </section>
  <div class="bar good" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="masteryBar" aria-label="Mastery"><i></i></div>

  <div class="row" style="margin-top:12px" role="group" aria-label="Mode">
    <button class="btn" id="modeStudy" aria-pressed="true"></button>
    <button class="btn" id="modeTest" aria-pressed="false"></button>
    <button class="btn" id="modeStats" aria-pressed="false"></button>
  </div>

  <p class="hint" id="syncNote"></p>
  <div class="card" id="confirmBox" role="alertdialog" aria-labelledby="confirmMsg" hidden>
    <p id="confirmMsg"></p>
    <div class="row"><button class="btn primary" id="confirmYes"></button><button class="btn" id="confirmNo"></button></div>
  </div>
  <details class="card" id="filters">
    <summary data-t="filters"></summary>
    <fieldset><legend data-t="topics"></legend><div class="chips" id="fTopics"></div></fieldset>
    <fieldset><legend data-t="difficulty"></legend><div class="chips" id="fDiff"></div></fieldset>
    <fieldset><legend data-t="qtype"></legend><div class="chips" id="fType"></div></fieldset>
    <fieldset><legend data-t="more"></legend><div class="chips" id="fMore"></div></fieldset>
    <fieldset><legend data-t="schedule"></legend>
      <div class="chips" id="fSched"></div>
      <p class="hint" data-t="schedHint"></p>
    </fieldset>
    <div class="row"><span class="hint" id="poolCount"></span>
      <button class="btn small" id="applyFilters" data-t="apply"></button>
      <button class="btn small" id="resetBtn" data-t="reset"></button></div>
  </details>

  <main id="view" aria-live="polite"></main>
  <p class="hint center" data-t="keys"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const BANK = [{"id":"T1-01","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"Using an EXISTING schema to make sense of a new experience is called…","tw":"運用「既有」基模去解釋新經驗，稱為……"},"explanation":{"en":"Assimilation = fit the new thing into an OLD box. Accommodation = CHANGE the box.\nMnemonic: a**SS**imilate = **S**ame **S**chema; a**CC**ommodate = **C**hange.","tw":"同化 = 把新事物放進「舊盒子」；調適 = 「改造盒子」。\n記法：同化＝照舊用；調適＝要調整。"},"source":"PDF1 p.9","options":[{"en":"Assimilation","tw":"同化（assimilation）"},{"en":"Accommodation","tw":"調適（accommodation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"}],"answerIndex":0,"correctAnswer":{"en":"Assimilation","tw":"同化（assimilation）"},"accepted":null},{"id":"T1-02","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Aaron calls every four-legged animal \"dog\". Dad says \"No, that is a horse\", and Aaron builds a new \"horse\" schema. Which Piaget process is this? (one word)","tw":"Aaron 把所有四腳動物都叫「狗」。爸爸說「不，那是馬」，Aaron 於是建立了新的「馬」基模。這是皮亞傑的哪個過程？"},"explanation":{"en":"He had to CREATE a new schema because \"horse\" did not fit \"dog\" → accommodation. First he felt confused (disequilibrium).\nTrap: calling the horse \"dog\" would be assimilation.","tw":"「馬」放不進「狗」的基模，他要建立新基模 → 調適。之前他感到困惑，就是失衡。\n陷阱：如果他繼續叫馬做「狗」，那才是同化。"},"source":"PDF1 p.21","options":null,"correctAnswer":{"en":"Accommodation","tw":"調適（accommodation）"},"accepted":["accommodation","accomodation","調適","調適作用"]},{"id":"T1-03","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"The confused feeling when existing schemas CANNOT assimilate a new experience is called…","tw":"既有基模「無法」同化新經驗時所產生的困惑感，稱為……"},"explanation":{"en":"Disequilibrium = \"this doesn't fit!\" feeling. Piaget says it is the PRE-REQUISITE of new knowledge, so teachers should create it on purpose.","tw":"失衡 =「這個不合我所知！」的感覺。皮亞傑認為失衡是學習新知識的先決條件，所以老師應刻意製造失衡。"},"source":"PDF1 p.10","options":[{"en":"Disequilibrium","tw":"失衡（disequilibrium）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"}],"answerIndex":0,"correctAnswer":{"en":"Disequilibrium","tw":"失衡（disequilibrium）"},"accepted":null},{"id":"T1-04","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the correct order of Piaget's four stages?","tw":"皮亞傑四個認知發展階段的正確次序是？"},"explanation":{"en":"Ages: 0–2 Sensorimotor · 2–7 Preoperational · 7–11 Concrete · 11/12+ Formal.\nMnemonic: \"**S**ome **P**eople **C**an **F**ly\" (S-P-C-F).","tw":"年齡：0–2 感覺運動 · 2–7 前運思 · 7–11 具體運思 · 11/12 歲以上 形式運思。\n記法：「感 → 前 → 具 → 形」：先感覺，再符號，再具體，後抽象。"},"source":"PDF1 p.28","options":[{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"},{"en":"Preoperational → Sensorimotor → Formal operational → Concrete operational","tw":"前運思期 → 感覺運動期 → 形式運思期 → 具體運思期"},{"en":"Sensorimotor → Concrete operational → Preoperational → Formal operational","tw":"感覺運動期 → 具體運思期 → 前運思期 → 形式運思期"},{"en":"Concrete operational → Sensorimotor → Preoperational → Formal operational","tw":"具體運思期 → 感覺運動期 → 前運思期 → 形式運思期"}],"answerIndex":0,"correctAnswer":{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"},"accepted":null},{"id":"T1-05","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"A baby searches for a ball after it rolls under the sofa. Which milestone does this show?","tw":"嬰兒在球滾到梳化底後會去找它。這顯示了哪一個里程碑？"},"explanation":{"en":"Object permanence = knowing something still exists when out of sight. It belongs to the Sensorimotor stage (0–2).","tw":"物體恆存 = 知道東西看不見時仍然存在。屬感覺運動期（0–2 歲）。"},"source":"PDF1 p.29","options":[{"en":"Object permanence","tw":"物體恆存（object permanence）"},{"en":"Conservation","tw":"守恆（conservation）"},{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"},{"en":"Reversibility","tw":"可逆性（reversibility）"}],"answerIndex":0,"correctAnswer":{"en":"Object permanence","tw":"物體恆存（object permanence）"},"accepted":null},{"id":"T1-06","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"In hide-and-seek, a child covers only his own eyes, thinking the seeker cannot see him. Which error is this?","tw":"玩捉迷藏時，孩子只遮著自己的眼睛，以為對方看不到他。這是哪種錯誤？"},"explanation":{"en":"Egocentrism = believing everyone sees the world exactly as you do. Typical of the Preoperational stage (2–7). Same idea: Piaget's Three Mountains task.","tw":"自我中心 = 以為別人看到的和自己一樣。屬前運思期（2–7 歲）的典型錯誤，皮亞傑的三山實驗也是測試這一點。"},"source":"PDF1 p.36","options":[{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"},{"en":"Irreversibility","tw":"不可逆性（irreversibility）"},{"en":"Lack of object permanence","tw":"缺乏物體恆存"}],"answerIndex":0,"correctAnswer":{"en":"Egocentrism","tw":"自我中心（egocentrism）"},"accepted":null},{"id":"T1-07","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"A child says the TALL thin glass has more juice than the short wide glass (same amount). Focusing on only ONE feature (height) is called…","tw":"孩子說高瘦杯的果汁比矮闊杯多（其實份量一樣）。只注意「一個」特徵（高度）的錯誤稱為……"},"explanation":{"en":"Centration + irreversibility → the child fails CONSERVATION (Preoperational, 2–7). In the Concrete stage (7–11) the child understands conservation.","tw":"中心化 + 不可逆性 → 守恆失敗（前運思期，2–7 歲）。到了具體運思期（7–11 歲）就明白守恆。"},"source":"PDF1 p.39","options":[{"en":"Centration","tw":"中心化（centration）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Reversibility","tw":"可逆性（reversibility）"},{"en":"Accommodation","tw":"調適（accommodation）"}],"answerIndex":0,"correctAnswer":{"en":"Centration","tw":"中心化（centration）"},"accepted":null},{"id":"T1-08","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"short","star":false,"question":{"en":"Name Piaget's task where a child chooses the photo that shows what a doll on the OTHER side of the table can see.","tw":"皮亞傑讓孩子選出「坐在桌子對面的洋娃娃」會看到的照片，這個實驗叫甚麼？"},"explanation":{"en":"Preoperational children pick the photo of THEIR OWN view → egocentrism.","tw":"前運思期兒童會選「自己」看到的景象 → 自我中心。"},"source":"PDF1 p.37","options":null,"correctAnswer":{"en":"Three Mountains Problem (tests egocentrism)","tw":"三山實驗（測試自我中心）"},"accepted":["three mountains problem","three mountains","three mountain","3 mountains","three mountains task","three mountains test","3 mountain","三山實驗","三山"]},{"id":"T1-09","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which stage: the child thinks logically about objects that are PRESENT and has conservation, decentration and reversibility, but cannot solve complex problems systematically?","tw":"哪個階段：孩子能對「眼前」事物作邏輯思考，已有守恆、去中心化和可逆性，但未能有系統地解決複雜問題？"},"explanation":{"en":"Key word: CONCRETE = real objects in front of you. Its errors: only familiar objects/concepts; no systematic work on complex problems.","tw":"關鍵字：「具體」= 眼前的實物。此階段的錯誤：只限熟悉的事物和概念；未能系統地解決複雜問題。"},"source":"PDF1 p.43","options":[{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"},{"en":"Preoperational (2–7)","tw":"前運思期（2–7 歲）"},{"en":"Formal operational (11/12+)","tw":"形式運思期（11/12 歲以上）"},{"en":"Sensorimotor (0–2)","tw":"感覺運動期（0–2 歲）"}],"answerIndex":0,"correctAnswer":{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"},"accepted":null},{"id":"T1-10","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"According to Piaget, which is TRUE about the formal operational stage?","tw":"根據皮亞傑，以下哪項關於形式運思期的描述正確？"},"explanation":{"en":"Formal stage = abstract \"If… then…\" thinking, hypotheses, systematic problem solving. Piaget: unlike the other stages, its attainment is NOT universal.","tw":"形式運思期 = 抽象的「如果……就……」思考、建立假設、系統解難。皮亞傑認為，與其他階段不同，它並不具普遍性。"},"source":"PDF1 p.46","options":[{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"},{"en":"It is the stage where egocentrism is strongest","tw":"這是自我中心最強的階段"},{"en":"Children can only reason about familiar, present objects","tw":"兒童只能對熟悉、眼前的事物推理"},{"en":"It starts at age 7","tw":"從 7 歲開始"}],"answerIndex":0,"correctAnswer":{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"},"accepted":null},{"id":"T1-11","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"When does the formal operational stage begin, according to the Topic 1 slides?","tw":"根據 Topic 1 投影片，形式運思期何時開始？"},"explanation":{"en":"[Conflict] One slide says \"age 12 onwards\"; later slides say \"age 11 onwards\". Concrete stage ends at 11. In an exam, write \"11/12+\" or mention both.","tw":"[矛盾] 一張投影片寫「12 歲以上」，後面幾張寫「11 歲以上」。具體運思期在 11 歲結束。考試時可寫「11/12 歲以上」或兩者並列。"},"source":"PDF1 p.28","options":[{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"},{"en":"Age 7 onwards","tw":"7 歲以上"},{"en":"Age 2 onwards","tw":"2 歲以上"},{"en":"Age 15 onwards","tw":"15 歲以上"}],"answerIndex":0,"correctAnswer":{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"},"accepted":null},{"id":"T1-12","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"All dogs have four legs. Boxer is a dog. So Boxer has four legs.\" This is…","tw":"「所有狗都有四條腿。Boxer 是狗。所以 Boxer 有四條腿。」這是……"},"explanation":{"en":"Deductive = general RULE → specific case (top-down). Inductive = specific EXAMPLES → general rule (bottom-up).","tw":"演繹 = 一般「原則」→ 個別例子（由上而下）。歸納 = 個別「例子」→ 一般原則（由下而上）。"},"source":"PDF1 p.44","options":[{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"},{"en":"Inductive reasoning","tw":"歸納推理（inductive reasoning）"},{"en":"Centration","tw":"中心化"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"},"accepted":null},{"id":"T1-13","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which is a WEAKNESS of Piaget's theory listed in the slides?","tw":"以下哪項是投影片列出的皮亞傑理論「缺點」？"},"explanation":{"en":"3 weaknesses: (1) underestimates children; (2) stages too strict – abilities develop in one domain before another (maths vs physics); (3) NOT ENOUGH attention to social context.\nTrap: option 2 is the opposite – that is Vygotsky's focus.","tw":"三個缺點：(1) 低估兒童；(2) 階段太嚴格 – 不同領域發展不同步（如數學 vs 物理）；(3) 對社會背景「關注不足」。\n陷阱：第二個選項剛好相反 – 那是維高斯基的重點。"},"source":"PDF1 p.57","options":[{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"},{"en":"It puts too much attention on social and cultural context","tw":"太重視社會及文化背景"},{"en":"It never used tests with real children","tw":"從未以真實兒童進行測試"},{"en":"It says learners are passive receivers of knowledge","tw":"認為學習者是被動接收知識的"}],"answerIndex":0,"correctAnswer":{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"},"accepted":null},{"id":"T1-14","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Piaget advises teachers to \"present new problems in moderately novel ways\". Why?","tw":"皮亞傑建議老師「以適度新穎的方式提出新課題」，原因是？"},"explanation":{"en":"Too familiar → no disequilibrium → no growth. Too strange → no link (closeness of match). \"Moderately\" novel is the sweet spot.","tw":"太熟悉 → 沒有失衡 → 沒有成長；太陌生 → 無法連結（足夠接近）。「適度」新穎最好。"},"source":"PDF1 p.52","options":[{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"},{"en":"To keep students in equilibrium so they never feel confused","tw":"讓學生保持平衡，永不困惑"},{"en":"To replace schemas with rote memorising","tw":"以死記硬背取代基模"},{"en":"To reward students immediately","tw":"即時獎勵學生"}],"answerIndex":0,"correctAnswer":{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"},"accepted":null},{"id":"T1-15","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"easy","type":"short","star":true,"question":{"en":"Piaget's term for a mental framework that organises experiences:","tw":"皮亞傑用來指「組織經驗的心理架構」的術語："},"explanation":{"en":"Schema = a mental \"folder\" (e.g. your \"dog\" folder). Assimilation adds to a folder; accommodation edits or creates folders.","tw":"基模 = 腦中的「文件夾」（例如「狗」文件夾）。同化 = 放進文件夾；調適 = 修改或新增文件夾。"},"source":"PDF1 p.7","options":null,"correctAnswer":{"en":"Schema","tw":"基模（schema）"},"accepted":["schema","schemas","schemata","scheme","基模"]},{"id":"T1-16","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Differences, not disabilities\" in Piaget's implications means…","tw":"皮亞傑教學意義中的「是差異，不是障礙」意思是……"},"explanation":{"en":"Same ORDER of stages, different SPEED. Teaching must be developmentally appropriate for each child's cognitive level.","tw":"階段「次序」相同，「速度」不同。教學要配合每個兒童的認知水平。"},"source":"PDF1 p.53","options":[{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"},{"en":"Some children skip stages, so ignore the stages","tw":"有些兒童會跳過階段，所以不用理會階段"},{"en":"Slow children have a learning disability","tw":"發展慢的兒童有學習障礙"},{"en":"All children in a class are at the same stage","tw":"全班兒童都處於同一階段"}],"answerIndex":0,"correctAnswer":{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"},"accepted":null},{"id":"T1-17","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"\"New material must be close enough to what the child already knows so a connection can be made.\" This describes…","tw":"「新知識必須足夠接近孩子已知的內容，才能建立新舊連繫。」這描述的是……"},"explanation":{"en":"Closeness of match = the NEW material is near the old. Readiness = the CHILD has the prior knowledge needed. (Material vs child.)","tw":"足夠接近 = 「新教材」貼近舊知識；準備就緒 = 「孩子」具備所需先備知識。（一個講教材，一個講孩子。）"},"source":"PDF1 p.13","options":[{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"},{"en":"Readiness","tw":"準備就緒（readiness）"},{"en":"Adaptation","tw":"適應（adaptation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"}],"answerIndex":0,"correctAnswer":{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"},"accepted":null},{"id":"T1-18","topicNo":1,"topic":{"en":"T1 Piaget's Cognitive Development","tw":"T1 皮亞傑認知發展"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"What first made Piaget curious about how children think?","tw":"甚麼事情最初令皮亞傑對兒童思維產生興趣？"},"explanation":{"en":"He interviewed children about their errors and noticed that 6-, 8- and 13-year-olds made DIFFERENT types of errors → stages.","tw":"他訪問兒童，請他們解釋錯誤，發現 6、8、13 歲兒童犯「不同類型」的錯誤 → 發展階段。"},"source":"PDF1 p.26","options":[{"en":"Children's WRONG answers on a French intelligence test he helped standardise","tw":"他協助標準化法語智力測試時，兒童給出的「錯誤答案」"},{"en":"Pavlov's dogs salivating to a bell","tw":"巴甫洛夫的狗聽 No":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"short","star":false,"question":{"en":"Gradually withdrawing scaffolding as the learner improves (based on their ZPD) is called ___ (one word).","tw":"根據學習者的 ZPD，隨其進步而逐步撤走鷹架，稱為 ___。"},"explanation":{"en":"Goal of scaffolding = an INDEPENDENT learner, so help must fade away over time.","tw":"搭鷹架的目標是令學生成為「獨立」學習者，所以協助要逐步減少。"},"source":"PDF2 p.24","options":null,"correctAnswer":{"en":"Fading (fading out assistance)","tw":"逐步撤出協助（fading）"},"accepted":["fading","fade","fading out","fade out","逐步撤出","漸漸退出","撤出","退出"]},{"id":"T2-04","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Vygotsky: every function in a child's development appears twice – first at the ___ level, then at the ___ level.","tw":"維高斯基：兒童發展中的每項功能都出現兩次 – 先在 ___ 層面，然後在 ___ 層面。"},"explanation":{"en":"Learning starts OUTSIDE (talking with others) and is then INTERNALISED (e.g. the concept of fairness).","tw":"學習先在「外」（與人互動），再被「內化」（例如公平觀念）。"},"source":"PDF2 p.8","options":[{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"},{"en":"individual → social","tw":"個人 → 社會"},{"en":"biological → cultural","tw":"生理 → 文化"},{"en":"assimilation → accommodation","tw":"同化 → 調適"}],"answerIndex":0,"correctAnswer":{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"},"accepted":null},{"id":"T2-05","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"A physics teacher talks out loud while solving a problem on the board. Which type of scaffolding?","tw":"物理老師在黑板解題時把思考過程說出來。這是哪一類搭鷹架？"},"explanation":{"en":"5 types: Modeling (art teacher draws an apple) · Think-aloud (physics teacher) · Questions (maths teacher at critical points) · Adapting materials (lower basket) · Prompts & cues (\"bunny goes around the hole\").","tw":"五類：示範（美術老師畫蘋果）· 出聲思考（物理老師）· 提問（數學老師在關鍵處發問）· 調節教學內容（降低籃框）· 提示（「兔子繞過洞」）。"},"source":"PDF2 p.28","options":[{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Prompts and cues","tw":"提示（prompts and cues）"},{"en":"Adapting instructional materials","tw":"調節教學內容"}],"answerIndex":0,"correctAnswer":{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},"accepted":null},{"id":"T2-06","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"A PE teacher lowers the basketball basket while teaching shooting, then raises it later. Which type of scaffolding?","tw":"體育老師教射球時先降低籃框，之後再升高。這是哪一類搭鷹架？"},"explanation":{"en":"The task material is made easier first, then made harder as skill grows – support is faded.","tw":"先把任務教材變容易，技能提升後再加難 – 支援逐步撤出。"},"source":"PDF2 p.28","options":[{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Questions","tw":"提問（questions）"}],"answerIndex":0,"correctAnswer":{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"},"accepted":null},{"id":"T2-07","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is a COGNITIVE tool (not a physical tool) in Vygotsky's theory?","tw":"在維高斯基理論中，以下哪項是「認知」工具（不是實體工具）？"},"explanation":{"en":"Cognitive tools = writing systems, number systems, maps, language. \"You can calculate only because your culture has a number system.\"","tw":"認知工具 = 文字系統、數字系統、地圖、語言。「你懂得運算，是因為你的文化有數字系統。」"},"source":"PDF2 p.7","options":[{"en":"A number system","tw":"數字系統"},{"en":"Chopsticks","tw":"筷子"},{"en":"Scissors","tw":"剪刀"},{"en":"A computer","tw":"電腦"}],"answerIndex":0,"correctAnswer":{"en":"A number system","tw":"數字系統"},"accepted":null},{"id":"T2-08","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Self-talk that guides a child's thinking and action is called…","tw":"引導兒童思考和行動的自我對話稱為……"},"explanation":{"en":"Language is a cognitive tool: (1) share knowledge, (2) think and solve problems, (3) talk to yourself (out loud → private speech).","tw":"語言是認知工具：(1) 交流知識；(2) 思考解難；(3) 自我對話（說出來 → private speech）。"},"source":"PDF2 p.15","options":[{"en":"Private speech","tw":"自我對話（private speech）"},{"en":"Deferred imitation","tw":"延遲模仿"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Retrieval cue","tw":"提取線索"}],"answerIndex":0,"correctAnswer":{"en":"Private speech","tw":"自我對話（private speech）"},"accepted":null},{"id":"T2-09","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"What is the MAIN difference between Piaget and Vygotsky?","tw":"皮亞傑與維高斯基的「主要」分別是？"},"explanation":{"en":"Both are constructivists and see learners as ACTIVE. The split is WHO drives learning: the child alone (Piaget) vs the child with others in a culture (Vygotsky).","tw":"兩者都屬建構主義，都視學習者為「主動」。分別在於誰推動學習：兒童自己（皮亞傑）vs 兒童與他人在文化中互動（維高斯基）。"},"source":"PDF2 p.6","options":[{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"},{"en":"Piaget: social interaction is central; Vygotsky: learning is individual","tw":"皮亞傑：社交互動是核心；維高斯基：學習是個人的"},{"en":"Piaget: learners are passive; Vygotsky: learners are active","tw":"皮亞傑：學習者被動；維高斯基：學習者主動"},{"en":"Vygotsky ignored language; Piaget focused on language","tw":"維高斯基忽略語言；皮亞傑重視語言"}],"answerIndex":0,"correctAnswer":{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"},"accepted":null},{"id":"T2-10","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT one of the four characteristics of constructivist learning theory (Eggen & Kauchak, 2010)?","tw":"以下哪項「不是」建構主義學習理論的四大特點（Eggen & Kauchak, 2010）？"},"explanation":{"en":"Constructivism = learners CREATE their own knowledge. 4th trait missing above: learners construct knowledge that makes sense to THEM (→ may cause misconceptions).","tw":"建構主義 = 學習者「自行建構」知識。另一特點：學習者以對自己有意義的方式建構知識（可能產生誤解）。"},"source":"PDF2 p.42","options":[{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"},{"en":"New learning depends on current understanding","tw":"新學習取決於現有理解"},{"en":"Social interaction facilitates learning","tw":"社交互動促進學習"},{"en":"Real-world tasks are needed for meaningful learning","tw":"真實世界任務帶來有意義的學習"}],"answerIndex":0,"correctAnswer":{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"},"accepted":null},{"id":"T2-11","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Problem-based Learning (PBL), what is the order?","tw":"在問題導向學習（PBL）中，次序是？"},"explanation":{"en":"PBL problems are authentic and ILL-structured (messy, real-world). Teacher = facilitator, gives direct instruction only if necessary.\nTrap: behaviourally active ≠ cognitively active.","tw":"PBL 的問題真實且「結構不良」（複雜、貼近現實）。老師是引導者，只在必要時直接指導。\n陷阱：行為活躍 ≠ 認知活躍。"},"source":"PDF2 p.48","options":[{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"},{"en":"Teacher lectures all skills first, then gives a well-structured exercise","tw":"老師先講授所有技巧，再給結構清晰的練習"},{"en":"Students memorise standard answers, then take a test","tw":"學生先背標準答案，再考試"},{"en":"Students work alone with no teacher at all","tw":"學生獨自學習，完全沒有老師"}],"answerIndex":0,"correctAnswer":{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"},"accepted":null},{"id":"T2-12","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"What are the four steps of STAD (Slavin, 1994) in order?","tw":"STAD（Slavin, 1994）的四個步驟次序是？"},"explanation":{"en":"STAD = Student Teams-Achievement Divisions. Test is INDIVIDUAL; team score is built from each member's IMPROVEMENT (test − base score).\nTrap: option 3 is Jigsaw.","tw":"STAD = 學生小組成就區分法。測驗是「個人」的；小組分數由每位成員的「進步分」（測驗分 − 基本分）組成。\n陷阱：第三個選項是拼圖法。"},"source":"PDF2 p.55","options":[{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"},{"en":"Team study → Teach → Team recognition → Test","tw":"小組學習 → 講授 → 小組表揚 → 測驗"},{"en":"Teach → Expert group → Home group → Quiz","tw":"講授 → 專家組 → 原組 → 測驗"},{"en":"Test → Teach → Team study → Team recognition","tw":"測驗 → 講授 → 小組學習 → 小組表揚"}],"answerIndex":0,"correctAnswer":{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"},"accepted":null},{"id":"T2-13","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"short","star":false,"question":{"en":"In the Jigsaw method, students from different groups who studied the SAME section meet in a(n) ___ group.","tw":"拼圖法中，來自不同小組、負責「同一部分」的學生會在 ___ 組會面。"},"explanation":{"en":"Jigsaw 5 steps: split task → expert group → return & teach home group → individual quiz → team score.","tw":"拼圖法五步：分拆任務 → 專家組討論 → 回原組教授 → 個人測驗 → 計算小組分。"},"source":"PDF2 p.58","options":null,"correctAnswer":{"en":"Expert group","tw":"專家組（expert group）"},"accepted":["expert","expert group","experts","專家組","專家"]},{"id":"T2-14","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"PIES (elements of effective groups) stands for…","tw":"PIES（有效小組的要素）代表……"},"explanation":{"en":"P = need each other (mutual goals, joint rewards, shared resources, roles). I = assess each member. E = equal share of tasks. S = leadership, decision-making, trust, communication, conflict management.","tw":"P = 彼此需要（共同目標、聯合獎勵、資源共享、角色分配）。I = 評估每位成員。E = 平均分工。S = 領導、決策、互信、溝通、衝突管理。"},"source":"PDF2 p.63","options":[{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"},{"en":"Peer tutoring, Independent work, Equal grades, Silent reading","tw":"朋輩輔導、獨立工作、相同分數、默讀"},{"en":"Positive reinforcement, Imitation, Extinction, Shaping","tw":"正增強、模仿、消退、塑形"},{"en":"Praise, Incentives, Effort, Success","tw":"讚賞、誘因、努力、成功"}],"answerIndex":0,"correctAnswer":{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"},"accepted":null},{"id":"T2-15","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"STAD scoring: Albert's base score is 75 and his test score is 85. What is his improvement score?","tw":"STAD 計分：Albert 基本分 75，測驗分 85。他的進步分是？"},"explanation":{"en":"Improvement = test − base = 85 − 75 = 10. Any member, at any level, can help the team by improving on their own past score.","tw":"進步分 = 測驗分 − 基本分 = 85 − 75 = 10。任何程度的成員只要比自己以前進步，都能為小組加分。"},"source":"PDF2 p.57","options":[{"en":"10","tw":"10"},{"en":"85","tw":"85"},{"en":"160","tw":"160"},{"en":"75","tw":"75"}],"answerIndex":0,"correctAnswer":{"en":"10","tw":"10"},"accepted":null},{"id":"T2-16","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a disadvantage of discovery learning?","tw":"以下哪項是發現式學習的缺點？"},"explanation":{"en":"Advantages: active engagement, fosters curiosity, highly motivating. Mostly used in science (experiments, field study).","tw":"優點：主動投入、培養好奇心、高度激勵。最常用於科學科（實驗、實地考察）。"},"source":"PDF2 p.73","options":[{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"},{"en":"It kills students' curiosity","tw":"扼殺學生好奇心"},{"en":"Students are never active","tw":"學生從不主動"},{"en":"It can only be used in PE lessons","tw":"只能用於體育課"}],"answerIndex":0,"correctAnswer":{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"},"accepted":null},{"id":"T2-17","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"In inter-group competition, why compare a group's present score with its OWN past score?","tw":"在分組比賽中，為何要將小組現時分數與其「自己」過去的分數比較？"},"explanation":{"en":"Competition: + cultivates cooperative spirit; − may create hostility between groups. Rewarding group improvement keeps the plus and cuts the minus.","tw":"比賽：＋培養合作精神；－可能造成組別間敵意。以小組進步作獎勵，可保留優點、減少缺點。"},"source":"PDF2 p.74","options":[{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"},{"en":"To make weaker groups feel ashamed","tw":"令較弱的組別感到羞愧"},{"en":"Because past scores are always higher","tw":"因為過去的分數總是較高"},{"en":"To stop groups from cooperating","tw":"阻止小組合作"}],"answerIndex":0,"correctAnswer":{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"},"accepted":null},{"id":"T2-18","topicNo":2,"topic":{"en":"T2 Vygotsky & Constructivism","tw":"T2 維高斯基與建構主義"},"difficulty":"easy","type":"short","star":false,"question":{"en":"Vygotsky is famous for his ___ theory of development.","tw":"維高斯基以哪個發展理論聞名？"},"explanation":{"en":"Socio = social interaction; cultural = culture gives tools and meaning. Book: \"Thought and Language\" (Russian 1934, English 1962).","tw":"社會 = 社交互動；文化 = 文化提供工具與意義。著作《Thought and Language》（1934 俄文，1962 英譯）。"},"source":"PDF2 p.5","options":null,"correctAnswer":{"en":"Sociocultural theory","tw":"社會文化理論（sociocultural theory）"},"accepted":["sociocultural","socio-cultural","sociocultural theory","socio cultural","social cultural","社會文化理論","社會文化"]},{"id":"T3-01","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"In Pavlov's experiment, the MEAT that naturally makes the dog salivate is the…","tw":"在巴甫洛夫實驗中，自然令狗流口水的「肉」是……"},"explanation":{"en":"\"Un-conditioned\" = no learning needed. Meat (US) → salivation (UR) happens naturally.","tw":"「非制約」= 不需學習。肉（US）→ 流口水（UR）是天生的。"},"source":"PDF3 p.15","options":[{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Conditioned response (CR)","tw":"制約反應（CR）"}],"answerIndex":0,"correctAnswer":{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},"accepted":null},{"id":"T3-02","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"BEFORE conditioning, the bell that causes no salivation is a…","tw":"制約「之前」，不會令狗流口水的鈴聲是……"},"explanation":{"en":"Steps: 0) US → UR; 1) NS → no response; 2) NS + US → UR; 3) CS → CR. The bell starts as NS and becomes the CS.","tw":"步驟：0) US → UR；1) NS → 無反應；2) NS + US → UR；3) CS → CR。鈴聲起初是 NS，之後變成 CS。"},"source":"PDF3 p.15","options":[{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"}],"answerIndex":0,"correctAnswer":{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},"accepted":null},{"id":"T3-03","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"AFTER conditioning, the dog salivates to the bell alone. This salivation is the…","tw":"制約「之後」，狗只聽到鈴聲就流口水。這流口水是……"},"explanation":{"en":"Same behaviour (salivation), different name: to MEAT it is the UR (natural); to the BELL it is the CR (learned).\nTrap: name depends on what triggers it.","tw":"同一個行為（流口水），名稱不同：對「肉」是 UR（天生）；對「鈴聲」是 CR（習得）。\n陷阱：名稱取決於由甚麼引發。"},"source":"PDF3 p.15","options":[{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},"accepted":null},{"id":"T3-04","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"short","star":false,"question":{"en":"A teacher always raises his hand while asking for quiet. Later, students stop talking when they just see the raised hand. The raised hand is now the ___ (term or abbreviation).","tw":"老師每次要求安靜時都舉手。之後學生一看到老師舉手就停止說話。舉手現在是 ___（術語或縮寫）。"},"explanation":{"en":"Raised hand: NS → paired with \"keep quiet\" (US) → becomes CS → students stop talking (CR).","tw":"舉手：NS → 與「要求安靜」（US）配對 → 變成 CS → 學生停止說話（CR）。"},"source":"PDF3 p.26","options":null,"correctAnswer":{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},"accepted":["cs","conditioned stimulus","conditioned stimuli","制約刺激"]},{"id":"T3-05","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which of these can NOT be a conditioned response in classical conditioning?","tw":"以下哪項「不能」成為古典制約的制約反應？"},"explanation":{"en":"Classical conditioning links INVOLUNTARY responses (emotions, reflexes). Doing homework is voluntary → that belongs to operant conditioning.","tw":"古典制約連結的是「非自願」反應（情緒、反射）。做功課是自願行為 → 屬操作性制約。"},"source":"PDF3 p.16","options":[{"en":"Doing homework","tw":"做功課"},{"en":"Feeling fear","tw":"感到害怕"},{"en":"Salivating","tw":"流口水"},{"en":"Feeling happy","tw":"感到愉快"}],"answerIndex":0,"correctAnswer":{"en":"Doing homework","tw":"做功課"},"accepted":null},{"id":"T3-06","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Pavlov won the Nobel Prize in 1904 for…","tw":"巴甫洛夫在 1904 年獲諾貝爾獎，是哪個範疇？"},"explanation":{"en":"Trap: NOT for psychology! He was a Russian physiologist studying digestion, the first Russian Nobel laureate.","tw":"陷阱：「不是」心理學！他是研究消化的俄國生理學家，也是首位俄國諾貝爾獎得主。"},"source":"PDF3 p.12","options":[{"en":"Physiology or Medicine","tw":"生理學或醫學"},{"en":"Psychology","tw":"心理學"},{"en":"Chemistry","tw":"化學"},{"en":"Peace","tw":"和平"}],"answerIndex":0,"correctAnswer":{"en":"Physiology or Medicine","tw":"生理學或醫學"},"accepted":null},{"id":"T3-07","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"short","star":false,"question":{"en":"Who is called the founder of behaviourism and ran the \"Little Albert\" experiment? (surname)","tw":"誰被稱為行為主義創始人，並進行了「小艾伯特」實驗？（姓氏）"},"explanation":{"en":"Watson showed EMOTIONS (fear) can be classically conditioned → conditioned emotional response.","tw":"華生證明「情緒」（恐懼）也能被古典制約 → 制約情緒反應。"},"source":"PDF3 p.30","options":null,"correctAnswer":{"en":"John B. Watson","tw":"華生（John B. Watson）"},"accepted":["watson","john watson","john b watson","j b watson","jb watson","華生","屈臣"]},{"id":"T3-08","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student who fears Mathematics now also fears Physics. This is…","tw":"一名怕數學的學生，現在連物理也怕。這是……"},"explanation":{"en":"Generalization = responding to stimuli SIMILAR to the CS (spreads out). Discrimination = telling them apart. Extinction = CR fades.","tw":"泛化 = 對「類似」CS 的刺激也有反應（擴散）。辨別 = 能分辨不同刺激。消退 = CR 逐漸消失。"},"source":"PDF3 p.38","options":[{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Shaping","tw":"塑形（shaping）"}],"answerIndex":0,"correctAnswer":{"en":"Generalization","tw":"泛化（generalization）"},"accepted":null},{"id":"T3-09","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student fears Maths and Physics but NOT Accounting. This is…","tw":"學生怕數學和物理，但「不」怕會計。這是……"},"explanation":{"en":"Discrimination = the ability to tell different classes of stimuli apart, so the CR appears for some but not others.","tw":"辨別 = 能區分不同種類的刺激，所以只對部分刺激產生 CR。"},"source":"PDF3 p.12","options":[{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Spontaneous reinforcement","tw":"自發強化"}],"answerIndex":0,"correctAnswer":{"en":"Discrimination","tw":"差異／辨別（discrimination）"},"accepted":null},{"id":"T3-10","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student repeatedly passes Maths tests and the fear of Maths disappears. This is…","tw":"學生多次通過數學測驗，對數學的恐懼消失了。這是……"},"explanation":{"en":"Extinction = CR weakens when the CS (Maths) keeps appearing WITHOUT the US (failure/pain). Like a dog that hears the bell but gets no food.","tw":"消退 = CS（數學）一再出現但「沒有」US（失敗／痛苦）→ CR 減弱。就像狗聽到鈴聲卻沒有食物。"},"source":"PDF3 p.38","options":[{"en":"Extinction","tw":"消退（extinction）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Extinction","tw":"消退（extinction）"},"accepted":null},{"id":"T3-11","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Using classical conditioning, why is giving writing assignments as punishment unwise?","tw":"以古典制約解釋，為何以寫作作懲罰並不明智？"},"explanation":{"en":"Writing (NS) + punishment (US → bad feeling UR) → writing becomes CS → negative feeling (CR) and avoidance of writing. Same as the shaming Maths teacher example.","tw":"寫作（NS）＋懲罰（US → 負面感受 UR）→ 寫作變成 CS → 負面感受（CR），學生逃避寫作。與羞辱學生的數學老師例子相同。"},"source":"PDF3 p.41","options":[{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"},{"en":"Writing is a voluntary behaviour, so it cannot be conditioned","tw":"寫作是自願行為，所以不能被制約"},{"en":"Writing becomes a primary reinforcer","tw":"寫作會變成主要強化物"},{"en":"Punishment always leads to extinction of writing skills","tw":"懲罰一定導致寫作技能消退"}],"answerIndex":0,"correctAnswer":{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"},"accepted":null},{"id":"T3-12","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"In classical conditioning, the neutral stimulus is usually presented ___ the unconditioned stimulus.","tw":"古典制約中，中性刺激通常在非制約刺激 ___ 出現。"},"explanation":{"en":"Bell (NS) FIRST, then meat (US). Classical = antecedent (comes before); operant = consequence (comes after).","tw":"先鈴聲（NS），後肉（US）。古典制約 = 前因（在行為前）；操作性制約 = 後果（在行為後）。"},"source":"PDF3 p.16","options":[{"en":"before","tw":"之前"},{"en":"after","tw":"之後"},{"en":"instead of","tw":"取代"},{"en":"long after","tw":"很久之後"}],"answerIndex":0,"correctAnswer":{"en":"before","tw":"之前"},"accepted":null},{"id":"T3-13","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Behaviourism focuses on…","tw":"行為主義著重於……"},"explanation":{"en":"Behaviourists ignore what can't be directly observed. Bandura later \"opened the black box\" by adding cognition.","tw":"行為主義忽略不能直接觀察的東西。後來班杜拉加入認知因素，「打開了黑盒」。"},"source":"PDF3 p.3","options":[{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"},{"en":"Thoughts and schemas inside the brain","tw":"大腦內的思想與基模"},{"en":"Dreams and the unconscious","tw":"夢境與潛意識"},{"en":"Social and cultural tools","tw":"社會及文化工具"}],"answerIndex":0,"correctAnswer":{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"},"accepted":null},{"id":"T3-14","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"hard","type":"short","star":false,"question":{"en":"The first time you eat sushi you get food poisoning; now just seeing sushi makes you feel sick. What is the US here?","tw":"第一次吃壽司就食物中毒，現在一看到壽司就不舒服。這裡的 US 是甚麼？"},"explanation":{"en":"NS = sushi; US = food poisoning; UR = feel sick; after pairing: CS = sushi → CR = feel sick (food aversion).","tw":"NS = 壽司；US = 食物中毒；UR = 不適；配對後：CS = 壽司 → CR = 不適（食物厭惡）。"},"source":"PDF3 p.22","options":null,"correctAnswer":{"en":"Food poisoning","tw":"食物中毒"},"accepted":["food poisoning","poisoning","the food poisoning","食物中毒","中毒"]},{"id":"T3-15","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"How can a teacher use classical conditioning in classroom management?","tw":"老師如何在課堂管理中運用古典制約？"},"explanation":{"en":"Goal: classroom (NS) + pleasant feelings (US) → classroom becomes a CS for happiness (like Anna, the smiling English teacher).","tw":"目標：課室（NS）＋愉快感受（US）→ 課室成為引發快樂的 CS（就像常微笑的英文老師安娜）。"},"source":"PDF3 p.40","options":[{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"},{"en":"Shame students who make mistakes so they try harder","tw":"羞辱犯錯的學生，令他們更努力"},{"en":"Give extra writing as punishment","tw":"以額外寫作作懲罰"},{"en":"Remove all rewards from lessons","tw":"取消課堂上的所有獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"},"accepted":null},{"id":"T3-16","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"Throwing a child who cannot swim into deep water \"so he learns to swim\" most likely leads to…","tw":"把不會游泳的孩子扔進深水「讓他學游泳」，最可能導致……"},"explanation":{"en":"Many irrational fears/phobias come from pairing a neutral stimulus (water) with something that triggers an involuntary fear response.","tw":"許多非理性恐懼／恐懼症，都源於中性刺激（水）與引發非自願恐懼反應的事物配對。"},"source":"PDF3 p.39","options":[{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"},{"en":"Learning to swim quickly","tw":"很快學會游泳"},{"en":"Extinction of fear","tw":"恐懼消退"},{"en":"Positive reinforcement of swimming","tw":"游泳行為得到正增強"}],"answerIndex":0,"correctAnswer":{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"},"accepted":null},{"id":"T3-17","topicNo":3,"topic":{"en":"T3 Classical Conditioning","tw":"T3 古典制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who suggested the \"Law of Association\" about 2000 years ago?","tw":"約 2000 年前，誰提出「聯繫法則」？"},"explanation":{"en":"Our minds naturally connect events that occur in sequence – the root idea of associative learning.","tw":"大腦自然地把先後發生的事件聯繫起來 – 這是聯繫學習的根源。"},"source":"PDF3 p.10","options":[{"en":"Aristotle","tw":"亞里士多德"},{"en":"Pavlov","tw":"巴甫洛夫"},{"en":"Skinner","tw":"史金納"},{"en":"Plato","tw":"柏拉圖"}],"answerIndex":0,"correctAnswer":{"en":"Aristotle","tw":"亞里士多德"},"accepted":null},{"id":"T4-01","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"In operant conditioning, behaviour is controlled by its…","tw":"在操作性制約中，行為受甚麼控制？"},"explanation":{"en":"ABC: Antecedent → Behaviour → Consequence. Classical works on the A side; operant on the C side.","tw":"ABC：前因 → 行為 → 後果。古典制約在前因；操作性制約在後果。"},"source":"PDF4 p.5","options":[{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"},{"en":"Antecedent stimuli only","tw":"只受前因刺激"},{"en":"Reflexes","tw":"反射"},{"en":"Genes","tw":"基因"}],"answerIndex":0,"correctAnswer":{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"},"accepted":null},{"id":"T4-02","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Lawrence is often late. His teacher makes him clean all the desks after school each time. Now he is late less often. This is…","tw":"Lawrence 經常遲到，老師每次都要他放學後清潔所有桌子。現在他少了遲到。這是……"},"explanation":{"en":"Two questions: (1) behaviour ↓ → punishment; (2) something ADDED (cleaning) → positive. So positive punishment.","tw":"問兩個問題：(1) 行為減少 → 懲罰；(2)「加入」了東西（清潔）→ 正。所以是正懲罰。"},"source":"PDF4 p.16","options":[{"en":"Positive punishment","tw":"正懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Positive punishment","tw":"正懲罰"},"accepted":null},{"id":"T4-03","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Students do NOT have to do extra practice if they score more than 80 in the exam. This is…","tw":"考試超過 80 分的學生就「不用」做額外練習。這是……"},"explanation":{"en":"Studying ↑ (reinforcement) by REMOVING something unpleasant (extra practice) → negative reinforcement.","tw":"溫習行為增加（強化），方法是「移除」不愉快的事（額外練習）→ 負增強。"},"source":"PDF4 p.26","options":[{"en":"Negative reinforcement","tw":"負增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Positive punishment","tw":"正懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Negative reinforcement","tw":"負增強"},"accepted":null},{"id":"T4-04","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Recess is taken away after a noisy class. This is…","tw":"課堂吵鬧後取消小息。這是……"},"explanation":{"en":"Noise ↓ (punishment) by REMOVING something liked (recess) → negative punishment.","tw":"吵鬧減少（懲罰），方法是「移除」喜愛的東西（小息）→ 負懲罰。"},"source":"PDF4 p.22","options":[{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Extinction","tw":"消退"}],"answerIndex":0,"correctAnswer":{"en":"Negative punishment","tw":"負懲罰"},"accepted":null},{"id":"T4-05","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"A teacher gives a candy whenever a student attempts to answer a question. This is…","tw":"學生每次嘗試答問題，老師就給糖果。這是……"},"explanation":{"en":"Answering ↑ by ADDING something pleasant → positive reinforcement. Discipline based mostly on positive reinforcement is usually very effective.","tw":"答問題增加，方法是「給予」愉快的東西 → 正增強。主要依賴正增強的紀律通常非常有效。"},"source":"PDF4 p.25","options":[{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Classical conditioning","tw":"古典制約"}],"answerIndex":0,"correctAnswer":{"en":"Positive reinforcement","tw":"正增強"},"accepted":null},{"id":"T4-06","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Common trap: \"negative reinforcement\" means…","tw":"常見陷阱：「負增強」的意思是……"},"explanation":{"en":"Reinforcement ALWAYS increases behaviour. \"Negative\" just means REMOVE (−), not \"bad\".\n• +R add nice · −R remove nasty · +P add nasty · −P remove nice","tw":"強化「永遠」是增加行為。「負」只是「移除」（−），不是「壞」。\n• 正增強：加好的 · 負增強：移走壞的 · 正懲罰：加壞的 · 負懲罰：移走好的"},"source":"PDF4 p.11","options":[{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"},{"en":"A type of punishment","tw":"一種懲罰"},{"en":"Adding something unpleasant to decrease a behaviour","tw":"加入不愉快的事物以減少行為"},{"en":"Removing something pleasant to decrease a behaviour","tw":"移除愉快的事物以減少行為"}],"answerIndex":0,"correctAnswer":{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"},"accepted":null},{"id":"T4-07","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Thorndike's law: behaviours followed by a reward are strengthened; unrewarded ones are weakened. Name the law.","tw":"桑代克的定律：有獎勵的行為會加強，沒有獎勵的會減弱。這定律叫甚麼？"},"explanation":{"en":"Thorndike (1874–1949) found it with cats in puzzle boxes. Skinner later built on it with the Principle of Reinforcement.","tw":"桑代克（1874–1949）用迷箱裡的貓發現此定律。史金納其後提出強化原理。"},"source":"PDF4 p.5","options":null,"correctAnswer":{"en":"Law of Effect","tw":"效果定律（Law of Effect）"},"accepted":["law of effect","effect law","the law of effect","效果定律","效果律"]},{"id":"T4-08","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Thorndike studied cats escaping from…","tw":"桑代克研究貓從甚麼逃出？"},"explanation":{"en":"Cat must find a way out of the puzzle box to reach food → the successful behaviour becomes stronger (Law of Effect).","tw":"貓要找方法逃出迷箱才吃到食物 → 成功的行為被加強（效果定律）。"},"source":"PDF4 p.6","options":[{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"},{"en":"Skinner boxes","tw":"史金納箱"},{"en":"A Bobo doll room","tw":"吹氣娃娃房間"},{"en":"The Three Mountains model","tw":"三山模型"}],"answerIndex":0,"correctAnswer":{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"},"accepted":null},{"id":"T4-09","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who coined the term \"operant conditioning\" and built a box with a lever that gives food?","tw":"誰創造「操作性制約」一詞，並設計了按桿得食物的箱子？"},"explanation":{"en":"Skinner (1904–1990) originally wanted to be a writer. He focused on behaviour rather than thinking/emotions.","tw":"史金納（1904–1990）原本想當作家。他關注行為，而非思考／情緒。"},"source":"PDF4 p.8","options":[{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},{"en":"Edward Thorndike","tw":"桑代克"},{"en":"Ivan Pavlov","tw":"巴甫洛夫"},{"en":"Albert Bandura","tw":"班杜拉"}],"answerIndex":0,"correctAnswer":{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},"accepted":null},{"id":"T4-10","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Money and gold stars (tokens) are examples of…","tw":"金錢和金星（代幣）屬於……"},"explanation":{"en":"Primary = satisfy biological needs (food, water). Secondary = LEARNED value through association with primary ones (money buys food).\nNote: reward or punishment depends on the receiver's perception.","tw":"主要強化物 = 滿足生理需要（食物、水）。次要強化物 = 透過與主要強化物連結而「習得」價值（錢可買食物）。\n注意：是獎是罰取決於接收者的感受。"},"source":"PDF4 p.28","options":[{"en":"Secondary reinforcers","tw":"次要強化物"},{"en":"Primary reinforcers","tw":"主要強化物"},{"en":"Unconditioned stimuli","tw":"非制約刺激"},{"en":"Negative punishments","tw":"負懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Secondary reinforcers","tw":"次要強化物"},"accepted":null},{"id":"T4-11","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"When should praise be given to strengthen Sam's answering behaviour?","tw":"應在何時稱讚 Sam，才能最有效加強他回答問題的行為？"},"explanation":{"en":"3 conditions: the reinforcer must FOLLOW the response; always & only follow it; follow IMMEDIATELY.","tw":"三個條件：強化物必須在反應「之後」；總是且只在之後；要「立即」給予。"},"source":"PDF4 p.29","options":[{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"},{"en":"Before he answers, to encourage him","tw":"在他回答前先稱讚以作鼓勵"},{"en":"At random times during the day","tw":"一天中隨機時間"},{"en":"Only at the end of the school term","tw":"只在學期末"}],"answerIndex":0,"correctAnswer":{"en":"Immediately after he answers – always and only after the behaviour","tw":"在他回答後「立即」給予 – 總是且只在行為之後"},"accepted":null},{"id":"T4-12","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"short","star":true,"question":{"en":"Rewarding behaviours that get closer and closer to a complex target behaviour is called ___.","tw":"獎勵越來越接近複雜目標行為的表現，稱為 ___。"},"explanation":{"en":"Example: game time after spelling 3, then 5, then 7, then all 10 new words. Plan the steps carefully or the wrong behaviour may be reinforced.","tw":"例子：串對 3 個字可玩遊戲，然後要 5 個、7 個，最後 10 個。步驟要周詳，否則可能強化錯誤行為。"},"source":"PDF4 p.30","options":null,"correctAnswer":{"en":"Shaping (successive approximations)","tw":"塑形（shaping）"},"accepted":["shaping","shape","successive approximation","successive approximations","塑形","塑造"]},{"id":"T4-13","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Slot machines in a casino use which reinforcement schedule?","tw":"賭場的老虎機使用哪種強化計劃？"},"explanation":{"en":"Ratio = number of responses; variable = unpredictable. People keep pulling in hope of a win → very persistent behaviour.","tw":"比率 = 按反應次數；變動 = 不可預測。人們不斷拉桿，希望下一次中獎 → 行為非常持久。"},"source":"PDF4 p.41","options":[{"en":"Variable ratio","tw":"變動比率（variable ratio）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Variable ratio","tw":"變動比率（variable ratio）"},"accepted":null},{"id":"T4-14","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"A monthly salary is an example of…","tw":"每月薪金屬於……"},"explanation":{"en":"Interval = based on TIME; fixed = predictable (paid every month).","tw":"時距 = 按「時間」；固定 = 可預測（每月出糧）。"},"source":"PDF4 p.41","options":[{"en":"Fixed interval","tw":"固定時距（fixed interval）"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Variable interval","tw":"變動時距"},{"en":"Variable ratio","tw":"變動比率"}],"answerIndex":0,"correctAnswer":{"en":"Fixed interval","tw":"固定時距（fixed interval）"},"accepted":null},{"id":"T4-15","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Sudden (pop) quizzes use which schedule?","tw":"突擊測驗屬於哪種強化計劃？"},"explanation":{"en":"Time-based but unpredictable → students study steadily because a check could come any time (also: random classwork checks).","tw":"按時間但不可預測 → 學生會穩定溫習，因為隨時可能被測（隨機檢查功課亦同）。"},"source":"PDF4 p.42","options":[{"en":"Variable interval","tw":"變動時距（variable interval）"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Fixed ratio","tw":"固定比率"},{"en":"Continuous reinforcement","tw":"連續性強化"}],"answerIndex":0,"correctAnswer":{"en":"Variable interval","tw":"變動時距（variable interval）"},"accepted":null},{"id":"T4-16","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Factory piece work (paid per item made) is an example of…","tw":"工廠計件工作（按件計酬）屬於……"},"explanation":{"en":"A set NUMBER of responses earns the reward (also: bonus for every 10 cars sold).","tw":"完成「固定次數」的行為就有獎勵（亦如每賣 10 部車有花紅）。"},"source":"PDF4 p.42","options":[{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"},{"en":"Variable ratio","tw":"變動比率"},{"en":"Fixed interval","tw":"固定時距"},{"en":"Variable interval","tw":"變動時距"}],"answerIndex":0,"correctAnswer":{"en":"Fixed ratio","tw":"固定比率（fixed ratio）"},"accepted":null},{"id":"T4-17","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is a danger of punishment listed in the slides?","tw":"以下哪項是投影片列出的懲罰的危機？"},"explanation":{"en":"Dangers: arouses emotion in both people; hard to judge severity; encourages lying; short-term → escalation. Advice: shape behaviour through reinforcement, not punishment.","tw":"危機：激起雙方情緒；難判斷輕重；鼓勵說謊；只具短期效果 → 需加重。建議：用強化而非懲罰去塑造行為。"},"source":"PDF4 p.23","options":[{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"},{"en":"It always produces long-term behaviour change","tw":"一定帶來長期行為改變"},{"en":"It never arouses emotion","tw":"從不引起情緒"},{"en":"It is easy to judge how severe it should be","tw":"很容易判斷懲罰應有多嚴重"}],"answerIndex":0,"correctAnswer":{"en":"It motivates concealment (lying) and often has only short-term effects, so punishment must escalate","tw":"鼓勵隱瞞（說謊），而且通常只有短期效果，需要不斷加重"},"accepted":null},{"id":"T4-18","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Flow (Csikszentmihalyi) happens when…","tw":"心流（Csikszentmihalyi）在甚麼情況下出現？"},"explanation":{"en":"challenge = skill → flow · challenge < skill → boredom · challenge > skill → anxiety. Flow is intrinsic: people do it even without rewards.","tw":"挑戰 = 技能 → 心流 · 挑戰 < 技能 → 無聊 · 挑戰 > 技能 → 焦慮。心流屬內在動機：沒有獎勵也願意做。"},"source":"PDF4 p.52","options":[{"en":"Challenge matches skill","tw":"挑戰 = 技能"},{"en":"Challenge is lower than skill","tw":"挑戰 < 技能"},{"en":"Challenge is higher than skill","tw":"挑戰 > 技能"},{"en":"There is no challenge at all","tw":"完全沒有挑戰"}],"answerIndex":0,"correctAnswer":{"en":"Challenge matches skill","tw":"挑戰 = 技能"},"accepted":null},{"id":"T4-19","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"hard","type":"mc","star":false,"question":{"en":"In gamification, a task's challenge should be about ___ above the person's ability.","tw":"遊戲化中，任務的挑戰應比個人能力高出約 ___。"},"explanation":{"en":"~10% harder means you must focus and try, but it is still achievable. Other steps: set clear goals, levels/milestones, instant rewards. Term coined by Nick Pelling (2002).","tw":"高約 10%，需要專注和努力，但仍做得到。其他步驟：訂定明確目標、設關卡／里程碑、即時獎勵。「遊戲化」一詞由 Nick Pelling（2002）提出。"},"source":"PDF4 p.58","options":[{"en":"10%","tw":"10%"},{"en":"50%","tw":"50%"},{"en":"0%","tw":"0%"},{"en":"100%","tw":"100%"}],"answerIndex":0,"correctAnswer":{"en":"10%","tw":"10%"},"accepted":null},{"id":"T4-20","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which comparison of classical vs operant conditioning is correct?","tw":"以下哪項古典制約與操作性制約的比較正確？"},"explanation":{"en":"Classical = learn by ASSOCIATION (NS linked to US). Operant = learn by REINFORCEMENT/PUNISHMENT (consequence linked to behaviour).","tw":"古典 = 透過「聯繫」學習（NS 連結 US）。操作 = 透過「強化／懲罰」學習（後果連結行為）。"},"source":"PDF4 p.46","options":[{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"},{"en":"Classical: voluntary behaviour, consequence after (Skinner). Operant: involuntary, stimulus first (Pavlov).","tw":"古典：自願行為，後果在後（史金納）。操作：非自願，刺激在先（巴甫洛夫）。"},{"en":"Both use reinforcement and punishment only","tw":"兩者都只用強化和懲罰"},{"en":"Both only work with animals","tw":"兩者都只適用於動物"}],"answerIndex":0,"correctAnswer":{"en":"Classical: involuntary response, stimulus comes first (Pavlov). Operant: voluntary behaviour, consequence comes after (Skinner).","tw":"古典：非自願反應，刺激在先（巴甫洛夫）。操作：自願行為，後果在後（史金納）。"},"accepted":null},{"id":"T4-21","topicNo":4,"topic":{"en":"T4 Operant Conditioning","tw":"T4 操作性制約"},"difficulty":"hard","type":"short","star":false,"question":{"en":"Csikszentmihalyi's term for total absorption in an activity, losing track of time (one word):","tw":"Csikszentmihalyi 用來形容全情投入、忘記時間的狀態（一個詞）："},"explanation":{"en":"Benefits of flow: positive emotions, better performance (flow time 5% → 15% doubled productivity), creativity, skill improvement (similar to Vygotsky's ZPD).","tw":"心流的好處：正面情緒、表現提升（心流時間 5% → 15%，生產力倍增）、創造力、推動進步（與維高斯基的 ZPD 異曲同工）。"},"source":"PDF4 p.49","options":null,"correctAnswer":{"en":"Flow","tw":"心流（flow）"},"accepted":["flow","flow state","心流"]},{"id":"T5-01","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"easy","type":"mc","star":true,"question":{"en":"Learning by observing the CONSEQUENCES of other people's behaviour is called…","tw":"透過觀察「他人行為的後果」來學習，稱為……"},"explanation":{"en":"See someone rewarded → you are more likely to do it; see someone punished → less likely. (New employee is always punctual after a colleague is fired for lateness.)","tw":"看到別人受獎 → 你更傾向做；看到別人受罰 → 減少做。（新員工見同事因遲到被解僱後，總是準時。）"},"source":"PDF5 p.6","options":[{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"},{"en":"Classical conditioning","tw":"古典制約"},{"en":"Shaping","tw":"塑形"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Vicarious learning","tw":"替代學習（vicarious learning）"},"accepted":null},{"id":"T5-02","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Bandura's Bobo doll experiment, which group of children imitated the aggressive acts LEAST?","tw":"在班杜拉的吹氣娃娃實驗中，哪一組兒童模仿攻擊行為「最少」？"},"explanation":{"en":"Model punished → far fewer imitative acts. Rewarded and no-consequence groups imitated more.","tw":"成人受罰 → 模仿少得多。受獎組和無後果組模仿較多。"},"source":"PDF5 p.18","options":[{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"},{"en":"Those who saw the model rewarded","tw":"看到成人受獎的一組"},{"en":"Those who saw no consequences","tw":"看到沒有後果的一組"},{"en":"All groups imitated equally at first","tw":"一開始各組模仿程度相同"}],"answerIndex":0,"correctAnswer":{"en":"Those who saw the model being punished","tw":"看到成人受罰的一組"},"accepted":null},{"id":"T5-03","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"When ALL Bobo doll groups were later offered incentives, all could reproduce the aggression. What does this show?","tw":"之後給「所有」吹氣娃娃組別獎勵，各組都能重現攻擊行為。這說明了甚麼？"},"explanation":{"en":"Even the punished-model group ACQUIRED the behaviour; they just chose not to perform it until it paid off.","tw":"即使看到成人受罰的一組也已「習得」該行為，只是選擇不表現，直到有獎勵才做。"},"source":"PDF5 p.25","options":[{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"},{"en":"Punishment stops learning completely","tw":"懲罰會完全阻止學習"},{"en":"Children only learn when directly reinforced","tw":"兒童只在直接受強化時才學習"},{"en":"Aggression is inborn, not learned","tw":"攻擊行為是天生，不是學來的"}],"answerIndex":0,"correctAnswer":{"en":"Acquisition ≠ performance: behaviour can be learned but not shown","tw":"習得 ≠ 表現：行為可以學會了但不表現出來"},"accepted":null},{"id":"T5-04","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"What are the four processes of observational learning, in order?","tw":"觀察學習的四個過程，正確次序是？"},"explanation":{"en":"Mnemonic: \"**A R**eal **R**ole **M**odel\" = A-R-R-M. Cake example: watch teacher bake → remember steps → bake yourself → friends admire your cakes.","tw":"記法：「看 → 記 → 做 → 想做」。焗蛋糕例子：留心看老師示範 → 記住步驟 → 自己焗 → 朋友讚賞令你想做。"},"source":"PDF5 p.34","options":[{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"},{"en":"Motivation → Attention → Reproduction → Retention","tw":"動機 → 注意 → 再生 → 保存"},{"en":"Encoding → Storage → Retrieval → Motivation","tw":"編碼 → 儲存 → 提取 → 動機"},{"en":"Retention → Attention → Motivation → Reproduction","tw":"保存 → 注意 → 動機 → 再生"}],"answerIndex":0,"correctAnswer":{"en":"Attention → Retention → Reproduction → Motivation","tw":"注意 → 保存（記憶）→ 再生（模仿）→ 動機"},"accepted":null},{"id":"T5-05","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Remembering the steps of baking a cake you watched in a cooking session is which process?","tw":"記住在烹飪課看到的焗蛋糕步驟，屬於哪個過程？"},"explanation":{"en":"Retention = keeping the observed information in memory. Teaching tip: teach good study and memory skills.","tw":"保存 = 把觀察到的資訊記在腦中。教學提示：教授良好的學習和記憶技巧。"},"source":"PDF5 p.34","options":[{"en":"Retention","tw":"保存（retention / 記憶）"},{"en":"Attention","tw":"注意（attention）"},{"en":"Reproduction","tw":"再生（reproduction）"},{"en":"Motivation","tw":"動機（motivation）"}],"answerIndex":0,"correctAnswer":{"en":"Retention","tw":"保存（retention / 記憶）"},"accepted":null},{"id":"T5-06","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"A character in a book, film, TV show or game is a ___ model.","tw":"書籍、電影、電視或遊戲中的角色屬於 ___ 楷模。"},"explanation":{"en":"Live = a real person demonstrating · Symbolic = portrayed in media · Verbal instructional = description of how to behave only.","tw":"真人 = 真人示範 · 象徵 = 媒體中描繪的人物 · 言語指導 = 只描述如何表現。"},"source":"PDF5 p.10","options":[{"en":"Symbolic","tw":"象徵性（symbolic）"},{"en":"Live","tw":"真人（live）"},{"en":"Verbal instructional","tw":"言語指導（verbal instructional）"},{"en":"Primary","tw":"主要（primary）"}],"answerIndex":0,"correctAnswer":{"en":"Symbolic","tw":"象徵性（symbolic）"},"accepted":null},{"id":"T5-07","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"For a LOW-achieving student, which model will most likely boost confidence in an academic task?","tw":"對「成績較差」的學生，哪個楷模最能提升他完成學術任務的信心？"},"explanation":{"en":"Effective models: high perceived SIMILARITY, high competence (use A-grade papers), prestige & power (teen idols). Similarity → \"If they can, I can.\"","tw":"有效楷模：相似度高、能力高（參考 A 級作業）、具威望權力（偶像）。相似 →「他做得到，我也可以。」"},"source":"PDF5 p.12","options":[{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"},{"en":"A famous professor","tw":"一位著名教授"},{"en":"A cartoon character with no link to school","tw":"一個與學校無關的卡通角色"},{"en":"Nobody – models do not affect confidence","tw":"沒有 – 楷模不影響信心"}],"answerIndex":0,"correctAnswer":{"en":"Another low-achieving student who succeeded at the task","tw":"另一位成功完成任務的成績較差學生"},"accepted":null},{"id":"T5-08","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"hard","type":"mc","star":true,"question":{"en":"Why does IGNORING a student's aggressive behaviour act like reinforcing it?","tw":"為何「忽視」學生的攻擊行為，會有鼓勵它的效果？"},"explanation":{"en":"Expectations matter: a missing expected punishment = reinforcing; a missing expected reward (no bonus) = punishing. Others watching also learn it is OK.","tw":"預期很重要：預期的懲罰沒出現 = 強化；預期的獎勵落空（沒有花紅）= 懲罰。旁觀的學生也會學到這樣做沒問題。"},"source":"PDF5 p.22","options":[{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"},{"en":"Ignoring is a form of positive punishment","tw":"忽視是一種正懲罰"},{"en":"Aggression is a classically conditioned reflex","tw":"攻擊是古典制約的反射"},{"en":"Ignoring always leads to extinction","tw":"忽視一定導致消退"}],"answerIndex":0,"correctAnswer":{"en":"The non-occurrence of an expected punishment acts as a reinforcer","tw":"預期的懲罰沒有出現，本身就起了強化作用"},"accepted":null},{"id":"T5-09","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"You expect a bonus for beating your sales target, but get nothing. According to social learning theory this feels like…","tw":"你預期超額完成銷售目標會有花紅，結果甚麼都沒有。根據社會學習理論，這感覺像……"},"explanation":{"en":"The non-occurrence of an expected consequence is a consequence in itself, often with strong negative emotions.","tw":"預期的結果沒有發生，本身就是一個後果，並常伴隨強烈負面情緒。"},"source":"PDF5 p.22","options":[{"en":"A punishment","tw":"一種懲罰"},{"en":"A reinforcement","tw":"一種強化"},{"en":"Extinction of a reflex","tw":"反射消退"},{"en":"Nothing – no consequence occurred","tw":"沒有影響 – 根本沒有後果"}],"answerIndex":0,"correctAnswer":{"en":"A punishment","tw":"一種懲罰"},"accepted":null},{"id":"T5-10","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"short","star":true,"question":{"en":"A specific belief about how well YOU can perform a particular task is called ___.","tw":"對「自己」能把某項任務做得多好的具體信念，稱為 ___。"},"explanation":{"en":"\"How well can I do such-and-such?\" High self-efficacy → choose the activity, set higher goals, more effort & persistence, better learning. Trap: unrealistically high can be harmful.","tw":"「我能把這件事做得多好？」效能感高 → 選擇參與、定較高目標、更努力堅持、學得更好。陷阱：不切實際地高可能有害。"},"source":"PDF5 p.39","options":null,"correctAnswer":{"en":"Self-efficacy","tw":"自我效能感（self-efficacy）"},"accepted":["self-efficacy","self efficacy","selfefficacy","efficacy","self-efficiency","自我效能感","自我效能","效能感"]},{"id":"T5-11","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which is NOT one of the four sources of self-efficacy?","tw":"以下哪項「不是」自我效能感的四個來源？"},"explanation":{"en":"4 sources: Mastery experience · Vicarious experience · Social persuasion · Physiological status. Mnemonic \"**M**y **V**ery **S**mart **P**al\".","tw":"四來源：過往成功經驗 · 替代經驗 · 社會說服 · 身心狀態。記法：「做過、看過、聽過、感覺」。"},"source":"PDF5 p.41","options":[{"en":"Fixed-interval reinforcement","tw":"固定時距強化"},{"en":"Mastery experience","tw":"過往成功經驗（mastery experience）"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"言語／朋輩說服"}],"answerIndex":0,"correctAnswer":{"en":"Fixed-interval reinforcement","tw":"固定時距強化"},"accepted":null},{"id":"T5-12","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"medium","type":"mc","star":false,"question":{"en":"Feeling very anxious before a test lowers your self-efficacy. Which source is this?","tw":"考試前非常焦慮，令自我效能感下降。這屬哪個來源？"},"explanation":{"en":"Anxiety and stress lower self-efficacy. Calm body → \"I can do this.\"","tw":"焦慮和壓力會降低自我效能感。身心平靜 →「我做得到」。"},"source":"PDF5 p.41","options":[{"en":"Physiological status","tw":"身心狀態（physiological status）"},{"en":"Mastery experience","tw":"過往成功經驗"},{"en":"Vicarious experience","tw":"替代經驗"},{"en":"Social persuasion","tw":"社會說服"}],"answerIndex":0,"correctAnswer":{"en":"Physiological status","tw":"身心狀態（physiological status）"},"accepted":null},{"id":"T5-13","topicNo":5,"topic":{"en":"T5 Social Learning Theory","tw":"T5 社會學習理論"},"difficulty":"easy","type":"mc","star":false,"question":{"en":"Bandura's soc
