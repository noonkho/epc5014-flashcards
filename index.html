x":0,"correctAnswer":{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"}},{"id":"T2-17","topicNo":2,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In inter-group competition, why compare a group's present score with its OWN past score?","tw":"在分組比賽中，為何要將小組現時分數與其「自己」過去的分數比較？"},"explanation":{"en":"**Slides say:** Inter-group competition builds cooperative spirit but may create inter-group hostility. Better: compare each group's present score with its past score and reward group improvement.\n**In simple words:** If groups only fight to beat each other, they start disliking each other. If each group tries to beat its OWN last score, they still work hard without fighting. Like chasing your personal best in sport.\n**Remember:** reward improvement, not winning.","tw":"**投影片：**分組比賽可培養合作精神，但可能造成組別間敵意。較好的做法：把小組現時分數與過去分數比較，按進步給獎。\n**簡單來說：**如果各組只想打敗對方，就會互相討厭；如果各組挑戰自己上次的分數，大家仍會努力，又不會敵對。就像運動員挑戰個人最佳成績。\n**記住：**獎勵進步，不是獎勵勝出。"},"source":"PDF2 p.74","options":[{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"},{"en":"To make weaker groups feel ashamed","tw":"令較弱的組別感到羞愧"},{"en":"Because past scores are always higher","tw":"因為過去的分數總是較高"},{"en":"To stop groups from cooperating","tw":"阻止小組合作"}],"answerIndex":0,"correctAnswer":{"en":"To reward improvement and reduce inter-group hostility","tw":"獎勵進步，減少組別間的敵意"}},{"id":"T2-18","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Vygotsky is famous for his…","tw":"維高斯基以哪個理論聞名？"},"explanation":{"en":"**Slides say:** Vygotsky is famous for his Sociocultural Theory of Development.\n**In simple words:** Socio = people around you; cultural = the tools and ideas your culture gives you (language, numbers). We grow by learning through both.\n**Trap:** social COGNITIVE theory = Bandura (T5). Self-determination theory = Deci & Ryan (T8).","tw":"**投影片：**維高斯基以「社會文化發展理論」聞名。\n**簡單來說：**社會 = 身邊的人；文化 = 文化給我們的工具和概念（語言、數字）。我們透過兩者成長。\n**陷阱：**社會「認知」理論 = 班杜拉（T5）；自我決定理論 = Deci & Ryan（T8）。"},"source":"PDF2 p.5","options":[{"en":"Sociocultural theory of development","tw":"社會文化發展理論"},{"en":"Social cognitive theory","tw":"社會認知理論"},{"en":"Self-determination theory","tw":"自我決定理論"},{"en":"Attribution theory","tw":"歸因理論"}],"answerIndex":0,"correctAnswer":{"en":"Sociocultural theory of development","tw":"社會文化發展理論"},"photo":"vygotsky"},{"id":"T2-19","topicNo":2,"difficulty":"medium","type":"order","star":true,"question":{"en":"Put the five steps of the Jigsaw method in order.","tw":"把拼圖式合作學習法的五個步驟排成正確次序。"},"explanation":{"en":"**Slides say:** Jigsaw has five steps: (1) the task is divided into sections, one per member; (2) members with the same section meet in an expert group; (3) experts return and teach their home group; (4) each member takes an individual quiz; (5) team scores are computed from members' scores.\n**In simple words:** Everyone holds one puzzle piece, so the team needs everyone to finish the picture.\n**Remember:** split → experts → teach → quiz → score.","tw":"**投影片：**拼圖法五步：(1) 任務分成不同部分，每人負責一部分；(2) 負責同一部分的成員在專家組會面；(3) 專家回原組教授；(4) 每人參加個人測驗；(5) 按成員分數計算小組分。\n**簡單來說：**每人手上一塊拼圖，小組需要每個人才能完成整幅圖。\n**記住：**分拆 → 專家 → 教授 → 測驗 → 計分。"},"source":"PDF2 p.58","tiles":{"en":["Split the task into sections","Same-section students meet in expert groups","Experts teach their home group","Everyone takes an individual quiz","Team score from members' scores"],"tw":["把任務分成不同部分","同一部分的學生在專家組會面","專家回原組教授","每人參加個人測驗","按成員分數計算小組分"]},"answerLen":{"en":5,"tw":5},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Split the task into sections → Same-section students meet in expert groups → Experts teach their home group → Everyone takes an individual quiz → Team score from members' scores","tw":"把任務分成不同部分 → 同一部分的學生在專家組會面 → 專家回原組教授 → 每人參加個人測驗 → 按成員分數計算小組分"}},{"id":"T2-20","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"According to Vygotsky, learning requires…","tw":"根據維高斯基，學習需要……"},"explanation":{"en":"**Slides say:** Learning requires (1) social interaction, (2) cognitive tools (concepts, symbolic knowledge such as language), (3) a cultural context to give knowledge meaning.\n**In simple words:** People + tools + culture. Example: a grandma (people) teaches a child to count (number system = tool) using mahjong tiles (culture).\n**Trap:** attention → motivation are Bandura's 4 processes (T5).","tw":"**投影片：**學習需要 (1) 社交互動；(2) 認知工具（概念、符號知識如語言）；(3) 賦予知識意義的文化背景。\n**簡單來說：**人 + 工具 + 文化。例：嫲嫲（人）用麻將牌（文化）教孫兒數數（數字系統 = 工具）。\n**陷阱：**注意 → 動機是班杜拉的四個過程（T5）。"},"source":"PDF2 p.7","options":[{"en":"Social interaction, cognitive tools (e.g. language) and a cultural context","tw":"社交互動、認知工具（例如語言）和文化背景"},{"en":"Rewards, punishments and a Skinner box","tw":"獎勵、懲罰和史金納箱"},{"en":"Only biological maturation","tw":"只需要生理成熟"},{"en":"Attention, retention, reproduction and motivation","tw":"注意、保存、再生和動機"}],"answerIndex":0,"correctAnswer":{"en":"Social interaction, cognitive tools (e.g. language) and a cultural context","tw":"社交互動、認知工具（例如語言）和文化背景"}},{"id":"T2-21","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The upper limit of tasks a child can perform WITH the help of a more competent person is the child's…","tw":"兒童在能力較高者「協助下」可完成的任務上限，稱為……"},"explanation":{"en":"**Slides say:** Actual developmental level = upper limit of tasks a child can do INDEPENDENTLY. Level of potential development = upper limit of tasks they can do WITH the assistance of a more competent individual.\n**In simple words:** Actual = what I can do alone today. Potential = what I can do with a helper. The gap between them is the ZPD.\n**Remember:** actual (alone) → ZPD → potential (with help).","tw":"**投影片：**實際發展程度 = 可「獨自」完成的任務上限；潛在發展水平 = 在能力較高者「協助下」可完成的任務上限。\n**簡單來說：**實際 = 今天我自己做到的；潛在 = 有人幫我就做到的；兩者之間的差距就是 ZPD。\n**記住：**實際（獨自）→ ZPD → 潛在（有協助）。"},"source":"PDF2 p.9","options":[{"en":"Level of potential development","tw":"潛在發展水平"},{"en":"Actual developmental level","tw":"實際發展程度"},{"en":"Readiness","tw":"準備就緒"},{"en":"Equilibrium","tw":"平衡"}],"answerIndex":0,"correctAnswer":{"en":"Level of potential development","tw":"潛在發展水平"},"fig":"zpd"},{"id":"T2-22","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Why does Vygotsky's view value children's role play?","tw":"為何維高斯基的觀點重視兒童的角色扮演？"},"explanation":{"en":"**Slides say:** Role plays allow children a chance to \"rehearse\" what is happening in adults' world (cultural context).\n**In simple words:** Playing \"shop\" or \"doctor\" lets kids practise real-life culture: paying money, saying \"please\", caring for someone.\n**Remember:** culture is learned by doing it together – even in pretend.","tw":"**投影片：**角色扮演讓孩子有機會「排練」成人世界中正在發生的事（文化背景）。\n**簡單來說：**玩「買賣」或「醫生」遊戲，讓孩子練習真實生活的文化：付錢、說「唔該」、照顧別人。\n**記住：**文化是一起「做」出來學會的 – 扮演也算。"},"source":"PDF2 p.14","options":[{"en":"It lets children \"rehearse\" what happens in the adult world","tw":"讓兒童「排練」成人世界中發生的事"},{"en":"It removes the need for language","tw":"令兒童不再需要語言"},{"en":"It is a form of negative reinforcement","tw":"它是一種負增強"},{"en":"It keeps children in the sensorimotor stage","tw":"令兒童停留在感覺運動期"}],"answerIndex":0,"correctAnswer":{"en":"It lets children \"rehearse\" what happens in the adult world","tw":"讓兒童「排練」成人世界中發生的事"}},{"id":"T2-23","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a benefit of scaffolding stated in the slides?","tw":"以下哪項是投影片所述搭鷹架的好處？"},"explanation":{"en":"**Slides say:** Scaffolding allows the learner to put aside the more complicated part of the learning process and focus on a particular aspect at a time; it reduces the chance that the learner gets frustrated.\n**In simple words:** Learning to swim: first just kick while holding the board, then add arms later. One piece at a time = less frustration.\n**Trap:** help should FADE, not stay forever.","tw":"**投影片：**搭鷹架讓學習者暫時放下學習中較複雜的部分，一次專注某一方面，並減少學習者感到沮喪的機會。\n**簡單來說：**學游泳：先抱著浮板只練踢腳，之後才加手。一次學一部分 = 少些挫敗。\n**陷阱：**協助要逐步「撤出」，不是永遠不變。"},"source":"PDF2 p.23","options":[{"en":"It lets learners put aside complicated parts and focus on one aspect at a time, reducing frustration","tw":"讓學習者先放下複雜部分、一次專注一方面，減少挫敗感"},{"en":"It removes the need for the learner to think","tw":"令學習者不用思考"},{"en":"It keeps the same level of help forever","tw":"永遠保持同樣的協助程度"},{"en":"It makes every task too easy","tw":"令所有任務變得太容易"}],"answerIndex":0,"correctAnswer":{"en":"It lets learners put aside complicated parts and focus on one aspect at a time, reducing frustration","tw":"讓學習者先放下複雜部分、一次專注一方面，減少挫敗感"}},{"id":"T2-24","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"An art teacher draws an apple in front of the class before asking students to draw their own. Which type of scaffolding?","tw":"美術老師先在全班面前畫一個蘋果，再讓學生自己畫。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Modeling – an art teacher demonstrates drawing an apple before asking students to make their own drawing.\n**In simple words:** Modeling = SHOW first, then the student tries.\n**Trap:** think-aloud = SAY your thinking out loud (the physics teacher).","tw":"**投影片：**示範 – 美術老師先示範畫蘋果，再讓學生自己畫。\n**簡單來說：**示範 = 先「做」給你看，再讓你試。\n**陷阱：**出聲思考 =「講」出思考過程（物理老師）。"},"source":"PDF2 p.28","options":[{"en":"Modeling","tw":"示範（modeling）"},{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Prompts and cues","tw":"提示（prompts and cues）"},{"en":"Questions","tw":"提問（questions）"}],"answerIndex":0,"correctAnswer":{"en":"Modeling","tw":"示範（modeling）"}},{"id":"T2-25","topicNo":2,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Preschoolers learning to tie their shoes are told, \"The bunny goes around the hole and then jumps into it.\" Which type of scaffolding?","tw":"教幼兒綁鞋帶時說：「兔子繞過洞，然後跳進去。」這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Prompts and cues – preschoolers learning to tie their shoes are taught that \"the bunny goes around the hole and then jumps into it\".\n**In simple words:** A short catchy hint helps you remember the next step – like a mnemonic.\n**Remember:** the 5 types are modeling, think-aloud, questions, adapting materials, and prompts & cues.","tw":"**投影片：**提示 – 教幼兒綁鞋帶時說「兔子繞過洞，然後跳進去」。\n**簡單來說：**一句易記的小提示幫你記住下一步 – 就像記憶口訣。\n**記住：**五類：示範、出聲思考、提問、調節教學內容、提示。"},"source":"PDF2 p.28","options":[{"en":"Prompts and cues","tw":"提示（prompts and cues）"},{"en":"Adapting instructional materials","tw":"調節教學內容"},{"en":"Modeling","tw":"示範"},{"en":"Think-aloud","tw":"出聲思考"}],"answerIndex":0,"correctAnswer":{"en":"Prompts and cues","tw":"提示（prompts and cues）"}},{"id":"T2-26","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A maths teacher \"walks\" students through several problems, asking questions at critical points. Which type of scaffolding?","tw":"數學老師帶領學生做幾道題，在關鍵處提問。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Questions – a mathematics teacher \"walks\" students through several problems, asking questions at critical junctures.\n**In simple words:** The teacher doesn't give the answer; they ask \"What should we find first?\" at the tricky step, so the student does the thinking.\n**Remember:** questions = guiding by asking.","tw":"**投影片：**提問 – 數學老師帶領學生做幾道題，在關鍵時刻提問。\n**簡單來說：**老師不直接給答案，而在難點問「我們先要找甚麼？」，讓學生自己思考。\n**記住：**提問 = 用問題引導。"},"source":"PDF2 p.28","options":[{"en":"Questions","tw":"提問（questions）"},{"en":"Modeling","tw":"示範"},{"en":"Adapting instructional materials","tw":"調節教學內容"},{"en":"Prompts and cues","tw":"提示"}],"answerIndex":0,"correctAnswer":{"en":"Questions","tw":"提問（questions）"}},{"id":"T2-27","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Don't conclude that your students understand an idea because you explained it to them\" (Eggen & Kauchak). What should a constructivist teacher do?","tw":"「不要因為你解釋過某個想法，就認為學生明白」（Eggen & Kauchak）。建構主義老師應怎樣做？"},"explanation":{"en":"**Slides say:** \"Wisdom can't be told.\" Be sceptical about verbal explanations – not that you should never use them, but double-check whether students have understood. Assess student learning to promote it.\n**In simple words:** Explaining is not the same as students understanding. Ask them to explain it back or try an example.\n**Trap:** \"never explain\" goes too far.","tw":"**投影片：**「智慧不能被告知。」對口頭解釋持懷疑態度 – 不是永不解釋，而是要仔細檢查學生是否真的明白；用評估促進學習。\n**簡單來說：**你講解了，不等於學生明白。請他們用自己的話解釋或試做一題。\n**陷阱：**「完全不解釋」就太極端了。"},"source":"PDF2 p.46","options":[{"en":"Be sceptical about verbal explanations and double-check that students have understood","tw":"對口頭解釋持懷疑態度，並再三檢查學生是否真的明白"},{"en":"Never explain anything at all","tw":"完全不作任何解釋"},{"en":"Repeat the same explanation louder","tw":"大聲重複同一個解釋"},{"en":"Assume silence means understanding","tw":"學生沉默就當作明白"}],"answerIndex":0,"correctAnswer":{"en":"Be sceptical about verbal explanations and double-check that students have understood","tw":"對口頭解釋持懷疑態度，並再三檢查學生是否真的明白"}},{"id":"T2-28","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is an ADVANTAGE of problem-based learning (PBL)?","tw":"以下哪項是問題導向學習（PBL）的「優點」？"},"explanation":{"en":"**Slides say:** Advantages of PBL: student-centred approach; encourages greater understanding; develops lifelong learning skills. Disadvantages: prior learning may not prepare students well; needs more time and preparation; group dynamics issues can reduce effectiveness.\n**In simple words:** Solving real problems teaches you how to learn by yourself – a skill for life.\n**Trap:** \"less time\" is wrong – PBL takes MORE time.","tw":"**投影片：**PBL 的優點：以學生為中心；鼓勵深入理解；培養終身學習技能。缺點：先前的學習未必足以應付；需要更多時間和準備；小組互動問題可能影響成效。\n**簡單來說：**解決真實問題，令你學會自己學習 – 是一生受用的技能。\n**陷阱：**「時間較少」是錯的 – PBL 需要「更多」時間。"},"source":"PDF2 p.52","options":[{"en":"It develops lifelong learning skills","tw":"培養終身學習技能"},{"en":"It needs less time and preparation","tw":"需要較少時間和準備"},{"en":"Group dynamics never cause problems","tw":"小組互動從不出問題"},{"en":"Students only need to memorise standard answers","tw":"學生只需背誦標準答案"}],"answerIndex":0,"correctAnswer":{"en":"It develops lifelong learning skills","tw":"培養終身學習技能"}},{"id":"T2-29","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a DISADVANTAGE of problem-based learning (PBL)?","tw":"以下哪項是問題導向學習（PBL）的「缺點」？"},"explanation":{"en":"**Slides say:** PBL disadvantages: prior learning experiences do not prepare students well; PBL requires more time and preparation; group dynamics issues sometimes compromise its effectiveness.\n**In simple words:** Real messy problems are slow to solve and plan, and groups don't always work well together.\n**Trap:** PBL is STUDENT-centred and uses ILL-structured problems.","tw":"**投影片：**PBL 缺點：先前的學習經驗未必足夠；需要更多時間和準備；小組互動問題有時會影響成效。\n**簡單來說：**真實又複雜的問題需要很多時間計劃和解決，而小組合作也不一定順利。\n**陷阱：**PBL 是「以學生為中心」，用「結構不良」的問題。"},"source":"PDF2 p.53","options":[{"en":"It requires more time and preparation","tw":"需要更多時間和準備"},{"en":"It is teacher-centred","tw":"以老師為中心"},{"en":"It discourages deep understanding","tw":"妨礙深入理解"},{"en":"It uses only well-structured problems","tw":"只用結構清晰的問題"}],"answerIndex":0,"correctAnswer":{"en":"It requires more time and preparation","tw":"需要更多時間和準備"}},{"id":"T2-30","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"In cooperative learning, groups are usually…","tw":"合作學習中，小組通常是……"},"explanation":{"en":"**Slides say:** Cooperative learning often uses four-member, mixed-ability groups. Students must be taught group-work skills (active listening, good explanations, no insults, being inclusive), and individual assessment makes sure each person learns.\n**In simple words:** Mix stronger and weaker students so they can help each other – like Vygotsky's \"more knowledgeable other\".\n**Remember:** 4 people, mixed ability, teach the skills, check each person.","tw":"**投影片：**合作學習通常安排四人混合能力小組；要教授合作技巧（積極聆聽、清楚講解、不互相侮辱、互相包容）；個人評估確保每人都在學習。\n**簡單來說：**能力強和弱的同學混在一起，互相幫助 – 就像維高斯基的「知識較豐富的他人」。\n**記住：**四人、混合能力、教技巧、評估每個人。"},"source":"PDF2 p.54","options":[{"en":"Four members with mixed abilities","tw":"四人、混合能力"},{"en":"Two members of the same ability","tw":"兩人、能力相同"},{"en":"Ten members chosen by friendship","tw":"十人、按友誼分組"},{"en":"The whole class as one group","tw":"全班一組"}],"answerIndex":0,"correctAnswer":{"en":"Four members with mixed abilities","tw":"四人、混合能力"}},{"id":"T2-31","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a DISADVANTAGE of cooperative learning listed in the slides?","tw":"以下哪項是投影片列出的合作學習「缺點」？"},"explanation":{"en":"**Slides say:** Disadvantages: some students may dominate the discussion; some may be uninvolved; disciplinary problems. Advantages: team spirit; presentation, social and communication skills; higher-level processing through discussion.\n**In simple words:** In a group project, one student may do all the talking while another just watches.\n**Remember:** that's why PIES needs \"equal participation\" and \"individual accountability\".","tw":"**投影片：**缺點：部分學生可能主導討論；部分學生可能不參與；紀律問題。優點：團隊精神；演講、社交和溝通技巧；透過討論提升思考層次。\n**簡單來說：**小組功課中，可能一個同學說個不停，另一個只在看。\n**記住：**所以 PIES 需要「平等參與」和「個人責任」。"},"source":"PDF2 p.69","options":[{"en":"Some students may dominate the discussion while others stay uninvolved","tw":"部分學生主導討論，另一些則不參與"},{"en":"It cannot improve communication skills","tw":"不能提升溝通技巧"},{"en":"It always reduces team spirit","tw":"一定會削弱團隊精神"},{"en":"It stops students from exchanging ideas","tw":"阻止學生交流意見"}],"answerIndex":0,"correctAnswer":{"en":"Some students may dominate the discussion while others stay uninvolved","tw":"部分學生主導討論，另一些則不參與"}},{"id":"T2-32","topicNo":2,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which task is an \"ill-structured\" problem, as used in PBL?","tw":"以下哪項是 PBL 所用的「結構不良」問題？"},"explanation":{"en":"**Slides say:** PBL problems are \"ill-structured\" rather than \"well-structured\". Slide example: following written instructions to build a tissue-paper balloon (well-structured) vs being given criteria plus an internet search engine (ill-structured).\n**In simple words:** Ill-structured = no recipe given; you must figure out the steps yourself, like real life.\n**Trap:** step-by-step instructions = well-structured.","tw":"**投影片：**PBL 的問題是「結構不良」而非「結構清晰」。投影片例子：按照書面說明做紙熱氣球（結構清晰）vs 只獲標準加互聯網搜尋（結構不良）。\n**簡單來說：**結構不良 = 沒有食譜，要自己想出步驟，就像真實生活。\n**陷阱：**一步步的說明 = 結構清晰。"},"source":"PDF2 p.49","options":[{"en":"Groups get a list of criteria for a tissue-paper balloon plus internet access, and must work out how to build it","tw":"小組獲得紙熱氣球的標準及互聯網，自行想辦法製作"},{"en":"Groups follow written step-by-step instructions to build a tissue-paper balloon","tw":"小組按照書面步驟製作紙熱氣球"},{"en":"Students copy the teacher's balloon exactly","tw":"學生完全照抄老師的熱氣球"},{"en":"Students memorise the parts of a balloon","tw":"學生背誦熱氣球的部件"}],"answerIndex":0,"correctAnswer":{"en":"Groups get a list of criteria for a tissue-paper balloon plus internet access, and must work out how to build it","tw":"小組獲得紙熱氣球的標準及互聯網，自行想辦法製作"}},{"id":"T2-33","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In scaffolding, what are the roles of the teacher and the student?","tw":"在搭鷹架中，老師和學生的角色分別是甚麼？"},"explanation":{"en":"**Slides say:** The teacher functions as a facilitator who coaches, mediates, prompts and helps students develop and assess their understanding. The student constructs knowledge actively rather than receiving it passively.\n**In simple words:** The teacher is like a sports coach, not a TV announcer. The player (student) does the running.\n**Remember:** facilitator + active learner.","tw":"**投影片：**老師是促進者，負責指導、協調、提示，幫助學生發展和評估自己的理解；學生主動建構知識，而不是被動接收。\n**簡單來說：**老師像運動教練，不是電視旁述員；跑的是球員（學生）。\n**記住：**促進者 + 主動學習者。"},"source":"PDF2 p.25","options":[{"en":"Teacher = facilitator who coaches, prompts and helps; student = actively constructs knowledge","tw":"老師 = 促進者，負責指導、提示和協助；學生 = 主動建構知識"},{"en":"Teacher = lecturer; student = passively receives knowledge","tw":"老師 = 講者；學生 = 被動接收知識"},{"en":"Teacher = judge who only grades; student = works alone","tw":"老師 = 只負責評分；學生 = 獨自工作"},{"en":"Teacher and student swap roles every lesson","tw":"老師和學生每堂課互換角色"}],"answerIndex":0,"correctAnswer":{"en":"Teacher = facilitator who coaches, prompts and helps; student = actively constructs knowledge","tw":"老師 = 促進者，負責指導、提示和協助；學生 = 主動建構知識"}},{"id":"T2-34","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which fact about Vygotsky is correct?","tw":"以下哪項關於維高斯基的資料正確？"},"explanation":{"en":"**Slides say:** Vygotsky (1896–1934) was born in Russia and died at the age of 38. His book \"Thought and Language\" was published in Russian in 1934 and translated into English in 1962. He is famous for his sociocultural theory.\n**In simple words:** He died young, so the West only read his work about 30 years later.\n**Trap:** 3 children = Piaget; Nobel 1904 = Pavlov; Bobo doll = Bandura.","tw":"**投影片：**維高斯基（1896–1934）生於俄國，38 歲逝世。《Thought and Language》1934 年以俄文出版，1962 年譯成英文。以社會文化理論聞名。\n**簡單來說：**他英年早逝，西方約 30 年後才讀到他的作品。\n**陷阱：**3 個孩子 = 皮亞傑；1904 諾貝爾獎 = 巴甫洛夫；吹氣娃娃 = 班杜拉。"},"source":"PDF2 p.5","options":[{"en":"Born in Russia, died at 38; \"Thought and Language\" (1934 in Russian, 1962 in English)","tw":"生於俄國，38 歲逝世；《Thought and Language》（1934 俄文、1962 英譯）"},{"en":"Born in Switzerland; studied his own 3 children","tw":"生於瑞士；研究自己的 3 個孩子"},{"en":"Won the Nobel Prize in 1904","tw":"1904 年獲諾貝爾獎"},{"en":"Created the Bobo doll experiment","tw":"進行了吹氣娃娃實驗"}],"answerIndex":0,"correctAnswer":{"en":"Born in Russia, died at 38; \"Thought and Language\" (1934 in Russian, 1962 in English)","tw":"生於俄國，38 歲逝世；《Thought and Language》（1934 俄文、1962 英譯）"},"photo":"vygotsky"},{"id":"T2-35","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides on cultural context, why does culture matter so much for learning?","tw":"根據文化背景的投影片，為何文化對學習如此重要？"},"explanation":{"en":"**Slides say:** Through informal conversation and formal schooling, adults pass on how their culture interprets the world. Children can learn by discovery, but a significant portion of knowledge and values is passed on through culture. Knowledge is accumulated, so we learn more and more efficiently.\n**In simple words:** You don't have to reinvent the wheel – your culture hands you the wheel.\n**Remember:** culture gives concepts and their meaning.","tw":"**投影片：**成人透過日常對話和正規教育，傳達他們的文化如何理解世界。兒童雖可透過發現學習，但大部分知識和價值觀是經文化傳承的；知識不斷累積，令我們學得更多、更有效率。\n**簡單來說：**你不用重新發明車輪 – 文化把車輪交給你。\n**記住：**文化提供概念及其意義。"},"source":"PDF2 p.11","options":[{"en":"A large part of knowledge and values is passed on through culture, and accumulated knowledge lets us learn more, more efficiently","tw":"大部分知識和價值觀透過文化傳承，累積的知識令我們學得更多、更有效率"},{"en":"Culture only matters for adults, not children","tw":"文化只對成人重要，對兒童不重要"},{"en":"Children can only learn by discovering things alone","tw":"兒童只能靠自己發現來學習"},{"en":"Culture replaces the need for language","tw":"文化令語言變得不需要"}],"answerIndex":0,"correctAnswer":{"en":"A large part of knowledge and values is passed on through culture, and accumulated knowledge lets us learn more, more efficiently","tw":"大部分知識和價值觀透過文化傳承，累積的知識令我們學得更多、更有效率"}},{"id":"T2-36","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which teaching practice follows directly from Vygotsky's instructional implications?","tw":"以下哪項教學做法直接源於維高斯基的教學意義？"},"explanation":{"en":"**Slides say:** Know students' actual developmental level to find their ZPD; introduce new concepts in moderately difficult ways (not too easy or too hard); encourage social interaction – tutoring by more competent peers helps growth within the ZPD; guidance from adults (teachers, parents) is important too.\n**In simple words:** A classmate who just mastered fractions can often explain them to you better than a textbook.\n**Remember:** find the ZPD, then teach there with help from others.","tw":"**投影片：**了解學生的實際發展水平以確定 ZPD；以適度困難的方式引入新概念（不太易、不太難）；鼓勵社交互動 – 能力較高的同儕輔導有助在 ZPD 內成長；成人（老師、家長）的指導也重要。\n**簡單來說：**剛學懂分數的同學，往往比課本更能向你解釋清楚。\n**記住：**先找出 ZPD，再在那裏借助他人教學。"},"source":"PDF2 p.30","options":[{"en":"Tutoring by more competent peers to support growth within the ZPD","tw":"由能力較高的同儕輔導，幫助學生在 ZPD 內成長"},{"en":"Giving every student tasks that are far too difficult","tw":"給每個學生遠超能力的任務"},{"en":"Avoiding all interaction between students","tw":"避免學生之間的一切互動"},{"en":"Waiting until a child reaches the formal stage before teaching","tw":"等孩子到形式運思期才開始教"}],"answerIndex":0,"correctAnswer":{"en":"Tutoring by more competent peers to support growth within the ZPD","tw":"由能力較高的同儕輔導，幫助學生在 ZPD 內成長"}},{"id":"T2-37","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What can a teacher do to help students construct knowledge (constructivism slides)?","tw":"根據建構主義投影片，老師可以怎樣幫助學生建構知識？"},"explanation":{"en":"**Slides say:** Help students construct knowledge: give high-quality examples; connect content to the \"real world\"; promote high levels of interaction (discuss, question each other); be sceptical about verbal explanations; assess learning to promote learning.\n**In simple words:** Example: teaching percentages with real shop discounts, then letting pairs check each other's working.\n**Remember:** examples + real world + interaction.","tw":"**投影片：**幫助學生建構知識：提供優質例子；內容貼近「現實世界」；促進高度互動（討論、互相提問）；對口頭解釋持懷疑態度；以評估促進學習。\n**簡單來說：**例：用真實商店折扣教百分比，再讓同學兩人一組互相檢查。\n**記住：**例子 + 現實 + 互動。"},"source":"PDF2 p.45","options":[{"en":"Give high-quality examples, connect content to the real world, and promote high levels of interaction","tw":"提供優質例子、把內容與現實世界連結、促進高度互動"},{"en":"Lecture for the whole lesson and avoid questions","tw":"整堂課講授，不讓學生發問"},{"en":"Give only abstract definitions with no examples","tw":"只給抽象定義，不給例子"},{"en":"Assume students understand once the topic is explained","tw":"講解過就假設學生明白"}],"answerIndex":0,"correctAnswer":{"en":"Give high-quality examples, connect content to the real world, and promote high levels of interaction","tw":"提供優質例子、把內容與現實世界連結、促進高度互動"}},{"id":"T2-38","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is NOT one of the three constructivist teaching strategies in the slides?","tw":"以下哪項「不是」投影片中的三種建構主義教學策略？"},"explanation":{"en":"**Slides say:** Constructivist teaching strategies: problem-based learning (PBL), cooperative learning, discovery learning.\n**In simple words:** All three make students actively BUILD knowledge – by solving, by working together, or by finding out.\n**Remember:** P-C-D: Problem, Cooperate, Discover.","tw":"**投影片：**建構主義教學策略：問題導向學習（PBL）、合作學習、發現式學習。\n**簡單來說：**三者都要學生主動「建構」知識 – 透過解決問題、合作或自己發現。\n**記住：**問題、合作、發現。"},"source":"PDF2 p.47","options":[{"en":"Rote drilling of standard answers","tw":"死記標準答案的操練"},{"en":"Problem-based learning","tw":"問題導向學習"},{"en":"Cooperative learning","tw":"合作學習"},{"en":"Discovery learning","tw":"發現式學習"}],"answerIndex":0,"correctAnswer":{"en":"Rote drilling of standard answers","tw":"死記標準答案的操練"}},{"id":"T2-39","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT an instructional objective of cooperative learning listed in the slides?","tw":"以下哪項「不是」投影片所列合作學習的教學目標？"},"explanation":{"en":"**Slides say:** Objectives: let students be active learners; let students help each other learn; reduce hostility and promote cooperation; improve students' ability to express ideas (writing and speaking); improve thinking through exchange of ideas.\n**In simple words:** Cooperative learning is about \"we all win together\", not \"I beat you\".\n**Trap:** individual competition is the opposite.","tw":"**投影片：**目標：讓學生成為主動學習者；讓學生互相幫忙；減少敵意、促進合作；提高表達想法的能力（寫作和說話）；透過交流想法提升思考。\n**簡單來說：**合作學習講「大家一起贏」，不是「我要打敗你」。\n**陷阱：**個人競爭正好相反。"},"source":"PDF2 p.67","options":[{"en":"Increase competition between individual students","tw":"加強學生個人之間的競爭"},{"en":"Reduce hostility and promote cooperation","tw":"減少敵意，促進合作"},{"en":"Let students help each other learn","tw":"讓學生互相幫助學習"},{"en":"Improve thinking through exchange of ideas","tw":"透過交流想法提升思考"}],"answerIndex":0,"correctAnswer":{"en":"Increase competition between individual students","tw":"加強學生個人之間的競爭"}},{"id":"T2-40","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is an ADVANTAGE of discovery learning?","tw":"以下哪項是發現式學習的「優點」？"},"explanation":{"en":"**Slides say:** Advantages: active engagement of learners; fosters curiosity; highly motivating because people can experiment and discover for themselves. Disadvantages: time-consuming; needs careful planning; without good supervision some learners may not gain.\n**In simple words:** Finding out by yourself (e.g. which objects float) is exciting – but slow.\n**Trap:** the other three options are the disadvantages turned upside down.","tw":"**投影片：**優點：學習者積極參與；培養好奇心；能自己嘗試和發現，因而高度激勵。缺點：費時；需周詳計劃；缺乏良好督導時部分學生未必得益。\n**簡單來說：**自己找出答案（例如哪些物件會浮）很有趣，但很花時間。\n**陷阱：**其餘三項是把缺點倒過來說。"},"source":"PDF2 p.72","options":[{"en":"It fosters curiosity and is highly motivating","tw":"培養好奇心，並且高度激勵"},{"en":"It takes very little time","tw":"只需要很少時間"},{"en":"It needs no planning","tw":"不需要計劃"},{"en":"Every learner gains, even with no supervision","tw":"即使沒有督導，每個學生都有得益"}],"answerIndex":0,"correctAnswer":{"en":"It fosters curiosity and is highly motivating","tw":"培養好奇心，並且高度激勵"}},{"id":"T2-41","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"In the Piaget vs Vygotsky comparison table, which statement belongs to VYGOTSKY?","tw":"在皮亞傑 vs 維高斯基比較表中，哪項屬於「維高斯基」？"},"explanation":{"en":"**Slides say:** Piaget: development is mostly universal; results from independent exploration; each child constructs knowledge on their own. Vygotsky: development differs from culture to culture and era to era; results from guided participation and social interaction; children and adults (or peers) CO-construct knowledge.\n**In simple words:** Piaget = the same stages everywhere. Vygotsky = it depends on your culture and the people around you.\n**Remember:** P = universal + alone; V = cultural + together.","tw":"**投影片：**皮亞傑：發展大致普遍；來自獨立探索；每個兒童獨自建構知識。維高斯基：發展因文化和時代而異；來自引導參與和社交互動；兒童與成人（或同儕）「共同」建構知識。\n**簡單來說：**皮亞傑 = 到處都是相同階段；維高斯基 = 取決於你的文化和身邊的人。\n**記住：**皮 = 普遍 + 獨自；維 = 文化 + 一起。"},"source":"PDF2 p.36","options":[{"en":"Cognitive development differs from culture to culture and across historical eras","tw":"認知發展因文化和歷史時代而異"},{"en":"Cognitive development is mostly the same universally","tw":"認知發展在各地大致相同"},{"en":"Development results from the child's independent exploration","tw":"發展來自兒童的獨立探索"},{"en":"Each child constructs knowledge on his or her own","tw":"每個兒童獨自建構知識"}],"answerIndex":0,"correctAnswer":{"en":"Cognitive development differs from culture to culture and across historical eras","tw":"認知發展因文化和歷史時代而異"}},{"id":"T2-42","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"How do Piaget and Vygotsky differ on learning vs development?","tw":"皮亞傑和維高斯基對「學習」與「發展」的先後看法有何不同？"},"explanation":{"en":"**Slides say:** Piaget: development precedes learning – children cannot master certain things until they have the needed cognitive structures. Vygotsky: learning precedes development – tools learned with adult help are internalised and push development forward.\n**In simple words:** Piaget waits until the child is \"ready\". Vygotsky teaches inside the ZPD so the child becomes ready.\n**Remember:** P = wait for readiness; V = learning leads.","tw":"**投影片：**皮亞傑：發展先於學習 – 未具備所需認知結構，兒童無法掌握某些事物。維高斯基：學習先於發展 – 在成人協助下學會的工具被內化，推動發展。\n**簡單來說：**皮亞傑等孩子「準備好」；維高斯基在 ZPD 內教，令孩子變得準備好。\n**記住：**皮 = 等待就緒；維 = 學習帶動發展。"},"source":"PDF2 p.36","options":[{"en":"Piaget: development precedes learning. Vygotsky: learning precedes development.","tw":"皮亞傑：發展先於學習。維高斯基：學習先於發展。"},{"en":"Piaget: learning precedes development. Vygotsky: development precedes learning.","tw":"皮亞傑：學習先於發展。維高斯基：發展先於學習。"},{"en":"Both say learning and development are unrelated","tw":"兩者都說學習與發展無關"},{"en":"Both say development always comes first","tw":"兩者都說發展永遠在先"}],"answerIndex":0,"correctAnswer":{"en":"Piaget: development precedes learning. Vygotsky: learning precedes development.","tw":"皮亞傑：發展先於學習。維高斯基：學習先於發展。"}},{"id":"T2-43","topicNo":2,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In the comparison table, why are PEERS important for Piaget but ADULTS important for Vygotsky?","tw":"比較表中，為何皮亞傑重視「同儕」，而維高斯基重視「成人」？"},"explanation":{"en":"**Slides say:** Piaget: peers are important because children must learn to take peers' perspectives (less egocentric). Vygotsky: adults are important because they know the culture's ways and tools of thinking.\n**In simple words:** Arguing with a friend teaches you that others see things differently (Piaget). A parent showing you how to use a map passes on a cultural tool (Vygotsky).\n**Remember:** P → peers → perspective; V → adults → tools.","tw":"**投影片：**皮亞傑：同儕重要，因為兒童要學習從同儕角度看事物（減少自我中心）。維高斯基：成人重要，因為他們掌握文化的思考方式和工具。\n**簡單來說：**和朋友爭論，令你明白別人看法不同（皮亞傑）；父母教你看地圖，是傳承文化工具（維高斯基）。\n**記住：**皮 → 同儕 → 角度；維 → 成人 → 工具。"},"source":"PDF2 p.36","options":[{"en":"Piaget: peers help children learn to take others' perspectives. Vygotsky: adults know the culture's ways and tools of thinking.","tw":"皮亞傑：同儕幫助兒童學習從他人角度看事物。維高斯基：成人掌握文化的思考方式和工具。"},{"en":"Piaget: peers give rewards. Vygotsky: adults give punishments.","tw":"皮亞傑：同儕給獎勵。維高斯基：成人給懲罰。"},{"en":"Piaget: peers are models to copy. Vygotsky: adults are symbolic models.","tw":"皮亞傑：同儕是模仿對象。維高斯基：成人是象徵楷模。"},{"en":"There is no difference between them","tw":"兩者沒有分別"}],"answerIndex":0,"correctAnswer":{"en":"Piaget: peers help children learn to take others' perspectives. Vygotsky: adults know the culture's ways and tools of thinking.","tw":"皮亞傑：同儕幫助兒童學習從他人角度看事物。維高斯基：成人掌握文化的思考方式和工具。"}},{"id":"T2-44","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What is the key difference between scaffolding and shaping, according to the slides?","tw":"根據投影片，搭鷹架與塑形的主要分別是甚麼？"},"explanation":{"en":"**Slides say:** \"Scaffolding is about providing support, whereas shaping is about refining and enhancing skills.\" Scaffolding support is temporary and gradually removed; shaping improves behaviour step by step through reinforced practice.\n**In simple words:** Scaffolding = a helper holds the bike. Shaping = praise for each slightly better attempt.\n**Remember:** scaffold = SUPPORT (Vygotsky); shape = REWARD closer steps (Skinner).","tw":"**投影片：**「鷹架是提供輔助，而塑形是調整及精進技巧。」鷹架的支援是暫時的、會逐步撤走；塑形透過受強化的練習逐步改善行為。\n**簡單來說：**搭鷹架 = 有人扶著單車；塑形 = 每次稍有進步就讚賞。\n**記住：**鷹架 = 支援（維高斯基）；塑形 = 獎勵更接近的行為（史金納）。"},"source":"PDF2 p.34","options":[{"en":"Scaffolding provides temporary support; shaping refines and improves skills through reinforced practice","tw":"搭鷹架提供暫時支援；塑形透過受強化的練習調整並精進技巧"},{"en":"Scaffolding uses punishment; shaping uses rewards","tw":"搭鷹架用懲罰；塑形用獎勵"},{"en":"They are exactly the same","tw":"兩者完全相同"},{"en":"Shaping is only for animals; scaffolding is only for adults","tw":"塑形只用於動物；搭鷹架只用於成人"}],"answerIndex":0,"correctAnswer":{"en":"Scaffolding provides temporary support; shaping refines and improves skills through reinforced practice","tw":"搭鷹架提供暫時支援；塑形透過受強化的練習調整並精進技巧"}},{"id":"T2-45","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is an ADVANTAGE of cooperative learning listed in the slides?","tw":"以下哪項是投影片列出的合作學習「優點」？"},"explanation":{"en":"**Slides say:** Advantages of cooperative learning: cultivates team spirit; improves students' presentation, social and communication skills; encourages a higher level of information processing through group discussion. Disadvantages: some students dominate, some are uninvolved, discipline problems.\n**In simple words:** Explaining an idea to your group makes you understand it better – and you practise speaking up.\n**Trap:** the other options are the disadvantages (or the opposite of PIES).","tw":"**投影片：**合作學習的優點：培養團隊精神；提升學生的演講、社交和溝通技巧；透過小組討論提升資訊處理層次。缺點：部分學生主導、部分不參與、紀律問題。\n**簡單來說：**向組員解釋一個概念，令你自己更明白，也練習發言。\n**陷阱：**其他選項是缺點（或與 PIES 相反）。"},"source":"PDF2 p.68","options":[{"en":"It cultivates team spirit and improves presentation, social and communication skills","tw":"培養團隊精神，提升演講、社交和溝通技巧"},{"en":"It guarantees that nobody dominates the discussion","tw":"保證沒有人主導討論"},{"en":"It removes all discipline problems","tw":"消除所有紀律問題"},{"en":"It means teachers never need to assess individuals","tw":"老師從此不用評估個人"}],"answerIndex":0,"correctAnswer":{"en":"It cultivates team spirit and improves presentation, social and communication skills","tw":"培養團隊精神，提升演講、社交和溝通技巧"}},{"id":"T3-01","topicNo":3,"difficulty":"easy","type":"mc","star":true,"question":{"en":"In Pavlov's experiment, the MEAT that naturally makes the dog salivate is the…","tw":"在巴甫洛夫實驗中，自然令狗流口水的「肉」是……"},"explanation":{"en":"**Slides say:** Unconditioned stimulus (US) = a stimulus that naturally elicits a response, e.g. meat. The natural response (salivation) is the UR.\n**In simple words:** \"Un-conditioned\" = no training needed. Meat makes a dog drool from birth.\n**Remember:** US → UR happens naturally. Training only adds the bell (NS → CS).","tw":"**投影片：**非制約刺激（US）= 能自然引發反應的刺激，例如肉；自然反應（流口水）是 UR。\n**簡單來說：**「非制約」= 不用訓練。狗天生見到肉就流口水。\n**記住：**US → UR 是天生的；訓練只是加入鈴聲（NS → CS）。"},"source":"PDF3 p.15","options":[{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Conditioned response (CR)","tw":"制約反應（CR）"}],"answerIndex":0,"correctAnswer":{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},"fig":"pavlov_steps"},{"id":"T3-02","topicNo":3,"difficulty":"easy","type":"mc","star":true,"question":{"en":"BEFORE conditioning, the bell that causes no salivation is a…","tw":"制約「之前」，不會令狗流口水的鈴聲是……"},"explanation":{"en":"**Slides say:** Neutral stimulus (NS) = a stimulus that does not evoke a response, e.g. hearing a bell.\n**In simple words:** Before training, the bell means nothing to the dog – no drool. After the bell is paired with meat many times, it becomes the conditioned stimulus (CS).\n**Remember:** NS (nothing) → paired with US → becomes CS.","tw":"**投影片：**中性刺激（NS）= 不會引起反應的刺激，例如鈴聲。\n**簡單來說：**訓練前，鈴聲對狗沒有意義，不會流口水。鈴聲與肉多次配對後，才變成制約刺激（CS）。\n**記住：**NS（無反應）→ 與 US 配對 → 變成 CS。"},"source":"PDF3 p.15","options":[{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"}],"answerIndex":0,"correctAnswer":{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"},"fig":"pavlov_steps"},{"id":"T3-03","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"AFTER conditioning, the dog salivates to the bell alone. This salivation is the…","tw":"制約「之後」，狗只聽到鈴聲就流口水。這流口水是……"},"explanation":{"en":"**Slides say:** Conditioned response (CR) = a learned response elicited by the CS.\n**In simple words:** It's the same drool with a different name. Drooling to MEAT = UR (natural). Drooling to the BELL = CR (learned).\n**Trap:** ask \"what started the drool?\" If it's the learned signal (bell), it's the CR.","tw":"**投影片：**制約反應（CR）= 由制約刺激引發、經學習得來的反應。\n**簡單來說：**同樣是流口水，名稱不同：對「肉」流口水 = UR（天生）；對「鈴聲」流口水 = CR（學來的）。\n**陷阱：**問自己「是甚麼引發流口水？」如果是學來的信號（鈴聲），就是 CR。"},"source":"PDF3 p.15","options":[{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},"fig":"pavlov_steps"},{"id":"T3-04","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A teacher always raises his hand while asking for quiet. Later, students stop talking when they just see the raised hand. The raised hand is now the…","tw":"老師每次要求安靜時都舉手。之後學生一看到老師舉手就停止說話。舉手現在是……"},"explanation":{"en":"**Slides say:** Class Exercise 2 – a teacher always raises his hand when asking students to stop talking; later students stop talking when they see the hand. Hand = CS; stop talking = CR.\n**In simple words:** At first the raised hand meant nothing (NS). It kept coming with \"Be quiet!\" (US), so now the hand alone works.\n**Trap:** before the pairing, the hand was the NS – it only becomes the CS after learning.","tw":"**投影片：**課堂練習 2 – 老師每次要求安靜都舉手；後來學生一見舉手就停止說話。舉手 = CS；停止說話 = CR。\n**簡單來說：**起初舉手沒有意義（NS）。它一直和「安靜！」（US）一起出現，現在單是舉手就有效。\n**陷阱：**配對前，舉手是 NS；學習後才變成 CS。"},"source":"PDF3 p.26","options":[{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Conditioned response (CR)","tw":"制約反應（CR）"},{"en":"Neutral stimulus (NS)","tw":"中性刺激（NS）"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}},{"id":"T3-05","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which of these can NOT be a conditioned response in classical conditioning?","tw":"以下哪項「不能」成為古典制約的制約反應？"},"explanation":{"en":"**Slides say:** Classical conditioning involves INVOLUNTARY responses – \"doing homework is not a potential candidate\" for a conditioned response.\n**In simple words:** Classical conditioning only works on things that happen by themselves – fear, happiness, drooling. You CHOOSE to do homework, so it is voluntary.\n**Remember:** voluntary actions belong to operant conditioning (rewards and punishments, T4).","tw":"**投影片：**古典制約涉及「非自願」反應 –「做功課不是自然反應」，不能成為制約反應。\n**簡單來說：**古典制約只適用於自動出現的反應 – 害怕、開心、流口水。做功課是你「選擇」做的，屬自願行為。\n**記住：**自願行為屬操作性制約（獎勵和懲罰，T4）。"},"source":"PDF3 p.16","options":[{"en":"Doing homework","tw":"做功課"},{"en":"Feeling fear","tw":"感到害怕"},{"en":"Salivating","tw":"流口水"},{"en":"Feeling happy","tw":"感到愉快"}],"answerIndex":0,"correctAnswer":{"en":"Doing homework","tw":"做功課"}},{"id":"T3-06","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Pavlov won the Nobel Prize in 1904 for…","tw":"巴甫洛夫在 1904 年獲諾貝爾獎，是哪個範疇？"},"explanation":{"en":"**Slides say:** Pavlov (1849–1936) was a Russian physiologist who studied digestion. He won the 1904 Nobel Prize in Physiology or Medicine (\"but not for Psychology!\").\n**In simple words:** He was studying how dogs digest food when he noticed they drooled before the food even arrived. That led to classical conditioning.\n**Trap:** many students pick \"Psychology\" – wrong.","tw":"**投影片：**巴甫洛夫（1849–1936）是研究消化的俄國生理學家，1904 年獲諾貝爾生理學或醫學獎（「不是心理學！」）。\n**簡單來說：**他研究狗如何消化食物時，發現食物未到狗已流口水，於是發現了古典制約。\n**陷阱：**很多同學選「心理學」– 錯。"},"source":"PDF3 p.12","options":[{"en":"Physiology or Medicine","tw":"生理學或醫學"},{"en":"Psychology","tw":"心理學"},{"en":"Chemistry","tw":"化學"},{"en":"Peace","tw":"和平"}],"answerIndex":0,"correctAnswer":{"en":"Physiology or Medicine","tw":"生理學或醫學"},"photo":"pavlov"},{"id":"T3-07","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who is called the founder of behaviourism and ran the \"Little Albert\" experiment?","tw":"誰被稱為行為主義創始人，並進行了「小艾伯特」實驗？"},"explanation":{"en":"**Slides say:** John B. Watson (1878–1958), the founder of Behaviourism. The Little Albert experiment shows a conditioned emotional response.\n**In simple words:** Watson showed that FEAR can be learned: baby Albert learned to fear something harmless after it was paired with something frightening.\n**Remember:** Watson = founder of behaviourism + Little Albert.","tw":"**投影片：**華生（John B. Watson，1878–1958）是行為主義創始人；小艾伯特實驗展示制約情緒反應。\n**簡單來說：**華生證明「恐懼」可以學來：嬰兒艾伯特把無害的東西與可怕的事配對後，便開始害怕它。\n**記住：**華生 = 行為主義創始人 + 小艾伯特。"},"source":"PDF3 p.30","options":[{"en":"John B. Watson","tw":"華生（John B. Watson）"},{"en":"Ivan Pavlov","tw":"巴甫洛夫（Ivan Pavlov）"},{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},{"en":"Edward Thorndike","tw":"桑代克（Edward Thorndike）"}],"answerIndex":0,"correctAnswer":{"en":"John B. Watson","tw":"華生（John B. Watson）"},"photo":"watson"},{"id":"T3-08","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student who fears Mathematics now also fears Physics. This is…","tw":"一名怕數學的學生，現在連物理也怕。這是……"},"explanation":{"en":"**Slides say:** Generalization = the tendency to respond to stimuli similar to the CS. Example: a student who fears Maths may also fear other subjects like Physics.\n**In simple words:** The fear spreads to things that feel similar – like a child bitten by one dog who becomes scared of all dogs.\n**Remember:** generalization = SPREADS.","tw":"**投影片：**泛化 = 對類似 CS 的刺激也作出反應。例：怕數學的學生也可能怕物理等其他科目。\n**簡單來說：**恐懼擴散到相似的東西 – 就像被一隻狗咬過，就怕所有狗。\n**記住：**泛化 = 擴散。"},"source":"PDF3 p.38","options":[{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Shaping","tw":"塑形（shaping）"}],"answerIndex":0,"correctAnswer":{"en":"Generalization","tw":"泛化（generalization）"}},{"id":"T3-09","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student fears Maths and Physics but NOT Accounting. This is…","tw":"學生怕數學和物理，但「不」怕會計。這是……"},"explanation":{"en":"**Slides say:** Discrimination = the ability to differentiate between classes of stimuli. Example: the student fears Maths and Physics, but not Accounting.\n**In simple words:** The student can tell the subjects apart, so the fear stops spreading.\n**Remember:** generalization spreads the reaction; discrimination tells things apart.","tw":"**投影片：**差異（辨別）= 能區分不同種類的刺激。例：學生怕數學和物理，但不怕會計。\n**簡單來說：**學生分得出科目的分別，所以恐懼不再擴散。\n**記住：**泛化 = 擴散；辨別 = 分清楚。"},"source":"PDF3 p.12","options":[{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Spontaneous reinforcement","tw":"自發強化"}],"answerIndex":0,"correctAnswer":{"en":"Discrimination","tw":"差異／辨別（discrimination）"}},{"id":"T3-10","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A student repeatedly passes Maths tests and the fear of Maths disappears. This is…","tw":"學生多次通過數學測驗，對數學的恐懼消失了。這是……"},"explanation":{"en":"**Slides say:** Extinction = gradual weakening of the CR when the CS appears without the US. Example: if the student repeatedly passes Maths tests, the fear of Maths disappears.\n**In simple words:** Maths (CS) keeps coming WITHOUT the bad experience (failing), so the fear slowly dies out – like a dog that stops drooling when the bell keeps ringing with no food.\n**Remember:** extinction = the learned reaction fades.","tw":"**投影片：**消退 = CS 出現而沒有 US，CR 會逐漸減弱。例：學生多次通過數學測驗，對數學的恐懼就會消失。\n**簡單來說：**數學（CS）一再出現，但沒有壞經驗（不合格），恐懼便慢慢消失 – 就像鈴聲響了很多次都沒有食物，狗就不再流口水。\n**記住：**消退 = 學來的反應慢慢消失。"},"source":"PDF3 p.38","options":[{"en":"Extinction","tw":"消退（extinction）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Discrimination","tw":"差異／辨別（discrimination）"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Extinction","tw":"消退（extinction）"}},{"id":"T3-11","topicNo":3,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Using classical conditioning, why is giving writing assignments as punishment unwise?","tw":"以古典制約解釋，為何以寫作作懲罰並不明智？"},"explanation":{"en":"**Slides say:** Discussion – teachers are discouraged from using writing assignments as punishment. Explain it with classical conditioning.\n**In simple words:** Writing (NS) keeps coming with punishment and bad feelings. The brain links \"writing = bad\", so later just being asked to write (now a CS) makes students feel upset and avoid it (CR).\n**Remember:** same as the shaming Maths teacher example – students end up avoiding the subject.","tw":"**投影片：**討論題 – 老師不應以寫作作為懲罰，請以古典制約解釋。\n**簡單來說：**寫作（NS）總是和懲罰、負面感受一起出現，大腦便把「寫作 = 不開心」連結起來；之後單是要寫作（已成 CS）就令學生不安並逃避（CR）。\n**記住：**與「羞辱學生的數學老師」例子一樣 – 學生最後逃避那一科。"},"source":"PDF3 p.41","options":[{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"},{"en":"Writing is a voluntary behaviour, so it cannot be conditioned","tw":"寫作是自願行為，所以不能被制約"},{"en":"Writing becomes a primary reinforcer","tw":"寫作會變成主要強化物"},{"en":"Punishment always leads to extinction of writing skills","tw":"懲罰一定導致寫作技能消退"}],"answerIndex":0,"correctAnswer":{"en":"Writing gets paired with the bad feelings of punishment, so later writing alone (CS) triggers dislike/anxiety (CR)","tw":"寫作與懲罰的負面感受配對，之後單是寫作（CS）就會引發厭惡／焦慮（CR）"}},{"id":"T3-12","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In classical conditioning, the neutral stimulus is usually presented ___ the unconditioned stimulus.","tw":"古典制約中，中性刺激通常在非制約刺激 ___ 出現。"},"explanation":{"en":"**Slides say:** The NS is usually presented BEFORE the US.\n**In simple words:** The signal must come first so it can PREDICT what comes next: bell → meat. If the meat came first, the bell would predict nothing.\n**Remember:** classical = something BEFORE the reaction; operant = a consequence AFTER the behaviour.","tw":"**投影片：**中性刺激（NS）通常在非制約刺激（US）「之前」出現。\n**簡單來說：**信號要先出現，才能「預告」接下來的事：鈴聲 → 肉。如果肉先出現，鈴聲就預告不到甚麼。\n**記住：**古典制約 = 反應「之前」的刺激；操作性制約 = 行為「之後」的後果。"},"source":"PDF3 p.16","options":[{"en":"before","tw":"之前"},{"en":"after","tw":"之後"},{"en":"instead of","tw":"取代"},{"en":"long after","tw":"很久之後"}],"answerIndex":0,"correctAnswer":{"en":"before","tw":"之前"},"photo":"pavlov_dog"},{"id":"T3-13","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Behaviourism focuses on…","tw":"行為主義著重於……"},"explanation":{"en":"**Slides say:** Behaviourism focuses only on OBSERVABLE behaviours and ignores what is not directly observable, such as what happens inside the brain – the \"black box\".\n**In simple words:** Behaviourists only study what you can SEE someone do, not what they think.\n**Remember:** Bandura (T5) and information processing (T6) later looked inside the black box.","tw":"**投影片：**行為主義只研究「可觀察」的行為，忽略不能直接觀察的東西，例如大腦內發生的事 –「黑盒」。\n**簡單來說：**行為主義只研究你「看得見」的行為，不理會人在想甚麼。\n**記住：**後來班杜拉（T5）和訊息處理模型（T6）才打開這個黑盒。"},"source":"PDF3 p.3","options":[{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"},{"en":"Thoughts and schemas inside the brain","tw":"大腦內的思想與基模"},{"en":"Dreams and the unconscious","tw":"夢境與潛意識"},{"en":"Social and cultural tools","tw":"社會及文化工具"}],"answerIndex":0,"correctAnswer":{"en":"Observable behaviours only (the mind is a \"black box\")","tw":"只研究可觀察的行為（大腦是「黑盒」）"}},{"id":"T3-14","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"The first time you eat sushi you get food poisoning; now just seeing sushi makes you feel sick. Which is the unconditioned stimulus (US)?","tw":"第一次吃壽司就食物中毒，現在一看到壽司就不舒服。哪一項是非制約刺激（US）？"},"explanation":{"en":"**Slides say:** Food aversion example: NS = sushi, US = food poisoning, UR = feel sick → afterwards CS = sushi, CR = feel sick.\n**In simple words:** Ask: what made you sick NATURALLY? The food poisoning. Sushi was harmless until it got linked with being sick.\n**Trap:** sushi is the NS (later the CS), NOT the US.","tw":"**投影片：**食物厭惡例子：NS = 壽司，US = 食物中毒，UR = 不適 → 之後 CS = 壽司，CR = 不適。\n**簡單來說：**問自己：甚麼「天生」令你不舒服？是食物中毒。壽司本來無害，只是和不適連結了。\n**陷阱：**壽司是 NS（之後變 CS），不是 US。"},"source":"PDF3 p.22","options":[{"en":"Food poisoning","tw":"食物中毒"},{"en":"Sushi","tw":"壽司"},{"en":"Feeling sick","tw":"感到不適"},{"en":"Seeing sushi later","tw":"之後看到壽司"}],"answerIndex":0,"correctAnswer":{"en":"Food poisoning","tw":"食物中毒"}},{"id":"T3-15","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How can a teacher use classical conditioning in classroom management?","tw":"老師如何在課堂管理中運用古典制約？"},"explanation":{"en":"**Slides say:** Positive learning environment – associate the learning environment with positive emotions: attractive learning aids, decorate the classroom, greet and smile at students, help them complete tasks.\n**In simple words:** If the classroom keeps coming with happy feelings, the classroom itself starts to feel happy. Slide example: Anna smiles and praises students, so they enjoy her English lessons.\n**Trap:** shaming does the opposite – it links the subject with fear.","tw":"**投影片：**愉快的學習環境 – 把學習環境與正面情緒連結：吸引的教具、佈置課室、微笑問好、協助完成任務。\n**簡單來說：**課室總是伴隨開心的感覺，課室本身就會令人開心。投影片例子：安娜常微笑讚賞學生，學生都喜歡上她的英文課。\n**陷阱：**羞辱學生正好相反 – 令科目與恐懼連結。"},"source":"PDF3 p.40","options":[{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"},{"en":"Shame students who make mistakes so they try harder","tw":"羞辱犯錯的學生，令他們更努力"},{"en":"Give extra writing as punishment","tw":"以額外寫作作懲罰"},{"en":"Remove all rewards from lessons","tw":"取消課堂上的所有獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Link the classroom with positive emotions: smile, greet, decorate, use attractive aids, help students finish tasks","tw":"把課室與正面情緒連結：微笑問好、佈置課室、用吸引的教具、協助學生完成任務"}},{"id":"T3-16","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Throwing a child who cannot swim into deep water \"so he learns to swim\" most likely leads to…","tw":"把不會游泳的孩子扔進深水「讓他學游泳」，最可能導致……"},"explanation":{"en":"**Slides say:** Many irrational fears come from pairing neutral stimuli with stimuli that trigger an involuntary response. Throwing a child who cannot swim into deep water is likely to cause a fear of water.\n**In simple words:** Water (neutral) + panic of nearly sinking (natural fear) → water itself becomes scary.\n**Remember:** phobias are often learned through classical conditioning.","tw":"**投影片：**許多非理性恐懼源於中性刺激與觸發非自願反應的刺激配對。把不會游泳的孩子扔進深水，很可能令他怕水。\n**簡單來說：**水（中性）＋ 差點遇溺的驚慌（天生恐懼）→ 水本身變得可怕。\n**記住：**恐懼症常由古典制約學來。"},"source":"PDF3 p.39","options":[{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"},{"en":"Learning to swim quickly","tw":"很快學會游泳"},{"en":"Extinction of fear","tw":"恐懼消退"},{"en":"Positive reinforcement of swimming","tw":"游泳行為得到正增強"}],"answerIndex":0,"correctAnswer":{"en":"A conditioned fear of water","tw":"對水產生制約的恐懼"}},{"id":"T3-17","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who suggested the \"Law of Association\" about 2000 years ago?","tw":"約 2000 年前，誰提出「聯繫法則」？"},"explanation":{"en":"**Slides say:** Our minds naturally connect events that occur in sequence; 2000 years ago Aristotle suggested this \"Law of Association\".\n**In simple words:** Things that happen one after another get linked in our mind – like the school bell and the end of a lesson.\n**Remember:** classical conditioning is built on this old idea.","tw":"**投影片：**大腦自然地把先後發生的事件聯繫起來；2000 年前亞里士多德已提出「聯繫法則」。\n**簡單來說：**先後發生的事會在腦中連在一起 – 就像下課鐘聲和下課。\n**記住：**古典制約就是建基於這個古老的想法。"},"source":"PDF3 p.10","options":[{"en":"Aristotle","tw":"亞里士多德"},{"en":"Pavlov","tw":"巴甫洛夫"},{"en":"Skinner","tw":"史金納"},{"en":"Plato","tw":"柏拉圖"}],"answerIndex":0,"correctAnswer":{"en":"Aristotle","tw":"亞里士多德"}},{"id":"T3-18","topicNo":3,"difficulty":"medium","type":"order","star":true,"question":{"en":"Put the steps of classical conditioning in order (Pavlov's dog).","tw":"把古典制約的步驟排成正確次序（巴甫洛夫的狗）。"},"explanation":{"en":"**Slides say:** Step 0: US → UR. Step 1: NS → no response. Step 2: NS + US → UR. Step 3: CS → CR.\n**In simple words:** Meat makes a dog drool. A bell alone does nothing. Ring the bell with the meat many times. Now the bell alone makes the dog drool.\n**Remember:** natural → nothing → pair → learned.","tw":"**投影片：**步驟 0：US → UR；步驟 1：NS → 沒有反應；步驟 2：NS + US → UR；步驟 3：CS → CR。\n**簡單來說：**肉令狗流口水；單是鈴聲沒有反應；鈴聲和肉一起出現很多次；之後單是鈴聲就令狗流口水。\n**記住：**天生 → 無反應 → 配對 → 學會。"},"source":"PDF3 p.20","tiles":{"en":["US → UR: meat makes the dog drool","NS → no response: bell alone","NS + US → UR: bell with meat, many times","CS → CR: bell alone makes it drool"],"tw":["US → UR：肉令狗流口水","NS → 沒有反應：只有鈴聲","NS + US → UR：鈴聲與肉多次一起出現","CS → CR：單是鈴聲就令狗流口水"]},"answerLen":{"en":4,"tw":4},"sep":{"en":"  |  ","tw":"  |  "},"correctAnswer":{"en":"US → UR: meat makes the dog drool  |  NS → no response: bell alone  |  NS + US → UR: bell with meat, many times  |  CS → CR: bell alone makes it drool","tw":"US → UR：肉令狗流口水  |  NS → 沒有反應：只有鈴聲  |  NS + US → UR：鈴聲與肉多次一起出現  |  CS → CR：單是鈴聲就令狗流口水"},"fig":"pavlov_steps"},{"id":"T3-19","topicNo":3,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Your partner always uses the same shampoo. Soon, just smelling that shampoo makes you happy. What is the CONDITIONED stimulus?","tw":"你的伴侶總是用同一款洗髮露。不久，單是聞到那洗髮露就令你開心。制約刺激（CS）是甚麼？"},"explanation":{"en":"**Slides say:** NS = smell of shampoo; US = romantic partner; UR = feel happy. After pairing: CS = smell of shampoo → CR = feel happy.\n**In simple words:** The smell was neutral, but it kept coming with someone you love, so now the smell alone makes you smile.\n**Trap:** the partner is the US (natural trigger), not the CS.","tw":"**投影片：**NS = 洗髮露香味；US = 伴侶；UR = 開心。配對後：CS = 洗髮露香味 → CR = 開心。\n**簡單來說：**香味本來沒有意義，但一直和你喜歡的人一起出現，現在單是香味就令你微笑。\n**陷阱：**伴侶是 US（天生的觸發），不是 CS。"},"source":"PDF3 p.21","options":[{"en":"The smell of the shampoo","tw":"洗髮露的香味"},{"en":"Your partner","tw":"你的伴侶"},{"en":"Feeling happy","tw":"感到開心"},{"en":"The shampoo bottle's price","tw":"洗髮露的價錢"}],"answerIndex":0,"correctAnswer":{"en":"The smell of the shampoo","tw":"洗髮露的香味"}},{"id":"T3-20","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"According to the slides, classical conditioning is commonly used in…","tw":"根據投影片，古典制約常用於……"},"explanation":{"en":"**Slides say:** Classical conditioning is commonly used in advertisements, learning, and treating fears or phobias.\n**In simple words:** An advert shows a drink with happy friends at the beach (US → happiness), so the drink (CS) starts to feel happy too.\n**Remember:** ads pair products with good feelings.","tw":"**投影片：**古典制約常用於廣告、學習和治療恐懼或恐懼症。\n**簡單來說：**廣告把飲品和一班開心的朋友在沙灘的畫面放在一起（US → 快樂），於是飲品（CS）也令人覺得快樂。\n**記住：**廣告把產品與好感覺配對。"},"source":"PDF3 p.22","options":[{"en":"Advertisements, learning, and treating fears or phobias","tw":"廣告、學習及治療恐懼或恐懼症"},{"en":"Only training circus animals","tw":"只用於訓練馬戲團動物"},{"en":"Only maths lessons","tw":"只用於數學課"},{"en":"Designing computer memory","tw":"設計電腦記憶體"}],"answerIndex":0,"correctAnswer":{"en":"Advertisements, learning, and treating fears or phobias","tw":"廣告、學習及治療恐懼或恐懼症"}},{"id":"T3-21","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A conditioned emotional response is a classical conditioning situation in which…","tw":"制約情緒反應是指古典制約中……"},"explanation":{"en":"**Slides say:** Conditioned emotional responses: the CR is an emotional reaction. They give rise to likes and dislikes, preferences and biases, by associating neutral stimuli with events that reflexively cause good or bad feelings (Watson, Little Albert).\n**In simple words:** Love for afternoon tea, fear of the dentist, hating a subject – many feelings are learned this way.\n**Trap:** \"strengthened by reward\" = operant conditioning.","tw":"**投影片：**制約情緒反應：CR 是一種情緒反應。中性刺激與自然引起好或壞感覺的事件連結，引致喜歡、討厭、偏好和偏見（華生，小艾伯特）。\n**簡單來說：**喜愛下午茶、害怕牙醫、討厭某一科 – 很多感覺都是這樣學來的。\n**陷阱：**「因獎勵而加強」是操作性制約。"},"source":"PDF3 p.30","options":[{"en":"The conditioned response is an emotional reaction, giving rise to likes, dislikes, preferences and biases","tw":"制約反應是一種情緒反應，引致喜歡、討厭、偏好和偏見"},{"en":"A behaviour is strengthened by a reward","tw":"行為因獎勵而加強"},{"en":"A child copies an adult's emotions on TV","tw":"兒童模仿電視中成人的情緒"},{"en":"Emotions are removed completely","tw":"情緒被完全消除"}],"answerIndex":0,"correctAnswer":{"en":"The conditioned response is an emotional reaction, giving rise to likes, dislikes, preferences and biases","tw":"制約反應是一種情緒反應，引致喜歡、討厭、偏好和偏見"},"photo":"little_albert"},{"id":"T3-22","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the slides' \"fear of the dentist office\" example, what was the NEUTRAL stimulus before conditioning?","tw":"在投影片「害怕牙醫診所」的例子中，制約前的中性刺激（NS）是甚麼？"},"explanation":{"en":"**Slides say:** US = dental exam with pain → UR = fear. NS = dentist office → no response. NS + US → fear. CS = dentist office → CR = fear.\n**In simple words:** The waiting room itself did nothing at first, but it kept coming with pain, so now just walking in makes you scared.\n**Remember:** the place becomes the trigger.","tw":"**投影片：**US = 帶來痛楚的牙科檢查 → UR = 害怕。NS = 牙醫診所 → 沒有反應。NS + US → 害怕。CS = 牙醫診所 → CR = 害怕。\n**簡單來說：**候診室起初沒有甚麼，但一直伴隨痛楚，現在一走進去就害怕。\n**記住：**地方本身變成觸發點。"},"source":"PDF3 p.33","options":[{"en":"The dentist office","tw":"牙醫診所"},{"en":"Pain from the dental exam","tw":"牙科檢查帶來的痛楚"},{"en":"Fear","tw":"害怕"},{"en":"The dentist's bill","tw":"牙醫的收費單"}],"answerIndex":0,"correctAnswer":{"en":"The dentist office","tw":"牙醫診所"}},{"id":"T3-23","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Class Exercise 1: you want your family to like your new partner, so you always meet at an expensive restaurant. What is the US?","tw":"課堂練習 1：你想家人喜歡你的新伴侶，所以每次都在豪華餐廳見面。US 是甚麼？"},"explanation":{"en":"**Slides say:** Step 0: US = eating at an expensive restaurant → UR = family feels happy. Step 1: NS = your partner → no response. Step 2: partner + restaurant → happy. Step 3: CS = partner → CR = family feels happy.\n**In simple words:** The nice dinner naturally makes the family happy. Your partner \"borrows\" that happy feeling by always being there.\n**Trap:** the partner starts as the NS and becomes the CS.","tw":"**投影片：**步驟 0：US = 在豪華餐廳用餐 → UR = 家人愉快。步驟 1：NS = 你的伴侶 → 沒有反應。步驟 2：伴侶 + 餐廳 → 愉快。步驟 3：CS = 伴侶 → CR = 家人愉快。\n**簡單來說：**豐富的晚餐天生令家人開心，伴侶每次都在場，就「借」了這份開心。\n**陷阱：**伴侶起初是 NS，後來變成 CS。"},"source":"PDF3 p.24","options":[{"en":"Eating at an expensive restaurant","tw":"在豪華餐廳用餐"},{"en":"Your new partner","tw":"你的新伴侶"},{"en":"Family members feeling happy","tw":"家人感到愉快"},{"en":"Saying goodbye","tw":"說再見"}],"answerIndex":0,"correctAnswer":{"en":"Eating at an expensive restaurant","tw":"在豪華餐廳用餐"}},{"id":"T3-24","topicNo":3,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Classical conditioning is best defined as learning to…","tw":"古典制約最佳的定義是學習……"},"explanation":{"en":"**Slides say:** Classical conditioning = learning to associate emotional or other automatic reactions with a new stimulus. Operant conditioning = learning a new (often complex) behaviour because of reinforcement or punishment.\n**In simple words:** Classical links a SIGNAL to an automatic reaction (lightning → you flinch before the thunder). Operant links an ACTION to its result.\n**Remember:** classical = stimulus–stimulus; operant = response–consequence.","tw":"**投影片：**古典制約 = 學習把情緒或其他自動反應與新刺激聯繫起來。操作性制約 = 因強化或懲罰而學習新的（常較複雜的）行為。\n**簡單來說：**古典把「信號」連結自動反應（見到閃電，未聞雷聲已縮一縮）；操作把「行動」連結結果。\n**記住：**古典 = 刺激–刺激；操作 = 反應–後果。"},"source":"PDF3 p.4","options":[{"en":"Associate emotional or other automatic reactions with a new stimulus","tw":"把情緒或其他自動反應與新刺激聯繫起來"},{"en":"Perform a new complex behaviour because of reinforcement","tw":"因強化而做出新的複雜行為"},{"en":"Copy a model's behaviour","tw":"模仿楷模的行為"},{"en":"Store information in long-term memory","tw":"把資訊存入長期記憶"}],"answerIndex":0,"correctAnswer":{"en":"Associate emotional or other automatic reactions with a new stimulus","tw":"把情緒或其他自動反應與新刺激聯繫起來"},"photo":"pavlov_dog"},{"id":"T3-25","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In \"love for afternoon tea\", what is the UNCONDITIONED stimulus?","tw":"在「喜愛下午茶」的例子中，非制約刺激（US）是甚麼？"},"explanation":{"en":"**Slides say:** US = friends and family → UR = happiness. NS = afternoon tea → no response. Afternoon tea + friends and family → happiness. CS = afternoon tea → CR = happiness.\n**In simple words:** Being with loved ones makes you happy naturally. Afternoon tea kept happening WITH them, so tea alone now feels happy.\n**Trap:** afternoon tea is the NS/CS, not the US.","tw":"**投影片：**US = 親朋摯友 → UR = 心情愉快。NS = 下午茶 → 沒有反應。下午茶 + 親朋摯友 → 愉快。CS = 下午茶 → CR = 愉快。\n**簡單來說：**與親友一起天生令人開心；下午茶總是和他們一起，所以單是下午茶也令人開心。\n**陷阱：**下午茶是 NS／CS，不是 US。"},"source":"PDF3 p.32","options":[{"en":"Friends and family","tw":"親朋摯友"},{"en":"Afternoon tea","tw":"下午茶"},{"en":"Happiness","tw":"心情愉快"},{"en":"The café's music","tw":"餐廳的音樂"}],"answerIndex":0,"correctAnswer":{"en":"Friends and family","tw":"親朋摯友"}},{"id":"T3-26","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is a characteristic of classical conditioning listed in the slides?","tw":"以下哪項是投影片列出的古典制約特點？"},"explanation":{"en":"**Slides say:** Characteristics: the CR is controlled by the autonomic nervous system, not voluntary; learning depends on external conditions – the learner is passive, the response is \"elicited\" by the stimulus, not \"emitted\"; the learner need not act to learn. Also: most of our daily learning is NOT like this!\n**In simple words:** You don't choose to flinch at thunder – it just happens to you.\n**Trap:** acting to get a reward = operant conditioning.","tw":"**投影片：**特點：CR 由自主神經系統控制，不受意志控制；學習取決於外在條件 – 學習者是被動的，反應由刺激「引發」，不是「自發」；學習者不必行動也能學會。另外：我們日常大部分學習並不是這樣！\n**簡單來說：**聽到雷聲縮一縮，不是你選擇的，而是自然發生。\n**陷阱：**為了獎勵而行動 = 操作性制約。"},"source":"PDF3 p.17","options":[{"en":"The learner is passive: the response is drawn out (elicited) by the stimulus, not freely emitted","tw":"學習者是被動的：反應由刺激「引發」，不是「自發」"},{"en":"The learner must act on the environment to get a reward","tw":"學習者必須對環境採取行動才能得到獎勵"},{"en":"It explains most of our everyday learning","tw":"它解釋了我們大部分的日常學習"},{"en":"The CR is under voluntary control","tw":"制約反應受意志控制"}],"answerIndex":0,"correctAnswer":{"en":"The learner is passive: the response is drawn out (elicited) by the stimulus, not freely emitted","tw":"學習者是被動的：反應由刺激「引發」，不是「自發」"}},{"id":"T3-27","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the slides' PE example, the teacher blows a whistle and students focus and stay quiet. Which is the UNCONDITIONED stimulus?","tw":"在投影片的體育課例子中，老師吹哨子，學生便專注安靜。非制約刺激（US）是甚麼？"},"explanation":{"en":"**Slides say:** PE teacher (NS) + whistle (US) → students focus and stay quiet (UR).\n**In simple words:** The whistle already makes students stop and listen. Over time, just seeing the PE teacher can make them settle down (the teacher becomes the CS).\n**Remember:** the trigger that works WITHOUT training is the US.","tw":"**投影片：**體育老師（NS）+ 哨子聲（US）→ 學生專注安靜（UR）。\n**簡單來說：**哨子本身已令學生停下來聽；日子久了，單是見到體育老師也會令他們安靜（老師變成 CS）。\n**記住：**不用訓練就有效的觸發是 US。"},"source":"PDF3 p.27","options":[{"en":"The whistle","tw":"哨子聲"},{"en":"The PE teacher","tw":"體育老師"},{"en":"Students focusing and being quiet","tw":"學生專注安靜"},{"en":"The basketball","tw":"籃球"}],"answerIndex":0,"correctAnswer":{"en":"The whistle","tw":"哨子聲"}},{"id":"T3-28","topicNo":3,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Lightning is always followed by thunder. After a while, you wince as soon as you SEE lightning. In this example, lightning has become the…","tw":"閃電之後總是打雷。一段時間後，你一「看到」閃電就縮一縮。在這例子中，閃電變成了……"},"explanation":{"en":"**Slides say:** Classical conditioning = learning to associate one stimulus with another: lightning + thunder; after repetition, seeing lightning → we wince, anticipating thunder.\n**In simple words:** Thunder (US) makes you wince naturally. Lightning keeps coming FIRST, so it becomes a warning signal (CS).\n**Remember:** the signal that comes first and gets learned = CS.","tw":"**投影片：**古典制約 = 學習兩個刺激之間的聯繫：閃電 + 雷聲；重複後，看到閃電 → 預期打雷而縮一縮。\n**簡單來說：**雷聲（US）天生令你縮一縮；閃電總是「先」出現，於是變成警告信號（CS）。\n**記住：**先出現、經學習而起作用的信號 = CS。"},"source":"PDF3 p.6","options":[{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"},{"en":"Unconditioned stimulus (US)","tw":"非制約刺激（US）"},{"en":"Unconditioned response (UR)","tw":"非制約反應（UR）"},{"en":"Reinforcer","tw":"強化物"}],"answerIndex":0,"correctAnswer":{"en":"Conditioned stimulus (CS)","tw":"制約刺激（CS）"}},{"id":"T3-29","topicNo":3,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Children dislike brushing their teeth. Parents let them use their favourite mango toothpaste, and gradually they like brushing. Using classical conditioning, what is the US?","tw":"孩子不喜歡刷牙。家長讓他們用最愛的芒果味牙膏，漸漸他們喜歡刷牙。以古典制約分析，US 是甚麼？"},"explanation":{"en":"**Slides say:** Class Exercise 3 (no answer given). [Tip] Using the slides' steps: US = mango flavour → UR = pleasure; NS = brushing teeth; NS + US many times → CS = brushing → CR = liking it.\n**In simple words:** The yummy taste is liked naturally. Brushing keeps coming with that taste, so brushing itself starts to feel nice.\n**Remember:** find what is liked WITHOUT learning – that's the US.","tw":"**投影片：**課堂練習 3（未提供答案）。[提示] 按投影片步驟：US = 芒果味 → UR = 喜悅；NS = 刷牙；NS + US 多次 → CS = 刷牙 → CR = 喜歡刷牙。\n**簡單來說：**好味道天生令人喜歡；刷牙總是和這味道一起，所以刷牙本身也變得愉快。\n**記住：**找出「不用學」也喜歡的東西 – 那就是 US。"},"source":"PDF3 p.28","options":[{"en":"The mango flavour they love","tw":"他們喜愛的芒果味道"},{"en":"Brushing teeth","tw":"刷牙"},{"en":"Liking to brush","tw":"喜歡刷牙"},{"en":"The toothbrush","tw":"牙刷"}],"answerIndex":0,"correctAnswer":{"en":"The mango flavour they love","tw":"他們喜愛的芒果味道"}},{"id":"T3-30","topicNo":3,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A maths teacher often uses shaming and ridicule. Students become anxious in maths, keep disliking it and avoid further study. This is an example of…","tw":"一位數學老師常常羞辱和嘲笑學生。學生在數學課感到焦慮，持續討厭數學並逃避進修。這是甚麼例子？"},"explanation":{"en":"**Slides say:** Exercise – students' embarrassment or extreme anxiety becomes associated with a maths class taught by a teacher who uses shaming and ridicule, leading to continuing negative feelings about the subject and avoidance of further study. The opposite example: Anna smiles and praises, so students enjoy English.\n**In simple words:** Maths class (NS) + humiliation (US → anxiety) → maths class alone (CS) → anxiety (CR).\n**Remember:** teachers' emotions get \"attached\" to their subject.","tw":"**投影片：**練習 – 老師常用羞辱和嘲笑，學生的尷尬或焦慮與數學課連結起來，令學生對該科持續有負面情緒並逃避進一步學習。相反例子：安娜常微笑讚賞，學生喜歡英文課。\n**簡單來說：**數學課（NS）+ 羞辱（US → 焦慮）→ 單是數學課（CS）→ 焦慮（CR）。\n**記住：**老師帶來的情緒會「黏」在所教的科目上。"},"source":"PDF3 p.34","options":[{"en":"A conditioned emotional response (classical conditioning)","tw":"制約情緒反應（古典制約）"},{"en":"Positive reinforcement of maths","tw":"數學的正增強"},{"en":"Flow","tw":"心流"},{"en":"Vicarious emotional learning (empathy)","tw":"替代情感學習（同理心）"}],"answerIndex":0,"correctAnswer":{"en":"A conditioned emotional response (classical conditioning)","tw":"制約情緒反應（古典制約）"}},{"id":"T4-01","topicNo":4,"difficulty":"easy","type":"mc","star":true,"question":{"en":"In operant conditioning, behaviour is controlled by its…","tw":"在操作性制約中，行為受甚麼控制？"},"explanation":{"en":"**Slides say:** Operant conditioning = a type of learning in which responses are controlled by their consequences. Reinforcement → behaviour increases; punishment → behaviour decreases.\n**In simple words:** You learn from what happens AFTER you act. Slide example: Sam answers a question, gets praised, and answers more often.\n**Remember:** ABC – Antecedent (before) → Behaviour → Consequence (after). Operant = the C.","tw":"**投影片：**操作性制約 = 反應行為受後果影響的學習。強化 → 行為增加；懲罰 → 行為減少。\n**簡單來說：**你從行動「之後」發生的事學習。投影片例子：Sam 回答問題後被稱讚，以後更常答問題。\n**記住：**前因 → 行為 → 後果；操作性制約講的是「後果」。"},"source":"PDF4 p.5","options":[{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"},{"en":"Antecedent stimuli only","tw":"只受前因刺激"},{"en":"Reflexes","tw":"反射"},{"en":"Genes","tw":"基因"}],"answerIndex":0,"correctAnswer":{"en":"Consequences (what happens after it)","tw":"後果（行為之後發生的事）"}},{"id":"T4-02","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Lawrence is often late. His teacher makes him clean all the desks after school each time. Now he is late less often. This is…","tw":"Lawrence 經常遲到，老師每次都要他放學後清潔所有桌子。現在他少了遲到。這是……"},"explanation":{"en":"**Slides say:** This is the slides' revision exercise. Positive punishment = present something negative to decrease behaviour.\n**In simple words:** Ask two questions. (1) Did lateness go up or down? Down → punishment. (2) Was something added or taken away? ADDED (cleaning desks) → positive. Answer: positive punishment.\n**Trap:** \"positive\" means ADD, not \"good\".","tw":"**投影片：**這是投影片的溫習練習。正懲罰 = 加入負面事物以減少行為。\n**簡單來說：**問兩個問題：(1) 遲到增加還是減少？減少 → 懲罰。(2) 加入還是移走東西？「加入」（清潔桌子）→ 正。答案：正懲罰。\n**陷阱：**「正」= 加入，不是「好」。"},"source":"PDF4 p.16","options":[{"en":"Positive punishment","tw":"正懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Negative reinforcement","tw":"負增強"}],"answerIndex":0,"correctAnswer":{"en":"Positive punishment","tw":"正懲罰"},"fig":"reinforce_grid"},{"id":"T4-03","topicNo":4,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Students do NOT have to do extra practice if they score more than 80 in the exam. This is…","tw":"考試超過 80 分的學生就「不用」做額外練習。這是……"},"explanation":{"en":"**Slides say:** Negative reinforcement = remove something negative so the behaviour increases. Slide example: students do not need to do extra practice if they score more than 80.\n**In simple words:** (1) Studying goes UP → reinforcement. (2) Something unpleasant is TAKEN AWAY (extra practice) → negative. Everyday example: the car's seatbelt beep stops when you buckle up, so you buckle up more.\n**Remember:** −R = remove the nasty.","tw":"**投影片：**負增強 = 移除負面事物，令行為增加。投影片例子：考試超過 80 分就不用做額外練習。\n**簡單來說：**(1) 溫習增加 → 強化；(2) 移走不愉快的事（額外練習）→ 負。生活例子：扣好安全帶後警告聲就停，所以你更會扣安全帶。\n**記住：**負增強 = 移走討厭的事。"},"source":"PDF4 p.26","options":[{"en":"Negative reinforcement","tw":"負增強"},{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive reinforcement","tw":"正增強"},{"en":"Positive punishment","tw":"正懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Negative reinforcement","tw":"負增強"},"fig":"reinforce_grid"},{"id":"T4-04","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Recess is taken away after a noisy class. This is…","tw":"課堂吵鬧後取消小息。這是……"},"explanation":{"en":"**Slides say:** Negative punishment = remove something positive to decrease behaviour. Slide example: taking away recess time after a noisy class.\n**In simple words:** (1) Noise goes DOWN → punishment. (2) Something they LIKE is taken away (recess) → negative.\n**Remember:** −P = remove the nice.","tw":"**投影片：**負懲罰 = 移除喜愛的事物以減少行為。投影片例子：課堂吵鬧後取消小息。\n**簡單來說：**(1) 吵鬧減少 → 懲罰；(2) 移走「喜歡」的東西（小息）→ 負。\n**記住：**負懲罰 = 移走喜歡的東西。"},"source":"PDF4 p.22","options":[{"en":"Negative punishment","tw":"負懲罰"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Extinction","tw":"消退"}],"answerIndex":0,"correctAnswer":{"en":"Negative punishment","tw":"負懲罰"},"fig":"reinforce_grid"},{"id":"T4-05","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A teacher gives a candy whenever a student attempts to answer a question. This is…","tw":"學生每次嘗試答問題，老師就給糖果。這是……"},"explanation":{"en":"**Slides say:** Positive reinforcement = give something that reinforces good behaviour. Slide example: a teacher gives candy whenever students attempt to answer, so they become more eager to answer. Discipline relying mostly on it is usually very effective.\n**In simple words:** (1) Answering goes UP → reinforcement. (2) Something nice is ADDED (candy) → positive.\n**Remember:** +R = add the nice.","tw":"**投影片：**正增強 = 給予強化良好行為的東西。投影片例子：學生每次嘗試答問題，老師就給糖果，學生更願意回答。主要依賴正增強的紀律通常非常有效。\n**簡單來說：**(1) 答問題增加 → 強化；(2)「加入」好東西（糖果）→ 正。\n**記住：**正增強 = 加入好東西。"},"source":"PDF4 p.25","options":[{"en":"Positive reinforcement","tw":"正增強"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Positive punishment","tw":"正懲罰"},{"en":"Classical conditioning","tw":"古典制約"}],"answerIndex":0,"correctAnswer":{"en":"Positive reinforcement","tw":"正增強"},"fig":"reinforce_grid"},{"id":"T4-06","topicNo":4,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Common trap: \"negative reinforcement\" means…","tw":"常見陷阱：「負增強」的意思是……"},"explanation":{"en":"**Slides say:** Reinforcement → strengthens (increases) behaviour; punishment → weakens it. Positive = present (+); negative = remove (−).\n**In simple words:** Reinforcement ALWAYS makes behaviour go up. \"Negative\" only means \"take away\". So negative reinforcement takes away something annoying so you do the behaviour MORE.\n• +R add nice · −R remove nasty · +P add nasty · −P remove nice","tw":"**投影片：**強化 → 行為增加；懲罰 → 行為減少。正 = 給予（+）；負 = 移除（−）。\n**簡單來說：**強化「永遠」令行為增加。「負」只是「移走」。所以負增強是移走討厭的事，令你「更多」做這個行為。\n• 正增強：加好的 · 負增強：移走壞的 · 正懲罰：加壞的 · 負懲罰：移走好的"},"source":"PDF4 p.11","options":[{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"},{"en":"A type of punishment","tw":"一種懲罰"},{"en":"Adding something unpleasant to decrease a behaviour","tw":"加入不愉快的事物以減少行為"},{"en":"Removing something pleasant to decrease a behaviour","tw":"移除愉快的事物以減少行為"}],"answerIndex":0,"correctAnswer":{"en":"Removing something unpleasant to INCREASE a behaviour","tw":"移除不愉快的事物，以「增加」行為"},"fig":"reinforce_grid"},{"id":"T4-07","topicNo":4,"difficulty":"medium","type":"order","star":true,"question":{"en":"Thorndike's law: behaviours followed by a reward get stronger; unrewarded ones get weaker. Tap the tiles to name the law.","tw":"桑代克的定律：有獎勵的行為會加強，沒有獎勵的會減弱。按次序點選字卡，說出定律名稱。"},"explanation":{"en":"**Slides say:** Thorndike's Law of Effect – the tendency to do a behaviour is strengthened if it is followed by a reward, and weakened if it is not rewarded.\n**In simple words:** His cats in puzzle boxes repeated the moves that got them out to the food and dropped the moves that didn't. A good effect makes an action stronger.\n**Remember:** Law of EFFECT = the effect (result) decides if you repeat it.","tw":"**投影片：**桑代克的效果定律 – 行為之後有獎勵，做該行為的傾向便增強；沒有獎勵便減弱。\n**簡單來說：**迷箱裏的貓會重複能逃出去吃食物的動作，放棄沒用的動作。好的「效果」令行為加強。\n**記住：**效果定律 =「效果」（結果）決定你會不會重複。"},"source":"PDF4 p.5","tiles":{"en":["Law","of","Effect","Reinforcement","Exercise"],"tw":["效果","定律","強化","練習"]},"answerLen":{"en":3,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Law of Effect","tw":"效果定律"},"photo":"thorndike"},{"id":"T4-08","topicNo":4,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Thorndike studied cats escaping from…","tw":"桑代克研究貓從甚麼逃出？"},"explanation":{"en":"**Slides say:** Thorndike is famous for his cat \"puzzle boxes\": the cat must find a way out of the box to reach the food.\n**In simple words:** By trial and error the cat learns which action opens the box, and gets faster each time.\n**Trap:** the Skinner box (press a lever for food) came later, from Skinner.","tw":"**投影片：**桑代克以貓的「迷箱」聞名：貓要找方法逃出箱子才能吃到食物。\n**簡單來說：**貓透過嘗試錯誤學會哪個動作能打開箱子，一次比一次快。\n**陷阱：**按桿得食物的史金納箱是後來史金納設計的。"},"source":"PDF4 p.6","options":[{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"},{"en":"Skinner boxes","tw":"史金納箱"},{"en":"A Bobo doll room","tw":"吹氣娃娃房間"},{"en":"The Three Mountains model","tw":"三山模型"}],"answerIndex":0,"correctAnswer":{"en":"Puzzle boxes","tw":"迷箱（puzzle boxes）"},"photo":"puzzle_box"},{"id":"T4-09","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who coined the term \"operant conditioning\" and built a box with a lever that gives food?","tw":"誰創造「操作性制約」一詞，並設計了按桿得食物的箱子？"},"explanation":{"en":"**Slides say:** B. F. Skinner created the term \"operant conditioning\" and is famous for the Skinner Box: an animal operates a lever to obtain food or water as a reinforcer.\n**In simple words:** When a rat learns that pressing the lever brings food, it presses more often.\n**Remember:** Skinner = operant + lever box. Pavlov = classical. Thorndike = puzzle box.","tw":"**投影片：**史金納創造了「操作性制約」一詞，以史金納箱聞名：動物按操作桿取得食物或水作為強化物。\n**簡單來說：**老鼠發現按桿有食物，就會更常按桿。\n**記住：**史金納 = 操作性制約 + 按桿箱；巴甫洛夫 = 古典制約；桑代克 = 迷箱。"},"source":"PDF4 p.8","options":[{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},{"en":"Edward Thorndike","tw":"桑代克"},{"en":"Ivan Pavlov","tw":"巴甫洛夫"},{"en":"Albert Bandura","tw":"班杜拉"}],"answerIndex":0,"correctAnswer":{"en":"B. F. Skinner","tw":"史金納（B. F. Skinner）"},"photo":"skinner_box"},{"id":"T4-10","topicNo":4,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Money and gold stars (tokens) are examples of…","tw":"金錢和金星（代幣）屬於……"},"explanation":{"en":"**Slides say:** Primary reinforcers satisfy biological needs (water, food). Secondary reinforcers are LEARNED – they get their power from association with primary reinforcers (money, gold stars/tokens).\n**In simple words:** Money is only paper, but we learned it buys food. A gold star is only a sticker, but we learned it means praise.\n**Remember:** primary = body needs; secondary = learned value.","tw":"**投影片：**主要強化物滿足生理需要（水、食物）；次要強化物是「學來的」，因與主要強化物有關聯而有效（金錢、金星／代幣）。\n**簡單來說：**錢只是紙，但我們學會了錢能買食物；金星只是貼紙，但我們學會了它代表讚賞。\n**記住：**主要 =
