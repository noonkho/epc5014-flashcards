<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPC5014 Flashcards</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1d2330; --muted:#5d6678; --line:#dfe3ea;
  --accent:#2f5bd3; --accent-ink:#ffffff; --good:#1c8a4c; --good-bg:#e5f5ec; --bad:#c23b3b; --bad-bg:#fbeaea;
  --warn:#9a6a00; --chip:#eef1f6; --shadow:0 2px 10px rgba(20,30,50,.08); --star:#d39b00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6f95ff; --accent-ink:#0d1220; --good:#4cc787; --good-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1a;
    --warn:#e6b84a; --chip:#252c38; --shadow:0 2px 12px rgba(0,0,0,.35); --star:#f2c14e; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.3rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.btn.small{padding:4px 10px;min-height:32px;font-size:.875rem}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.stat:last-child{grid-column:span 2}
@media(min-width:600px){.stats{grid-template-columns:repeat(5,1fr)}.stat:last-child{grid-column:auto}}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.875rem;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.good>i{background:var(--good)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
details.card{padding:12px 18px}
summary{cursor:pointer;font-weight:600}
fieldset{border:0;padding:0;margin:10px 0}
legend{font-size:.875rem;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.875rem;cursor:pointer}
.chip input{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.875rem;color:var(--muted);margin-bottom:8px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px}
.tag.easy{color:var(--good)} .tag.medium{color:var(--warn)} .tag.hard{color:var(--bad)}
.star{color:var(--star)}
.q{font-size:1.3rem;font-weight:600;margin:4px 0 14px;outline:none}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:hover:not([disabled]),.tile:hover:not([disabled]){border-color:var(--accent)}
.opt .k,.tile .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.875rem;font-weight:700}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{border-color:var(--accent)}
.opt[disabled],.tile[disabled]{cursor:default}
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.built.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.built.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;min-height:40px;cursor:pointer;text-align:left}
.tile.placed{border-color:var(--accent)}
.tiles .tile[disabled]{opacity:.35}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb .src{font-size:.875rem;color:var(--muted);margin-top:6px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:.875rem;color:var(--muted)}
.center{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res-item{border-bottom:1px solid var(--line);padding:10px 0}
.res-item:last-child{border:0}
.ok-t{color:var(--good);font-weight:700} .no-t{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90vw;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:19;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.bar>i{transition:none}}
.warn{background:var(--bad-bg);border-radius:10px;padding:8px 12px;font-size:.875rem;display:none}
.fig{margin:10px 0;padding:8px;background:var(--card);border-radius:10px;overflow-x:auto;cursor:zoom-in}
.fig svg{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;overflow:visible}
.fig.zoom{cursor:zoom-out}.fig.zoom svg{width:520px;max-width:none}
.fig figcaption{display:none;text-align:center;font-size:.75rem;color:var(--muted)}
@media(max-width:520px){.card{padding:14px}.fb{padding:10px}.fig{padding:6px 0}.fig figcaption{display:block}}
.fig text{font-size:12px;fill:var(--ink);text-anchor:middle}
.fig .e{text-anchor:end}.fig .s{text-anchor:start}
.fig .tb{font-weight:700}.fig .tl{font-size:16px;font-weight:700}
.fig .ts{font-size:10.5px;fill:var(--muted)}.fig .tsm{font-size:9.5px}
.fig .gt{fill:var(--good)}.fig .rt{fill:var(--bad)}.fig .wt{fill:var(--warn)}
.fig .bx{fill:var(--chip);stroke:var(--line);stroke-width:1.5}
.fig .bxa{fill:var(--card);stroke:var(--accent);stroke-width:2}
.fig .bxg{fill:var(--good-bg);stroke:var(--good);stroke-width:1.5}
.fig .bxr{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.5}
.fig .dash{stroke-dasharray:5 4}.fig .op{fill-opacity:.55}
.fig .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
.fig .lna{stroke:var(--accent);stroke-width:2.5;fill:none}
.fig .lng{stroke:var(--good);stroke-width:2.5;fill:none}
.fig .lnw{stroke:var(--warn);stroke-width:2.5;fill:none}
.fig .ahp,.fig .dot{fill:var(--muted)}
.photo{display:flex;gap:12px;align-items:center;margin:10px 0}
.photo img{width:96px;height:auto;border-radius:8px;flex:none;background:#fff}
.photo figcaption{font-size:.8rem;color:var(--muted);min-width:0}
.photo figcaption b{color:var(--ink)}
.photo a{color:var(--accent)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:.875rem}
.boxes div{background:var(--chip);border-radius:8px;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">EPC5014 Flashcards</h1>
    <div class="row">
      <div class="row" role="group" aria-label="Language">
        <button class="btn small" id="lang-en" aria-pressed="true">EN</button>
        <button class="btn small" id="lang-tw" aria-pressed="false">繁中</button>
      </div>
    </div>
  </header>

  <div class="warn" id="storeWarn" role="alert"></div>

  <section class="stats" aria-label="Progress">
    <div class="stat"><b id="sScore">0</b><span data-t="score"></span></div>
    <div class="stat"><b id="sStreak">0</b><span data-t="streak"></span></div>
    <div class="stat"><b id="sAnswered">0</b><span data-t="answered"></span></div>
    <div class="stat"><b id="sAcc">–</b><span data-t="accuracy"></span></div>
    <div class="stat"><b id="sMastery">0%</b><span data-t="mastery"></span></div>
  </section>
  <div class="bar good" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="masteryBar" aria-label="Mastery"><i></i></div>

  <div class="row" style="margin-top:12px" role="group" aria-label="Mode">
    <button class="btn" id="modeStudy" aria-pressed="true"></button>
    <button class="btn" id="modeTest" aria-pressed="false"></button>
    <button class="btn" id="modeStats" aria-pressed="false"></button>
  </div>

  <p class="hint" id="syncNote"></p>
  <div class="card" id="confirmBox" role="alertdialog" aria-labelledby="confirmMsg" hidden>
    <p id="confirmMsg"></p>
    <div class="row"><button class="btn primary" id="confirmYes"></button><button class="btn" id="confirmNo"></button></div>
  </div>
  <details class="card" id="filters">
    <summary data-t="filters"></summary>
    <fieldset><legend data-t="topics"></legend><div class="chips" id="fTopics"></div></fieldset>
    <fieldset><legend data-t="difficulty"></legend><div class="chips" id="fDiff"></div></fieldset>
    <fieldset><legend data-t="qtype"></legend><div class="chips" id="fType"></div></fieldset>
    <fieldset><legend data-t="more"></legend><div class="chips" id="fMore"></div></fieldset>
    <fieldset><legend data-t="schedule"></legend>
      <div class="chips" id="fSched"></div>
      <p class="hint" data-t="schedHint"></p>
    </fieldset>
    <div class="row"><span class="hint" id="poolCount"></span>
      <button class="btn small" id="applyFilters" data-t="apply"></button>
      <button class="btn small" id="resetBtn" data-t="reset"></button></div>
  </details>

  <main id="view" aria-live="polite"></main>
  <p class="hint center" data-t="keys"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const BANK = [{"id":"T1-01","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Using an EXISTING schema to make sense of a new experience is called…","tw":"運用「既有」基模去解釋新經驗，稱為……"},"explanation":{"en":"**Slides say:** Assimilation = interpret new experiences using EXISTING schemas.\n**In simple words:** You already have a \"box\" in your head for an idea. You put the new thing into that same box without changing the box. Example: you know \"dog\"; you meet a poodle for the first time and still call it \"dog\".\n**Remember:** a**SS**imilate = **S**ame **S**chema. a**CC**ommodate = **C**hange the box.","tw":"**投影片：**同化 = 運用「既有」基模解釋新經驗。\n**簡單來說：**你腦中已有一個「盒子」裝某個概念，新東西直接放進同一個盒子，盒子不用改。例：你認識「狗」，第一次見到貴婦狗，也叫牠「狗」。\n**記住：**同化 = 照舊用；調適 = 要改盒子。"},"source":"PDF1 p.9","options":[{"en":"Assimilation","tw":"同化（assimilation）"},{"en":"Accommodation","tw":"調適（accommodation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"}],"answerIndex":0,"correctAnswer":{"en":"Assimilation","tw":"同化（assimilation）"},"fig":"schema_cycle"},{"id":"T1-02","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Aaron calls every four-legged animal \"dog\". Dad says \"No, that is a horse\", and Aaron builds a new \"horse\" schema. Which Piaget process is this?","tw":"Aaron 把所有四腳動物都叫「狗」。爸爸說「不，那是馬」，Aaron 於是建立了新的「馬」基模。這是皮亞傑的哪個過程？"},"explanation":{"en":"**Slides say:** Accommodation = modify existing schemas (or create a new one) to explain new experiences. The slides use exactly this Aaron example.\n**In simple words:** The horse did not fit Aaron's \"dog\" box, so he made a NEW \"horse\" box. Before that he felt confused – that confusion is disequilibrium.\n**Trap:** if Aaron kept calling the horse \"dog\", that would be assimilation.","tw":"**投影片：**調適 = 修正既有基模（或建立新基模）去解釋新經驗。投影片正正用了 Aaron 這個例子。\n**簡單來說：**馬放不進 Aaron 的「狗」盒子，他便新開一個「馬」盒子。之前他感到困惑，那就是失衡。\n**陷阱：**如果 Aaron 繼續叫馬做「狗」，那才是同化。"},"source":"PDF1 p.21","options":[{"en":"Accommodation","tw":"調適（accommodation）"},{"en":"Assimilation","tw":"同化（assimilation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Centration","tw":"中心化（centration）"}],"answerIndex":0,"correctAnswer":{"en":"Accommodation","tw":"調適（accommodation）"},"fig":"schema_cycle"},{"id":"T1-03","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The confused feeling when existing schemas CANNOT assimilate a new experience is called…","tw":"既有基模「無法」同化新經驗時所產生的困惑感，稱為……"},"explanation":{"en":"**Slides say:** Disequilibrium occurs if existing schemas cannot assimilate new experiences. It is the pre-requisite of new knowledge.\n**In simple words:** \"Dis-\" means \"not\", so disequilibrium = \"not balanced\". It is the \"Huh? That doesn't fit!\" feeling. Example: Aaron seeing a horse that is not quite a dog.\n**Remember:** this confused feeling is GOOD – it pushes you to learn, so teachers create it on purpose.","tw":"**投影片：**既有基模無法同化新經驗時，便會出現失衡。失衡是學習新知識的先決條件。\n**簡單來說：**失衡就是「咦？對不上！」的感覺。例：Aaron 見到一隻像狗又不是狗的馬。\n**記住：**這種困惑是好事，它推動學習，所以老師會刻意製造失衡。"},"source":"PDF1 p.10","options":[{"en":"Disequilibrium","tw":"失衡（disequilibrium）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"}],"answerIndex":0,"correctAnswer":{"en":"Disequilibrium","tw":"失衡（disequilibrium）"},"fig":"schema_cycle"},{"id":"T1-04","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the correct order of Piaget's four stages?","tw":"皮亞傑四個認知發展階段的正確次序是？"},"explanation":{"en":"**Slides say:** Sensorimotor (0–2) → Preoperational (2–7) → Concrete operational (7–11) → Formal operational (11/12+).\n**In simple words:** Babies learn with senses and hands. Young kids start using words and pretend play. School kids reason about real things. Teenagers can think about \"what if\" ideas.\n**Remember:** \"**S**ome **P**eople **C**an **F**ly\" = S-P-C-F.","tw":"**投影片：**感覺運動期（0–2）→ 前運思期（2–7）→ 具體運思期（7–11）→ 形式運思期（11/12 歲以上）。\n**簡單來說：**嬰兒用感官和手去認識世界；幼童開始用語言和扮演遊戲；小學生能對實物推理；青少年能思考「如果……」的抽象問題。\n**記住：**「感 → 前 → 具 → 形」：先感覺，後符號，再具體，最後抽象。"},"source":"PDF1 p.28","options":[{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"},{"en":"Preoperational → Sensorimotor → Formal operational → Concrete operational","tw":"前運思期 → 感覺運動期 → 形式運思期 → 具體運思期"},{"en":"Sensorimotor → Concrete operational → Preoperational → Formal operational","tw":"感覺運動期 → 具體運思期 → 前運思期 → 形式運思期"},{"en":"Concrete operational → Sensorimotor → Preoperational → Formal operational","tw":"具體運思期 → 感覺運動期 → 前運思期 → 形式運思期"}],"answerIndex":0,"correctAnswer":{"en":"Sensorimotor → Preoperational → Concrete operational → Formal operational","tw":"感覺運動期 → 前運思期 → 具體運思期 → 形式運思期"},"fig":"piaget_stairs"},{"id":"T1-05","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"A baby searches for a ball after it rolls under the sofa. Which milestone does this show?","tw":"嬰兒在球滾到梳化底後會去找它。這顯示了哪一個里程碑？"},"explanation":{"en":"**Slides say:** Object permanence = knowing that something continues to exist even when it is out of sight (e.g. looking for a lost ball). Sensorimotor stage, 0–2.\n**In simple words:** \"Permanent\" means it stays. The baby knows the ball is still under the sofa, so she looks for it.\n**Trap:** the slides' film shows a younger baby who thinks a hidden toy no longer exists – that baby LACKS object permanence.","tw":"**投影片：**物體恆存 = 知道東西看不見時仍然存在（例如找丟失的球）。屬感覺運動期（0–2 歲）。\n**簡單來說：**嬰兒知道球仍在梳化底，所以會去找。\n**陷阱：**投影片影片中，較小的嬰兒以為看不見的玩具已經不存在，那是「缺乏」物體恆存。"},"source":"PDF1 p.29","options":[{"en":"Object permanence","tw":"物體恆存（object permanence）"},{"en":"Conservation","tw":"守恆（conservation）"},{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"},{"en":"Reversibility","tw":"可逆性（reversibility）"}],"answerIndex":0,"correctAnswer":{"en":"Object permanence","tw":"物體恆存（object permanence）"}},{"id":"T1-06","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In hide-and-seek, a child covers only his own eyes, thinking the seeker cannot see him. Which error is this?","tw":"玩捉迷藏時，孩子只遮著自己的眼睛，以為對方看不到他。這是哪種錯誤？"},"explanation":{"en":"**Slides say:** Egocentric = cannot see the world from others' point of view. The slides use this hide-and-seek example (Preoperational, 2–7).\n**In simple words:** \"Ego\" means \"me\". The child thinks: \"I can't see you, so you can't see me.\" Another slide example: a child nods \"yes\" on the phone, forgetting you can't see them.\n**Remember:** Piaget's Three Mountains task also tests egocentrism.","tw":"**投影片：**自我中心 = 無法從別人的角度看世界。投影片正正用了這個捉迷藏例子（前運思期，2–7 歲）。\n**簡單來說：**孩子心想：「我看不見你，你也看不見我。」投影片另一例：孩子講電話時點頭說「是」，忘了對方看不見。\n**記住：**皮亞傑的三山實驗也是測試自我中心。"},"source":"PDF1 p.36","options":[{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Centration","tw":"中心化（centration）"},{"en":"Irreversibility","tw":"不可逆性（irreversibility）"},{"en":"Lack of object permanence","tw":"缺乏物體恆存"}],"answerIndex":0,"correctAnswer":{"en":"Egocentrism","tw":"自我中心（egocentrism）"}},{"id":"T1-07","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A child says the TALL thin glass has more juice than the short wide glass (same amount). Focusing on only ONE feature (height) is called…","tw":"孩子說高瘦杯的果汁比矮闊杯多（其實份量一樣）。只注意「一個」特徵（高度）的錯誤稱為……"},"explanation":{"en":"**Slides say:** Centration = concentrating on ONE aspect of a stimulus while ignoring other features (\"if one object looks taller, it is bigger\"). With irreversibility, it causes lack of conservation (Preoperational).\n**In simple words:** The child looks only at how TALL the juice is and forgets how WIDE the glass is.\n**Remember:** Concrete operational children (7–11) know the amount stays the same – that is conservation.","tw":"**投影片：**中心化 = 只注意刺激的「一個」方面而忽略其他特徵（「看起來較高的就較大」）。加上不可逆性，就會守恆失敗（前運思期）。\n**簡單來說：**孩子只看果汁有多「高」，忘了杯子有多「闊」。\n**記住：**具體運思期（7–11 歲）的孩子明白份量不變，這就是守恆。"},"source":"PDF1 p.39","options":[{"en":"Centration","tw":"中心化（centration）"},{"en":"Egocentrism","tw":"自我中心（egocentrism）"},{"en":"Reversibility","tw":"可逆性（reversibility）"},{"en":"Accommodation","tw":"調適（accommodation）"}],"answerIndex":0,"correctAnswer":{"en":"Centration","tw":"中心化（centration）"}},{"id":"T1-08","topicNo":1,"difficulty":"medium","type":"order","star":false,"question":{"en":"Tap the tiles to name Piaget's task where a child picks the photo that shows what a doll on the OTHER side of the table can see.","tw":"按次序點選字卡，說出皮亞傑讓孩子選出「桌子對面洋娃娃」所見照片的實驗名稱。"},"explanation":{"en":"**Slides say:** In the Three Mountains Problem, a child chooses the photo of what a doll on the opposite side of the table would see.\n**In simple words:** Young children pick the photo of what THEY see, not what the doll sees. They can't yet imagine another person's view.\n**Remember:** Three Mountains → tests egocentrism → Preoperational stage (2–7).","tw":"**投影片：**三山實驗中，孩子要選出坐在桌子對面的洋娃娃會看到的照片。\n**簡單來說：**年幼的孩子會選「自己」看到的照片，而不是洋娃娃看到的，因為他們還未能想像別人的角度。\n**記住：**三山實驗 → 測試自我中心 → 前運思期（2–7 歲）。"},"source":"PDF1 p.37","tiles":{"en":["Three","Mountains","Problem","Conservation","Hidden"],"tw":["三山","實驗","守恆","迷箱"]},"answerLen":{"en":3,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Three Mountains Problem","tw":"三山實驗"}},{"id":"T1-09","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which stage: the child thinks logically about objects that are PRESENT and has conservation, decentration and reversibility, but cannot solve complex problems systematically?","tw":"哪個階段：孩子能對「眼前」事物作邏輯思考，已有守恆、去中心化和可逆性，但未能有系統地解決複雜問題？"},"explanation":{"en":"**Slides say:** Concrete operational (7–11): thinks logically about objects that are PRESENT and already understands conservation, decentration and reversibility. Errors: works only with familiar objects; can't systematically work through complex problems.\n**In simple words:** \"Concrete\" = real things you can see and touch. Example: the child knows a tall glass and a short glass can hold the same amount of juice.\n**Remember:** concrete = real objects; formal = abstract ideas.","tw":"**投影片：**具體運思期（7–11 歲）：能對「眼前」事物作邏輯思考，已明白守恆、去中心化和可逆性。錯誤：只限熟悉事物；未能系統地解決複雜問題。\n**簡單來說：**「具體」= 看得見、摸得到的實物。例：孩子知道高杯和矮杯可以裝同樣多的果汁。\n**記住：**具體 = 實物；形式 = 抽象概念。"},"source":"PDF1 p.43","options":[{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"},{"en":"Preoperational (2–7)","tw":"前運思期（2–7 歲）"},{"en":"Formal operational (11/12+)","tw":"形式運思期（11/12 歲以上）"},{"en":"Sensorimotor (0–2)","tw":"感覺運動期（0–2 歲）"}],"answerIndex":0,"correctAnswer":{"en":"Concrete operational (7–11)","tw":"具體運思期（7–11 歲）"},"fig":"piaget_stairs"},{"id":"T1-10","topicNo":1,"difficulty":"hard","type":"mc","star":true,"question":{"en":"According to Piaget, which is TRUE about the formal operational stage?","tw":"根據皮亞傑，以下哪項關於形式運思期的描述正確？"},"explanation":{"en":"**Slides say:** Formal operational = abstract and systematic thinking (\"If… then…\"). Piaget believed reaching this stage, unlike the other stages, is NOT universal.\n**In simple words:** Everyone passes through the first three stages, but not everyone fully reaches this last one. Example of formal thinking (from the slides): \"David is taller than Peter and shorter than Eve – who is tallest?\"\n**Trap:** \"only familiar, present objects\" describes the CONCRETE stage.","tw":"**投影片：**形式運思期 = 抽象和系統的思考（「如果……就……」）。皮亞傑認為，與其他階段不同，達到此階段並不具普遍性。\n**簡單來說：**人人都會經過前三個階段，但並非人人能完全達到最後一個。投影片的例子：「David 比 Peter 高、比 Eve 矮，誰最高？」\n**陷阱：**「只限熟悉、眼前的事物」是「具體」運思期。"},"source":"PDF1 p.46","options":[{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"},{"en":"It is the stage where egocentrism is strongest","tw":"這是自我中心最強的階段"},{"en":"Children can only reason about familiar, present objects","tw":"兒童只能對熟悉、眼前的事物推理"},{"en":"It starts at age 7","tw":"從 7 歲開始"}],"answerIndex":0,"correctAnswer":{"en":"Not everyone reaches it (it is not universal)","tw":"並非人人都能達到（不具普遍性）"},"fig":"piaget_stairs"},{"id":"T1-11","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"When does the formal operational stage begin, according to the Topic 1 slides?","tw":"根據 Topic 1 投影片，形式運思期何時開始？"},"explanation":{"en":"**Slides say:** One slide lists the formal stage as \"age 12 onwards\"; later slides say \"age 11 onwards\". The concrete stage ends at 11.\n**In simple words:** The slides disagree with themselves, so both ages are \"correct\" for this course.\n**Exam tip:** write \"11/12 onwards\" or mention both ages.","tw":"**投影片：**有一張投影片寫形式運思期由「12 歲以上」開始，後面幾張寫「11 歲以上」。具體運思期在 11 歲結束。\n**簡單來說：**投影片前後不一，所以兩個年齡在這科都算正確。\n**應試提示：**答「11/12 歲以上」，或兩個都寫。"},"source":"PDF1 p.28","options":[{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"},{"en":"Age 7 onwards","tw":"7 歲以上"},{"en":"Age 2 onwards","tw":"2 歲以上"},{"en":"Age 15 onwards","tw":"15 歲以上"}],"answerIndex":0,"correctAnswer":{"en":"Around 11–12 onwards (the slides show both \"11\" and \"12\")","tw":"約 11–12 歲以上（投影片同時出現「11」和「12」）"}},{"id":"T1-12","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"All dogs have four legs. Boxer is a dog. So Boxer has four legs.\" This is…","tw":"「所有狗都有四條腿。Boxer 是狗。所以 Boxer 有四條腿。」這是……"},"explanation":{"en":"**Slides say:** Deductive reasoning = use a general rule to solve a specific case. The slides use this Boxer example. Inductive reasoning = make a general rule from specific examples.\n**In simple words:** Deductive goes DOWN from a rule to one case. Inductive goes UP from many examples to a rule. Inductive example: \"Every swan I've seen is white, so all swans are white.\"\n**Remember:** DEductive = Down.","tw":"**投影片：**演繹推理 = 用一般原則解決特定個案，投影片正正用了 Boxer 這個例子。歸納推理 = 從具體例子歸納出一般原則。\n**簡單來說：**演繹是由原則「向下」推到個案；歸納是由很多例子「向上」得出原則。歸納例子：「我見過的天鵝都是白色，所以天鵝都是白色。」\n**記住：**演繹 = 由上而下。"},"source":"PDF1 p.44","options":[{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"},{"en":"Inductive reasoning","tw":"歸納推理（inductive reasoning）"},{"en":"Centration","tw":"中心化"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"}},{"id":"T1-13","topicNo":1,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which is a WEAKNESS of Piaget's theory listed in the slides?","tw":"以下哪項是投影片列出的皮亞傑理論「缺點」？"},"explanation":{"en":"**Slides say:** Weaknesses: (1) underestimates children's abilities – 3-month-olds already show object permanence (Bower, 1974); (2) the stages are too strict; (3) not enough attention to the role of others and social context.\n**In simple words:** Babies turned out to be smarter, earlier, than Piaget thought.\n**Trap:** \"too much attention to social context\" is backwards – Piaget gave it TOO LITTLE. Social context is Vygotsky's focus.","tw":"**投影片：**缺點：(1) 低估兒童能力 – 3 個月大已有物體恆存（Bower, 1974）；(2) 階段太嚴格；(3) 對他人角色和社會背景關注不足。\n**簡單來說：**嬰兒原來比皮亞傑所想的更早、更聰明。\n**陷阱：**「太重視社會背景」剛好相反 – 皮亞傑是關注「不足」。重視社會背景的是維高斯基。"},"source":"PDF1 p.57","options":[{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"},{"en":"It puts too much attention on social and cultural context","tw":"太重視社會及文化背景"},{"en":"It never used tests with real children","tw":"從未以真實兒童進行測試"},{"en":"It says learners are passive receivers of knowledge","tw":"認為學習者是被動接收知識的"}],"answerIndex":0,"correctAnswer":{"en":"It underestimates children's abilities (e.g. object permanence at 3 months – Bower, 1974)","tw":"低估兒童的能力（例如 3 個月大已有物體恆存 – Bower, 1974）"}},{"id":"T1-14","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Piaget advises teachers to \"present new problems in moderately novel ways\". Why?","tw":"皮亞傑建議老師「以適度新穎的方式提出新課題」，原因是？"},"explanation":{"en":"**Slides say:** Present new problems in moderately novel ways – disequilibrium is the pre-requisite of new knowledge.\n**In simple words:** If a problem is too familiar, nothing feels strange, so the mind doesn't change. If it is too strange, the child can't link it to anything. \"A little bit new\" is just right. Example: show students two paintings and ask \"Which one looks farther away?\" when the answer surprises them.\n**Remember:** Goldilocks – not too easy, not too hard.","tw":"**投影片：**以適度新穎的方式提出新課題 – 失衡是學習新知識的先決條件。\n**簡單來說：**太熟悉，沒有奇怪感，思想不會改變；太陌生，孩子連結不到。「有一點新」最好。例：給學生看兩幅畫，問「哪幅畫距離我們最遠？」，答案令他們意外。\n**記住：**不太易，也不太難，剛剛好。"},"source":"PDF1 p.52","options":[{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"},{"en":"To keep students in equilibrium so they never feel confused","tw":"讓學生保持平衡，永不困惑"},{"en":"To replace schemas with rote memorising","tw":"以死記硬背取代基模"},{"en":"To reward students immediately","tw":"即時獎勵學生"}],"answerIndex":0,"correctAnswer":{"en":"To create disequilibrium, which is the pre-requisite of new knowledge","tw":"製造失衡，而失衡是新知識的先決條件"}},{"id":"T1-15","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Piaget's term for a mental framework that organises experiences:","tw":"皮亞傑用來指「組織經驗的心理架構」的術語："},"explanation":{"en":"**Slides say:** Schema = a mental framework to organise experiences; a way of interacting with the world.\n**In simple words:** A schema is like a folder in your brain for one idea. Example: your \"birthday party\" folder holds cake, candles and presents.\n**Remember:** new things go into a folder (assimilation) or make you change folders (accommodation).","tw":"**投影片：**基模 = 用來組織經驗的心理架構；是與世界互動的方式。\n**簡單來說：**基模就像腦中的文件夾，每個裝一個概念。例：「生日會」文件夾裏有蛋糕、蠟燭和禮物。\n**記住：**新東西放進文件夾 = 同化；要改文件夾 = 調適。"},"source":"PDF1 p.7","options":[{"en":"Schema","tw":"基模（schema）"},{"en":"Scaffold","tw":"鷹架（scaffold）"},{"en":"Chunk","tw":"組塊（chunk）"},{"en":"Model","tw":"楷模（model）"}],"answerIndex":0,"correctAnswer":{"en":"Schema","tw":"基模（schema）"}},{"id":"T1-16","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Differences, not disabilities\" in Piaget's implications means…","tw":"皮亞傑教學意義中的「是差異，不是障礙」意思是……"},"explanation":{"en":"**Slides say:** Children go through the same stages but at different rates. Teachers should design activities for groups of children, not the whole class. \"Differences, not disabilities.\"\n**In simple words:** All children climb the same stairs in the same order, but at different speeds. A slower child is not \"broken\", just at a different step.\n**Remember:** same ORDER, different SPEED.","tw":"**投影片：**兒童經歷相同階段，但速度不同。老師應為小組設計活動，而非全班統一。「是差異，不是障礙。」\n**簡單來說：**所有孩子按同一次序走同一條樓梯，只是快慢不同。走得慢的孩子並非「有問題」，只是在另一級。\n**記住：**次序相同，速度不同。"},"source":"PDF1 p.53","options":[{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"},{"en":"Some children skip stages, so ignore the stages","tw":"有些兒童會跳過階段，所以不用理會階段"},{"en":"Slow children have a learning disability","tw":"發展慢的兒童有學習障礙"},{"en":"All children in a class are at the same stage","tw":"全班兒童都處於同一階段"}],"answerIndex":0,"correctAnswer":{"en":"Children go through the same stages but at different rates, so plan activities for groups, not the whole class","tw":"兒童經歷相同階段但速度不同，所以應按小組設計活動，而非全班統一"}},{"id":"T1-17","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"\"New material must be close enough to what the child already knows so a connection can be made.\" This describes…","tw":"「新知識必須足夠接近孩子已知的內容，才能建立新舊連繫。」這描述的是……"},"explanation":{"en":"**Slides say:** Closeness of the match = new material must be close enough to what the child already knows to connect old and new. Readiness = the child has the prior knowledge needed to make that connection.\n**In simple words:** Learning needs a bridge from old to new. Example: teach multiplication after addition (3 × 4 = 4 + 4 + 4), not before.\n**Remember:** closeness = about the LESSON; readiness = about the CHILD.","tw":"**投影片：**足夠接近 = 新知識要足夠接近孩子已知的內容，新舊才能連結。準備就緒 = 孩子具備建立連結所需的先備知識。\n**簡單來說：**學習需要一道由舊到新的橋。例：先學加法，再學乘法（3 × 4 = 4 + 4 + 4）。\n**記住：**足夠接近講「教材」；準備就緒講「孩子」。"},"source":"PDF1 p.13","options":[{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"},{"en":"Readiness","tw":"準備就緒（readiness）"},{"en":"Adaptation","tw":"適應（adaptation）"},{"en":"Equilibrium","tw":"平衡（equilibrium）"}],"answerIndex":0,"correctAnswer":{"en":"Closeness of the match","tw":"足夠接近（closeness of the match）"}},{"id":"T1-18","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What first made Piaget curious about how children think?","tw":"甚麼事情最初令皮亞傑對兒童思維產生興趣？"},"explanation":{"en":"**Slides say:** Piaget helped standardise a French intelligence test and was captured by the WRONG answers children gave. 6-, 8- and 13-year-olds made different types of errors.\n**In simple words:** Different ages made different kinds of mistakes. That suggested children think differently at each age, which led to his stage theory.\n**Trap:** drooling dogs = Pavlov; Bobo doll = Bandura; puzzle-box cats = Thorndike.","tw":"**投影片：**皮亞傑協助標準化法語版智力測試時，對兒童的「錯誤答案」很感興趣；6、8、13 歲兒童犯不同類型的錯誤。\n**簡單來說：**不同年齡犯不同的錯，代表兒童在不同年齡的思考方式不同，於是產生了階段理論。\n**陷阱：**流口水的狗 = 巴甫洛夫；吹氣娃娃 = 班杜拉；迷箱裏的貓 = 桑代克。"},"source":"PDF1 p.26","options":[{"en":"Children's WRONG answers on a French intelligence test he helped standardise","tw":"他協助標準化法語智力測試時，兒童給出的「錯誤答案」"},{"en":"Pavlov's dogs salivating to a bell","tw":"巴甫洛夫的狗聽到鈴聲流口水"},{"en":"Children copying an adult hitting a Bobo doll","tw":"兒童模仿成人打吹氣娃娃"},{"en":"Cats escaping from puzzle boxes","tw":"貓從迷箱逃出"}],"answerIndex":0,"correctAnswer":{"en":"Children's WRONG answers on a French intelligence test he helped standardise","tw":"他協助標準化法語智力測試時，兒童給出的「錯誤答案」"},"photo":"piaget"},{"id":"T1-19","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What is the MAIN TASK of the sensorimotor stage (0–2)?","tw":"感覺運動期（0–2 歲）的「主要任務」是甚麼？"},"explanation":{"en":"**Slides say:** Sensorimotor stage (birth to 2) – main task: coordination of sensory and motor abilities.\n**In simple words:** Babies learn by linking what they SEE, HEAR and TOUCH with what their body DOES. Example: a baby sees a rattle, reaches for it, shakes it and hears the sound.\n**Remember:** each stage has one main task – senses+movement → symbols → logic → abstract.","tw":"**投影片：**感覺運動期（0–2 歲）主要任務：協調感覺和運動能力。\n**簡單來說：**嬰兒把「看到、聽到、摸到」的和身體「做」的連結起來。例：嬰兒看見搖鈴，伸手拿起來搖，聽到聲音。\n**記住：**每階段一個主要任務 – 感官＋動作 → 符號 → 邏輯 → 抽象。"},"source":"PDF1 p.29","options":[{"en":"Coordinating sensory and motor abilities","tw":"協調感覺和運動能力"},{"en":"Developing symbols (abstract thinking)","tw":"發展符號（抽象思維）"},{"en":"Learning logical thinking about present objects","tw":"學習對眼前事物作邏輯思考"},{"en":"Forming hypotheses and solving problems systematically","tw":"建立假設並有系統地解決問題"}],"answerIndex":0,"correctAnswer":{"en":"Coordinating sensory and motor abilities","tw":"協調感覺和運動能力"},"fig":"piaget_stairs"},{"id":"T1-20","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A baby hits a musical toy ON PURPOSE to make it play a sound. Which sensorimotor milestone is this?","tw":"嬰兒「刻意」敲打音樂玩具令它發聲。這是感覺運動期的哪一個里程碑？"},"explanation":{"en":"**Slides say:** Goal-directed or intentional action = actions produced consciously to achieve a desired end, e.g. hitting a musical toy to elicit a sound.\n**In simple words:** The baby does something to MAKE something happen – it's no longer an accident.\n**Remember:** sensorimotor milestones = object permanence, goal-directed action, deferred imitation.","tw":"**投影片：**目的性行為 = 有意識地做出動作以達到想要的結果，例如敲打音樂玩具令它發聲。\n**簡單來說：**嬰兒做某件事是「為了」令某事發生，不再是偶然。\n**記住：**感覺運動期里程碑 = 物體恆存、目的性行為、延遲模仿。"},"source":"PDF1 p.29","options":[{"en":"Goal-directed (intentional) action","tw":"目的性行為（goal-directed action）"},{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"},{"en":"Object permanence","tw":"物體恆存（object permanence）"},{"en":"Conservation","tw":"守恆（conservation）"}],"answerIndex":0,"correctAnswer":{"en":"Goal-directed (intentional) action","tw":"目的性行為（goal-directed action）"}},{"id":"T1-21","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"After watching someone sweep the floor, a toddler later makes sweeping actions with a broom. This is…","tw":"幼兒看過別人掃地，之後自己拿掃帚做掃地動作。這是……"},"explanation":{"en":"**Slides say:** Deferred imitation = repeating an action observed on a previous occasion, e.g. making a sweeping action with a broom after watching someone sweep.\n**In simple words:** \"Deferred\" = later. The child copies an action they saw BEFORE, not right now – so they must have kept it in memory.\n**Remember:** deferred = delayed copying.","tw":"**投影片：**延遲模仿 = 重複之前看過的動作，例如看過別人掃地後，自己拿掃帚做掃地動作。\n**簡單來說：**「延遲」= 之後才做。孩子模仿的是「以前」看到的動作，表示他記住了。\n**記住：**延遲模仿 = 遲些才模仿。"},"source":"PDF1 p.29","options":[{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"},{"en":"Goal-directed action","tw":"目的性行為"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Accommodation","tw":"調適"}],"answerIndex":0,"correctAnswer":{"en":"Deferred imitation","tw":"延遲模仿（deferred imitation）"}},{"id":"T1-22","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"A 3-year-old waves goodbye and says \"brm\" while pushing a toy car. Which preoperational milestone does this show?","tw":"3 歲小孩揮手道別，推玩具車時說「brm」。這顯示前運思期的哪一個里程碑？"},"explanation":{"en":"**Slides say:** Preoperational stage (2–7) – main task: development of symbols. Milestone: symbolic thought and language – using gestures, signs, sounds and words to represent meaning (pointing, waving goodbye, saying \"brm\" while pushing a toy car, asking for \"mo\").\n**In simple words:** A wave STANDS FOR \"bye\"; \"brm\" STANDS FOR a car engine. Using one thing to stand for another = symbols.\n**Remember:** preoperational = symbols and pretend.","tw":"**投影片：**前運思期（2–7 歲）主要任務：符號的發展。里程碑：象徵性思考和語言 – 用手勢、聲音和字詞表達意思（指東西、揮手道別、推玩具車說「brm」、要「mo」（more））。\n**簡單來說：**揮手「代表」再見；「brm」「代表」汽車引擎聲。用一樣東西代表另一樣 = 符號。\n**記住：**前運思期 = 符號和扮演。"},"source":"PDF1 p.32","options":[{"en":"Symbolic thought and language","tw":"象徵性思考和語言"},{"en":"Conservation","tw":"守恆"},{"en":"Abstract hypothetical reasoning","tw":"抽象假設推理"},{"en":"Object permanence","tw":"物體恆存"}],"answerIndex":0,"correctAnswer":{"en":"Symbolic thought and language","tw":"象徵性思考和語言"},"fig":"piaget_stairs"},{"id":"T1-23","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"A child cannot imagine that sugar dissolved in water could be recovered by evaporating the water. Which error is this?","tw":"孩子無法想像溶在水中的糖可以透過蒸發水份取回。這是哪種錯誤？"},"explanation":{"en":"**Slides say:** Irreversibility = cannot, in one's own mind, reverse the order of operations (the dissolved-sugar example). Reversibility = the ability to mentally reverse a thought, such as adding back something taken away.\n**In simple words:** The child can't \"rewind the movie\" in their head. Once the sugar disappears, they can't picture getting it back.\n**Remember:** irreversibility + centration → fails conservation (preoperational).","tw":"**投影片：**不可逆性 = 無法在腦中把操作次序倒轉（溶糖例子）。可逆性 = 能在腦中把想法倒轉，例如把拿走的東西加回去。\n**簡單來說：**孩子不能在腦中「倒帶」。糖消失了，就想像不到可以取回。\n**記住：**不可逆性 + 中心化 → 守恆失敗（前運思期）。"},"source":"PDF1 p.36","options":[{"en":"Irreversibility","tw":"不可逆性（irreversibility）"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Object permanence","tw":"物體恆存"},{"en":"Deferred imitation","tw":"延遲模仿"}],"answerIndex":0,"correctAnswer":{"en":"Irreversibility","tw":"不可逆性（irreversibility）"}},{"id":"T1-24","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student notices that every metal object they test conducts electricity, and concludes \"metals conduct electricity\". This is…","tw":"學生發現每件測試過的金屬都能導電，於是總結「金屬能導電」。這是……"},"explanation":{"en":"**Slides say:** Inductive reasoning = inducing general rules or principles from observation of specific examples. Deductive = using general rules to solve specific problems.\n**In simple words:** Many examples → one rule = inductive (going UP). One rule → one case = deductive (going DOWN).\n**Trap:** students often swap them. DEductive goes DOWN from the rule.","tw":"**投影片：**歸納推理 = 從具體例子的觀察歸納出一般原則；演繹推理 = 用一般原則解決特定問題。\n**簡單來說：**很多例子 → 一條規則 = 歸納（向上）；一條規則 → 一個例子 = 演繹（向下）。\n**陷阱：**很多同學會搞亂，記住演繹是由規則「向下」推。"},"source":"PDF1 p.47","options":[{"en":"Inductive reasoning","tw":"歸納推理（inductive reasoning）"},{"en":"Deductive reasoning","tw":"演繹推理（deductive reasoning）"},{"en":"Centration","tw":"中心化"},{"en":"Assimilation","tw":"同化"}],"answerIndex":0,"correctAnswer":{"en":"Inductive reasoning","tw":"歸納推理（inductive reasoning）"}},{"id":"T1-25","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In Piaget's theory, \"adaptation\" means…","tw":"在皮亞傑理論中，「適應」是指……"},"explanation":{"en":"**Slides say:** Adaptation = the process of adjusting to new situations and experiences through the modification of existing schema OR the creation of new schema.\n**In simple words:** It's the big umbrella word: your mind keeps updating its \"folders\" so the world makes sense.\n**Trap:** copying after watching = observational learning (Bandura, T5).","tw":"**投影片：**適應 = 透過修改現有基模「或」建立新基模，去適應新情境、新經驗的過程。\n**簡單來說：**這是一個總稱：腦袋不斷更新「文件夾」，令世界變得合理。\n**陷阱：**看完再模仿 = 觀察學習（班杜拉，T5）。"},"source":"PDF1 p.13","options":[{"en":"Adjusting to new situations by modifying existing schemas or creating new ones","tw":"透過修改現有基模或建立新基模去適應新情境"},{"en":"Copying an adult's behaviour after watching it","tw":"觀看成人行為後加以模仿"},{"en":"Getting a reward after a correct response","tw":"正確反應後獲得獎勵"},{"en":"Forgetting old schemas completely","tw":"完全忘記舊基模"}],"answerIndex":0,"correctAnswer":{"en":"Adjusting to new situations by modifying existing schemas or creating new ones","tw":"透過修改現有基模或建立新基模去適應新情境"}},{"id":"T1-26","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"According to Piaget, \"equilibrium\" occurs when…","tw":"根據皮亞傑，「平衡」在何時出現？"},"explanation":{"en":"**Slides say:** Equilibrium occurs when existing schemas are modified to accommodate new experiences. Disequilibrium occurs if existing schemas cannot assimilate new experiences.\n**In simple words:** Confused (disequilibrium) → fix your folder (accommodation) → \"Ah, now it makes sense!\" (equilibrium).\n**Remember:** dis- = not balanced; equilibrium = balanced again.","tw":"**投影片：**既有基模被修正以調適新經驗時，便出現平衡；既有基模無法同化新經驗時，便出現失衡。\n**簡單來說：**困惑（失衡）→ 修改文件夾（調適）→「啊，明白了！」（平衡）。\n**記住：**失衡 = 不平衡；平衡 = 重新平衡。"},"source":"PDF1 p.10","options":[{"en":"Existing schemas are modified to accommodate the new experience","tw":"既有基模被修正以調適新經驗"},{"en":"A child cannot assimilate a new experience","tw":"孩子無法同化新經驗"},{"en":"A child copies a model","tw":"孩子模仿楷模"},{"en":"A behaviour is punished","tw":"行為受到懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Existing schemas are modified to accommodate the new experience","tw":"既有基模被修正以調適新經驗"},"fig":"schema_cycle"},{"id":"T1-27","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a STRENGTH of Piaget's contribution listed in the slides?","tw":"以下哪項是投影片列出的皮亞傑貢獻「優點」？"},"explanation":{"en":"**Slides say:** Strengths: (1) helped us understand cognitive development; (2) developed objective, child-oriented tests, e.g. tests of conservation.\n**In simple words:** His juice-glass tests let anyone check how a child thinks, simply and fairly.\n**Trap:** rewards = Skinner; culture = Vygotsky; same speed is wrong (\"different rates\").","tw":"**投影片：**優點：(1) 幫助我們了解認知發展；(2) 開發了客觀、以兒童為中心的測試，例如守恆測試。\n**簡單來說：**他的果汁杯測試讓人簡單又公平地看出兒童怎樣思考。\n**陷阱：**獎勵 = 史金納；文化 = 維高斯基；「相同速度」是錯的（速度不同）。"},"source":"PDF1 p.56","options":[{"en":"He developed objective, child-oriented tests (e.g. tests of conservation)","tw":"開發了客觀、以兒童為中心的測試（例如守恆測試）"},{"en":"He showed babies learn mainly through rewards and punishment","tw":"證明嬰兒主要透過獎勵和懲罰學習"},{"en":"He proved stages develop at exactly the same speed for all children","tw":"證明所有兒童以完全相同的速度發展"},{"en":"He focused mainly on culture and social interaction","tw":"主要關注文化和社交互動"}],"answerIndex":0,"correctAnswer":{"en":"He developed objective, child-oriented tests (e.g. tests of conservation)","tw":"開發了客觀、以兒童為中心的測試（例如守恆測試）"}},{"id":"T1-28","topicNo":1,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which classroom activity best suits the CONCRETE operational stage?","tw":"以下哪項課堂活動最適合「具體運思期」？"},"explanation":{"en":"**Slides say:** Concrete operation – concrete experiences for experimentation and testing ideas, discussing problems and planning solutions, group work with students challenging each other's ideas.\n**In simple words:** 7–11-year-olds think logically about REAL things, so give them real things to test.\n• Sensorimotor: turn-taking, imitation, songs\n• Preoperational: hands-on, word/counting games\n• Concrete: experiments, group problem-solving\n• Formal: hypotheses, debates","tw":"**投影片：**具體運思期 – 讓學生透過具體經驗做實驗、測試想法、討論問題、計劃方案；小組活動中互相挑戰對方的想法。\n**簡單來說：**7–11 歲兒童能對「實物」作邏輯思考，所以給他們實物去測試。\n• 感覺運動：輪流、模仿、唱歌\n• 前運思：動手做、文字／數數遊戲\n• 具體運思：實驗、小組解難\n• 形式運思：假設、辯論"},"source":"PDF1 p.55","options":[{"en":"Hands-on experiments and group work where students test ideas and challenge each other","tw":"動手做實驗和小組活動，讓學生測試想法、互相挑戰"},{"en":"Debates on hypothetical and theoretical topics","tw":"就假設性和理論性題目進行辯論"},{"en":"Turn-taking, imitating actions and singing \"Old MacDonald\"","tw":"輪流、模仿動作、唱《Old MacDonald》"},{"en":"Word games and counting games to build symbols","tw":"以文字遊戲和數數遊戲發展符號"}],"answerIndex":0,"correctAnswer":{"en":"Hands-on experiments and group work where students test ideas and challenge each other","tw":"動手做實驗和小組活動，讓學生測試想法、互相挑戰"}},{"id":"T1-29","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"According to Piaget's instructional implications, how should teachers treat students' errors?","tw":"根據皮亞傑的教學意義，老師應如何對待學生的錯誤？"},"explanation":{"en":"**Slides say:** Welcome and analyse students' errors; accept individual differences.\n**In simple words:** A wrong answer shows HOW a child is thinking – remember, Piaget built his whole theory from children's wrong answers on an IQ test!\n**Remember:** errors are clues, not crimes.","tw":"**投影片：**接納及分析學生的錯誤；接受學生的個別差異。\n**簡單來說：**錯誤答案顯示孩子「怎樣」思考 – 記住，皮亞傑的整個理論就是從兒童在智力測試的錯誤答案開始的！\n**記住：**錯誤是線索，不是罪行。"},"source":"PDF1 p.53","options":[{"en":"Welcome and analyse them","tw":"接納並分析錯誤"},{"en":"Punish them so they are not repeated","tw":"懲罰錯誤以免重犯"},{"en":"Ignore them completely","tw":"完全忽略錯誤"},{"en":"Correct them without discussion","tw":"直接改正，不作討論"}],"answerIndex":0,"correctAnswer":{"en":"Welcome and analyse them","tw":"接納並分析錯誤"}},{"id":"T1-30","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which statement matches Piaget's view of development in the slides?","tw":"以下哪項符合投影片中皮亞傑對發展的看法？"},"explanation":{"en":"**Slides say:** Piaget (1896–1980) studied his own 3 children. Development depends on how the child interacts with the environment – an interaction between maturation and environment. Children are active learners.\n**In simple words:** Children are like little scientists who explore, test and figure things out.\n**Remember:** Piaget = active child + maturation × environment.","tw":"**投影片：**皮亞傑（1896–1980）研究自己的 3 個孩子。發展取決於孩子如何與環境互動 – 成長（成熟）與環境之間的相互作用；孩子是積極主動的學習者。\n**簡單來說：**孩子像小科學家，會探索、測試、想通事情。\n**記住：**皮亞傑 = 主動的孩子 + 成熟 × 環境。"},"source":"PDF1 p.6","options":[{"en":"Development depends on how the child interacts with the environment; children are active learners","tw":"發展取決於孩子如何與環境互動；孩子是積極主動的學習者"},{"en":"Development depends only on rewards from adults","tw":"發展只取決於成人給的獎勵"},{"en":"Children are passive and learn only by being told","tw":"孩子是被動的，只靠被告知而學習"},{"en":"Development is fixed at birth and cannot change","tw":"發展在出生時已固定，不能改變"}],"answerIndex":0,"correctAnswer":{"en":"Development depends on how the child interacts with the environment; children are active learners","tw":"發展取決於孩子如何與環境互動；孩子是積極主動的學習者"},"photo":"piaget"},{"id":"T1-31","topicNo":1,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Slavin (2014) defines educational psychology as…","tw":"Slavin（2014）把教育心理學定義為……"},"explanation":{"en":"**Slides say:** Educational psychology is \"the study of learners, learning and teaching\" (Slavin, 2014). Good teachers need to know their students, the processes of learning, and good teaching practices.\n**In simple words:** It's the science of WHO learns, HOW they learn, and HOW to teach them.\n**Remember:** learners + learning + teaching.","tw":"**投影片：**教育心理學是「對學習者、學習和教學的研究」（Slavin, 2014）。好老師需要了解學生、學習過程和優良的教學方法。\n**簡單來說：**它研究「誰」在學、「怎樣」學、以及「怎樣」教。\n**記住：**學習者 + 學習 + 教學。"},"source":"PDF1 p.3","options":[{"en":"The study of learners, learning and teaching","tw":"對學習者、學習和教學的研究"},{"en":"The study of brain cells only","tw":"只研究腦細胞"},{"en":"The study of school buildings and timetables","tw":"研究校舍和時間表"},{"en":"The study of animal reflexes","tw":"研究動物反射"}],"answerIndex":0,"correctAnswer":{"en":"The study of learners, learning and teaching","tw":"對學習者、學習和教學的研究"}},{"id":"T1-32","topicNo":1,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What does constructivism (as introduced in Topic 1) say about learners?","tw":"Topic 1 所介紹的建構主義怎樣看學習者？"},"explanation":{"en":"**Slides say:** Construct = build up. Humans actively construct their own knowledge to make sense of their environment; the knowledge learners can construct depends on what they already know. Learning is student-centred.\n**In simple words:** Knowledge is built like a Lego tower – new bricks must sit on bricks you already have.\n**Remember:** active + builds on prior knowledge.","tw":"**投影片：**建構 = 建立。人類主動建構自己的知識以理解環境；學習者能建構的知識取決於已知的內容；學習以學生為中心。\n**簡單來說：**知識像砌 Lego – 新積木要砌在已有的積木上。\n**記住：**主動 + 建基於已有知識。"},"source":"PDF1 p.4","options":[{"en":"They actively construct their own knowledge, and what they can build depends on what they already know","tw":"他們主動建構知識，而能建構甚麼取決於已有的知識"},{"en":"They passively absorb whatever the teacher says","tw":"他們被動吸收老師所說的一切"},{"en":"They learn only through reward and punishment","tw":"他們只透過獎勵和懲罰學習"},{"en":"They are born with all their knowledge","tw":"他們天生已擁有所有知識"}],"answerIndex":0,"correctAnswer":{"en":"They actively construct their own knowledge, and what they can build depends on what they already know","tw":"他們主動建構知識，而能建構甚麼取決於已有的知識"}},{"id":"T1-33","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT one of Piaget's instructional implications?","tw":"以下哪項「不是」皮亞傑的教學意義？"},"explanation":{"en":"**Slides say:** Implications: understand how children think; design appropriate activities; encourage active involvement; help reorganise schemas; present problems in moderately novel ways; welcome errors; accept individual differences – design activities for groups, not the whole class.\n**In simple words:** Children grow at different speeds, so one-size-fits-all lessons don't fit Piaget.\n**Remember:** same stages, different rates → group work at different levels.","tw":"**投影片：**教學意義：了解兒童如何思考；設計適當活動；鼓勵積極參與；協助重組基模；以適度新穎方式提問；接納錯誤；接受個別差異 – 為小組而非全班設計活動。\n**簡單來說：**兒童發展速度不同，「一刀切」的課堂不符合皮亞傑的看法。\n**記住：**階段相同、速度不同 → 按程度分組。"},"source":"PDF1 p.51","options":[{"en":"Give the whole class exactly the same activity at the same pace","tw":"全班做完全相同的活動、用相同的進度"},{"en":"Encourage students' active involvement in learning","tw":"鼓勵學生積極參與學習"},{"en":"Help students reorganise their existing schemas","tw":"幫助學生重組現有基模"},{"en":"Understand how children think to give developmentally appropriate education","tw":"了解兒童如何思考，提供適合發展階段的教學"}],"answerIndex":0,"correctAnswer":{"en":"Give the whole class exactly the same activity at the same pace","tw":"全班做完全相同的活動、用相同的進度"}},{"id":"T1-34","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which classroom activity suits the PREOPERATIONAL stage (2–7)?","tw":"以下哪項課堂活動適合「前運思期」（2–7 歲）？"},"explanation":{"en":"**Slides say:** Preoperational – hands-on experiences that let the child \"construct\" knowledge; group activities with peers; word games and counting games; sorting, matching, pattern-making; keep egocentrism in mind and increase awareness of others' views.\n**In simple words:** Young kids learn by DOING with real objects and simple symbols, not by abstract talk.\n**Trap:** debates and satire are for the formal stage.","tw":"**投影片：**前運思期 – 讓孩子動手「建構」知識；與同儕的小組活動；文字和數數遊戲；分類、配對、砌圖案；顧及自我中心，提高對他人觀點的意識。\n**簡單來說：**幼童靠實物和簡單符號「動手做」來學習，而不是抽象討論。\n**陷阱：**辯論和諷刺屬形式運思期。"},"source":"PDF1 p.54","options":[{"en":"Hands-on sorting, matching and counting games, keeping children's egocentrism in mind","tw":"動手做分類、配對和數數遊戲，並顧及兒童的自我中心"},{"en":"Debates on theoretical topics","tw":"就理論性題目辯論"},{"en":"Writing essays on satire and paradox","tw":"撰寫諷刺和悖論的文章"},{"en":"Solving abstract \"if… then…\" proofs","tw":"解答抽象的「如果……就……」證明題"}],"answerIndex":0,"correctAnswer":{"en":"Hands-on sorting, matching and counting games, keeping children's egocentrism in mind","tw":"動手做分類、配對和數數遊戲，並顧及兒童的自我中心"}},{"id":"T1-35","topicNo":1,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which is NOT one of the conservation tests shown in the slides?","tw":"以下哪項「不是」投影片所示的守恆實驗？"},"explanation":{"en":"**Slides say:** Tests of conservation: liquid quantity, number, length, mass and area. The child sees the same amount change SHAPE and is asked whether the amount is still the same.\n**In simple words:** Conservation = \"it looks different but it's still the same amount\". Preoperational kids fail; concrete kids pass.\n**Trap:** object permanence is a sensorimotor milestone (0–2), not a conservation test.","tw":"**投影片：**守恆實驗：液體容量、數量、長度、質量、面積。孩子看著同一份量改變「形狀」，然後回答份量是否仍然一樣。\n**簡單來說：**守恆 =「看起來不同，但份量一樣」。前運思期兒童答錯，具體運思期兒童答對。\n**陷阱：**物體恆存是感覺運動期（0–2 歲）的里程碑，不是守恆實驗。"},"source":"PDF1 p.40","options":[{"en":"Object permanence (hidden toy)","tw":"物體恆存（藏起玩具）"},{"en":"Liquid quantity (pour into a taller glass)","tw":"液體容量（倒入較高的杯）"},{"en":"Number (spread out a row of coins)","tw":"數量（把一行硬幣拉開）"},{"en":"Mass (roll a clay ball into a sausage)","tw":"質量（把泥球搓成長條）"}],"answerIndex":0,"correctAnswer":{"en":"Object permanence (hidden toy)","tw":"物體恆存（藏起玩具）"}},{"id":"T1-36","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"\"If A = B and B = C, then A = C.\" Understanding this develops in which stage?","tw":"「如果 A = B，B = C，那麼 A = C。」明白這一點是在哪個階段發展的？"},"explanation":{"en":"**Slides say:** Concrete operational (7–11) features include conservation, classification, reversibility (if A > B then B < A) and transitive reasoning (A = B, B = C → A = C).\n**In simple words:** If Tom is as tall as May, and May is as tall as Ken, then Tom is as tall as Ken. School-age children can work this out with real things.\n**Remember:** concrete = logic about real objects.","tw":"**投影片：**具體運思期（7–11 歲）的特點包括守恆、分類、可逆性（A > B 則 B < A）和遞移推理（A = B、B = C → A = C）。\n**簡單來說：**Tom 與 May 一樣高，May 與 Ken 一樣高，所以 Tom 與 Ken 一樣高。小學生能用實物想通這一點。\n**記住：**具體 = 對實物作邏輯思考。"},"source":"PDF1 p.42","options":[{"en":"Concrete operational (transitivity)","tw":"具體運思期（遞移推理）"},{"en":"Sensorimotor","tw":"感覺運動期"},{"en":"Preoperational","tw":"前運思期"},{"en":"Only adults can do this","tw":"只有成人才做得到"}],"answerIndex":0,"correctAnswer":{"en":"Concrete operational (transitivity)","tw":"具體運思期（遞移推理）"}},{"id":"T1-37","topicNo":1,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A 9-year-old sorts blocks by size, then re-sorts them by colour. Which concrete-operational ability is this?","tw":"9 歲孩子先按大小把積木分類，再按顏色重新分類。這是具體運思期的哪種能力？"},"explanation":{"en":"**Slides say:** Concrete operational children can classify objects by features such as size, shape and colour.\n**In simple words:** Grouping things by a rule, and switching the rule, shows logical thinking about real objects.\n**Remember:** concrete stage = conservation, classification, reversibility, transitivity.","tw":"**投影片：**具體運思期兒童能按特徵（如大小、形狀、顏色）把事物分類。\n**簡單來說：**按規則把東西分組，又能轉換規則，顯示能對實物作邏輯思考。\n**記住：**具體運思期 = 守恆、分類、可逆性、遞移推理。"},"source":"PDF1 p.42","options":[{"en":"Classification","tw":"分類（classification）"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Object permanence","tw":"物體恆存"},{"en":"Deferred imitation","tw":"延遲模仿"}],"answerIndex":0,"correctAnswer":{"en":"Classification","tw":"分類（classification）"}},{"id":"T1-38","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"The slides split the preoperational stage into two phases. Which is correct?","tw":"投影片把前運思期分為兩個時期。以下哪項正確？"},"explanation":{"en":"**Slides say:** Preoperational (2–7): preconceptual phase (2–4) – egocentrism; intuitive phase (4–7) – intuitive reasoning (judging by what things look like, without logic).\n**In simple words:** A 5-year-old says the tall glass has more juice because it LOOKS like more – that's intuition, not logic.\n**Remember:** 2–4 preconceptual; 4–7 intuitive.","tw":"**投影片：**前運思期（2–7 歲）：前概念期（2–4 歲）– 自我中心；直覺期（4–7 歲）– 直覺式推論（只憑外觀判斷，未用邏輯）。\n**簡單來說：**5 歲孩子說高杯的果汁多，因為「看起來」多 – 這是直覺，不是邏輯。\n**記住：**2–4 前概念；4–7 直覺。"},"source":"PDF1 p.33","options":[{"en":"Preconceptual phase (2–4, egocentric) and intuitive phase (4–7, intuitive reasoning)","tw":"前概念期（2–4 歲，自我中心）和直覺期（4–7 歲，直覺式推論）"},{"en":"Primary phase (0–1) and secondary phase (1–2)","tw":"初級期（0–1 歲）和次級期（1–2 歲）"},{"en":"Concrete phase (7–9) and abstract phase (9–11)","tw":"具體期（7–9 歲）和抽象期（9–11 歲）"},{"en":"Assimilation phase and accommodation phase","tw":"同化期和調適期"}],"answerIndex":0,"correctAnswer":{"en":"Preconceptual phase (2–4, egocentric) and intuitive phase (4–7, intuitive reasoning)","tw":"前概念期（2–4 歲，自我中心）和直覺期（4–7 歲，直覺式推論）"}},{"id":"T1-39","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"A baby keeps shaking the crib again and again to make it move. According to the slides, this repeated action on the outside world is a…","tw":"嬰兒一次又一次搖動嬰兒牀令它晃動。根據投影片，這種重複作用於外界的行為是……"},"explanation":{"en":"**Slides say:** Sensorimotor: (A) primary circular reaction – repeating actions that stimulate the baby's own body, e.g. sucking a thumb; (B) secondary circular reaction – repeating actions that stimulate the outside world, e.g. shaking the crib.\n**In simple words:** Primary = about MY body. Secondary = about the world AROUND me.\n**Remember:** thumb = primary; crib = secondary.","tw":"**投影片：**感覺運動期：(A) 初級反應循環 – 重複刺激自己身體的動作，例如吮手指；(B) 次級反應循環 – 重複刺激外界的動作，例如反覆搖牀。\n**簡單來說：**初級 = 關於「自己身體」；次級 = 關於「身邊的世界」。\n**記住：**吮手指 = 初級；搖牀 = 次級。"},"source":"PDF1 p.30","options":[{"en":"Secondary circular reaction","tw":"次級反應循環"},{"en":"Primary circular reaction","tw":"初級反應循環"},{"en":"Deferred imitation","tw":"延遲模仿"},{"en":"Conservation","tw":"守恆"}],"answerIndex":0,"correctAnswer":{"en":"Secondary circular reaction","tw":"次級反應循環"}},{"id":"T1-40","topicNo":1,"difficulty":"medium","type":"order","star":true,"question":{"en":"Put Piaget's learning cycle in order when a new experience does NOT fit.","tw":"當新經驗「不符合」已有認知時，把皮亞傑的學習循環排成正確次序。"},"explanation":{"en":"**Slides say:** The equilibration cycle: current knowledge meets a new situation → try assimilation → if it fails, disequilibrium → accommodation (corrective feedback, update knowledge) → equilibrium. Slide example: \"Horsy? No, that's an okapi.\"\n**In simple words:** Meet something new → try your old idea → \"Huh?\" → change your idea → \"Got it!\"\n**Remember:** confused before balanced.","tw":"**投影片：**平衡化循環：現有知識遇上新情境 → 嘗試同化 → 若失敗則失衡 → 調適（修正回饋、更新知識）→ 平衡。投影片例子：「是馬嗎？不，是霍加狓。」\n**簡單來說：**遇到新事物 → 用舊想法試試 →「咦？」→ 改變想法 →「明白了！」\n**記住：**先困惑，後平衡。"},"source":"PDF1 p.11","tiles":{"en":["New situation","Assimilation fails","Disequilibrium","Accommodation","Equilibrium"],"tw":["遇到新情境","同化失敗","失衡","調適","平衡"]},"answerLen":{"en":5,"tw":5},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"New situation → Assimilation fails → Disequilibrium → Accommodation → Equilibrium","tw":"遇到新情境 → 同化失敗 → 失衡 → 調適 → 平衡"},"fig":"schema_cycle"},{"id":"T1-41","topicNo":1,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which kinds of reasoning do the slides list for the formal operational stage?","tw":"投影片列出形式運思期具備哪些推理能力？"},"explanation":{"en":"**Slides say:** Formal operational (11+): can use abstract logic to solve problems; can use hypothetical-deductive, propositional and combinatorial reasoning (e.g. \"If A then B\"; Ax + By = C).\n**In simple words:** Teens can reason about things that are only imagined – like solving for x in algebra or planning \"what if\" experiments.\n**Trap:** centration and irreversibility are preoperational ERRORS.","tw":"**投影片：**形式運思期（11 歲以上）：能運用抽象邏輯解決問題；能使用假設演繹推理、命題推理和組合推理（例如「若 A 則 B」；Ax + By = C）。\n**簡單來說：**青少年能推理只存在於想像中的事 – 例如代數求 x，或計劃「如果……會怎樣」的實驗。\n**陷阱：**中心化和不可逆性是前運思期的「錯誤」。"},"source":"PDF1 p.45","options":[{"en":"Hypothetical-deductive, propositional and combinatorial reasoning","tw":"假設演繹推理、命題推理和組合推理"},{"en":"Deferred imitation and object permanence","tw":"延遲模仿和物體恆存"},{"en":"Centration and irreversibility","tw":"中心化和不可逆性"},{"en":"Primary and secondary circular reactions","tw":"初級和次級反應循環"}],"answerIndex":0,"correctAnswer":{"en":"Hypothetical-deductive, propositional and combinatorial reasoning","tw":"假設演繹推理、命題推理和組合推理"}},{"id":"T2-01","topicNo":2,"difficulty":"easy","type":"mc","star":true,"question":{"en":"What is the Zone of Proximal Development (ZPD)?","tw":"甚麼是近側發展區（ZPD）？"},"explanation":{"en":"**Slides say:** ZPD = the distance between a child's current level of competence on a task and the level they can reach with support or guidance. It differs for each person.\n**In simple words:** Three zones: can do alone (too easy) | can do WITH help (ZPD) | can't do even with help (too hard). Teach in the middle zone. Example: a child can't bake a cake alone, but can with Mum guiding (the slides' cake example).\n**Remember:** ZPD = the \"I can, with help\" zone.","tw":"**投影片：**ZPD = 兒童現有能力與在支援或指導下可達水平之間的差距，因人而異。\n**簡單來說：**三個區：自己做到（太易）｜有人幫就做到（ZPD）｜有人幫也做不到（太難）。老師要在中間那區教。例：男孩不能獨自焗蛋糕，但有媽媽指導就可以（投影片的例子）。\n**記住：**ZPD = 「有人幫我就做到」的區域。"},"source":"PDF2 p.18","options":[{"en":"The gap between what a child can do alone and what they can do with guidance","tw":"兒童「獨自」能做到與在「指導下」能做到之間的差距"},{"en":"The age range of the preoperational stage","tw":"前運思期的年齡範圍"},{"en":"The part of memory that holds 7 ± 2 items","tw":"能容納 7 ± 2 個單位的記憶部分"},{"en":"The time between a behaviour and its reward","tw":"行為與獎勵之間的時間"}],"answerIndex":0,"correctAnswer":{"en":"The gap between what a child can do alone and what they can do with guidance","tw":"兒童「獨自」能做到與在「指導下」能做到之間的差距"},"fig":"zpd"},{"id":"T2-02","topicNo":2,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Support that fits the learner's current level, given by a more competent person and gradually removed, is called ___.","tw":"由能力較高者提供、配合學習者現有水平、並逐步撤走的支援，稱為 ___。"},"explanation":{"en":"**Slides say:** Scaffolding = support from more competent peers or adults, adjusted to the learner's current level, so the task is done successfully and more independently. Give only enough support.\n**In simple words:** Builders put up scaffolding while building, then take it down when the building can stand alone. Example: holding a child's hands while they learn to walk (from the slides), then letting go.\n**Trap:** shaping (T4) REWARDS behaviour step by step; scaffolding gives HELP step by step.","tw":"**投影片：**搭鷹架 = 能力較高的同儕或成人，按學習者現有水平提供支援，令其成功並更獨立地完成任務；只給「足夠」支援。\n**簡單來說：**建築工人起樓時搭棚架，大樓能自己站穩就拆走。例：扶著孩子的手學行（投影片例子），之後慢慢放手。\n**陷阱：**塑形（T4）是逐步「獎勵」行為；搭鷹架是逐步「提供協助」。"},"source":"PDF2 p.21","options":[{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"},{"en":"Shaping","tw":"塑形（shaping）"},{"en":"Chunking","tw":"集組塊（chunking）"},{"en":"Modeling","tw":"示範（modeling）"}],"answerIndex":0,"correctAnswer":{"en":"Scaffolding","tw":"搭鷹架（scaffolding）"},"fig":"scaffold_fade"},{"id":"T2-03","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Gradually withdrawing scaffolding as the learner improves (based on their ZPD) is called…","tw":"根據學習者的 ZPD，隨其進步而逐步撤走鷹架，稱為……"},"explanation":{"en":"**Slides say:** The helper should fade out assistance based on the learner's ZPD. The goal is an independent learner.\n**In simple words:** Fading = slowly taking the help away. Example: holding the back of a bike seat, then letting go a little more each day.\n**Trap:** \"extinction\" is different – it is a learned reaction dying out in classical conditioning (T3).","tw":"**投影片：**協助者應按學習者的 ZPD 逐步撤出協助，目標是培養獨立學習者。\n**簡單來說：**逐步撤出 = 慢慢減少幫助。例：教孩子踩單車，先扶著車尾，每天放手多一點。\n**陷阱：**「消退」是另一回事 – 那是古典制約（T3）中習得反應的減弱。"},"source":"PDF2 p.24","options":[{"en":"Fading","tw":"逐步撤出（fading）"},{"en":"Extinction","tw":"消退（extinction）"},{"en":"Generalization","tw":"泛化（generalization）"},{"en":"Disequilibrium","tw":"失衡（disequilibrium）"}],"answerIndex":0,"correctAnswer":{"en":"Fading","tw":"逐步撤出（fading）"},"fig":"scaffold_fade"},{"id":"T2-04","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Vygotsky: every function in a child's development appears twice – first at the ___ level, then at the ___ level.","tw":"維高斯基：兒童發展中的每項功能都出現兩次 – 先在 ___ 層面，然後在 ___ 層面。"},"explanation":{"en":"**Slides say:** Every function in a child's development appears twice: first at the social level (between people), then at the individual level (inside the child).\n**In simple words:** We learn something WITH others first, then we can do it in our own head. Slide example: Penny's mum reads \"I think I can\" with her; days later Penny tells a classmate \"we can do this if we keep trying.\"\n**Remember:** outside → inside (internalisation).","tw":"**投影片：**兒童發展中的每項功能都會出現兩次：先在社會層面（人與人之間），後在個人層面（兒童內心）。\n**簡單來說：**先和別人一起學，之後自己在腦中也做到。投影片例子：媽媽和 Penny 讀「我想我可以」；幾天後 Penny 對同學說「只要繼續嘗試，我們就做得到」。\n**記住：**由外到內（內化）。"},"source":"PDF2 p.8","options":[{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"},{"en":"individual → social","tw":"個人 → 社會"},{"en":"biological → cultural","tw":"生理 → 文化"},{"en":"assimilation → accommodation","tw":"同化 → 調適"}],"answerIndex":0,"correctAnswer":{"en":"social (between people) → individual (inside the child)","tw":"社會（人與人之間）→ 個人（兒童內心）"}},{"id":"T2-05","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A physics teacher talks out loud while solving a problem on the board. Which type of scaffolding?","tw":"物理老師在黑板解題時把思考過程說出來。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Think-aloud = a physics teacher talks out loud while solving a physics problem on the chalkboard.\n**In simple words:** The teacher says their thinking out loud (\"First I find the force, then…\") so students can hear how an expert thinks.\n**Trap:** Modeling = SHOWING how to do it (an art teacher draws an apple first). Think-aloud = SAYING your thinking.","tw":"**投影片：**出聲思考 = 物理老師在黑板解題時把思考過程說出來。\n**簡單來說：**老師把腦中想法講出來（「先找出力，然後……」），學生就能「聽到」專家如何思考。\n**陷阱：**示範 = 「做」給你看（美術老師先畫蘋果）；出聲思考 = 「講」出想法。"},"source":"PDF2 p.28","options":[{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Prompts and cues","tw":"提示（prompts and cues）"},{"en":"Adapting instructional materials","tw":"調節教學內容"}],"answerIndex":0,"correctAnswer":{"en":"Think-aloud","tw":"出聲思考（think-aloud）"}},{"id":"T2-06","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A PE teacher lowers the basketball basket while teaching shooting, then raises it later. Which type of scaffolding?","tw":"體育老師教射球時先降低籃框，之後再升高。這是哪一類搭鷹架？"},"explanation":{"en":"**Slides say:** Adapting instructional materials = a PE teacher lowers the basketball basket while teaching shooting, then raises it later.\n**In simple words:** The task itself is made easier first, then harder as skills grow. The help is in the equipment, not in the teacher's words.\n**Remember:** the 5 types are modeling, think-aloud, questions, adapting materials, and prompts & cues.","tw":"**投影片：**調節教學內容 = 體育老師教射球時先降低籃框，之後再升高。\n**簡單來說：**先把任務本身變容易，技能提升後再加難。協助來自器材，而不是老師的說話。\n**記住：**五類：示範、出聲思考、提問、調節教學內容、提示。"},"source":"PDF2 p.28","options":[{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"},{"en":"Modeling","tw":"示範（modeling）"},{"en":"Think-aloud","tw":"出聲思考（think-aloud）"},{"en":"Questions","tw":"提問（questions）"}],"answerIndex":0,"correctAnswer":{"en":"Adapting instructional materials","tw":"調節教學內容（adapting instructional materials）"}},{"id":"T2-07","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is a COGNITIVE tool (not a physical tool) in Vygotsky's theory?","tw":"在維高斯基理論中，以下哪項是「認知」工具（不是實體工具）？"},"explanation":{"en":"**Slides say:** Physical tools = chopsticks, scissors, hammers, computers. Cognitive tools = writing system, number system, maps. \"You know how to calculate only because your culture has a number system.\"\n**In simple words:** Physical tools help your HANDS; cognitive tools help your MIND.\n**Trap:** a computer is a physical tool in the slides, even though it feels \"smart\".","tw":"**投影片：**實體工具 = 筷子、剪刀、鐵鎚、電腦；認知工具 = 文字系統、數字系統、地圖。「你懂得運算，是因為你的文化有數字系統。」\n**簡單來說：**實體工具幫你的「手」；認知工具幫你的「腦」。\n**陷阱：**投影片把電腦列為實體工具，雖然它好像很「聰明」。"},"source":"PDF2 p.7","options":[{"en":"A number system","tw":"數字系統"},{"en":"Chopsticks","tw":"筷子"},{"en":"Scissors","tw":"剪刀"},{"en":"A computer","tw":"電腦"}],"answerIndex":0,"correctAnswer":{"en":"A number system","tw":"數字系統"}},{"id":"T2-08","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Self-talk that guides a child's thinking and action is called…","tw":"引導兒童思考和行動的自我對話稱為……"},"explanation":{"en":"**Slides say:** Language lets you think to yourself: out loud → private speech, \"self-talk that guides thinking and action\".\n**In simple words:** Ever said \"OK, first this, then that…\" to yourself while doing something hard? That is private speech.\n**Remember:** language is a cognitive tool. It lets you share knowledge, think and solve problems, and talk to yourself.","tw":"**投影片：**語言讓你自我思考：說出來 → 自我對話（private speech），即「引導思考和行動的自言自語」。\n**簡單來說：**做難題時，你有沒有對自己說「好，先做這個，再做那個……」？這就是自我對話。\n**記住：**語言是認知工具：交流知識、思考解難、自我對話。"},"source":"PDF2 p.15","options":[{"en":"Private speech","tw":"自我對話（private speech）"},{"en":"Deferred imitation","tw":"延遲模仿"},{"en":"Egocentrism","tw":"自我中心"},{"en":"Retrieval cue","tw":"提取線索"}],"answerIndex":0,"correctAnswer":{"en":"Private speech","tw":"自我對話（private speech）"}},{"id":"T2-09","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"What is the MAIN difference between Piaget and Vygotsky?","tw":"皮亞傑與維高斯基的「主要」分別是？"},"explanation":{"en":"**Slides say:** Piaget: individual, internal construction of knowledge; social interaction does not play a major role. Vygotsky: social interaction, language and culture shape development – \"development is not an individual process\".\n**In simple words:** Both say children build knowledge actively. Piaget's child is a little scientist working mostly ALONE. Vygotsky's child learns WITH parents, teachers and classmates.\n**Remember:** Piaget = \"me\"; Vygotsky = \"we\".","tw":"**投影片：**皮亞傑：個人內在建構知識，社交互動不扮演重要角色。維高斯基：社交互動、語言和文化塑造發展 –「成長發展不是個人的過程」。\n**簡單來說：**兩者都認為兒童主動建構知識。皮亞傑的兒童像小科學家，多數「自己」探索；維高斯基的兒童「與人一起」學（父母、老師、同學）。\n**記住：**皮亞傑 =「我」；維高斯基 =「我們」。"},"source":"PDF2 p.6","options":[{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"},{"en":"Piaget: social interaction is central; Vygotsky: learning is individual","tw":"皮亞傑：社交互動是核心；維高斯基：學習是個人的"},{"en":"Piaget: learners are passive; Vygotsky: learners are active","tw":"皮亞傑：學習者被動；維高斯基：學習者主動"},{"en":"Vygotsky ignored language; Piaget focused on language","tw":"維高斯基忽略語言；皮亞傑重視語言"}],"answerIndex":0,"correctAnswer":{"en":"Piaget: individual, internal construction (social role minor); Vygotsky: social interaction, language and culture are central","tw":"皮亞傑：個人內在建構（社交角色次要）；維高斯基：社交互動、語言和文化是核心"}},{"id":"T2-10","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is NOT one of the four characteristics of constructivist learning theory (Eggen & Kauchak, 2010)?","tw":"以下哪項「不是」建構主義學習理論的四大特點（Eggen & Kauchak, 2010）？"},"explanation":{"en":"**Slides say:** Constructivism – learners create their own knowledge rather than receiving it from another source (Eggen & Kauchak, 2010). The 4 characteristics: (1) learners construct knowledge that makes sense to them; (2) new learning depends on current understanding; (3) social interaction helps; (4) real-world tasks make learning meaningful.\n**In simple words:** Students BUILD understanding, like building with Lego. They are not just filled up like empty cups.\n**Trap:** \"passively receive from the teacher\" is the opposite of constructivism.","tw":"**投影片：**建構主義 – 學習者自行建構知識，而不是被動接收（Eggen & Kauchak, 2010）。四特點：(1) 以對自己有意義的方式建構；(2) 新學習取決於現有理解；(3) 社交互動促進學習；(4) 真實任務令學習有意義。\n**簡單來說：**學生像砌 Lego 一樣「砌」出理解，而不是像空杯子被倒滿。\n**陷阱：**「被動接收老師的知識」正是建構主義的相反。"},"source":"PDF2 p.42","options":[{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"},{"en":"New learning depends on current understanding","tw":"新學習取決於現有理解"},{"en":"Social interaction facilitates learning","tw":"社交互動促進學習"},{"en":"Real-world tasks are needed for meaningful learning","tw":"真實世界任務帶來有意義的學習"}],"answerIndex":0,"correctAnswer":{"en":"Learners passively receive knowledge transmitted by the teacher","tw":"學習者被動接收老師傳遞的知識"}},{"id":"T2-11","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Problem-based Learning (PBL), what is the order?","tw":"在問題導向學習（PBL）中，次序是？"},"explanation":{"en":"**Slides say:** In PBL, students are asked to solve the problem FIRST, THEN are taught the basic/abstract skills. Problems are authentic and \"ill-structured\". The teacher is a facilitator.\n**In simple words:** You meet a real, messy problem first, then learn what you need. Slide example: teams get only a list of criteria plus internet access to build a tissue-paper balloon, not step-by-step instructions.\n**Trap:** being busy with your hands (behaviourally active) is NOT the same as thinking hard (cognitively active).","tw":"**投影片：**問題導向學習：學生「先」解決問題，「然後」才學基本／抽象技巧。問題真實且「結構不良」，老師是引導者。\n**簡單來說：**先遇上真實、複雜的問題，再學需要的東西。投影片例子：小組只獲一系列標準加上互聯網，自行製作紙熱氣球，而不是照著步驟做。\n**陷阱：**手在忙（行為活躍）≠ 腦在想（認知活躍）。"},"source":"PDF2 p.48","options":[{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"},{"en":"Teacher lectures all skills first, then gives a well-structured exercise","tw":"老師先講授所有技巧，再給結構清晰的練習"},{"en":"Students memorise standard answers, then take a test","tw":"學生先背標準答案，再考試"},{"en":"Students work alone with no teacher at all","tw":"學生獨自學習，完全沒有老師"}],"answerIndex":0,"correctAnswer":{"en":"Students try to solve an authentic problem FIRST, then are taught the basic/abstract skills","tw":"學生「先」嘗試解決真實問題，「然後」才學基本／抽象技巧"}},{"id":"T2-12","topicNo":2,"difficulty":"hard","type":"mc","star":true,"question":{"en":"What are the four steps of STAD (Slavin, 1994) in order?","tw":"STAD（Slavin, 1994）的四個步驟次序是？"},"explanation":{"en":"**Slides say:** STAD (Slavin, 1994) has four steps: Teach → Team study (worksheets in teams) → Test (individual quizzes) → Team recognition (team score from members' scores).\n**In simple words:** The teacher explains, the team practises together, each student takes the test ALONE, then the team is rewarded for how much each member IMPROVED.\n**Trap:** \"expert groups\" belong to the Jigsaw method.","tw":"**投影片：**STAD（Slavin, 1994）四步：講授 → 小組學習（組內完成工作紙）→ 測驗（個人測驗）→ 小組表揚（按成員分數計算小組分）。\n**簡單來說：**老師講解，小組一起練習，每人「獨自」考試，最後按每位成員的「進步」獎勵小組。\n**陷阱：**「專家組」屬拼圖法。"},"source":"PDF2 p.55","options":[{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"},{"en":"Team study → Teach → Team recognition → Test","tw":"小組學習 → 講授 → 小組表揚 → 測驗"},{"en":"Teach → Expert group → Home group → Quiz","tw":"講授 → 專家組 → 原組 → 測驗"},{"en":"Test → Teach → Team study → Team recognition","tw":"測驗 → 講授 → 小組學習 → 小組表揚"}],"answerIndex":0,"correctAnswer":{"en":"Teach → Team study → Test → Team recognition","tw":"講授 → 小組學習 → 測驗 → 小組表揚"}},{"id":"T2-13","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the Jigsaw method, students from different groups who studied the SAME section meet in a(n)…","tw":"拼圖法中，來自不同小組、負責「同一部分」的學生會在哪裏會面？"},"explanation":{"en":"**Slides say:** Jigsaw step 2: students from different groups with the same section meet in an \"expert group\" to discuss their section, then return home to teach it.\n**In simple words:** Each team member gets one piece of the puzzle. Everyone with the same piece meets to become experts, then goes back to teach their own team. Like each friend studying one chapter and teaching it to the others.\n**Remember:** expert group → home group.","tw":"**投影片：**拼圖法第二步：不同小組中負責同一部分的學生在「專家組」討論，之後回原組教授。\n**簡單來說：**每位組員拿一塊拼圖；拿同一塊的人先聚在一起成為專家，再回自己小組教其他人。就像每位朋友讀一章，再教給其他人。\n**記住：**專家組 → 原組。"},"source":"PDF2 p.58","options":[{"en":"Expert group","tw":"專家組"},{"en":"Home group","tw":"原組"},{"en":"Control group","tw":"對照組"},{"en":"Mixed-ability group","tw":"混合能力組"}],"answerIndex":0,"correctAnswer":{"en":"Expert group","tw":"專家組"}},{"id":"T2-14","topicNo":2,"difficulty":"medium","type":"mc","star":true,"question":{"en":"PIES (elements of effective groups) stands for…","tw":"PIES（有效小組的要素）代表……"},"explanation":{"en":"**Slides say:** PIES (Spencer, 1994; Slavin, 1994) = Positive interdependence, Individual accountability, Equal participation, Social skills.\n**In simple words:** P – we need each other (shared goal). I – each person's part is checked. E – everyone does a fair share. S – listening, leading and solving arguments.\n**Remember:** think of a PIE shared fairly by the whole group.","tw":"**投影片：**PIES（Spencer, 1994；Slavin, 1994）= 積極互賴、個人責任、平等參與、社交技巧。\n**簡單來說：**P – 互相需要（共同目標）；I – 每人的部分都會被評估；E – 公平分工；S – 聆聽、領導、處理分歧。\n**記住：**想像一個「PIE」（批）由全組公平分享。"},"source":"PDF2 p.63","options":[{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"},{"en":"Peer tutoring, Independent work, Equal grades, Silent reading","tw":"朋輩輔導、獨立工作、相同分數、默讀"},{"en":"Positive reinforcement, Imitation, Extinction, Shaping","tw":"正增強、模仿、消退、塑形"},{"en":"Praise, Incentives, Effort, Success","tw":"讚賞、誘因、努力、成功"}],"answerIndex":0,"correctAnswer":{"en":"Positive interdependence, Individual accountability, Equal participation, Social skills","tw":"積極互賴、個人責任、平等參與、社交技巧"}},{"id":"T2-15","topicNo":2,"difficulty":"easy","type":"mc","star":false,"question":{"en":"STAD scoring: Albert's base score is 75 and his test score is 85. What is his improvement score?","tw":"STAD 計分：Albert 基本分 75，測驗分 85。他的進步分是？"},"explanation":{"en":"**Slides say:** In STAD, members contribute an improved score = test score − base score (Albert: 85 − 75 = 10).\n**In simple words:** STAD counts how much you IMPROVED, not your raw mark. A weaker student who jumps from 56 to 75 adds 19 points – more than Albert!\n**Remember:** improvement = test − base.","tw":"**投影片：**STAD 中，每位成員貢獻進步分 = 測驗分 − 基本分（Albert：85 − 75 = 10）。\n**簡單來說：**STAD 計的是「進步」，不是原始分。由 56 分進步到 75 分的同學可貢獻 19 分，比 Albert 還多！\n**記住：**進步分 = 測驗分 − 基本分。"},"source":"PDF2 p.57","options":[{"en":"10","tw":"10"},{"en":"85","tw":"85"},{"en":"160","tw":"160"},{"en":"75","tw":"75"}],"answerIndex":0,"correctAnswer":{"en":"10","tw":"10"}},{"id":"T2-16","topicNo":2,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which is a disadvantage of discovery learning?","tw":"以下哪項是發現式學習的缺點？"},"explanation":{"en":"**Slides say:** Discovery learning – disadvantages: time-consuming; needs very careful planning and preparation; unless well supervised, some learners might not gain from it. Advantages: active engagement, curiosity, highly motivating.\n**In simple words:** Students find out rules themselves through experiments or field trips. It is exciting, but slow, and without guidance some students miss the point.\n**Remember:** most often used in science lessons.","tw":"**投影片：**發現學習的缺點：費時；需非常周詳的計劃和準備；缺乏良好督導，部分學生未必有得益。優點：主動投入、培養好奇心、高度激勵。\n**簡單來說：**學生靠實驗或實地考察自己找出規律。很有趣，但很花時間；沒有指導的話，有些學生會學不到重點。\n**記住：**最常用於科學課。"},"source":"PDF2 p.73","options":[{"en":"Time-consuming and needs very careful planning; unsupervised learners may gain little","tw":"費時、需非常周詳的計劃；缺乏督導時學生可能得益不多"},{"en":"It kills students' curiosity","tw":"扼殺學生好奇心"},{"en":"Students are never active","tw":"學生從不主動"},{"en":"It can only be used in PE lessons","tw":"只能用於體育課"}],"answerInde
