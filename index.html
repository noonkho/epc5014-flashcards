in STM. Middle: not enough rehearsal and interference.\n**In simple words:** After a shopping list is read out, the last few items are still \"fresh\" in your head.\n**Remember:** first = rehearsed; last = still in STM; middle = squeezed out.","tw":"**投影片：**序列位置效應（Murdock, 1962）：開頭（首因效應）和結尾（近因效應）的項目記得較好。首因：複述較多；近因：仍活躍於短期記憶；中間：複述不足且受干擾。\n**簡單來說：**聽完購物清單，最後幾項仍「新鮮」地留在腦中。\n**記住：**開頭 = 複述多；結尾 = 仍在短期記憶；中間 = 被擠掉。"},"source":"PDF6 p.31","options":[{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"},{"en":"Primacy effect – they were rehearsed the most","tw":"首因效應 – 它們被複述得最多"},{"en":"They suffer the most interference","tw":"它們受最多干擾"},{"en":"They were encoded structurally","tw":"它們以結構編碼"}],"answerIndex":0,"correctAnswer":{"en":"Recency effect – they are still active in short-term memory","tw":"近因效應 – 它們仍活躍於短期記憶"},"fig":"serial_curve"},{"id":"T6-11","topicNo":6,"difficulty":"medium","type":"order","star":false,"question":{"en":"Put the PQ4R study method in the correct order.","tw":"把 PQ4R 學習法排成正確次序。"},"explanation":{"en":"**Slides say:** PQ4R (Thomas & Robinson, 1972) is a storage/study method: Preview, Question, Read, Reflect, Recite, Review.\n**In simple words:** Skim the chapter → ask \"What will I learn?\" → read → link it to what you know → say it back in your own words → go over it again later.\n**Remember:** P-Q then 4 R's: Read, Reflect, Recite, Review.","tw":"**投影片：**PQ4R（Thomas & Robinson, 1972）是儲存／學習方法：預覽、提問、閱讀、反思、背誦、複習。\n**簡單來說：**先略讀 → 問「我會學到甚麼？」→ 閱讀 → 連結已有知識 → 用自己的話說出來 → 之後再複習。\n**記住：**P、Q，再加 4 個 R。"},"source":"PDF6 p.28","tiles":{"en":["Preview","Question","Read","Reflect","Recite","Review"],"tw":["預覽","提問","閱讀","反思","背誦","複習"]},"answerLen":{"en":6,"tw":6},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Preview → Question → Read → Reflect → Recite → Review","tw":"預覽 → 提問 → 閱讀 → 反思 → 背誦 → 複習"}},{"id":"T6-12","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"The method of loci improves encoding by…","tw":"位置記憶法（method of loci）如何改善編碼？"},"explanation":{"en":"**Slides say:** Method of loci = link new information with familiar visual images, to enrich encoding.\n**In simple words:** To remember a shopping list, imagine milk on your front door, eggs on the sofa and bread on your bed. Later, \"walk\" through your home in your mind and collect them.\n**Remember:** loci = places.","tw":"**投影片：**位置記憶法 = 把新資訊與熟悉的視覺影像連結，令編碼更豐富。\n**簡單來說：**要記購物清單，就想像牛奶放在大門、雞蛋在梳化、麵包在牀上；之後在腦中「行一轉」屋企，逐樣拿回來。\n**記住：**loci = 地點。"},"source":"PDF6 p.11","options":[{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"},{"en":"Repeating information out loud 100 times","tw":"把資訊大聲重複 100 次"},{"en":"Reading only the first and last items","tw":"只讀第一項和最後一項"},{"en":"Removing all meaning from the information","tw":"去除資訊的一切意義"}],"answerIndex":0,"correctAnswer":{"en":"Linking new information to familiar visual images/places","tw":"把新資訊與熟悉的視覺影像／地點連結"}},{"id":"T6-13","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Specht & Sandling (1991): after traditional lectures, scores dropped by 54%. After role-playing they dropped by only…","tw":"Specht & Sandling（1991）：傳統講課後分數下降 54%，角色扮演後只下降……"},"explanation":{"en":"**Slides say:** Specht & Sandling (1991): scores after traditional lectures decreased by 54%; after role-playing they decreased by only 13%. Active learning helps.\n**In simple words:** Acting things out makes you think about MEANING (deep processing), so you remember more than when you just listen.\n**Remember:** doing beats listening.","tw":"**投影片：**Specht & Sandling（1991）：傳統講課後分數下降 54%；角色扮演後只下降 13%。主動學習有幫助。\n**簡單來說：**親身扮演令你思考「意義」（深層處理），比單純聽記得更多。\n**記住：**做比聽好。"},"source":"PDF6 p.25","options":[{"en":"13%","tw":"13%"},{"en":"54%","tw":"54%"},{"en":"40%","tw":"40%"},{"en":"0%","tw":"0%"}],"answerIndex":0,"correctAnswer":{"en":"13%","tw":"13%"}},{"id":"T6-14","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What is the difference between learning and development?","tw":"學習與發展（成長）的分別是？"},"explanation":{"en":"**Slides say:** Learning = a change in an individual due to experience. Development = a change due to biological maturation. They are inter-dependent – learning cannot happen in a developmentally inappropriate period.\n**In simple words:** Practising piano is learning. Growing taller is development. A child cannot learn to talk before their voice is physically ready.\n**Remember:** learning = experience; development = growing up. Both nature and nurture matter.","tw":"**投影片：**學習 = 經驗帶來的改變；發展（成長）= 生理成熟帶來的改變。兩者互相依存 – 發育未到的時期無法學習。\n**簡單來說：**練琴是學習；長高是發展。孩子的發聲器官未成熟，就學不到說話。\n**記住：**學習 = 經驗；發展 = 長大。先天與後天同樣重要。"},"source":"PDF6 p.41","options":[{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"},{"en":"Learning = change due to maturation; development = change due to experience","tw":"學習 = 成熟帶來的改變；發展 = 經驗帶來的改變"},{"en":"They are unrelated","tw":"兩者毫無關係"},{"en":"Only development needs the environment","tw":"只有發展需要環境"}],"answerIndex":0,"correctAnswer":{"en":"Learning = change due to experience; development = change due to biological maturation","tw":"學習 = 經驗帶來的改變；發展 = 生理成熟帶來的改變"}},{"id":"T6-15","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"From sensory memory, which information moves on to working memory?","tw":"感覺記憶中，哪些訊息會進入工作記憶？"},"explanation":{"en":"**Slides say:** Only attended information goes into working memory. Sensory memory holds raw input for a fraction of a second, and it is lost quickly without further processing.\n**In simple words:** Your senses take in tons of things, but only what you NOTICE moves on. Slide example: the \"Monkey Business\" video – people counting passes miss a gorilla walking by!\n**Remember:** attention is the gate to memory.","tw":"**投影片：**只有被注意的訊息才會進入工作記憶；感覺記憶只保留原始訊息幾分之一秒，未經處理便迅速消失。\n**簡單來說：**感官接收大量資訊，只有你「留意」的才會留下。投影片例子：Monkey Business 影片 – 專心數傳球的人看不到走過的大猩猩！\n**記住：**注意力是記憶的閘門。"},"source":"PDF6 p.15","options":[{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"},{"en":"All information automatically","tw":"所有訊息自動進入"},{"en":"Only information that rhymes","tw":"只有押韻的訊息"},{"en":"Only information older than 20 seconds","tw":"只有超過 20 秒的訊息"}],"answerIndex":0,"correctAnswer":{"en":"Only information we pay attention to","tw":"只有被「注意」的訊息"},"fig":"memory_model"},{"id":"T6-16","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who proposed the levels of processing theory (1972)?","tw":"誰提出處理層次理論（1972）？"},"explanation":{"en":"**Slides say:** Levels of processing theory – Craik & Lockhart (1972).\n**In simple words:** They showed that HOW deeply you think about information decides how well you remember it.\n**Trap:** Thomas & Robinson = PQ4R; Murdock = serial position effect; Specht & Sandling = role-play study.","tw":"**投影片：**處理層次理論 – Craik & Lockhart（1972）。\n**簡單來說：**他們指出，你對資訊思考得多「深」，決定你記得多好。\n**陷阱：**Thomas & Robinson = PQ4R；Murdock = 序列位置效應；Specht & Sandling = 角色扮演研究。"},"source":"PDF6 p.9","options":[{"en":"Craik & Lockhart","tw":"Craik & Lockhart"},{"en":"Thomas & Robinson","tw":"Thomas & Robinson"},{"en":"Specht & Sandling","tw":"Specht & Sandling"},{"en":"Seligman & Maier","tw":"Seligman & Maier"}],"answerIndex":0,"correctAnswer":{"en":"Craik & Lockhart","tw":"Craik & Lockhart"}},{"id":"T6-17","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"To prevent \"false memories\" where new and old information mix up, a teacher should…","tw":"為防止新舊訊息混淆造成「錯誤記憶」，老師應……"},"explanation":{"en":"**Slides say:** To prevent \"false memories\" where new and old information get mixed up, point out how the new information is different from the old.\n**In simple words:** Example: after learning negative reinforcement, students often mix it up with punishment. Saying \"Careful – negative reinforcement INCREASES behaviour, punishment DECREASES it\" stops the mix-up.\n**Remember:** compare and contrast new vs old.","tw":"**投影片：**為防止新舊資訊混淆而產生「錯誤記憶」，要指出新資訊與舊資訊的分別。\n**簡單來說：**例：學生學了負增強後，常與懲罰混淆。老師說「小心 – 負增強令行為增加，懲罰令行為減少」，就能防止混淆。\n**記住：**新舊對比。"},"source":"PDF6 p.36","options":[{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"},{"en":"Teach the new topic without mentioning old topics","tw":"教新課題時完全不提舊課題"},{"en":"Give the information only once","tw":"只講一次"},{"en":"Ask students to memorise without understanding","tw":"要求學生不求甚解地背誦"}],"answerIndex":0,"correctAnswer":{"en":"Point out how the new information is different from the old","tw":"指出新訊息與舊訊息的分別"}},{"id":"T6-18","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"How do the slides distinguish learning from memory?","tw":"投影片如何區分「學習」和「記憶」？"},"explanation":{"en":"**Slides say:** Learning generally refers to the acquisition of skills and knowledge. Memory refers to our ability to store information and recall it later. Memory has three stages: encoding, storage, retrieval.\n**In simple words:** Learning = getting it IN; memory = keeping it and getting it back OUT.\n**Remember:** the information processing model sees learning as forming memories.","tw":"**投影片：**學習一般指技能和知識的獲取；記憶指儲存並日後回憶資訊的能力。記憶分三階段：編碼、儲存、提取。\n**簡單來說：**學習 = 放進去；記憶 = 保存並再拿出來。\n**記住：**訊息處理模型把學習視為形成記憶。"},"source":"PDF6 p.5","options":[{"en":"Learning = acquiring skills and knowledge; memory = the ability to store information and recall it later","tw":"學習 = 獲取技能和知識；記憶 = 儲存並日後提取資訊的能力"},{"en":"Learning = storing; memory = acquiring","tw":"學習 = 儲存；記憶 = 獲取"},{"en":"They mean exactly the same thing","tw":"兩者意思完全相同"},{"en":"Memory only refers to short-term memory","tw":"記憶只指短期記憶"}],"answerIndex":0,"correctAnswer":{"en":"Learning = acquiring skills and knowledge; memory = the ability to store information and recall it later","tw":"學習 = 獲取技能和知識；記憶 = 儲存並日後提取資訊的能力"}},{"id":"T6-19","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"To remember \"self-efficacy\", a student links it to the time they believed they could pass their swimming test. Which encoding strategy is this?","tw":"為記住「自我效能感」，學生把它連結到自己曾相信能通過游泳測試的經歷。這是哪種編碼策略？"},"explanation":{"en":"**Slides say:** Better encoding: enrich the information (method of loci); self-referent encoding = make new information personally relevant; elaborative encoding = connect it with knowledge already learned.\n**In simple words:** Things about ME stick best – your brain pays extra attention to your own life.\n**Remember:** self-referent = \"how does this relate to me?\"","tw":"**投影片：**改善編碼：豐富訊息（位置記憶法）；自我參照編碼 = 令新訊息與個人相關；聯想編碼 = 與已學知識連結。\n**簡單來說：**和「我」有關的事最難忘 – 大腦特別留意自己的生活。\n**記住：**自我參照 =「這和我有甚麼關係？」"},"source":"PDF6 p.11","options":[{"en":"Self-referent encoding","tw":"自我參照編碼"},{"en":"Structural encoding","tw":"結構編碼"},{"en":"Phonetic encoding","tw":"語音編碼"},{"en":"Chunking","tw":"集組塊"}],"answerIndex":0,"correctAnswer":{"en":"Self-referent encoding","tw":"自我參照編碼"}},{"id":"T6-20","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student remembers \"negative reinforcement\" by linking it to \"escape\" and to the seatbelt beep they already know. Which encoding strategy is this?","tw":"學生把「負增強」連結到已認識的「逃脫」和安全帶警告聲來記憶。這是哪種編碼策略？"},"explanation":{"en":"**Slides say:** Elaborative encoding = connect new information with knowledge already learned, or connect new pieces of knowledge together.\n**In simple words:** Hook the new idea onto old ideas, like adding a branch to a tree that's already there.\n**Remember:** elaborate = add links.","tw":"**投影片：**聯想編碼 = 把新訊息與已學的知識連結，或把新知識互相連結。\n**簡單來說：**把新概念掛在舊概念上，就像在已有的樹上加一條樹枝。\n**記住：**聯想 = 加連結。"},"source":"PDF6 p.11","options":[{"en":"Elaborative encoding","tw":"聯想編碼（elaborative encoding）"},{"en":"Structural encoding","tw":"結構編碼"},{"en":"Sensory memory","tw":"感覺記憶"},{"en":"Rote repetition only","tw":"只是死記重複"}],"answerIndex":0,"correctAnswer":{"en":"Elaborative encoding","tw":"聯想編碼（elaborative encoding）"}},{"id":"T6-21","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Explicit memory is also called…","tw":"外顯記憶又稱為……"},"explanation":{"en":"**Slides say:** Explicit memory = deliberate recall of information that one recognises as a memory (facts, knowledge, specific experiences). Also known as declarative memory. It includes semantic (facts) and episodic (personal events) memory.\n**In simple words:** Explicit = things you can DECLARE (say out loud): \"Pavlov won a Nobel Prize\", \"I went to Japan last summer\".\n**Remember:** explicit = declarative; implicit = procedural.","tw":"**投影片：**外顯記憶 = 有意識地回憶自己認得是記憶的資訊（事實、知識、特定經歷），又稱陳述記憶，包括語意記憶（事實）和情節記憶（個人事件）。\n**簡單來說：**外顯 = 可以「說出來」的事：「巴甫洛夫獲諾貝爾獎」、「我去年暑假去了日本」。\n**記住：**外顯 = 陳述；內隱 = 程序。"},"source":"PDF6 p.20","options":[{"en":"Declarative memory","tw":"陳述記憶"},{"en":"Procedural memory","tw":"程序記憶"},{"en":"Sensory memory","tw":"感覺記憶"},{"en":"Implicit memory","tw":"內隱記憶"}],"answerIndex":0,"correctAnswer":{"en":"Declarative memory","tw":"陳述記憶"},"fig":"memory_types"},{"id":"T6-22","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which are the two types of retrieval cues in the slides?","tw":"投影片提到哪兩類提取線索？"},"explanation":{"en":"**Slides say:** Retrieval cues = hints of where to find information. Association cues are related to what you are searching for and direct you to the right part of long-term memory. Frames = organisational structure – recalling by categories.\n**In simple words:** Smelling sunscreen can bring back a beach trip (association). Remembering your shopping list by sections – fruit, then drinks (frame).\n**Remember:** cues = hints; organisation helps retrieval.","tw":"**投影片：**提取線索 = 提示資訊在哪裏。關聯線索與要找的東西有關，引導你到長期記憶的相關部分；架構 = 組織結構 – 按類別提取。\n**簡單來說：**聞到防曬霜想起沙灘之旅（關聯）；按類別記購物清單 – 先生果，再飲品（架構）。\n**記住：**線索 = 提示；有組織便易提取。"},"source":"PDF6 p.30","options":[{"en":"Association cues and frames (organisational structure, recalling by categories)","tw":"關聯線索和架構（組織結構、按類別提取）"},{"en":"Primacy and recency","tw":"首因和近因"},{"en":"Rewards and punishments","tw":"獎勵和懲罰"},{"en":"Sensory and short-term","tw":"感覺和短期"}],"answerIndex":0,"correctAnswer":{"en":"Association cues and frames (organisational structure, recalling by categories)","tw":"關聯線索和架構（組織結構、按類別提取）"}},{"id":"T6-23","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Why are the FIRST items in a list remembered well (primacy effect)?","tw":"為何清單「開頭」的項目記得好（首因效應）？"},"explanation":{"en":"**Slides say:** Serial position effect: primacy effect – rehearsal → better recall; recency effect – still active in STM; middle items – not enough time for rehearsal and interference.\n**In simple words:** You have time to repeat the first few names in your head before the list gets long.\n**Trap:** \"still in STM\" explains the LAST items (recency).","tw":"**投影片：**序列位置效應：首因效應 – 複述 → 回憶較好；近因效應 – 仍在短期記憶；中間項目 – 複述時間不足並受干擾。\n**簡單來說：**清單變長之前，你有時間在腦中重複頭幾個名字。\n**陷阱：**「仍在短期記憶」解釋的是「最後」的項目（近因）。"},"source":"PDF6 p.33","options":[{"en":"They get more rehearsal, leading to better recall","tw":"它們被複述得較多，回憶較好"},{"en":"They are still active in short-term memory","tw":"它們仍活躍於短期記憶"},{"en":"They suffer the most interference","tw":"它們受最多干擾"},{"en":"They are encoded only by sound","tw":"它們只用聲音編碼"}],"answerIndex":0,"correctAnswer":{"en":"They get more rehearsal, leading to better recall","tw":"它們被複述得較多，回憶較好"},"fig":"serial_curve"},{"id":"T6-24","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, which kind of event is HARDEST to forget?","tw":"根據投影片，哪類事件「最難」忘記？"},"explanation":{"en":"**Slides say:** Forgetting = loss or change of stored information. It frees space so we keep what's important. Whether we forget depends on how many links an event has and the emotions it causes: we quickly forget things we don't care about; events with strong emotions are hard to forget; pleasant events are kept longer.\n**In simple words:** You remember your best birthday, not what you ate last Tuesday.\n**Remember:** emotion + links = stronger memory.","tw":"**投影片：**遺忘 = 儲存的資訊消失或改變，能釋放空間保留重要資訊。是否遺忘取決於事件的聯繫數目和引起的情感：漠不關心的事很快忘記；引起強烈情緒的事難以忘懷；愉快的事保留較久。\n**簡單來說：**你記得最開心的生日，卻記不起上星期二吃了甚麼。\n**記住：**情緒 + 聯繫 = 記憶更牢。"},"source":"PDF6 p.34","options":[{"en":"Events that triggered strong emotional reactions","tw":"曾引起強烈情緒反應的事件"},{"en":"Things we feel indifferent about","tw":"我們漠不關心的事"},{"en":"Items in the middle of a list","tw":"清單中間的項目"},{"en":"Information we never paid attention to","tw":"從未注意過的資訊"}],"answerIndex":0,"correctAnswer":{"en":"Events that triggered strong emotional reactions","tw":"曾引起強烈情緒反應的事件"}},{"id":"T6-25","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What does the forgetting curve show?","tw":"遺忘曲線顯示了甚麼？"},"explanation":{"en":"**Slides say:** The forgetting curve shows how learned information slips out of our memories over time – unless we take action to keep it there (e.g. review).\n**In simple words:** Memory leaks like a bucket with a small hole; each review tops it up. That's exactly why this flashcard game brings cards back on a schedule!\n**Remember:** review beats forgetting.","tw":"**投影片：**遺忘曲線顯示學過的資訊如何隨時間從記憶中流失 – 除非我們採取行動保留（例如複習）。\n**簡單來說：**記憶像有小洞的水桶會漏水，每次複習就把水加滿。這正是本遊戲定時讓卡片再出現的原因！\n**記住：**複習打敗遺忘。"},"source":"PDF6 p.35","options":[{"en":"Learned information slips out of memory over time unless we act to keep it","tw":"學過的資訊會隨時間流失，除非我們採取行動保留"},{"en":"Memory gets stronger the longer we leave it alone","tw":"記憶放得越久越強"},{"en":"We remember middle items best","tw":"我們最記得中間的項目"},{"en":"Short-term memory holds 7 ± 2 items","tw":"短期記憶容納 7 ± 2 個項目"}],"answerIndex":0,"correctAnswer":{"en":"Learned information slips out of memory over time unless we act to keep it","tw":"學過的資訊會隨時間流失，除非我們採取行動保留"},"fig":"forgetting_curve"},{"id":"T6-26","topicNo":6,"difficulty":"medium","type":"mc","star":true,"question":{"en":"In Topic 6, learning is defined as…","tw":"Topic 6 把「學習」定義為……"},"explanation":{"en":"**Slides say:** Learning is a long-term change in mental representations or associations as a result of experience (e.g. remembering a phone number in the brain). Learning is usually reflected in behaviour.\n**In simple words:** Learning changes what's in your head for a long time, because of something you experienced.\n**Trap:** change due to maturation = development, not learning.","tw":"**投影片：**學習是由經驗導致的心理表徵或聯繫的長期變化（例如在腦中記住一個電話號碼）；學習通常體現在行為上。\n**簡單來說：**學習是因某種經歷，令腦中的東西長期改變。\n**陷阱：**由成熟引起的改變 = 發展，不是學習。"},"source":"PDF6 p.39","options":[{"en":"A long-term change in mental representations or associations as a result of experience","tw":"由經驗導致的心理表徵或聯繫的長期變化"},{"en":"Any short-term change in behaviour","tw":"任何短期的行為改變"},{"en":"A change caused only by biological maturation","tw":"只由生理成熟引起的改變"},{"en":"Remembering a phone number for 20 seconds","tw":"記住電話號碼 20 秒"}],"answerIndex":0,"correctAnswer":{"en":"A long-term change in mental representations or associations as a result of experience","tw":"由經驗導致的心理表徵或聯繫的長期變化"}},{"id":"T6-27","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What do the slides conclude about the nature–nurture debate?","tw":"投影片對「先天與後天」之爭有何結論？"},"explanation":{"en":"**Slides say:** Nature = innate; nurture = environmental. Both nature and nurture are important; learning and development are inter-dependent. Learning cannot occur in a developmentally inappropriate period (a child cannot talk before proper vocal development); in the appropriate period, (learning) experience becomes important.\n**In simple words:** A 3-year-old can't learn the times table yet (nature), but an 8-year-old needs practice to learn it (nurture).\n**Remember:** ready body + right experience.","tw":"**投影片：**先天 = 與生俱來；後天 = 環境培育。先天與後天同樣重要；學習與成長互相依存。發育不適當的時期不能學習（發聲未成熟不能說話）；到了適當時期，（學習）經驗就變得重要。\n**簡單來說：**3 歲小孩還學不到乘數表（先天），但 8 歲孩子需要練習才學會（後天）。\n**記住：**身體準備好 + 適當經驗。"},"source":"PDF6 p.43","options":[{"en":"Both are important: learning can't happen in a developmentally inappropriate period, but in the right period experience matters","tw":"兩者都重要：發育未到不能學習，但到了適當時期經驗就很重要"},{"en":"Only nature matters","tw":"只有先天重要"},{"en":"Only nurture matters","tw":"只有後天重要"},{"en":"Neither matters","tw":"兩者都不重要"}],"answerIndex":0,"correctAnswer":{"en":"Both are important: learning can't happen in a developmentally inappropriate period, but in the right period experience matters","tw":"兩者都重要：發育未到不能學習，但到了適當時期經驗就很重要"}},{"id":"T6-28","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What do the slides say about \"passive learning\" (reading a text, listening to a lecture, watching a movie)?","tw":"投影片如何看「被動學習」（讀課文、聽講課、看電影）？"},"explanation":{"en":"**Slides say:** \"Active learning\" describes an interactive process, such as a hands-on experiment. But \"passive learning\", such as reading a text, listening to a lecture or watching a movie, is still learning, and can be effective.\n**In simple words:** Listening to a good podcast does teach you things – it's just usually not as \"sticky\" as doing (role-play only dropped 13% vs lectures 54%).\n**Remember:** both count; active usually sticks better.","tw":"**投影片：**「主動學習」指互動過程，例如動手做實驗；但「被動學習」，如讀課文、聽講課、看電影，也是學習，而且可以有效。\n**簡單來說：**聽一個好的播客確實能學到東西，只是通常不及親身做那麼牢固（角色扮演只降 13%，講課降 54%）。\n**記住：**兩者都算；主動通常記得更牢。"},"source":"PDF6 p.45","options":[{"en":"It is still learning and can be effective","tw":"它仍然是學習，而且可以有效"},{"en":"It is not learning at all","tw":"它根本不算學習"},{"en":"It always beats active learning","tw":"它一定勝過主動學習"},{"en":"It only works for babies","tw":"它只適用於嬰兒"}],"answerIndex":0,"correctAnswer":{"en":"It is still learning and can be effective","tw":"它仍然是學習，而且可以有效"}},{"id":"T6-29","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What do the slides say about the biological basis of learning?","tw":"投影片如何描述學習的生物學基礎？"},"explanation":{"en":"**Slides say:** The total number of neurons may be a reasonable correlate of intelligence; neurons and the connections among neurons are important.\n**In simple words:** Learning builds and strengthens links between brain cells, like paths in a field that get clearer the more you walk them.\n**Remember:** neurons + connections.","tw":"**投影片：**神經元總數與智力可能有合理的相關；神經元之間的連結十分重要。\n**簡單來說：**學習會建立並加強腦細胞之間的連結，就像草地上的小徑，走得越多越清晰。\n**記住：**神經元 + 連結。"},"source":"PDF6 p.40","options":[{"en":"Neurons and the connections among them are important; total neuron number may be a reasonable correlate of intelligence","tw":"神經元及其連結很重要；神經元總數與智力可能有合理相關"},{"en":"The brain plays no role in learning","tw":"大腦在學習中沒有角色"},{"en":"Only the heart stores memories","tw":"只有心臟儲存記憶"},{"en":"Neurons never change their connections","tw":"神經元的連結永不改變"}],"answerIndex":0,"correctAnswer":{"en":"Neurons and the connections among them are important; total neuron number may be a reasonable correlate of intelligence","tw":"神經元及其連結很重要；神經元總數與智力可能有合理相關"}},{"id":"T6-30","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student files new information into the wrong \"memory network\" and later mixes it up. At which stage did the memory error happen?","tw":"學生把新資訊放進錯誤的「記憶網絡」，之後混淆了。記憶錯誤發生在哪個階段？"},"explanation":{"en":"**Slides say:** Mistakes at different stages: encoding (not enough attention, so not encoded); storage (put into the wrong networks); retrieval (forgetting, or remembering inaccurately).\n**In simple words:** Like putting a library book on the wrong shelf – it's in there, but in the wrong place.\n**Remember:** no attention = encoding; wrong shelf = storage; can't find it = retrieval.","tw":"**投影片：**不同階段的錯誤：編碼（不夠注意，所以沒有編碼）；儲存（放進錯誤的網絡）；提取（忘記或記錯）。\n**簡單來說：**就像把圖書放錯書架 – 書在館內，但位置錯了。\n**記住：**沒注意 = 編碼；放錯架 = 儲存；找不到 = 提取。"},"source":"PDF6 p.26","options":[{"en":"Storage","tw":"儲存"},{"en":"Encoding","tw":"編碼"},{"en":"Retrieval","tw":"提取"},{"en":"Sensory input","tw":"感覺輸入"}],"answerIndex":0,"correctAnswer":{"en":"Storage","tw":"儲存"}},{"id":"T6-31","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What are the educational implications of SHORT-TERM memory in the slides?","tw":"投影片中，短期記憶對教育有甚麼意義？"},"explanation":{"en":"**Slides say:** STM goal: move information into long-term memory. Give students enough time to rehearse new information; make information well organised (helps chunking).\n**In simple words:** Short-term memory is small and fast-fading, so slow down, repeat, and group information.\n**Remember:** rehearse + organise.","tw":"**投影片：**短期記憶的目標：把訊息轉移到長期記憶。給學生足夠時間複述（溫習）新訊息；把訊息有系統地組織好（利於集組塊）。\n**簡單來說：**短期記憶容量小、消失快，所以要放慢、重複、分組。\n**記住：**複述 + 組織。"},"source":"PDF6 p.17","options":[{"en":"Give students enough time to rehearse new information, and organise it well (helps chunking)","tw":"給學生足夠時間複述新資訊，並把資訊組織好（有助集組塊）"},{"en":"Give as much new information as fast as possible","tw":"盡快給予最多新資訊"},{"en":"Avoid any repetition","tw":"避免任何重複"},{"en":"Only use long, unorganised lists","tw":"只用冗長無組織的清單"}],"answerIndex":0,"correctAnswer":{"en":"Give students enough time to rehearse new information, and organise it well (helps chunking)","tw":"給學生足夠時間複述新資訊，並把資訊組織好（有助集組塊）"}},{"id":"T6-32","topicNo":6,"difficulty":"easy","type":"mc","star":true,"question":{"en":"The information processing model views learning as…","tw":"訊息處理模型把學習視為……"},"explanation":{"en":"**Slides say:** The information processing model is a theory of learning that views learning as forming memories – like a computer: information gets IN (attention/encoding), is KEPT (storage), and is pulled OUT when needed (retrieval).\n**In simple words:** Your brain works a bit like a computer that saves files.\n**Trap:** rewards = operant; copying = social learning; needs = Maslow.","tw":"**投影片：**訊息處理模型是一種把學習視為形成記憶的學習理論 – 像電腦一樣：訊息「進入」（注意／編碼）、被「保存」（儲存）、需要時「取出」（提取）。\n**簡單來說：**大腦有點像會儲存檔案的電腦。\n**陷阱：**獎勵 = 操作性制約；模仿 = 社會學習；需求 = 馬斯洛。"},"source":"PDF6 p.3","options":[{"en":"Forming memories","tw":"形成記憶"},{"en":"Earning rewards","tw":"賺取獎勵"},{"en":"Copying models","tw":"模仿楷模"},{"en":"Satisfying needs","tw":"滿足需求"}],"answerIndex":0,"correctAnswer":{"en":"Forming memories","tw":"形成記憶"}},{"id":"T6-33","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, why does a well-developed schema help memory?","tw":"根據投影片，為何完善的基模有助記憶？"},"explanation":{"en":"**Slides say:** Semantic memory is organised in networks by schemas. Schemas help decide the meaning of new knowledge and \"where\" it belongs; they guide perception, organisation and use of new information. The better-developed a schema is, the more easily you will remember knowledge that fits into it.\n**In simple words:** A football fan remembers new match scores easily because they already have a rich \"football\" folder.\n**Remember:** rich folder → easy filing.","tw":"**投影片：**語意記憶以基模組成網絡。基模幫助判斷新知識的意義和它屬於「哪裏」，指導新資訊的組織、處理和應用。基模建構得越完善，越容易記住能放進其中的知識。\n**簡單來說：**足球迷很易記住新賽果，因為他已有豐富的「足球」文件夾。\n**記住：**文件夾豐富 → 歸檔容易。"},"source":"PDF6 p.22","options":[{"en":"The better-developed a schema is, the more easily you remember knowledge that fits into it","tw":"基模越完善，越容易記住能放進其中的知識"},{"en":"It deletes old memories to make space","tw":"它刪除舊記憶以騰出空間"},{"en":"It stops new information from entering","tw":"它阻止新資訊進入"},{"en":"It only works in sensory memory","tw":"它只在感覺記憶中起作用"}],"answerIndex":0,"correctAnswer":{"en":"The better-developed a schema is, the more easily you remember knowledge that fits into it","tw":"基模越完善，越容易記住能放進其中的知識"}},{"id":"T6-34","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is a technique from the slides for increasing students' attention?","tw":"以下哪項是投影片中提升學生注意力的方法？"},"explanation":{"en":"**Slides say:** When planning a lesson, ask how to increase attention to the right content: use active learning rather than passive listening; vivid demonstrations relevant to real life; pictures; thought-provoking questions; emphasis such as \"This will be on the test!\" or \"Now, this is really interesting.\"\n**In simple words:** Only attended information gets into memory, so grab attention first.\n**Remember:** active, vivid, pictures, questions, emphasis.","tw":"**投影片：**計劃課堂時，想想如何提高學生對正確內容的注意：用主動學習而非被動聆聽；與生活相關的生動示範；圖片；發人深省的問題；強調，例如「這是考試重點！」、「這部分真的很有趣。」\n**簡單來說：**只有被注意的資訊才會進入記憶，所以先要吸引注意。\n**記住：**主動、生動、圖片、提問、強調。"},"source":"PDF6 p.27","options":[{"en":"Pictures, thought-provoking questions and emphasis (\"This will be on the test!\")","tw":"圖片、發人深省的問題和強調（「這是考試重點！」）"},{"en":"Speaking in a flat voice for the whole lesson","tw":"整堂課用單調聲線"},{"en":"Removing all real-life examples","tw":"刪除所有生活例子"},{"en":"Passive listening only","tw":"只讓學生被動聆聽"}],"answerIndex":0,"correctAnswer":{"en":"Pictures, thought-provoking questions and emphasis (\"This will be on the test!\")","tw":"圖片、發人深省的問題和強調（「這是考試重點！」）"}},{"id":"T6-35","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Why does ORGANISATION help retrieval from long-term memory?","tw":"為何「有組織」有助從長期記憶提取資訊？"},"explanation":{"en":"**Slides say:** Retrieval = getting information out of memory, often a conscious process. LTM capacity is unlimited, so complete searching is impossible – similar to searching for something with a torch at night. Organisation helps the retrieval process.\n**In simple words:** In a messy room you'll never find your keys; in a tidy room you go straight to the drawer.\n**Remember:** tidy memory = fast retrieval.","tw":"**投影片：**提取 = 從記憶中取出資訊，通常是有意識的過程。長期記憶容量無限，不可能完整搜尋 – 就像晚上用電筒找東西。組織有助提取。\n**簡單來說：**亂糟糟的房間永遠找不到鎖匙；整齊的房間就能直接打開抽屜。\n**記住：**記憶有條理 = 提取快。"},"source":"PDF6 p.29","options":[{"en":"LTM is unlimited, so a complete search is impossible – organisation tells you where to look","tw":"長期記憶無限，不可能全面搜尋 – 組織告訴你去哪裏找"},{"en":"Organisation makes LTM smaller","tw":"組織令長期記憶變小"},{"en":"Organisation turns LTM into STM","tw":"組織把長期記憶變成短期記憶"},{"en":"Retrieval never needs any cues","tw":"提取從不需要任何線索"}],"answerIndex":0,"correctAnswer":{"en":"LTM is unlimited, so a complete search is impossible – organisation tells you where to look","tw":"長期記憶無限，不可能全面搜尋 – 組織告訴你去哪裏找"}},{"id":"T6-36","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to \"Different perspectives of learning\", learning can result from…","tw":"根據「不同的學習觀點」，學習可以來自……"},"explanation":{"en":"**Slides say:** Learning can result from both direct and (indirect) vicarious experiences – vicarious means observing someone and learning from that observation without being directly involved. Learning is cognitively constructed and relies on social, emotional and cooperative processes.\n**In simple words:** You learn by touching the hot stove yourself OR by watching your brother get burnt.\n**Remember:** this links T6 with Bandura (T5) and constructivism (T1–T2).","tw":"**投影片：**學習可以來自直接經驗和間接（替代）經驗 – 替代是指觀察別人並從中學習，而不是直接參與。學習是認知的建構，建基於社交、情感和合作過程。\n**簡單來說：**你可以自己碰熱爐學會，也可以看見哥哥被燙到而學會。\n**記住：**這把 T6 與班杜拉（T5）和建構主義（T1–T2）連結起來。"},"source":"PDF6 p.44","options":[{"en":"Both direct and vicarious (observed) experiences","tw":"直接經驗和替代（觀察）經驗"},{"en":"Only direct experience","tw":"只有直接經驗"},{"en":"Only reading","tw":"只有閱讀"},{"en":"Only rewards","tw":"只有獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Both direct and vicarious (observed) experiences","tw":"直接經驗和替代（觀察）經驗"}},{"id":"T6-37","topicNo":6,"difficulty":"medium","type":"order","star":false,"question":{"en":"According to \"Type of learning\", put the steps you must go through to learn in order.","tw":"根據「學習的類型」，把學習必經的步驟排成正確次序。"},"explanation":{"en":"**Slides say:** To learn, you must encounter new information, pay attention to it, coordinate it with what you already know, store it in your memory, and apply it.\n**In simple words:** See it → notice it → link it → save it → use it.\n**Remember:** this mirrors attention → encoding → storage → retrieval.","tw":"**投影片：**學習，你必須遇到新資訊、注意它、與已知知識互相協調、儲存在記憶中，並應用它。\n**簡單來說：**遇見 → 留意 → 連結 → 儲存 → 運用。\n**記住：**這與注意 → 編碼 → 儲存 → 提取相呼應。"},"source":"PDF6 p.45","tiles":{"en":["Encounter new information","Pay attention to it","Coordinate it with what you know","Store it in memory","Apply it"],"tw":["遇到新資訊","注意它","與已知知識協調","儲存在記憶中","應用它"]},"answerLen":{"en":5,"tw":5},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Encounter new information → Pay attention to it → Coordinate it with what you know → Store it in memory → Apply it","tw":"遇到新資訊 → 注意它 → 與已知知識協調 → 儲存在記憶中 → 應用它"}},{"id":"T6-38","topicNo":6,"difficulty":"easy","type":"mc","star":false,"question":{"en":"In the slides' computer analogy for information processing, \"saving a file on the hard disk\" stands for…","tw":"在投影片的電腦比喻中，「把檔案存入硬碟」代表……"},"explanation":{"en":"**Slides say:** Encoding = forming a memory code (like entering data through the keyboard). Storage = maintaining encoded information over time (saving data in a file on the hard disk). Retrieval = recovering information from memory (calling up the file and displaying it on the monitor).\n**In simple words:** Type it in → save it → open it again.\n**Remember:** keyboard, hard disk, monitor.","tw":"**投影片：**編碼 = 形成記憶編碼（如用鍵盤輸入資料）；儲存 = 長時間保存已編碼的資訊（把資料存入硬碟）；提取 = 從記憶取回資訊（打開檔案在螢幕顯示）。\n**簡單來說：**輸入 → 儲存 → 再打開。\n**記住：**鍵盤、硬碟、螢幕。"},"source":"PDF6 p.4","options":[{"en":"Storage","tw":"儲存"},{"en":"Encoding","tw":"編碼"},{"en":"Retrieval","tw":"提取"},{"en":"Attention","tw":"注意"}],"answerIndex":0,"correctAnswer":{"en":"Storage","tw":"儲存"}},{"id":"T6-39","topicNo":6,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the \"types of memory\" tree, which description is correct?","tw":"在「記憶的類型」圖中，哪項描述正確？"},"explanation":{"en":"**Slides say:** Human memory: sensory (< 1 s), short-term/working (< 1 min), long-term (lifetime). Long-term splits into explicit (conscious) → declarative (facts, events) → episodic (events, experiences) and semantic (facts, concepts); and implicit (unconscious) → procedural (skills, tasks).\n**In simple words:** You KNOW you remember your holiday (explicit), but you just DO riding a bike without thinking (implicit).\n**Remember:** explicit = aware; implicit = automatic.","tw":"**投影片：**人類記憶：感覺（< 1 秒）、短期／工作（< 1 分鐘）、長期（一生）。長期分為外顯（有意識）→ 陳述（事實、事件）→ 情節（事件、經歷）和語意（事實、概念）；以及內隱（無意識）→ 程序（技能、任務）。\n**簡單來說：**你「知道」自己記得那次旅行（外顯）；踩單車卻是不經思考就做到（內隱）。\n**記住：**外顯 = 察覺得到；內隱 = 自動的。"},"source":"PDF6 p.14","options":[{"en":"Explicit memory is conscious; implicit memory is unconscious","tw":"外顯記憶是有意識的；內隱記憶是無意識的"},{"en":"Explicit memory is unconscious; implicit memory is conscious","tw":"外顯記憶是無意識的；內隱記憶是有意識的"},{"en":"Procedural memory is a type of explicit memory","tw":"程序記憶屬外顯記憶"},{"en":"Sensory memory lasts a lifetime","tw":"感覺記憶維持一生"}],"answerIndex":0,"correctAnswer":{"en":"Explicit memory is conscious; implicit memory is unconscious","tw":"外顯記憶是有意識的；內隱記憶是無意識的"},"fig":"memory_types"},{"id":"T6-40","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In the conceptual hierarchy (canary → bird → animal), where is the fact \"has skin\" stored?","tw":"在概念階梯（金絲雀 → 鳥 → 動物）中，「有皮膚」這個事實儲存在哪一層？"},"explanation":{"en":"**Slides say:** Conceptual hierarchies organise semantic memory: animal (has skin, can move, eats, breathes) → bird (wings, can fly, feathers) / fish (fins, can swim, gills) → canary (can sing, is yellow), penguin, shark, salmon. Question on the slide: \"A canary has fins – yes or no?\" Answer: No.\n**In simple words:** General facts are stored once at the top and shared by everything below it, like a family tree of ideas.\n**Remember:** general facts at the top; special facts at the bottom.","tw":"**投影片：**概念階梯組織語意記憶：動物（有皮膚、會移動、會吃、會呼吸）→ 鳥（有翼、會飛、有羽毛）／魚（有鰭、會游、有鰓）→ 金絲雀（會唱歌、黃色）、企鵝、鯊魚、三文魚。投影片問題：「金絲雀有鰭嗎？」答案：沒有。\n**簡單來說：**一般的事實只在最上層儲存一次，下面所有東西共用，就像概念的族譜。\n**記住：**一般事實在上層；特別事實在下層。"},"source":"PDF6 p.24","options":[{"en":"At the general \"animal\" level","tw":"一般的「動物」層"},{"en":"At the \"canary\" level","tw":"「金絲雀」層"},{"en":"At the \"fish\" level","tw":"「魚」層"},{"en":"It is not stored anywhere","tw":"沒有儲存在任何地方"}],"answerIndex":0,"correctAnswer":{"en":"At the general \"animal\" level","tw":"一般的「動物」層"}},{"id":"T6-41","topicNo":6,"difficulty":"hard","type":"mc","star":false,"question":{"en":"The slides contrast \"nonrelational\" with \"relational\" processing of a word list (notes, pencil, coffee, music…). Why does relational processing help memory?","tw":"投影片比較以「非關聯」與「關聯」方式處理一串字詞（筆記、鉛筆、咖啡、音樂……）。為何關聯處理有助記憶？"},"explanation":{"en":"**Slides say:** Nonrelational processing = the words are rehearsed as a separate list. Relational processing = the same words are linked into one meaningful picture (a student studying with notes, a pencil, coffee, music and a newspaper).\n**In simple words:** \"I'm at my desk with my notes, pencil and coffee, music on\" is easier to remember than a random list – one item reminds you of the next.\n**Remember:** links + meaning = elaborative, deeper encoding.","tw":"**投影片：**非關聯處理 = 把字詞當獨立清單重複；關聯處理 = 把同一組字詞連成一個有意義的畫面（學生一邊聽音樂、喝咖啡，一邊用筆記、鉛筆和報紙溫習）。\n**簡單來說：**「我坐在書枱前，有筆記、鉛筆和咖啡，播著音樂」比一串無關的字詞容易記 – 一樣東西會提醒你下一樣。\n**記住：**連結 + 意義 = 聯想、較深層的編碼。"},"source":"PDF6 p.12","options":[{"en":"The items are linked together into one meaningful scene, so each item cues the others","tw":"把項目連結成一個有意義的場景，每個項目都能提示其他項目"},{"en":"The items are repeated without meaning many times","tw":"把項目無意義地重複很多次"},{"en":"The items are kept only in sensory memory","tw":"項目只留在感覺記憶"},{"en":"The items are learned one letter at a time","tw":"逐個字母學習項目"}],"answerIndex":0,"correctAnswer":{"en":"The items are linked together into one meaningful scene, so each item cues the others","tw":"把項目連結成一個有意義的場景，每個項目都能提示其他項目"}},{"id":"T7-01","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Motivation is defined (Slavin, 2014) as…","tw":"動機的定義（Slavin, 2014）是……"},"explanation":{"en":"**Slides say:** Motivation is an internal process that activates, guides and maintains behaviour over time (Slavin, 2014).\n**In simple words:** Motivation is your inner engine. It STARTS you (activate), STEERS you (guide), and KEEPS you going (maintain). Example: wanting to pass a test gets you to open the book, choose what to study, and keep revising all week.\n**Remember:** start, steer, keep going.","tw":"**投影片：**動機是激活、引導並長時間維持行為的內在過程（Slavin, 2014）。\n**簡單來說：**動機是你內心的引擎：「啟動」你、「指引」方向、「維持」你繼續。例：想考試合格，令你打開書本、決定溫甚麼、整個星期堅持溫習。\n**記住：**啟動、指引、維持。"},"source":"PDF7 p.2","options":[{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"},{"en":"A reward given after a behaviour","tw":"行為之後給予的獎勵"},{"en":"A reflex caused by an unconditioned stimulus","tw":"由非制約刺激引起的反射"},{"en":"The capacity of short-term memory","tw":"短期記憶的容量"}],"answerIndex":0,"correctAnswer":{"en":"An internal process that activates, guides and maintains behaviour over time","tw":"激活、引導並維持行為的內在過程"}},{"id":"T7-02","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Who developed attribution theory?","tw":"誰提出歸因理論？"},"explanation":{"en":"**Slides say:** Attribution theory was developed by Bernard Weiner (UCLA). Every cause can be related to three factors: internal/external, controllable/uncontrollable, stable/unstable.\n**In simple words:** Attribution = how you explain WHY you succeeded or failed (\"I studied hard\" vs \"I was lucky\").\n**Trap:** Dweck = mindsets and goals; Seligman = learned helplessness; Maslow = needs.","tw":"**投影片：**歸因理論由 Bernard Weiner（UCLA）提出。每個成因都可從三方面分析：內在／外在、可控／不可控、穩定／不穩定。\n**簡單來說：**歸因 = 你怎樣解釋自己「為甚麼」成功或失敗（「我很努力」vs「我好彩」）。\n**陷阱：**Dweck = 心態與目標；Seligman = 習得性無助；Maslow = 需求。"},"source":"PDF7 p.8","options":[{"en":"Bernard Weiner","tw":"Bernard Weiner"},{"en":"Carol Dweck","tw":"Carol Dweck"},{"en":"Martin Seligman","tw":"Martin Seligman"},{"en":"Abraham Maslow","tw":"Abraham Maslow"}],"answerIndex":0,"correctAnswer":{"en":"Bernard Weiner","tw":"Bernard Weiner"}},{"id":"T7-03","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is EFFORT classified in attribution theory?","tw":"歸因理論中，「努力」如何分類？"},"explanation":{"en":"**Slides say:** Effort = internal, controllable, unstable (\"personal effort can change\").\n**In simple words:** Effort comes from YOU, you CHOOSE how much, and it can be different tomorrow. That's why \"I didn't try hard enough\" is a hopeful reason – you can fix it next time.\n**Remember:** learning strategy has the same three labels as effort.","tw":"**投影片：**努力 = 內在、可控、不穩定（「個人努力是可變的」）。\n**簡單來說：**努力來自「你」，由你「選擇」多少，明天可以不同。所以「我不夠努力」是充滿希望的原因 – 下次可以改。\n**記住：**學習策略與努力的三個分類相同。"},"source":"PDF7 p.11","options":[{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},"fig":"attribution_grid"},{"id":"T7-04","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"How is TASK DIFFICULTY classified?","tw":"「任務難度」如何分類？"},"explanation":{"en":"**Slides say:** Task difficulty = external, uncontrollable, stable.\n**In simple words:** How hard the exam is comes from OUTSIDE you, you can't change it, and it stays the same.\n• Effort/strategy: internal · controllable · unstable\n• Luck: external · uncontrollable · unstable\n• Task difficulty: external · uncontrollable · stable\n• Ability: internal · uncontrollable(?) · stable(?)","tw":"**投影片：**任務難度 = 外在、不可控、穩定。\n**簡單來說：**考試有多難來自你「以外」，你改變不了，而且不會變。\n• 努力／策略：內在 · 可控 · 不穩定\n• 運氣：外在 · 不可控 · 不穩定\n• 任務難度：外在 · 不可控 · 穩定\n• 能力：內在 · 不可控（?）· 穩定（?）"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},"fig":"attribution_grid"},{"id":"T7-05","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"How is LUCK classified?","tw":"「運氣」如何分類？"},"explanation":{"en":"**Slides say:** Luck = external, uncontrollable, unstable (\"luck is not under personal control\").\n**In simple words:** Luck is outside you, you can't control it, and it changes from day to day – lucky today, unlucky tomorrow.\n**Trap:** task difficulty is also external and uncontrollable, but it is STABLE.","tw":"**投影片：**運氣 = 外在、不可控、不穩定（「運氣是不受個人控制的」）。\n**簡單來說：**運氣在你以外、控制不了，而且每天不同 – 今天好彩，明天未必。\n**陷阱：**任務難度同樣外在、不可控，但它是「穩定」的。"},"source":"PDF7 p.11","options":[{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},{"en":"External, uncontrollable, stable","tw":"外在、不可控、穩定"},{"en":"Internal, controllable, unstable","tw":"內在、可控、不穩定"},{"en":"Internal, uncontrollable, stable","tw":"內在、不可控、穩定"}],"answerIndex":0,"correctAnswer":{"en":"External, uncontrollable, unstable","tw":"外在、不可控、不穩定"},"fig":"attribution_grid"},{"id":"T7-06","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"Which attribution for FAILURE is the most adaptive (desirable)?","tw":"對「失敗」的哪種歸因最理想（適應性）？"},"explanation":{"en":"**Slides say:** Adaptive pattern: attribute failure to lack of effort → motivating emotions (e.g. guilt) → high persistence, mastery-oriented, relatively high expectation of future success. Maladaptive: failure → lack of ability → depression, avoidance, helplessness.\n**In simple words:** \"I didn't study enough\" means next time I can do better, so I keep going. \"I'm stupid\" means why bother, so I give up.\n**Remember:** blame effort, not brains.","tw":"**投影片：**理想歸因：失敗歸因於努力不足 → 激發情緒（如內疚）→ 高度堅持、精熟導向、對未來成功期望較高。不理想：失敗 → 能力不足 → 沮喪、逃避、無助。\n**簡單來說：**「我溫得不夠」= 下次可以做得更好，所以繼續；「我好蠢」= 何必努力，於是放棄。\n**記住：**歸因努力，不歸因天資。"},"source":"PDF7 p.17","options":[{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"},{"en":"\"I'm just not smart enough.\"","tw":"「我根本不夠聰明。」"},{"en":"\"The test was impossible.\"","tw":"「測驗根本不可能做到。」"},{"en":"\"I was unlucky.\"","tw":"「我運氣不好。」"}],"answerIndex":0,"correctAnswer":{"en":"\"I didn't put in enough effort.\"","tw":"「我不夠努力。」"}},{"id":"T7-07","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A teacher tells a student, \"You got an A – you were lucky!\" What is the problem?","tw":"老師對學生說：「你拿 A – 運氣好而已！」問題在哪？"},"explanation":{"en":"**Slides say:** Do not attribute students' success to unstable and uncontrollable factors such as luck. Maladaptive pattern: success → luck → indifference, little rise in expectation, lack of future effort.\n**In simple words:** If an A was \"just luck\", the student thinks effort doesn't matter and won't try harder next time.\n**Better feedback:** \"You got an A because you practised every day!\"","tw":"**投影片：**不要把學生的成功歸因於運氣等不穩定、不可控的因素。不理想歸因：成功 → 運氣 → 冷漠、期望不提高、日後不努力。\n**簡單來說：**如果拿 A 只是「好彩」，學生會覺得努力沒用，下次不再加把勁。\n**較好的回饋：**「你拿 A 是因為你每天都有練習！」"},"source":"PDF7 p.26","options":[{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"},{"en":"It attributes success to effort, which is maladaptive","tw":"把成功歸因於努力，屬不理想歸因"},{"en":"Luck is internal and stable","tw":"運氣是內在且穩定的"},{"en":"There is no problem; luck is the best attribution","tw":"沒有問題；運氣是最好的歸因"}],"answerIndex":0,"correctAnswer":{"en":"It attributes success to an unstable, uncontrollable cause, so the student won't see a reason to put in future effort","tw":"把成功歸因於不穩定、不可控的因素，學生看不到日後努力的理由"}},{"id":"T7-08","topicNo":7,"difficulty":"medium","type":"order","star":true,"question":{"en":"Dogs that could NOT control electric shocks later did not even try to escape. Tap the tiles to name this.","tw":"無法控制電擊的狗，之後連嘗試逃走都沒有。按次序點選字卡，說出這個現象。"},"explanation":{"en":"**Slides say:** Learned helplessness (Seligman & Maier, 1967): dogs that could not control shocks later did not escape, even when they easily could. In students: \"You expect to fail, so why bother?\" plus anxiety and low self-esteem.\n**In simple words:** After failing again and again no matter what, a student stops trying. Real experiences of overcoming difficulties protect against it – the earlier, the better.\n**Remember:** helplessness is LEARNED, so it can be un-learned.","tw":"**投影片：**習得性無助（Seligman & Maier, 1967）：無法控制電擊的狗，之後即使容易逃走也不逃。學生身上：「反正會失敗，何必努力？」並感到焦慮、自卑。\n**簡單來說：**無論怎樣做都一再失敗，學生便不再嘗試。曾經克服困難的經驗可以預防 – 越早越好。\n**記住：**無助是「學來的」，所以可以改變。"},"source":"PDF7 p.1","tiles":{"en":["Learned","helplessness","hopelessness","Attribution"],"tw":["習得性","無助","無望","歸因"]},"answerLen":{"en":2,"tw":2},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Learned helplessness","tw":"習得性無助"}},{"id":"T7-09","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In Dweck's (1975) attributional retraining, students in the experimental group were told their failures were due to…","tw":"在 Dweck（1975）的歸因再訓練中，實驗組學生被告知失敗是因為……"},"explanation":{"en":"**Slides say:** Dweck (1975) attributional retraining: each time students in the experimental group failed, they were told it was due to lack of effort or ineffective learning strategies. After 25 sessions they persisted longer, changed strategies and got better at maths. The control group got no such feedback.\n**In simple words:** Teaching kids to blame things they CAN fix (effort, method) brought back their motivation.\n**Remember:** retrain → \"try harder / try differently\".","tw":"**投影片：**Dweck（1975）歸因再訓練：實驗組學生每次失敗都被告知是因為努力不足或學習策略無效；25 節後他們更堅持、會改策略、數學進步。對照組沒有這種回饋。\n**簡單來說：**教學生把失敗歸因於「可以改」的事（努力、方法），動機便回來了。\n**記住：**再訓練 →「再努力／換方法」。"},"source":"PDF7 p.24","options":[{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"},{"en":"Low intelligence","tw":"智力低"},{"en":"Bad luck","tw":"運氣差"},{"en":"A very difficult test","tw":"測驗太難"}],"answerIndex":0,"correctAnswer":{"en":"Lack of effort or ineffective learning strategies","tw":"努力不足或學習策略無效"}},{"id":"T7-10","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"Intelligence is inborn and cannot change\" is the ___ theory of intelligence.","tw":"「智力是天生且不能改變的」屬 ___ 智力理論。"},"explanation":{"en":"**Slides say:** Entity theory of intelligence = intelligence is inborn and unchangeable (Dweck, 1986).\n**In simple words:** Entity = a fixed \"thing\" – like eye colour, you're born with it. Incremental = it grows like a muscle with practice.\n**Remember:** entity → fixed mindset; incremental → growth mindset.","tw":"**投影片：**固定智力理論 = 智力與生俱來、不可改變（Dweck, 1986）。\n**簡單來說：**固定理論 = 智力像眼睛顏色，天生不變；增長理論 = 智力像肌肉，練習就會增長。\n**記住：**固定理論 → 固定心態；增長理論 → 成長心態。"},"source":"PDF7 p.30","options":[{"en":"Entity","tw":"固定（entity）"},{"en":"Incremental","tw":"增長（incremental）"},{"en":"Attribution","tw":"歸因"},{"en":"Expectancy","tw":"期望"}],"answerIndex":0,"correctAnswer":{"en":"Entity","tw":"固定（entity）"}},{"id":"T7-11","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Intelligence can be changed through effort\" is the ___ theory of intelligence.","tw":"「智力可以靠努力改變」屬哪種智力理論？"},"explanation":{"en":"**Slides say:** Incremental theory of intelligence = intelligence (ability) can be changed through effort (Dweck, 1986). Linked to ability being controllable and unstable (changeable).\n**In simple words:** \"Incremental\" = growing step by step. Like learning to swim: lap by lap you get better.\n**Remember:** incremental + learning goals = growth mindset.","tw":"**投影片：**增長智力理論 = 智力（能力）可以透過努力改變（Dweck, 1986）；能力被視為可控、不穩定（可改變）。\n**簡單來說：**「增長」= 一步一步進步，就像學游泳，一圈一圈游得更好。\n**記住：**增長理論 + 學習目標 = 成長心態。"},"source":"PDF7 p.30","options":[{"en":"Incremental","tw":"增長理論（incremental）"},{"en":"Entity","tw":"固定理論（entity）"},{"en":"Expectancy","tw":"期望理論（expectancy）"},{"en":"Attribution","tw":"歸因理論（attribution）"}],"answerIndex":0,"correctAnswer":{"en":"Incremental","tw":"增長理論（incremental）"}},{"id":"T7-12","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"\"It's important to me that I look smart compared to others in my class.\" This shows a…","tw":"「對我來說，在班上比別人顯得聰明很重要。」這反映……"},"explanation":{"en":"**Slides say:** Performance goals = to prove \"I have high ability\"; outcomes (grades) are seen as a sign of ability. Learning goals = to learn new knowledge and skills; growth is seen as success.\n**In simple words:** Wanting to LOOK smarter than classmates = performance goal. Wanting to GET better = learning goal.\n**Remember:** performance = prove; learning = improve.","tw":"**投影片：**表現目標 = 證明「我能力很高」；結果（成績）被視為能力指標。學習目標 = 學習新知識和技能；成長被視為成功。\n**簡單來說：**想「顯得」比同學聰明 = 表現目標；想「變得」更好 = 學習目標。\n**記住：**表現 = 證明；學習 = 進步。"},"source":"PDF7 p.37","options":[{"en":"Performance goal","tw":"表現目標"},{"en":"Learning goal","tw":"學習目標"},{"en":"Growth mindset","tw":"成長心態"},{"en":"Intrinsic motivation","tw":"內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Performance goal","tw":"表現目標"}},{"id":"T7-13","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A growth mindset combines…","tw":"成長心態結合了……"},"explanation":{"en":"**Slides say:** Growth mindset = incremental theory of intelligence + learning goals – ability is something to be DEVELOPED. Fixed mindset = entity theory + performance goals – ability is something to be DEMONSTRATED.\n**In simple words:** Growth mindset says \"I can't do it YET, but practice will help.\" Fixed mindset says \"I'm just not a maths person.\"\n**Remember:** growth = develop; fixed = demonstrate.","tw":"**投影片：**成長心態 = 增長智力理論 + 學習目標 – 能力是「培養」出來的。固定心態 = 固定理論 + 表現目標 – 能力是要「表現」出來的。\n**簡單來說：**成長心態：「我『暫時』未做到，練習會有幫助。」固定心態：「我天生不擅長數學。」\n**記住：**成長 = 培養；固定 = 表現。"},"source":"PDF7 p.42","options":[{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"},{"en":"Entity theory of intelligence + performance goals","tw":"固定智力理論＋表現目標"},{"en":"Entity theory + learning goals","tw":"固定理論＋學習目標"},{"en":"External attributions + extrinsic rewards","tw":"外在歸因＋外在獎勵"}],"answerIndex":0,"correctAnswer":{"en":"Incremental theory of intelligence + learning goals","tw":"增長智力理論＋學習目標"}},{"id":"T7-14","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"A student with a PERFORMANCE goal and LOW confidence will most likely…","tw":"抱「表現目標」且「信心低」的學生最可能……"},"explanation":{"en":"**Slides say:** Performance goal + LOW confidence → helpless pattern: avoid challenge, low persistence. Performance goal + high confidence → mastery-oriented. Learning goal → mastery-oriented whether confidence is high or low.\n**In simple words:** If you only care about LOOKING smart and you doubt yourself, a hard task could make you look stupid – so you avoid it and give up fast.\n**Remember:** learning goals protect students with low confidence.","tw":"**投影片：**表現目標 + 信心「低」→ 無助模式：逃避挑戰、不堅持。表現目標 + 信心高 → 精熟導向。學習目標 → 不論信心高低都是精熟導向。\n**簡單來說：**只在乎「顯得」聰明又懷疑自己，難題可能令你出醜 – 於是逃避、很快放棄。\n**記住：**學習目標能保護信心低的學生。"},"source":"PDF7 p.1","options":[{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"},{"en":"Seek challenge with high persistence","tw":"尋求挑戰並高度堅持"},{"en":"Be mastery-oriented no matter what","tw":"無論如何都是精熟導向"},{"en":"Have no change in behaviour","tw":"行為沒有改變"}],"answerIndex":0,"correctAnswer":{"en":"Show a helpless pattern: avoid challenge, low persistence","tw":"表現無助：逃避挑戰、不堅持"}},{"id":"T7-15","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Expectancy theory: M = Ps × ?","tw":"期望理論：M = Ps × ？"},"explanation":{"en":"**Slides say:** Expectancy theory (Edwards, 1954; Atkinson, 1964): M = Ps × Is. M = motivation, Ps = perceived probability of success, Is = incentive value of success.\n**In simple words:** You're motivated when you think you CAN succeed AND success is WORTH it. Example: a prize you'd love but can't possibly win → low M.\n**Remember:** chance × value.","tw":"**投影片：**期望理論（Edwards, 1954；Atkinson, 1964）：M = Ps × Is。M = 動機，Ps = 成功機會率，Is = 成功的誘因價值。\n**簡單來說：**你覺得自己「做得到」，而且成功「值得」，才會有動機。例：很想要但根本贏不到的獎品 → 動機低。\n**記住：**機會率 × 價值。"},"source":"PDF7 p.45","options":[{"en":"Is – incentive value of success","tw":"Is – 成功的誘因價值"},{"en":"Ps – probability of success","tw":"Ps – 成功的機會率"},{"en":"E – effort","tw":"E – 努力"},{"en":"A – ability","tw":"A – 能力"}],"answerIndex":0,"correctAnswer":{"en":"Is – incentive value of success","tw":"Is – 成功的誘因價值"},"fig":"expectancy"},{"id":"T7-16","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A student thinks success is very likely (Ps = 0.9) but sees no value in it (Is = 0). Motivation (M) = ?","tw":"學生認為成功機會很高（Ps = 0.9），但覺得成功毫無價值（Is = 0）。動機 M = ？"},"explanation":{"en":"**Slides say:** If Ps = 0 or Is = 0, then M = 0.\n**In simple words:** It's multiplication: 0.9 × 0 = 0. Even if success is almost certain, if you don't care about it at all, you won't be motivated.\n**Remember:** anything × 0 = 0.","tw":"**投影片：**如果 Ps = 0 或 Is = 0，M 就等於 0。\n**簡單來說：**這是乘法：0.9 × 0 = 0。即使幾乎一定成功，你完全不在乎的話，也不會有動機。\n**記住：**任何數 × 0 = 0。"},"source":"PDF7 p.45","options":[{"en":"0","tw":"0"},{"en":"0.9","tw":"0.9"},{"en":"0.45","tw":"0.45"},{"en":"1","tw":"1"}],"answerIndex":0,"correctAnswer":{"en":"0","tw":"0"},"fig":"expectancy"},{"id":"T7-17","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In expectancy theory, \"utility value\" means…","tw":"期望理論中，「實用價值」是指……"},"explanation":{"en":"**Slides say:** Utility value = how useful the student thinks the task is for future goals, such as career goals. Attainment value = personal importance and link to self-concept (pride). Cost = what you must give up, e.g. time.\n**In simple words:** \"Learning English will help me get a job abroad\" = utility value.\n**Remember:** utility = useful; attainment = pride; cost = what I give up.","tw":"**投影片：**實用價值 = 學生認為任務對未來目標（如職業）有多有用。成就價值 = 對個人的重要性及與自我概念的關係（自豪）。代價 = 要放棄的東西，例如時間。\n**簡單來說：**「學好英文有助我日後到外國工作」= 實用價值。\n**記住：**實用 = 有用；成就 = 自豪；代價 = 要放棄甚麼。"},"source":"PDF7 p.47","options":[{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"},{"en":"How the task links to self-concept and pride","tw":"任務與自我概念和自豪感的關係"},{"en":"What you must give up, e.g. time","tw":"要放棄甚麼，例如時間"},{"en":"The chance of succeeding","tw":"成功的機會率"}],"answerIndex":0,"correctAnswer":{"en":"How useful the task is for future goals, e.g. a career","tw":"任務對未來目標（如職業）的用處"}},{"id":"T7-18","topicNo":7,"difficulty":"hard","type":"mc","star":false,"question":{"en":"If Ps (probability of success) is too HIGH, what happens to Is, and what should teachers do?","tw":"如果 Ps（成功機會率）太「高」，Is 會怎樣？老師應怎樣做？"},"explanation":{"en":"**Slides say:** If Ps is too high, Is will drop – \"What's the incentive for doing well on a very easy task?\" Grading should make good grades difficult, but not impossible.\n**In simple words:** Winning a race against a toddler feels worthless. Wins only feel valuable when they take real effort.\n**Remember:** challenging but not impossible.","tw":"**投影片：**Ps 太高，Is 便會下降 –「在極容易的任務上表現好有甚麼價值？」評分應令好成績變得困難，但並非不可能。\n**簡單來說：**跟幼童賽跑贏了也沒甚麼意思；要付出努力的勝利才有價值。\n**記住：**有挑戰，但並非不可能。"},"source":"PDF7 p.48","options":[{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"},{"en":"Is rises; make all tasks very easy","tw":"Is 上升；把所有任務變得很容易"},{"en":"Is stays the same; nothing needs to change","tw":"Is 不變；毋須改變"},{"en":"Is becomes negative; stop grading","tw":"Is 變成負數；停止評分"}],"answerIndex":0,"correctAnswer":{"en":"Is drops; make good grades difficult but not impossible","tw":"Is 下降；令好成績變得困難但並非不可能"}},{"id":"T7-19","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Teachers should encourage students to attribute success and failure to factors that are…","tw":"老師應鼓勵學生把成功和失敗歸因於哪類因素？"},"explanation":{"en":"**Slides say:** Encourage students to attribute their success and failure to internal, controllable and unstable factors, e.g. effort.\n**In simple words:** If the cause is inside me and I can change it, then trying harder or changing my study method always makes sense.\n**Remember:** internal + controllable + unstable = effort / strategy.","tw":"**投影片：**鼓勵學生把成功和失敗歸因於內在、可控、不穩定的因素，例如努力。\n**簡單來說：**原因在我之內、我又能改變的話，更努力或改變溫習方法就一定有意思。\n**記住：**內在 + 可控 + 不穩定 = 努力／策略。"},"source":"PDF7 p.27","options":[{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"},{"en":"External, uncontrollable and stable (e.g. task difficulty)","tw":"外在、不可控、穩定（例如任務難度）"},{"en":"Internal, uncontrollable and stable (e.g. fixed ability)","tw":"內在、不可控、穩定（例如固定能力）"},{"en":"External, uncontrollable and unstable (e.g. luck)","tw":"外在、不可控、不穩定（例如運氣）"}],"answerIndex":0,"correctAnswer":{"en":"Internal, controllable and unstable (e.g. effort)","tw":"內在、可控、不穩定（例如努力）"}},{"id":"T7-20","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is NOT one of the four \"causes of motivation\" theories in Topic 7?","tw":"以下哪項「不是」Topic 7 的四個「動機成因」理論之一？"},"explanation":{"en":"**Slides say:** Causes of motivation (Topic 7): (1) attribution theory & learned helplessness; (2) implicit theories of intelligence; (3) goal orientation theory; (4) expectancy theory. Types of motivation (Topic 8): Maslow's hierarchy of needs; self-determination theory (intrinsic vs extrinsic).\n**In simple words:** Topic 7 asks WHY we are (not) motivated; Topic 8 asks WHAT KINDS of motivation exist.\n**Remember:** T7 = causes; T8 = types.","tw":"**投影片：**動機成因（Topic 7）：(1) 歸因理論與習得性無助；(2) 內隱智力理論；(3) 目標導向理論；(4) 期望理論。動機類型（Topic 8）：馬斯洛需求層次；自我決定理論（內在 vs 外在）。\n**簡單來說：**Topic 7 問「為甚麼」有（沒有）動機；Topic 8 問動機有「哪些類型」。\n**記住：**T7 = 成因；T8 = 類型。"},"source":"PDF7 p.4","options":[{"en":"Maslow's hierarchy of needs","tw":"馬斯洛需求層次理論"},{"en":"Attribution theory & learned helplessness","tw":"歸因理論與習得性無助"},{"en":"Goal orientation theory","tw":"目標導向理論"},{"en":"Expectancy theory","tw":"期望理論"}],"answerIndex":0,"correctAnswer":{"en":"Maslow's hierarchy of needs","tw":"馬斯洛需求層次理論"}},{"id":"T7-21","topicNo":7,"difficulty":"hard","type":"mc","star":true,"question":{"en":"A student attributes failure to \"ability\". According to the slides, whether this hurts motivation depends on…","tw":"學生把失敗歸因於「能力」。根據投影片，這會否打擊動機取決於……"},"explanation":{"en":"**Slides say:** If you attribute success or failure to your ability (intelligence), its effect depends on your implicit theory: entity theory → ability is uncontrollable and stable; incremental theory → ability is controllable and unstable (changeable).\n**In simple words:** \"I'm not good at maths YET\" (incremental) keeps you trying; \"I'm just not a maths person\" (entity) makes you quit.\n**Remember:** that's why ability has a (?) in the attribution table.","tw":"**投影片：**如果把成功／失敗歸因於能力（智力），其影響取決於你的內隱智力理論：固定理論 → 能力不可控、穩定；增長理論 → 能力可控、不穩定（可改變）。\n**簡單來說：**「我『暫時』未擅長數學」（增長）令你繼續努力；「我天生不是讀數學的料」（固定）令你放棄。\n**記住：**所以歸因表中「能力」一欄有（?）。"},"source":"PDF7 p.31","options":[{"en":"Their implicit theory of intelligence (entity → stable & uncontrollable; incremental → changeable & controllable)","tw":"他的內隱智力理論（固定理論 → 穩定且不可控；增長理論 → 可變且可控）"},{"en":"Which reinforcement schedule the teacher uses","tw":"老師使用哪種強化計劃"},{"en":"Their short-term memory capacity","tw":"他的短期記憶容量"},{"en":"Whether they are in the sensorimotor stage","tw":"他是否處於感覺運動期"}],"answerIndex":0,"correctAnswer":{"en":"Their implicit theory of intelligence (entity → stable & uncontrollable; incremental → changeable & controllable)","tw":"他的內隱智力理論（固定理論 → 穩定且不可控；增長理論 → 可變且可控）"}},{"id":"T7-22","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Attributing SUCCESS to high effort typically leads to…","tw":"把「成功」歸因於高度努力，通常會帶來……"},"explanation":{"en":"**Slides say:** Desirable pattern (reaction to success): attribute success to high effort → positive-esteem emotions (e.g. pride) → high persistence, mastery-oriented, high expectation of future success. Undesirable: success → luck → indifference, little rise in expectation, lack of future effort.\n**In simple words:** \"I did well because I practised\" makes you proud AND tells you what to do next time.\n**Remember:** effort → pride → keep going.","tw":"**投影片：**理想歸因（對成功）：把成功歸因於努力 → 積極自信的情緒（如自豪）→ 高度堅持、精熟導向、對未來成功高度期望。不理想：成功 → 運氣 → 冷漠、期望不提高、日後不努力。\n**簡單來說：**「我做得好是因為有練習」令你自豪，也告訴你下次怎樣做。\n**記住：**努力 → 自豪 → 繼續。"},"source":"PDF7 p.19","options":[{"en":"Pride, high persistence, mastery orientation and a high expectation of future success","tw":"自豪、高度堅持、精熟導向，以及對未來成功的高度期望"},{"en":"Indifference and lack of future effort","tw":"冷漠及日後不再努力"},{"en":"Depression and avoidance","tw":"沮喪和逃避"},{"en":"Learned helplessness","tw":"習得性無助"}],"answerIndex":0,"correctAnswer":{"en":"Pride, high persistence, mastery orientation and a high expectation of future success","tw":"自豪、高度堅持、精熟導向，以及對未來成功的高度期望"}},{"id":"T7-23","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What is Attributional Retraining (AR) designed to do?","tw":"歸因再訓練（AR）的目的是甚麼？"},"explanation":{"en":"**Slides say:** Attributional Retraining (AR) is designed to enhance motivation and encourage achievement by changing how students think about their academic successes and failures, so that their beliefs work for, rather than against, their chances of success. Example: Dweck (1975).\n**In simple words:** Teach students to say \"I need a better strategy\" instead of \"I'm stupid\".\n**Remember:** retrain the \"why\".","tw":"**投影片：**歸因再訓練（AR）旨在透過改變學生對學業成功和失敗的看法，增強動機、鼓勵成就，令信念有利於而非不利於爭取成功。例子：Dweck（1975）。\n**簡單來說：**教學生說「我需要更好的方法」，而不是「我好蠢」。\n**記住：**重新訓練「為甚麼」。"},"source":"PDF7 p.23","options":[{"en":"Change how students think about their successes and failures, so their beliefs help rather than hurt their chances of success","tw":"改變學生對成功和失敗的看法，令信念有利而非不利於爭取成功"},{"en":"Reward students with money for good grades","tw":"以金錢獎勵好成績"},{"en":"Train students to memorise faster","tw":"訓練學生記得更快"},{"en":"Teach students to blame luck","tw":"教學生歸咎運氣"}],"answerIndex":0,"correctAnswer":{"en":"Change how students think about their successes and failures, so their beliefs help rather than hurt their chances of success","tw":"改變學生對成功和失敗的看法，令信念有利而非不利於爭取成功"}},{"id":"T7-24","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, what protects people from learned helplessness?","tw":"根據投影片，甚麼能保護人免於習得性無助？"},"explanation":{"en":"**Slides say:** A key factor is whether people have experienced overcoming setbacks. If they once overcame difficulties through their own effort, they are less likely to develop learned helplessness even in uncontrollable situations – and the earlier this happens in life, the stronger the effect.\n**In simple words:** Like Group A dogs that COULD stop the shock – they kept trying.\n**Remember:** success after struggle builds a shield.","tw":"**投影片：**關鍵在於「是否曾經有過克服挫折的經驗」；曾靠自己努力克服困境的人，即使後來處於不可控的環境，也較不易出現習得性無助 – 這經驗越早發生，效果越強。\n**簡單來說：**就像 A 組能停止電擊的狗，牠們會繼續嘗試。\n**記住：**經努力而成功，就像一面盾牌。"},"source":"PDF7 p.22","options":[{"en":"Having overcome setbacks through their own effort – the earlier in life, the stronger the effect","tw":"曾經靠自己努力克服挫折 – 越早經歷，效果越強"},{"en":"Never facing any difficulty","tw":"從不面對任何困難"},{"en":"Being told they are not smart","tw":"被告知自己不聰明"},{"en":"Only receiving punishments","tw":"只受到懲罰"}],"answerIndex":0,"correctAnswer":{"en":"Having overcome setbacks through their own effort – the earlier in life, the stronger the effect","tw":"曾經靠自己努力克服挫折 – 越早經歷，效果越強"}},{"id":"T7-25","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"\"It's important to me that I improve my skills this year.\" Which goal orientation is this?","tw":"「今年提升自己的技能，對我很重要。」這屬哪種目標導向？"},"explanation":{"en":"**Slides say:** Learning goals = learn new knowledge or skills, increase one's abilities; understanding and growth are seen as success. Performance goals = prove \"I have high ability\"; outcomes are seen as a sign of ability.\n**In simple words:** \"Get better\" = learning goal. \"Look better than others\" = performance goal.\n**Remember:** improve = learning; prove = performance.","tw":"**投影片：**學習目標 = 學習新知識或技能、提升能力；理解和成長被視為成功。表現目標 = 證明「我能力很高」；結果被視為能力指標。\n**簡單來說：**「變得更好」= 學習目標；「顯得比別人好」= 表現目標。\n**記住：**進步 = 學習；證明 = 表現。"},"source":"PDF7 p.37","options":[{"en":"Learning goal","tw":"學習目標"},{"en":"Performance goal","tw":"表現目標"},{"en":"Fixed mindset","tw":"固定心態"},{"en":"Extrinsic goal","tw":"外在目標"}],"answerIndex":0,"correctAnswer":{"en":"Learning goal","tw":"學習目標"}},{"id":"T7-26","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which classroom practice promotes PERFORMANCE goals?","tw":"以下哪項課堂做法會助長「表現目標」？"},"explanation":{"en":"**Slides say:** Slide statements such as \"My teacher lets us know which students get the highest scores\", \"My teacher tells us how we compare to other students\" and \"In our class, getting good grades is the main goal\" reflect performance goals. \"My teacher recognises us for trying hard\" and \"master a lot of new concepts\" reflect learning goals.\n**In simple words:** Ranking and comparing pushes students to SHOW ability instead of building it.\n**Remember:** compare = performance; effort/mastery = learning.","tw":"**投影片：**投影片句子如「老師讓我們知道誰取得最高分」、「老師告訴我們與其他同學比較的結果」、「班上取得好成績是主要目標」反映表現目標；「老師表揚我們努力嘗試」、「掌握很多新概念」反映學習目標。\n**簡單來說：**排名和比較令學生想「展示」能力，而不是建立能力。\n**記住：**比較 = 表現；努力／精熟 = 學習。"},"source":"PDF7 p.38","options":[{"en":"The teacher tells us how we compare to other students","tw":"老師告訴我們與其他同學比較的結果"},{"en":"The teacher recognises us for trying hard","tw":"老師表揚我們努力嘗試"},{"en":"My parents want my work to be challenging","tw":"父母希望功課有挑戰性"},{"en":"One of my goals is to master many new concepts","tw":"我的目標之一是掌握很多新概念"}],"answerIndex":0,"correctAnswer":{"en":"The teacher tells us how we compare to other students","tw":"老師告訴我們與其他同學比較的結果"}},{"id":"T7-27","topicNo":7,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Which teaching practice creates a LEARNING-oriented environment (goal orientation theory)?","tw":"根據目標導向理論，以下哪項教學做法能營造「學習導向」的環境？"},"explanation":{"en":"**Slides say:** Create a learning-oriented environment: emphasise progress and improvement; encourage cooperation; emphasise the interest value and practical importance of materials. Do NOT create a performance-oriented one: de-emphasise external rewards and competitive grading; treat failure as part of learning.\n**In simple words:** Celebrate \"you improved by 10 marks\" rather than \"you came 3rd\".\n**Remember:** progress, cooperation, interest – not ranks.","tw":"**投影片：**營造學習導向的環境：強調進步和改善；鼓勵合作；強調教材的趣味和實用性。「不要」營造表現導向的環境：淡化外在獎勵和競爭性評分；把失敗視為學習的一部分。\n**簡單來說：**慶祝「你進步了 10 分」，而不是「你考第 3」。\n**記住：**進步、合作、趣味 – 不是排名。"},"source":"PDF7 p.39","options":[{"en":"Emphasise progress and improvement, encourage cooperation, and treat failure as part of learning","tw":"強調進步和改善、鼓勵合作，並把失敗視為學習的一部分"},{"en":"Post a ranking of test scores every week","tw":"每週張貼測驗分數排名"},{"en":"Give big prizes only to the top student","tw":"只給第一名大獎"},{"en":"Use a strongly competitive grading system","tw":"使用高度競爭的評分制度"}],"answerIndex":0,"correctAnswer":{"en":"Emphasise progress and improvement, encourage cooperation, and treat failure as part of learning","tw":"強調進步和改善、鼓勵合作，並把失敗視為學習的一部分"}},{"id":"T7-28","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"What does Vroom's (1964) expectancy theory say?","tw":"Vroom（1964）的期望理論指出甚麼？"},"explanation":{"en":"**Slides say:** Expectancy theory suggests individuals are motivated to perform if they know their extra performance is recognised and rewarded (Vroom, 1964). Edwards (1954) and Atkinson (1964) gave the formula M = Ps × Is.\n**In simple words:** \"If I work extra hard, will anyone notice and reward it?\" Yes → effort.\n**Remember:** Vroom = recognition and reward; Edwards/Atkinson = the formula.","tw":"**投影片：**期望理論指出，若個人知道額外的表現會得到認可和獎勵，就會有動力（Vroom, 1964）。Edwards（1954）和 Atkinson（1964）提出公式 M = Ps × Is。\n**簡單來說：**「我額外努力，會有人看到並獎勵嗎？」會 → 就努力。\n**記住：**Vroom = 認可與獎勵；Edwards／Atkinson = 公式。"},"source":"PDF7 p.44","options":[{"en":"People are motivated to perform if they know their extra performance will be recognised and rewarded","tw":"人若知道額外的表現會得到認可和獎勵，就會有動力去做"},{"en":"People are motivated only by fear","tw":"人只會因恐懼而有動力"},{"en":"Motivation depends only on age","tw":"動機只取決於年齡"},{"en":"Rewards always reduce motivation","tw":"獎勵一定降低動機"}],"answerIndex":0,"correctAnswer":{"en":"People are motivated to perform if they know their extra performance will be recognised and rewarded","tw":"人若知道額外的表現會得到認可和獎勵，就會有動力去做"}},{"id":"T7-29","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"\"Doing well on this project would make me proud of who I am.\" Which kind of value (Is) is this?","tw":"「做好這份功課會令我為自己感到自豪。」這屬哪一種價值（Is）？"},"explanation":{"en":"**Slides say:** Attainment value = the personal importance a student attaches to a task – especially how well it connects to their self-concept (will doing well make them proud?). Utility value = usefulness for future goals. Cost = what must be given up.\n**In simple words:** Attainment = \"this is part of who I am\".\n**Remember:** attainment = pride/identity; utility = useful later; cost = what I give up.","tw":"**投影片：**成就價值 = 學生對任務的個人重視程度 – 尤其與自我概念的聯繫（做得好會令她自豪嗎？）。實用價值 = 對未來目標的用處；代價 = 必須放棄的東西。\n**簡單來說：**成就價值 =「這是我身分的一部分」。\n**記住：**成就 = 自豪／身分；實用 = 日後有用；代價 = 要放棄甚麼。"},"source":"PDF7 p.46","options":[{"en":"Attainment value","tw":"成就價值"},{"en":"Utility value","tw":"實用價值"},{"en":"Cost","tw":"代價"},{"en":"Probability of success","tw":"成功機會率"}],"answerIndex":0,"correctAnswer":{"en":"Attainment value","tw":"成就價值"}},{"id":"T7-30","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A student would have to give up weekend football to prepare for a competition. In expectancy theory, this is the…","tw":"學生要放棄週末踢足球去準備比賽。在期望理論中，這是……"},"explanation":{"en":"**Slides say:** Cost = what the student will have to give up in order to do well on the task, for example time.\n**In simple words:** The higher the cost, the lower the overall value of the task feels – unless other values are high.\n**Remember:** cost = the price you pay.","tw":"**投影片：**代價 = 為做好任務，學生必須放棄的東西，例如時間。\n**簡單來說：**代價越高，任務的整體價值就感覺越低 – 除非其他價值很高。\n**記住：**代價 = 你要付出的東西。"},"source":"PDF7 p.47","options":[{"en":"Cost","tw":"代價"},{"en":"Attainment value","tw":"成就價值"},{"en":"Utility value","tw":"實用價值"},{"en":"Probability of success","tw":"成功機會率"}],"answerIndex":0,"correctAnswer":{"en":"Cost","tw":"代價"}},{"id":"T7-31","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"What assumption links attribution theory, learned helplessness and implicit theories of intelligence?","tw":"歸因理論、習得性無助和內隱智力理論背後有甚麼共同假設？"},"explanation":{"en":"**Slides say:** These theories assume that students will WANT to do well if they think they CAN do well. So motivation depends on whether they think they can – which depends on what they attribute success/failure to, and whether those causes are (un)controllable, (un)stable, internal or external.\n**In simple words:** Believing \"I can\" switches on \"I want to\".\n**Remember:** can → want.","tw":"**投影片：**這些理論假設：學生若認為自己「做得到」，就會「想」做好。所以動機取決於他們是否認為自己做得到 – 這又取決於他們把成功／失敗歸因於甚麼，以及這些成因是否可控、穩定、內在或外在。\n**簡單來說：**相信「我做得到」，便會啟動「我想做」。\n**記住：**做得到 → 想做。"},"source":"PDF7 p.32","options":[{"en":"Students WANT to do well if they think they CAN do well","tw":"學生若認為自己「做得到」，就會「想」做好"},{"en":"Students only care about money","tw":"學生只在乎金錢"},{"en":"Motivation is fixed at birth","tw":"動機在出生時已固定"},{"en":"Students never want to do well","tw":"學生從不想做好"}],"answerIndex":0,"correctAnswer":{"en":"Students WANT to do well if they think they CAN do well","tw":"學生若認為自己「做得到」，就會「想」做好"}},{"id":"T7-32","topicNo":7,"difficulty":"hard","type":"order","star":true,"question":{"en":"Put the maladaptive attribution cycle in order (from the slides' figure).","tw":"按投影片的圖，把不理想歸因循環排成正確次序。"},"explanation":{"en":"**Slides say:** The cyclical interaction between attribution style and achievement: poor academic achievement → maladaptive attribution (\"I failed because I'm stupid\") → decreased self-esteem → decreased motivation and lack of effort → poor achievement again.\n**In simple words:** A bad mark plus a bad explanation leads to trying less, which leads to another bad mark. Changing the explanation (to effort or strategy) breaks the loop.\n**Remember:** that's why attributional retraining works.","tw":"**投影片：**歸因風格與學業成就的循環：學業成績差 → 不理想歸因（「我失敗是因為我蠢」）→ 自尊下降 → 動機下降、不努力 → 成績再次差。\n**簡單來說：**壞成績 + 壞解釋 → 少努力 → 又一個壞成績。把解釋改為努力或策略，就能打破循環。\n**記住：**這就是歸因再訓練有效的原因。"},"source":"PDF7 p.14","tiles":{"en":["Poor academic achievement","\"I failed because I'm stupid\"","Decreased self-esteem","Decreased motivation and effort"],"tw":["學業成績差","「我失敗是因為我蠢」","自尊下降","動機和努力下降"]},"answerLen":{"en":4,"tw":4},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Poor academic achievement → \"I failed because I'm stupid\" → Decreased self-esteem → Decreased motivation and effort","tw":"學業成績差 → 「我失敗是因為我蠢」 → 自尊下降 → 動機和努力下降"}},{"id":"T7-33","topicNo":7,"difficulty":"medium","type":"mc","star":false,"question":{"en":"In the slides' attribution table, which thought goes with attributing results to LUCK?","tw":"在投影片的歸因表中，哪個想法對應把結果歸因於「運氣」？"},"explanation":{"en":"**Slides say:** Internal/unstable – effort (controllable): \"work harder / work differently\". Internal/stable – ability (uncontrollable): \"I'm just not smart enough\". External/unstable – luck (uncontrollable): \"why put in more effort?\". External/stable – task difficulty (uncontrollable): \"too difficult anyway\".\n**In simple words:** If it's all luck, effort feels pointless.\n**Remember:** only effort gives a reason to try again.","tw":"**投影片：**內在／不穩定 – 努力（可控）：「更努力／換方法」；內在／穩定 – 能力（不可控）：「我根本不夠聰明」；外在／不穩定 – 運氣（不可控）：「何必再努力？」；外在／穩定 – 任務難度（不可控）：「反正太難了」。\n**簡單來說：**如果全靠運氣，努力就好像沒意義。\n**記住：**只有「努力」給你再試的理由。"},"source":"PDF7 p.10","options":[{"en":"\"Why put in more effort?\"","tw":"「何必再努力？」"},{"en":"\"I'll work harder or work differently\"","tw":"「我會更努力或換個方法」"},{"en":"\"I'm just not smart enough\"","tw":"「我根本不夠聰明」"},{"en":"\"It's too difficult anyway\"","tw":"「反正太難了」"}],"answerIndex":0,"correctAnswer":{"en":"\"Why put in more effort?\"","tw":"「何必再努力？」"},"fig":"attribution_grid"},{"id":"T7-34","topicNo":7,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Which is a GROWTH-mindset way to say \"This is too hard\" (from the \"Change your words\" poster)?","tw":"根據「改變你的說話」海報，「這太難了」的「成長心態」說法是哪一句？"},"explanation":{"en":"**Slides say:** Change your words, change your mindset: \"I don't understand\" → \"What am I missing?\"; \"I give up\" → \"I'll use some of the strategies I've learned\"; \"I made a mistake\" → \"Mistakes help me improve\"; \"This is too hard\" → \"This may take some time and effort\"; \"I'm not good at this\" → \"I'm on the right track\".\n**In simple words:** Growth talk points to effort and strategy, not fixed talent.\n**Remember:** add the word \"yet\".","tw":"**投影片：**改變說話，改變心態：「我不明白」→「我遺漏了甚麼？」；「我放棄」→「我會用學過的策略」；「我犯了錯」→「錯誤幫助我進步」；「這太難了」→「這可能需要一些時間和努力」；「我不擅長」→「我正走在正確的路上」。\n**簡單來說：**成長心態的說話指向努力和方法，而不是固定的天分。\n**記住：**加上「暫時」兩個字。"},"source":"PDF7 p.25","options":[{"en":"\"This may take some time and effort.\"","tw":"「這可能需要一些時間和努力。」"},{"en":"\"I give up.\"","tw":"「我放棄。」"},{"en":"\"I'll never be as smart as her.\"","tw":"「我永遠不會像她那麼聰明。」"},{"en":"\"It's good enough.\"","tw":"「這樣已經夠好。」"}],"answerIndex":0,"correctAnswer":{"en":"\"This may take some time and effort.\"","tw":"「這可能需要一些時間和努力。」"}},{"id":"T7-35","topicNo":7,"difficulty":"medium","type":"order","star":false,"question":{"en":"Put the chain of how attributions affect achievement in order.","tw":"把歸因如何影響成就的鏈條排成正確次序。"},"explanation":{"en":"**Slides say:** Attributions influence emotional reactions to success and failure and expectations for future success; these influence the future effort put towards trying to succeed, and finally the actual achievement.\n**In simple words:** How you EXPLAIN a result changes how you FEEL, which changes how hard you TRY, which changes how well you DO.\n**Remember:** explain → feel → try → do.","tw":"**投影片：**歸因影響對成功和失敗的情緒反應，以及對未來成功的期望；這些會影響爭取未來成功的努力，最終影響實際成就。\n**簡單來說：**你怎樣「解釋」結果，會改變你的「感受」，再改變你多「努力」，最後改變你的「表現」。\n**記住：**解釋 → 感受 → 努力 → 表現。"},"source":"PDF7 p.15","tiles":{"en":["Attribution of success/failure","Emotions and expectations of future success","Future effort","Actual achievement"],"tw":["對成功／失敗的歸因","情緒及對未來成功的期望","日後的努力","實際成就"]},"answerLen":{"en":4,"tw":4},"sep":{"en":" → ","tw":" → "},"correctAnswer":{"en":"Attribution of success/failure → Emotions and expectations of future success → Future effort → Actual achievement","tw":"對成功／失敗的歸因 → 情緒及對未來成功的期望 → 日後的努力 → 實際成就"}},{"id":"T8-01","topicNo":8,"difficulty":"easy","type":"mc","star":true,"question":{"en":"Maslow's hierarchy of needs from BOTTOM to TOP is…","tw":"馬斯洛需求層次由「下」至「上」是……"},"explanation":{"en":"**Slides say:** Maslow's hierarchy (1943), from the bottom: (1) physiological, (2) safety, (3) love & belonging, (4) esteem, (5) self-actualisation. More basic needs must be met before we are motivated by higher ones.\n**In simple words:** Food and sleep first, then feeling safe, then friends and family, then respect, then becoming your best self.\n**Remember:** \"**P**lease **S**top **L**aughing, **E**veryone **S**miles\" = P-S-L-E-S.","tw":"**投影片：**馬斯洛需求層次（1943），由下而上：(1) 生理；(2) 安全；(3) 愛與歸屬；(4) 尊重；(5) 自我實現。要先滿足較基本的需求，才會追求較高層的需求。\n**簡單來說：**先要吃飽睡好，再要安全，再要親友的愛，再要別人尊重，最後成為最好的自己。\n**記住：**「吃 → 安 → 愛 → 敬 → 實現」。"},"source":"PDF8 p.6","options":[{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"},{"en":"Safety → Physiological → Esteem → Love & belonging → Self-actualisation","tw":"安全 → 生理 → 尊重 → 愛與歸屬 → 自我實現"},{"en":"Physiological → Love & belonging → Safety → Self-actualisation → Esteem","tw":"生理 → 愛與歸屬 → 安全 → 自我實現 → 尊重"},{"en":"Self-actualisation → Esteem → Love & belonging → Safety → Physiological","tw":"自我實現 → 尊重 → 愛與歸屬 → 安全 → 生理"}],"answerIndex":0,"correctAnswer":{"en":"Physiological → Safety → Love & belonging → Esteem → Self-actualisation","tw":"生理 → 安全 → 愛與歸屬 → 尊重 → 自我實現"},"fig":"maslow"},{"id":"T8-02","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Which need is the LAST of the lower needs in Maslow's hierarchy?","tw":"馬斯洛需求層次中，哪一項是低層需求中的「最後」一個？"},"explanation":{"en":"**Slides say:** Love and belonging (social) needs relate to human interact
