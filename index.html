 父母或重要他人接受並愛這個人的本來面目，犯錯也不會收回；這人便敢於嘗試和犯錯。\n**簡單來說：**「無論怎樣我都愛你 – 就算你考試不合格。」有這種感覺的孩子敢嘗試新事物。\n**陷阱：**有條件的積極關懷 =「你考到 A 我才愛你。」"},"source":"PDF8 p.23","tiles":{"en":["Unconditional","positive","regard","Conditional","negative"],"tw":["無條件","積極","關懷","有條件","消極"]},"answerLen":{"en":3,"tw":3},"sep":{"en":" ","tw":""},"correctAnswer":{"en":"Unconditional positive regard","tw":"無條件積極關懷"}},{"id":"T8-07","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"A child loves music but feels parents only value them if they become a doctor. According to Rogers, \"conditions of worth\" may lead the child to…","tw":"孩子熱愛音樂，卻覺得父母只在他當醫生時才重視他。根據羅傑斯，「價值條件化」可能令孩子……"},"explanation":{"en":"**Slides say:** Conditions of worth = conditions we think we must meet for others to accept and love us. A child with conditions of worth may cope by denying or distorting a feature of their true self. The slides use this musician vs doctor example.\n**In simple words:** To keep their parents' love, the child hides their real dream (music).\n**Remember:** conditions of worth block self-actualisation.","tw":"**投影片：**價值條件化 = 我們以為要達到某些條件，別人才會接納和愛我們。有此經歷的孩子可能以否認或扭曲真實自我來應對。投影片正正用了「音樂家 vs 醫生」這個例子。\n**簡單來說：**為了保住父母的愛，孩子把真正的夢想（音樂）收起來。\n**記住：**價值條件化會阻礙自我實現。"},"source":"PDF8 p.26","options":[{"en":"Deny or distort a feature of their true self","tw":"否認或扭曲真實自我的一部分"},{"en":"Reach self-actualisation faster","tw":"更快達到自我實現"},{"en":"Develop object permanence","tw":"發展物體恆存"},{"en":"Become intrinsically motivated to be a doctor","tw":"對當醫生產生內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Deny or distort a feature of their true self","tw":"否認或扭曲真實自我的一部分"}},{"id":"T8-08","topicNo":8,"difficulty":"hard","type":"mc","star":false,"question":{"en":"Which is NOT one of Rogers' five characteristics of a fully functioning person?","tw":"以下哪項「不是」羅傑斯所說「充分發揮的人」的五個特徵？"},"explanation":{"en":"**Slides say:** Rogers' five characteristics of a fully functioning person: open to experience, existential living (living in the present), trusting feelings, creativity, and a fulfilled life.\n**In simple words:** Someone who always needs others to say \"good job\" is not trusting themselves – that comes from CONDITIONAL love.\n**Remember:** Open, Present, Trust, Create, Fulfilled.","tw":"**投影片：**羅傑斯所說「充分發揮的人」的五個特徵：開放體驗、活在當下、信任感覺、創造力、充實人生。\n**簡單來說：**總要別人說「做得好」的人，並不信任自己 – 那是源於「有條件」的愛。\n**記住：**開放、當下、信任、創造、充實。"},"source":"PDF8 p.28","options":[{"en":"Constantly seeking approval from others","tw":"不斷尋求他人認可"},{"en":"Open to experience","tw":"開放體驗"},{"en":"Existential living (living in the present)","tw":"活在當下"},{"en":"Trusting own feelings","tw":"信任自己的感覺"}],"answerIndex":0,"correctAnswer":{"en":"Constantly seeking approval from others","tw":"不斷尋求他人認可"}},{"id":"T8-09","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Rogers' self-concept has three components. Which set is correct?","tw":"羅傑斯的自我概念包括三個部分，哪組正確？"},"explanation":{"en":"**Slides say:** Rogers' self-concept has three components: self-worth (self-esteem – what we think about ourselves), self-image (how we see ourselves) and ideal self (who we would like to be; it keeps changing).\n**In simple words:** \"I like myself\" (self-worth). \"I'm a tall, friendly student\" (self-image). \"I want to be a doctor\" (ideal self).\n**Trap:** competence, autonomy, relatedness = SDT.","tw":"**投影片：**羅傑斯的自我概念有三部分：自我價值（自尊 – 我們對自己的看法）、自我形象（我們如何看自己）、理想自我（想成為的人，會不斷改變）。\n**簡單來說：**「我喜歡自己」（自我價值）；「我是個高大友善的學生」（自我形象）；「我想做醫生」（理想自我）。\n**陷阱：**勝任、自主、歸屬 = 自我決定理論。"},"source":"PDF8 p.18","options":[{"en":"Self-worth, self-image, ideal self","tw":"自我價值、自我形象、理想自我"},{"en":"Id, ego, superego","tw":"本我、自我、超我"},{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"},{"en":"Attention, retention, reproduction","tw":"注意、保存、再生"}],"answerIndex":0,"correctAnswer":{"en":"Self-worth, self-image, ideal self","tw":"自我價值、自我形象、理想自我"}},{"id":"T8-10","topicNo":8,"difficulty":"medium","type":"mc","star":true,"question":{"en":"Self-Determination Theory (SDT) names three intrinsic needs. Which are they?","tw":"自我決定理論（SDT）提出的三種內在需求是？"},"explanation":{"en":"**Slides say:** SDT (Deci & Ryan): three intrinsic needs must be satisfied for growth and well-being – competence (勝任), autonomy (自主) and relatedness (歸屬).\n**In simple words:** Competence = \"I can do it.\" Autonomy = \"I chose to do it.\" Relatedness = \"I belong here.\"\n**Remember:** **CAR** – these three drive your motivation car.","tw":"**投影片：**自我決定理論（Deci & Ryan）：為了成長和幸福，要滿足三種內在需求 – 勝任、自主、歸屬。\n**簡單來說：**勝任 =「我做得到」；自主 =「是我選擇的」；歸屬 =「我屬於這裏」。\n**記住：**勝任、自主、歸屬三者推動你的動機。"},"source":"PDF8 p.31","options":[{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"},{"en":"Physiological, safety, esteem","tw":"生理、安全、尊重"},{"en":"Attention, retention, motivation","tw":"注意、保存、動機"},{"en":"Effort, luck, ability","tw":"努力、運氣、能力"}],"answerIndex":0,"correctAnswer":{"en":"Competence, autonomy, relatedness","tw":"勝任、自主、歸屬"}},{"id":"T8-11","topicNo":8,"difficulty":"hard","type":"mc","star":true,"question":{"en":"What can happen when extrinsic rewards are given for a behaviour that is ALREADY intrinsically motivated?","tw":"對「本已」有內在動機的行為給予外在獎勵，可能會怎樣？"},"explanation":{"en":"**Slides say:** Giving extrinsic rewards for already intrinsically motivated behaviour can undermine autonomy. As behaviour becomes controlled by rewards, people feel less in control and intrinsic motivation decreases (Deci).\n**In simple words:** A child who loves drawing gets paid for each drawing. Soon they draw only for the money, and stop when the money stops.\n**Remember:** don't pay for what kids already love.","tw":"**投影片：**對本已有內在動機的行為給予外在獎勵，會削弱自主感；行為越受獎勵控制，人越覺得失去控制，內在動機下降（Deci）。\n**簡單來說：**一個本來愛畫畫的孩子，每畫一幅就給錢，不久他只為錢而畫，沒錢就不畫。\n**記住：**孩子本來喜歡的事，不要用錢去「買」。"},"source":"PDF8 p.41","options":[{"en":"Autonomy is undermined and intrinsic motivation decreases","tw":"削弱自主感，內在動機下降"},{"en":"Intrinsic motivation always doubles","tw":"內在動機一定加倍"},{"en":"Nothing changes","tw":"沒有任何改變"},{"en":"The behaviour becomes a reflex","tw":"行為變成反射"}],"answerIndex":0,"correctAnswer":{"en":"Autonomy is undermined and intrinsic motivation decreases","tw":"削弱自主感，內在動機下降"}},{"id":"T8-12","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to the slides, how should rewards (like grades) be used?","tw":"根據投影片，應如何運用獎勵（例如成績）？"},"explanation":{"en":"**Slides say:** Focus on the informational function of rewards, not the controlling function: \"Don't do it FOR the grade; the grade tells you how well you've done.\" If you first use extrinsic rewards, soon shift attention to the task's intrinsic value.\n**In simple words:** A grade should work like a mirror (showing how you did), not a leash (forcing you).\n**Remember:** rewards = information, not control.","tw":"**投影片：**著重獎勵的「信息」功能，而非「操控」功能：「不要『為了』成績而做；成績只是告訴你做得多好。」若先用外在獎勵，之後要盡快轉向任務的內在價值。\n**簡單來說：**成績應像鏡子（讓你看到表現），而不是狗帶（逼你做）。\n**記住：**獎勵是信息，不是控制。"},"source":"PDF8 p.42","options":[{"en":"Focus on their informational function (the grade tells you how well you did), not their controlling function","tw":"著重其「信息」功能（成績告訴你做得多好），而非操控功能"},{"en":"Use them to control every behaviour","tw":"用它們控制每一個行為"},{"en":"Give them only for intrinsically enjoyable tasks","tw":"只在任務本身有趣時才給"},{"en":"Never tell students their grades","tw":"永不告訴學生成績"}],"answerIndex":0,"correctAnswer":{"en":"Focus on their informational function (the grade tells you how well you did), not their controlling function","tw":"著重其「信息」功能（成績告訴你做得多好），而非操控功能"}},{"id":"T8-13","topicNo":8,"difficulty":"easy","type":"mc","star":false,"question":{"en":"\"I study this subject because it's fun.\" This is…","tw":"「我讀這科因為很有趣。」這是……"},"explanation":{"en":"**Slides say:** Intrinsic motivation = engaging in a task with no external reward; the incentive is the task itself (\"it's fun!\") or its importance to your self-concept. Extrinsic = for a reward, or to avoid punishment or a bad grade.\n**In simple words:** Reading a novel because you love the story = intrinsic. Reading it only because it's homework = extrinsic.\n**Remember:** intrinsic = inside; extrinsic = outside.","tw":"**投影片：**內在動機 = 沒有外在獎勵也去做，誘因是任務本身（「很有趣！」）或對自我概念的重要性。外在動機 = 為了獎勵、避免懲罰或壞成績。\n**簡單來說：**因為喜歡故事而讀小說 = 內在；只因為是功課才讀 = 外在。\n**記住：**內在 = 由內而來；外在 = 由外而來。"},"source":"PDF8 p.45","options":[{"en":"Intrinsic motivation","tw":"內在動機"},{"en":"Extrinsic motivation","tw":"外在動機"},{"en":"Negative reinforcement","tw":"負增強"},{"en":"Learned helplessness","tw":"習得性無助"}],"answerIndex":0,"correctAnswer":{"en":"Intrinsic motivation","tw":"內在動機"}},{"id":"T8-14","topicNo":8,"difficulty":"hard","type":"mc","star":false,"question":{"en":"In the Relative Autonomy Index (RAI), the scores of Q1 + Q2 (\"it's the rule\", \"so others won't get mad\") are multiplied by…","tw":"相對自主指數（RAI）中，Q1 + Q2（「這是規定」、「免得別人生氣」）的分數要乘以……"},"explanation":{"en":"**Slides say:** RAI = (Q1+Q2) × −2 + (Q3+Q4) × −1 + (Q5+Q6) × 1 + (Q7+Q8) × 2 (Ryan & Connell, 1989).\n**In simple words:** The most \"outside\" reasons (Q1 \"it's the rule\", Q2 \"so others won't get mad\") count most negatively: × −2. The most \"inside\" reasons (Q7 \"it's fun\", Q8 \"I enjoy it\") count most positively: × +2.\n**Remember:** −2, −1, +1, +2 from outside to inside.","tw":"**投影片：**RAI =（Q1+Q2）× −2 +（Q3+Q4）× −1 +（Q5+Q6）× 1 +（Q7+Q8）× 2（Ryan & Connell, 1989）。\n**簡單來說：**最「外在」的理由（Q1「這是規定」、Q2「免得別人生氣」）最負面：× −2；最「內在」的理由（Q7「有趣」、Q8「享受」）最正面：× +2。\n**記住：**由外到內：−2、−1、+1、+2。"},"source":"PDF8 p.46","options":[{"en":"−2","tw":"−2"},{"en":"−1","tw":"−1"},{"en":"+1","tw":"+1"},{"en":"+2","tw":"+2"}],"answerIndex":0,"correctAnswer":{"en":"−2","tw":"−2"}},{"id":"T8-15","topicNo":8,"difficulty":"hard","type":"mc","star":false,"question":{"en":"A POSITIVE RAI score means you have more ___ motivation than the other type.","tw":"RAI 分數為「正數」代表你的 ___ 動機較多。"},"explanation":{"en":"**Slides say:** If you have a positive RAI, you have more intrinsic motivation than extrinsic motivation, and vice versa.\n**In simple words:** Positive means your \"I want to\" reasons outweigh your \"I have to\" reasons.\n**Remember:** + = intrinsic; − = extrinsic.","tw":"**投影片：**RAI 為正數，代表內在動機多於外在動機；負數則相反。\n**簡單來說：**正數 =「我想做」的理由多過「我要做」的理由。\n**記住：**正 = 內在；負 = 外在。"},"source":"PDF8 p.46","options":[{"en":"Intrinsic","tw":"內在（intrinsic）"},{"en":"Extrinsic","tw":"外在（extrinsic）"},{"en":"Controlled","tw":"受控（controlled）"},{"en":"Conditional","tw":"有條件（conditional）"}],"answerIndex":0,"correctAnswer":{"en":"Intrinsic","tw":"內在（intrinsic）"}},{"id":"T8-16","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Who developed Self-Determination Theory?","tw":"誰提出自我決定理論？"},"explanation":{"en":"**Slides say:** Edward L. Deci and Richard Ryan, professors at the University of Rochester, are famous for Self-Determination Theory (SDT).\n**In simple words:** They showed people are most motivated when they feel capable, free to choose, and connected to others.\n**Trap:** Maslow = needs pyramid; Rogers = self-concept; Dweck = mindsets.","tw":"**投影片：**Edward L. Deci 與 Richard Ryan，羅徹斯特大學教授，以自我決定理論聞名。\n**簡單來說：**他們指出，人在覺得有能力、可以自己選擇、與人有連繫時最有動力。\n**陷阱：**馬斯洛 = 需求金字塔；羅傑斯 = 自我概念；Dweck = 心態。"},"source":"PDF8 p.31","options":[{"en":"Edward Deci & Richard Ryan","tw":"Edward Deci & Richard Ryan"},{"en":"Abraham Maslow","tw":"Abraham Maslow"},{"en":"Carl Rogers","tw":"Carl Rogers"},{"en":"Carol Dweck","tw":"Carol Dweck"}],"answerIndex":0,"correctAnswer":{"en":"Edward Deci & Richard Ryan","tw":"Edward Deci & Richard Ryan"}},{"id":"T8-17","topicNo":8,"difficulty":"hard","type":"mc","star":false,"question":{"en":"How do the slides say SDT may apply in Hong Kong / traditional Chinese culture?","tw":"投影片指自我決定理論在香港／中國傳統文化中可能如何應用？"},"explanation":{"en":"**Slides say:** In traditional Chinese culture, some extrinsic motives – such as doing things from a sense of duty towards close others (e.g. filial piety) – may lead to intrinsic motivation among those who value fulfilling others' expectations.\n**In simple words:** Studying hard \"for my parents\" starts as an outside reason. If you truly care about your family, it can become your own inside reason.\n**Remember:** culture can turn \"have to\" into \"want to\".","tw":"**投影片：**在中國傳統文化中，某些外在動機 – 例如出於對家人的責任感（孝道）– 對重視滿足他人期望的人，實際上可能強化內在動機。\n**簡單來說：**「為父母」努力讀書起初是外在理由；如果你真心重視家人，它可以變成你自己的內在理由。\n**記住：**文化可以把「要做」變成「想做」。"},"source":"PDF8 p.52","options":[{"en":"Some extrinsic motives, like duty to close others (filial piety), may lead to intrinsic motivation for people who value meeting others' expectations","tw":"某些外在動機，如對家人的責任（孝道），對重視滿足他人期望的人，可能轉化為內在動機"},{"en":"SDT does not apply at all in Hong Kong","tw":"自我決定理論完全不適用於香港"},{"en":"Only money motivates students in Hong Kong","tw":"香港學生只受金錢激勵"},{"en":"Filial piety always destroys intrinsic motivation","tw":"孝道必定摧毀內在動機"}],"answerIndex":0,"correctAnswer":{"en":"Some extrinsic motives, like duty to close others (filial piety), may lead to intrinsic motivation for people who value meeting others' expectations","tw":"某些外在動機，如對家人的責任（孝道），對重視滿足他人期望的人，可能轉化為內在動機"}},{"id":"T8-18","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"Students are hungry, sleepy or feel physically unsafe. Even with a fascinating lesson, Maslow predicts they will…","tw":"學生肚餓、睏倦或感到不安全。即使課堂很精彩，馬斯洛預計他們會……"},"explanation":{"en":"**Slides say:** If students are hungry, sleepy or feel physically unsafe, they will be less motivated to learn, even with your fascinating lesson plan. Basic needs first.\n**In simple words:** A student who skipped breakfast keeps thinking about food, not fractions.\n**Remember:** lower needs come before learning (a higher need).","tw":"**投影片：**學生肚餓、睏倦或感到身體不安全，即使你的課堂設計很精彩，學習動力也會降低；先要滿足基本需求。\n**簡單來說：**沒吃早餐的學生滿腦子想著食物，而不是分數題。\n**記住：**低層需求先於學習（高層需求）。"},"source":"PDF8 p.13","options":[{"en":"Be less motivated to learn, because basic needs come first","tw":"學習動機較低，因為要先滿足基本需求"},{"en":"Be more motivated because of the challenge","tw":"因挑戰而更有動機"},{"en":"Reach self-actualisation quickly","tw":"很快達到自我實現"},{"en":"Not be affected at all","tw":"完全不受影響"}],"answerIndex":0,"correctAnswer":{"en":"Be less motivated to learn, because basic needs come first","tw":"學習動機較低，因為要先滿足基本需求"}},{"id":"T8-19","topicNo":8,"difficulty":"easy","type":"mc","star":false,"question":{"en":"Carl Rogers believed humans have one basic motive. What is it?","tw":"羅傑斯認為人類只有一個基本動機，是甚麼？"},"explanation":{"en":"**Slides say:** Carl Rogers believed humans have one basic motive: the tendency to fulfil one's potential and achieve the highest level of being human (self-actualisation). People need genuineness, acceptance and empathy, \"much like a tree will not grow without sunlight and water\".\n**In simple words:** Everyone naturally wants to grow into their best self, like a plant growing towards the sun.\n**Remember:** Rogers = self-actualisation + unconditional positive regard.","tw":"**投影片：**羅傑斯認為人類只有一個基本動機：發揮個人潛能、達到最高層次的自我（自我實現）。人需要真誠、接納和同理心，「就像樹沒有陽光和水就不會生長」。\n**簡單來說：**每個人天生都想成長為最好的自己，就像植物向著太陽生長。\n**記住：**羅傑斯 = 自我實現 + 無條件積極關懷。"},"source":"PDF8 p.15","options":[{"en":"The tendency to fulfil one's potential (self-actualisation)","tw":"發揮個人潛能的傾向（自我實現）"},{"en":"Avoiding punishment","tw":"逃避懲罰"},{"en":"Getting money","tw":"賺錢"},{"en":"Copying role models","tw":"模仿榜樣"}],"answerIndex":0,"correctAnswer":{"en":"The tendency to fulfil one's potential (self-actualisation)","tw":"發揮個人潛能的傾向（自我實現）"}},{"id":"T8-20","topicNo":8,"difficulty":"medium","type":"mc","star":false,"question":{"en":"According to Deci, UNEXPECTED positive feedback on a task tends to…","tw":"根據 Deci，對任務表現給予「意料之外」的正面回饋，通常會……"},"explanation":{"en":"**Slides say:** Deci: offering unexpected positive encouragement and feedback on a person's performance can increase intrinsic motivation, because it helps people feel more competent.\n**In simple words:** A surprise \"Wow, great essay!\" makes you feel capable, so you want to write more.\n**Trap:** an EXPECTED reward for a task you already love can do the opposite (see T8-11).","tw":"**投影片：**Deci：對一個人的表現給予意料之外的正面鼓勵和回饋，可提升內在動機，因為它令人覺得自己更有能力（勝任）。\n**簡單來說：**一句意想不到的「嘩，文章寫得很好！」令你覺得自己有能力，於是更想寫。\n**陷阱：**對本已喜歡的事給「預期中」的獎勵，可能有相反效果（見 T8-11）。"},"source":"PDF8 p.40","options":[{"en":"Increase intrinsic motivation by making people feel more competent","tw":"令人覺得更有能力，從而提升內在動機"},{"en":"Destroy intrinsic motivation","tw":"摧毀內在動機"},{"en":"Cause learned helplessness","tw":"導致習得性無助"},{"en":"Have no effect","tw":"沒有影響"}],"answerIndex":0,"correctAnswer":{"en":"Increase intrinsic motivation by making people feel more competent","tw":"令人覺得更有能力，從而提升內在動機"}}];

/* ---------- storage ---------- */
let storeOK = true;
function defaults(){
  return { v:1, cards:{}, stats:{score:0, streak:0, best:0, answered:0, correct:0},
    settings:{ lang:"en", schedule:"cram", topics:Object.keys(TOPICS).map(Number), diffs:["easy","medium","hard"], types:["mc","order"], starOnly:false, weakOnly:false, testN:"20" },
    milestones:{} };
}
function load(){
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const s = JSON.parse(raw);
    const settings = { ...d.settings, ...s.settings };
    // Typed answers were replaced by "order" questions: map the old filter value across.
    settings.types = (settings.types || []).map(x => x === "short" ? "order" : x).filter(x => d.settings.types.includes(x));
    if (!settings.types.length) settings.types = d.settings.types;
    return { ...d, ...s, stats:{...d.stats, ...s.stats}, settings, cards:s.cards||{}, milestones:s.milestones||{} };
  } catch(e){ storeOK = false; return d; }
}
function save(){
  if (!storeOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storeOK = false; showStoreWarn(); }
}
function persist(){ save(); pushSoon(); }

const tx = o => o ? (o[L()] ?? o.en) : "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");

const byId = Object.fromEntries(BANK.map(q => [q.id, q]));

function fmtWhen(ms){
  const d = ms - Date.now();
  if (d <= 0) return t("due");
  const m = Math.round(d/MIN);
  if (L()==="tw") return m < 60 ? `${m} 分鐘後` : m < 1440 ? `${Math.round(m/60)} 小時後` : `${Math.round(m/1440)} 天後`;
  return m < 60 ? `in ${m} min` : m < 1440 ? `in ${Math.round(m/60)} h` : `in ${Math.round(m/1440)} days`;
}
function fmtDur(ms){ const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

/* ---------- put-in-order (tile) questions ---------- */
// Tiles come correct-order first, then wrong tiles. An answer is right when the picks are exactly 0, 1, …, n-1.
const tileState = q => ({ lang: L(), tileOrder: shuffle(q.tiles[L()].map((_, i) => i)), picked: [] });
const orderRight = (q, st) => st.picked.length === q.answerLen[st.lang] && st.picked.every((ti, i) => ti === i);
const orderText = (q, st) => st.picked.map(ti => q.tiles[st.lang][ti]).join(q.sep[st.lang]);
function tilesHTML(q, st, verdict){ // verdict: null while answering, true/false once checked
  const tiles = q.tiles[st.lang], locked = verdict !== null;
  const built = st.picked.length
    ? st.picked.map((ti, k) => `<button class="tile placed" data-k="${k}" ${locked?"disabled":""} aria-label="${esc(t("removeTile"))}: ${esc(tiles[ti])}">${esc(tiles[ti])}</button>`).join("")
    : `<span class="hint">${esc(t("tapTiles"))}</span>`;
  const left = st.tileOrder.map((ti, i) =>
    `<button class="tile" data-ti="${ti}" ${locked || st.picked.includes(ti) ? "disabled" : ""} aria-label="${i+1}. ${esc(tiles[ti])}"><span class="k">${i+1}</span>${esc(tiles[ti])}</button>`).join("");
  return `<div class="built${locked ? (verdict ? " ok" : " no") : ""}" aria-label="${esc(t("yourAns"))}">${built}</div>
    <div class="tiles" role="group" aria-label="${esc(t("tiles"))}">${left}</div>`;
}
function bindTiles(st, render){
  const update = () => { render(); focusTiles(); };
  document.querySelectorAll(".tiles .tile").forEach(b => b.onclick = () => { st.picked.push(+b.dataset.ti); update(); });
  document.querySelectorAll(".built .tile").forEach(b => b.onclick = () => { st.picked.splice(+b.dataset.k, 1); update(); });
  const clear = $("clearBtn"); if (clear) clear.onclick = () => { st.picked = []; update(); };
}
function tileKey(e, st, render){ // 1–9 taps a tile, Backspace undoes the last one
  if (/^[1-9]$/.test(e.key)){ const ti = st.tileOrder[+e.key-1]; if (ti !== undefined && !st.picked.includes(ti)) st.picked.push(ti); }
  else if (e.key === "Backspace" && st.picked.length) st.picked.pop();
  else return;
  e.preventDefault(); render(); focusTiles();
}
const givenText = (q, choice, tiles) => q.type === "mc" ? (choice != null ? tx(q.options[choice]) : "") : orderText(q, tiles);
const tileButtonsHTML = (st, withCheck) => {
  const off = st.picked.length ? "" : "disabled";
  return `<div class="row" style="margin-top:10px">${withCheck ? `<button class="btn primary" id="checkBtn" ${off}>${esc(t("check"))}</button>` : ""}<button class="btn" id="clearBtn" ${off}>${esc(t("clear"))}</button></div>`;
};
function focusTiles(){ (document.querySelector(".tiles .tile:not([disabled])") || $("checkBtn") || $("tNext"))?.focus(); }
// A card nobody has started yet follows a language switch; a started one keeps its language.
const tilesForLang = (q, st) => st && !st.picked.length && st.lang !== L() ? tileState(q) : st;

/* ---------- pool & scheduling ---------- */
function pool(){
  const st = S.settings, now = Date.now();
  return BANK.filter(q => st.topics.includes(q.topicNo) && st.diffs.includes(q.difficulty) && st.types.includes(q.type)
    && (!st.starOnly || q.star)
    && (!st.weakOnly || (peek(q.id).seen > 0 && peek(q.id).box <= 2)));
}
function grade(q, ok){
  const c = card(q.id), now = Date.now();
  c.seen++; ok ? c.right++ : c.wrong++;
  c.box = ok ? Math.min(5, Math.max(1, c.box) + 1) : 1; // new card answered right → box 2
  c.due = now + SCHED[S.settings.schedule][c.box - 1];
  const st = S.stats;
  st.answered++;
  if (ok){ st.correct++; st.streak++; st.best = Math.max(st.best, st.streak); st.score += POINTS[q.difficulty]; }
  else st.streak = 0;
}
function masteryPct(list){ list = list || BANK; if (!list.length) return 0; return Math.round(100 * list.filter(q => peek(q.id).box >= 4).length / list.length); }

/* ---------- header / stats ---------- */
function renderStats(){
  const st = S.stats;
  $("sScore").textContent = st.score;
  $("sStreak").textContent = st.streak;
  $("sAnswered").textContent = st.answered;
  $("sAcc").textContent = st.answered ? Math.round(100*st.correct/st.answered) + "%" : "–";
  const m = masteryPct();
  $("sMastery").textContent = m + "%";
  $("masteryBar").firstElementChild.style.width = m + "%";
  $("masteryBar").setAttribute("aria-valuenow", m);
  document.querySelector('[data-t="streak"]').textContent = t("streak", {b: st.best});
}
function milestones(){
  const st = S.stats, ms = S.milestones;
  const fire = (key, msg) => { if (!ms[key]){ ms[key] = 1; toast(msg); confetti(); return true; } return false; };
  if ([5,10,20,30,50,75,100].includes(st.streak)) { toast(t("streakMsg",{n:st.streak})); if (st.streak>=10) confetti(); }
  if (st.answered >= 10) fire("a10", t("firstMsg"));
  if (st.answered >= 100) fire("a100", t("hundredMsg"));
  const m = masteryPct();
  for (const p of [25,50,75,100]) if (m >= p) fire("m"+p, t("masteryMsg",{p}));
}
let toastTimer;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2600); }
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors=["#2f5bd3","#1c8a4c","#d39b00","#c23b3b","#8a4fd3"];
  for (let i=0;i<40;i++){
    const c=document.createElement("i"); c.className="confetti";
    c.style.left=Math.random()*100+"vw"; c.style.background=pick(colors);
    c.style.animationDelay=(Math.random()*0.6)+"s"; c.style.animationDuration=(1.8+Math.random()*1.4)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),3600);
  }
}
function showStoreWarn(){ const w=$("storeWarn"); w.textContent=t("storeFail"); w.style.display=storeOK?"none":"block"; }

/* ---------- static labels & filters ---------- */
function renderLabels(){
  document.documentElement.lang = L()==="tw" ? "zh-Hant" : "en";
  document.title = t("title"); $("title").textContent = t("title");

function chip(name, value, label, checked, type){
  return `<label class="chip"><input type="${type||"checkbox"}" name="${name}" value="${esc(value)}" ${checked?"checked":""}> ${esc(label)}</label>`;
}
function renderFilters(){
  const st = S.settings;
  $("fTopics").innerHTML = Object.keys(TOPICS).map(k => chip("topic", k, tx(TOPICS[k]), st.topics.includes(+k))).join("");
  $("fDiff").innerHTML = ["easy","medium","hard"].map(d => chip("diff", d, t(d), st.diffs.includes(d))).join("");
  $("fType").innerHTML = ["mc","order"].map(d => chip("type", d, t(d), st.types.includes(d))).join("");

  $("fSched").innerHTML = ["cram","standard"].map(d => chip("sched", d, t(d), st.schedule===d, "radio")).join("");
  updatePoolCount();

function readFilters(){
  const vals = n => [...document.querySelectorAll(`#filters input[name="${n}"]:checked`)].map(i => i.value);
  const st = S.settings;
  st.topics = vals("topic").map(Number); st.diffs = vals("diff"); st.types = vals("type");
  st.starOnly = vals("star").length > 0; st.weakOnly = vals("weak").length > 0;
  st.schedule = vals("sched")[0] || "cram";
}
function updatePoolCount(){ const n = pool().length; $("poolCount").textContent = n ? t("pool",{n}) : t("noPool"); }

/* ---------- study mode ---------- */
let mode = "study";
let study = null;   // {queue:[ids], done:n}
let cur = null;     // {q, order, tiles, picked, result}

function buildQueue(practice){
  // Random order everywhere; spaced repetition only decides WHICH cards come first.
  // Shuffle once: filter keeps that order inside each group.
  const now = Date.now(), p = shuffle(pool());
  if (practice) return p.map(q => q.id);
  const due = p.filter(q => peek(q.id).seen > 0 && peek(q.id).due <= now);
  const fresh = p.filter(q => !peek(q.id).seen);
  return [...due, ...fresh].map(q => q.id);
}
function startStudy(practice){
  study = { queue: buildQueue(practice), done: 0 };
  nextCard();
}
function nextCard(){
  if (!study.queue.length) return renderCaughtUp();
  const q = byId[study.queue.shift()];
  cur = { q, order: q.type==="mc" ? shuffle([0,1,2,3]) : null, tiles: q.type==="order" ? tileState(q) : null, picked:null, result:null };
  renderCard();
}
function renderCaughtUp(){
  cur = null;
  const p = pool();
  if (!p.length){ $("view").innerHTML = `<div class="card center"><p>${esc(t("noPool"))}</p></div>`; return; }
  const future = p.map(q => peek(q.id)).filter(c => c.seen && c.due > Date.now()).map(c => c.due).sort((a,b)=>a-b)[0];
  $("view").innerHTML = `<div class="card center">
    <h2>${esc(study && study.done ? t("sessionDone") : t("caught"))}</h2>
    <p>${future ? esc(t("nextDue",{t:fmtWhen(future)})) : esc(t("noneSeen"))}</p>
    <p>${esc(t("mastered"))} ${masteryPct(p)}%</p>
    <div class="bar good" aria-hidden="true"><i style="width:${masteryPct(p)}%"></i></div>
    <p class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="practiceBtn">${esc(t("practice"))}</button></p></div>`;
  $("practiceBtn").onclick = () => startStudy(true);
  $("practiceBtn").focus();
}
function cardMeta(q){
  const c = peek(q.id);
  return `<div class="meta"><span class="tag">${esc(tx(TOPICS[q.topicNo]))}</span>
    <span class="tag ${q.difficulty}">${esc(t(q.difficulty))}</span>
    <span class="tag">${esc(t(q.type))}</span>
    <span class="tag">${c.seen ? esc(t("box",{b:c.box})) : esc(t("newCard"))}</span>
    ${q.star ? '<span class="tag star" aria-label="high-yield">★</span>' : ""}</div>`;
}
function optionsHTML(q, order, picked, result, showAnswers){
  return `<div class="opts" role="group" aria-label="${esc(t("mc"))}">` + order.map((oi, i) => {
    let cls = "opt";
    if (showAnswers){ if (oi === q.answerIndex) cls += " correct"; else if (oi === picked) cls += " wrong"; }
    else if (oi === picked) cls += " picked";
    return `<button class="${cls}" data-oi="${oi}" ${showAnswers?"disabled":""} aria-label="${i+1}. ${esc(tx(q.options[oi]))}"><span class="k">${"ABCD"[i]}</span><span>${esc(tx(q.options[oi]))}</span></button>`;
  }).join("") + `</div>`;
}
function feedbackHTML(q, ok, given){
  return `<div class="fb show ${ok?"ok":"no"}">
    <h3>${ok ? "✅ "+esc(t("correct"))+" "+esc(pick(T[L()].yes)) : "❌ "+esc(t("wrong"))}</h3>
    ${!ok && given!=null ? `<p><b>${esc(t("yourAns"))}</b> ${esc(given || t("unanswered"))}</p>` : ""}
    <p><b>${esc(t("answerIs"))}</b> ${esc(tx(q.correctAnswer))}</p>
    <p>${q.star?'<span class="star">★</span> ':""}${rich(tx(q.explanation))}</p>
    ${!ok ? `<p class="hint">${esc(pick(T[L()].no))}</p>` : ""}
    <p class="src">${esc(t("src"))} ${esc(q.source)}</p></div>`;
}
function renderCard(){
  if (cur.result === null) cur.tiles = tilesForLang(cur.q, cur.tiles);
  const { q, order, picked, result } = cur;
  const answered = result !== null;
  const left = study.queue.length;
  const total = study.done + left + 1;
  const body = q.type === "mc"
    ? optionsHTML(q, order, picked, result, answered)
    : tilesHTML(q, cur.tiles, answered ? result : null) + (answered ? "" : tileButtonsHTML(cur.tiles, true));
  $("view").innerHTML = `
    <div class="row hint" style="justify-content:space-between"><span>${esc(t("left",{n:left}))}</span></div>
    <div class="bar" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${study.done}"><i style="width:${Math.round(100*study.done/total)}%"></i></div>
    <article class="card">
      ${cardMeta(q)}
      <h2 class="q" id="qText" tabindex="-1">${q.star?'<span class="star" aria-hidden="true">★ </span>':""}${esc(tx(q.question))}</h2>
      ${body}
      <div id="fbBox" role="status" aria-live="polite">${answered ? feedbackHTML(q, result, givenText(q, picked, cur.tiles)) : ""}</div>
      <div class="actions">
        ${answered ? `<span></span><button class="btn primary" id="nextBtn">${esc(t("next"))}</button>`
                   : `<button class="btn" id="idkBtn">${esc(t("idk"))}</button><span></span>`}
      </div>
    </article>`;
  if (!answered){
    if (q.type === "mc") document.querySelectorAll(".opt").forEach(b => b.onclick = () => submitStudy(+b.dataset.oi));
    else { bindTiles(cur.tiles, renderCard); $("checkBtn").onclick = () => submitStudy(cur.tiles); }
    $("idkBtn").onclick = () => submitStudy(null);
    $("qText").focus();
  } else {
    $("nextBtn").onclick = () => { study.done++; nextCard(); };
    $("nextBtn").focus();
  }
}
function submitStudy(answer){
  if (cur.result !== null) return;
  const q = cur.q;
  let ok;
  if (q.type === "mc"){ cur.picked = answer; ok = answer === q.answerIndex; }
  else { if (answer == null) cur.tiles.picked = []; ok = answer != null && orderRight(q, answer); } // "I don't know" clears the tiles
  cur.result = ok;
  grade(q, ok);
  if (!ok){ // see it again later this round
    const pos = Math.min(study.queue.length, 3 + Math.floor(Math.random() * 4)); // back in 3–6 cards
    if (!study.queue.includes(q.id)) study.queue.splice(pos, 0, q.id);
  }
  save(); renderStats(); renderCard(); milestones(); persist();
}

/* ---------- test mode ---------- */
let test = null, timerId = null;
function renderTestSetup(){
  const n = pool().length;
  const opts = ["10","20","30","all"].map(v => `<option value="${v}" ${S.settings.testN===v?"selected":""}>${v==="all"?esc(t("all"))+` (${n})`:v}</option>`).join("");
  $("view").innerHTML = `<div class="card">
    <h2>${esc(t("testSetup"))}</h2><p>${esc(t("testDesc"))}</p>
    <p class="hint">${esc(n ? t("pool",{n}) : t("noPool"))}</p>
    <div class="row"><label for="testN">${esc(t("nQ"))}</label><select id="testN" class="btn">${opts}</select>
      <span class="hint">${esc(t("perQ"))}</span></div>
    <p><button class="btn primary" id="startTest" ${n?"":"disabled"}>${esc(t("start"))}</button></p></div>`;
  $("startTest").onclick = () => {
    S.settings.testN = $("testN").value; save();
    const p = shuffle(pool());
    const items = (S.settings.testN === "all" ? p : p.slice(0, +S.settings.testN));
    test = { items: items.map(q => ({ id:q.id, order: q.type==="mc"?shuffle([0,1,2,3]):null, tiles: q.type==="order"?tileState(q):null, answer:null })), i:0,
             start: Date.now(), deadline: Date.now() + items.length*45000, finished:false };
    clearInterval(timerId); timerId = setInterval(tick, 1000);
    renderTestQ();
  };
}
function tick(){
  if (!test || test.finished) return clearInterval(timerId);
  const left = test.deadline - Date.now();
  const el = $("timer"); if (el){ el.textContent = fmtDur(left); el.classList.toggle("low", left < 60000); }
  if (left <= 0) finishTest();
}
function renderTestQ(){
  const it = test.items[test.i], q = byId[it.id], n = test.items.length;
  it.tiles = tilesForLang(q, it.tiles);
  const body = q.type === "mc"
    ? optionsHTML(q, it.order, it.answer, null, false)
    : tilesHTML(q, it.tiles, null) + tileButtonsHTML(it.tiles, false);
  $("view").innerHTML = `
    <div class="row hint" style="justify-content:space-between"><span>${esc(t("qOf",{i:test.i+1,n}))}</span>
      <span>${esc(t("timeLeft"))}: <span class="timer" id="timer">${fmtDur(test.deadline-Date.now())}</span></span></div>
    <div class="bar" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${test.i}"><i style="width:${Math.round(100*test.i/n)}%"></i></div>
    <article class="card">${cardMeta(q)}
      <h2 class="q" id="qText" tabindex="-1">${esc(tx(q.question))}</h2>${body}
      <div class="actions"><button class="btn" id="finBtn">${esc(t("finish"))}</button>
        <button class="btn primary" id="tNext">${esc(test.i < n-1 ? t("next") : t("finish"))}</button></div></article>`;
  if (q.type === "mc") document.querySelectorAll(".opt").forEach(b => b.onclick = () => { it.answer = +b.dataset.oi; testNext(); });
  else bindTiles(it.tiles, renderTestQ);
  $("qText").focus();
  $("tNext").onclick = testNext;
  $("finBtn").onclick = finishTest;
}
function testNext(){ if (test.i < test.items.length-1){ test.i++; renderTestQ(); } else finishTest(); }
function finishTest(){
  if (!test || test.finished) return;
  test.finished = true; clearInterval(timerId);
  const used = Math.min(Date.now(), test.deadline) - test.start;
  const rows = test.items.map(it => {
    const q = byId[it.id];
    const ok = q.type === "mc" ? it.answer === q.answerIndex : orderRight(q, it.tiles);
    grade(q, ok);
    return { q, ok, given: givenText(q, it.answer, it.tiles) };
  });
  save(); renderStats(); milestones(); persist();
  const c = rows.filter(r => r.ok).length, n = rows.length, p = n ? Math.round(100*c/n) : 0;
  if (p >= 90) confetti();
  rows.sort((a,b) => a.ok - b.ok);
  $("view").innerHTML = `<div class="card">
    <h2 tabindex="-1" id="resH">${esc(t("results"))}</h2>
    <p><b>${esc(t("scoreLine",{c,n,p,t:fmtDur(used)}))}</b></p>
    <div class="bar good" aria-hidden="true"><i style="width:${p}%"></i></div>
    <p>${esc(p>=90 ? pick(T[L()].yes) : pick(T[L()].no))}</p>
    <h3>${esc(t("review"))}</h3>
    ${rows.map((r,i) => `<div class="res-item"><p><span class="${r.ok?"ok-t":"no-t"}">${r.ok?"✓":"✗"}</span> <b>${i+1}.</b> ${esc(tx(r.q.question))}</p>
      ${r.ok ? `<p class="hint">${esc(t("answerIs"))} ${esc(tx(r.q.correctAnswer))}</p>` : feedbackHTML(r.q, false, r.given)}</div>`).join("")}
    <p><button class="btn primary" id="againBtn">${esc(t("again"))}</button></p></div>`;
  $("againBtn").onclick = renderTestSetup;
  $("resH").focus();
}

/* ---------- progress view ---------- */
function renderProgress(){
  const rows = Object.keys(TOPICS).map(k => {
    const list = BANK.filter(q => q.topicNo === +k), m = masteryPct(list);
    const seen = list.filter(q => peek(q.id).seen).length;
    return `<tr><td>${esc(tx(TOPICS[k]))}</td><td style="width:40%"><div class="bar good" aria-hidden="true"><i style="width:${m}%"></i></div></td><td>${m}%</td><td class="hint">${seen}/${list.length}</td></tr>`;
  }).join("");
  const counts = [0,1,2,3,4,5].map(b => BANK.filter(q => (peek(q.id).seen ? peek(q.id).box : 0) === b).length);
  $("view").innerHTML = `<div class="card"><h2>${esc(t("perTopic"))}</h2><table>${rows}</table>
    <p class="hint">${esc(t("mastered"))}</p>
    <h3>${esc(t("boxes"))}</h3>
    <div class="boxes">${counts.map((n,b) => `<div><b>${n}</b><br>${b ? "Box "+b : esc(t("bNew"))}</div>`).join("")}</div></div>`;
}

/* ---------- mode switching & events ---------- */
function setMode(m){
  if (mode === "test" && m !== "test" && test && !test.finished){ clearInterval(timerId); test = null; }
  mode = m;
  $("modeStudy").setAttribute("aria-pressed", m==="study"); $("modeTest").setAttribute("aria-pressed", m==="test"); $("modeStats").setAttribute("aria-pressed", m==="stats");
  if (m === "study") startStudy(false);
  else if (m === "test") renderTestSetup();
  else renderProgress();
}
function rerender(){
  renderLabels();
  if (mode === "study"){ cur ? renderCard() : startStudy(false); }
  else if (mode === "test"){ test && !test.finished ? renderTestQ() : renderTestSetup(); }
  else renderProgress();
}
$("lang-en").onclick = () => { S.settings.lang = "en"; save(); rerender(); };
$("lang-tw").onclick = () => { S.settings.lang = "tw"; save(); rerender(); };
$("modeStudy").onclick = () => setMode("study");
$("modeTest").onclick = () => setMode("test");
$("modeStats").onclick = () => setMode("stats");
$("filters").addEventListener("change", () => { readFilters(); updatePoolCount(); });
$("applyFilters").onclick = () => { readFilters(); save(); $("filters").open = false; cur = null; setMode(mode === "stats" ? "study" : mode); };
$("resetBtn").onclick = () => {
  $("confirmMsg").textContent = t("resetQ"); $("confirmYes").textContent = t("yesReset"); $("confirmNo").textContent = t("cancel");
  $("filters").open = false; $("confirmBox").hidden = false; $("confirmNo").focus();
};
$("confirmNo").onclick = () => { $("confirmBox").hidden = true; };
$("confirmYes").onclick = () => {
  $("confirmBox").hidden = true;
  const lang = S.settings.lang; S = defaults(); S.settings.lang = lang;
  try { localStorage.removeItem(KEY); } catch(e){}
  persist(); cur = null; renderLabels(); setMode("study");
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("confirmBox").hidden){ $("confirmBox").hidden = true; return; }
  if (e.key === "Escape" && $("filters").open){ $("filters").open = false; return; }
  if (!$("confirmBox").hidden) return;
  const inForm = e.target.closest && e.target.closest("#filters, select");
  if (inForm) return;
  if (mode === "study" && cur){
    if (cur.result === null){
      if (cur.q.type === "mc" && /^[1-4]$/.test(e.key)){ e.preventDefault(); submitStudy(cur.order[+e.key-1]); }
      else if (cur.q.type === "order"){
        if (e.key === "Enter" && e.target.tagName !== "BUTTON" && cur.tiles.picked.length){ e.preventDefault(); submitStudy(cur.tiles); }
        else tileKey(e, cur.tiles, renderCard);
      }
    } else if (e.key === "Enter" && e.target.id !== "nextBtn"){ e.preventDefault(); study.done++; nextCard(); }
  } else if (mode === "test" && test && !test.finished){
    const it = test.items[test.i];
    const q = byId[it.id];
    if (q.type === "mc" && /^[1-4]$/.test(e.key)){ e.preventDefault(); it.answer = it.order[+e.key-1]; testNext(); }
    else if (q.type === "order"){
      if (e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); testNext(); }
      else tileKey(e, it.tiles, renderTestQ);
    }
  }
});

/* ---------- account sync (only inside the claude.ai viewer, signed in) ---------- */
const sync = { ref:null, busy:false, dirty:false, timer:null };
function pushSoon(){ if (!sync.ref) return; sync.dirty = true; clearTimeout(sync.timer); sync.timer = setTimeout(push, 2000); }
async function push(){
  if (!sync.ref || sync.busy || !sync.dirty) return;
  sync.busy = true; sync.dirty = false;
  try { await sync.ref.set({ v:1, cards:S.cards, stats:S.stats, milestones:S.milestones, updatedAt:Date.now() }); }
  catch(e){
    if (e && ["invalid_argument","revoked","not_granted","quota_exceeded","capability_disabled","capability_removed"].includes(e.code)){ sync.ref = null; $("syncNote").textContent = t("syncLocal"); }
    else sync.dirty = true;
  } finally {
    sync.busy = false;
    if (sync.dirty && sync.ref) sync.timer = setTimeout(push, 4000);
  }
}
// Merge account copy into this browser's copy; returns true if this browser knew something the account did not.
function mergeRemote(r){
  let localAhead = false;
  const rc = (r && typeof r.cards === "object" && r.cards) || {};
  for (const id of Object.keys(byId)){
    const a = S.cards[id], b = rc[id];
    const ok = b && typeof b.seen === "number" && typeof b.box === "number" && typeof b.due === "number";
    if (ok && (!a || b.seen > a.seen || (b.seen === a.seen && b.due > a.due))) S.cards[id] = { box:b.box, due:b.due, seen:b.seen, right:+b.right||0, wrong:+b.wrong||0 };
    else if (a && a.seen && (!ok || a.seen > b.seen)) localAhead = true;
  }
  const rs = r && r.stats;
  if (rs && typeof rs.answered === "number" && rs.answered > S.stats.answered) S.stats = { ...S.stats, ...rs };
  else if (S.stats.answered > ((rs && rs.answered) || 0)) localAhead = true;
  if (r && r.milestones && typeof r.milestones === "object") S.milestones = { ...r.milestones, ...S.milestones };
  return localAhead;
}
async function initSync(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const localAhead = mergeRemote(snap.exists ? snap.data() : null);
    sync.ref = ref;
    save(); rerender();
    if (localAhead) pushSoon();
  } catch(e){ /* stay on this-browser storage */ }
}

renderLabels();
if (S.stats.answered) toast(t("started"));
setMode("study");
initSync();
</script>
